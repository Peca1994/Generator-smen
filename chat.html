<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Týmový Chat</title>

<style>
        /* 1. GLOBÁLNÍ OPRAVA (Vložte hned sem) */
        * {
            box-sizing: border-box;
            max-width: 100%;
        }

        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
body {
    background: radial-gradient(circle at center, #062111 0%, #000000 100%) !important;
    margin: 0;
    padding: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: white;
    min-height: 100vh;
    /* Žádný flex zde nebude, aby se obsah nerozbil */
}

/* Toto vytvoří to zapuštěné logo a nápis ŠKODA na pozadí */
.background-logo {
    position: fixed;
    top: 25%; /* Pozice nahoře jako v indexu */
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
    text-align: center;
    pointer-events: none;
}

.background-logo img {
    /* Zvětšení rozměrů pro dominantní vzhled */
    width: 650px !important; 
    max-width: 90vw !important;
    
    /* Vyladění ostrosti a zapuštění */
    opacity: 0.12 !important;
    /* Blur jsme snížili na minimum (1px), aby logo bylo ostré */
    filter: brightness(0.6) sepia(1) hue-rotate(85deg) saturate(2.5) blur(1px) !important;
    
    /* TATO ČÁST VYMAŽE OKRAJE - kruh od středu do ztracena */
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
}

.background-logo h1 {
    font-size: 16vw !important;
    margin-top: -30px !important;
    letter-spacing: 25px !important;
    /* Nápis taky necháme ostrý bez blur */
    filter: none !important;
    color: #1a3a2a !important;
    opacity: 0.5 !important;
    text-shadow: 0 0 15px rgba(0,0,0,0.8) !important;
}

    /* 2. TOPBAR */
    .topbar {
        width: 100% !important; height: 60px;
        display: flex !important; align-items: center !important;
        justify-content: space-between !important;
        padding: 0 20px !important; background: transparent !important;
        position: sticky; top: 0; z-index: 1000;
    }
    .topTitle { font-size: 22px !important; font-weight: 800 !important; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .menuBtn { padding: 8px 14px; border-radius: 10px; border: none; font-weight: 800; background: rgba(51, 65, 85, 0.8); color: white; cursor: pointer; }

    /* 3. CHAT BOX - OPRAVA VÝŠKY A MEZER */
    #chatBox {
    /* Zvětšíme výšku - odečteme jen 100px místo 160px */
    height: calc(100vh - 100px) !important; 
    margin-top: 5px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    /* Zmenšíme rezervu dole, aby zprávy končily těsně nad lištou */
    padding: 10px 15px 75px 15px !important; 
}

    /* Bublina zprávy - KOMPAKTNÍ DESIGN */
    .msg {
        padding: 6px 12px !important; /* Mnohem nižší bubliny */
        border-radius: 15px;
        max-width: 80%;
        width: fit-content;
        position: relative;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.05);
        align-self: flex-start;
        color: white;
        line-height: 1.25;
    }

    .msg.me {
        align-self: flex-end; 
        background: rgba(34, 197, 94, 0.25);
        border: 1px solid rgba(34, 197, 94, 0.5);
    }

    .msg-sender { font-size: 10px !important; font-weight: 800; color: #38bdf8; margin-bottom: 2px !important; display: block; }
    .msg-text { font-size: 14px; word-wrap: break-word; }
    .msg-time { font-size: 9px !important; opacity: 0.5; display: block; text-align: right; margin-top: 2px !important; }

    /* 4. PSACÍ LIŠTA - NÍŽ U ZEMĚ */
    .chat-input-container {
        position: fixed; bottom: 12px; /* Posunuto níž k okraji */
        left: 50%; transform: translateX(-50%);
        width: 92%; max-width: 500px; z-index: 1001;
    }

    .chat-input-wrapper {
        background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 30px; padding: 5px 5px 5px 18px;
        display: flex; align-items: center; gap: 10px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    #msgInput {
        flex: 1; background: transparent !important; border: none !important;
        color: white !important; font-size: 15px; outline: none !important;
    }

    /* TLAČÍTKO ODESLAT - VYCENTROVANÁ ŠIPKA */
    #sendBtn {
        background: #22c55e; color: white; border: none;
        width: 42px; height: 42px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; padding: 0 !important; /* Důležité pro střed */
        flex-shrink: 0;
    }

    #sendBtn svg {
        width: 22px; height: 22px;
        margin-left: 3px; /* Jemné optické vycentrování šipky */
    }

    .disclaimer { font-size: 8px; color: rgba(255, 255, 255, 0.2); text-align: center; margin-top: 8px; }
</style>
</head>

<body>
<div class="background-logo">
    <img src="pozadi.jpg" alt="Logo">
</div>
<div class="topbar">
    <span class="topTitle"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg> Týmový Chat</span>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<!-- 2. SEM VLOŽ TENTO BLOK (Uprostřed mezi lištami) -->
<div id="chatBox">
    <!-- Sem skript automaticky vloží zprávy -->
</div>

<!-- 3. Tady už máš (nebo vlož) spodní část s textem -->

<div class="chat-input-container">
    <!-- 1. Psací lišta -->
    <div class="chat-input-wrapper">
        <input type="text" id="msgInput" placeholder="Napiš vzkaz...">
        <button id="sendBtn">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" /></svg>
        </button>
    </div>

    <!-- 2. Text o právech (teď bude až pod lištou) -->
    <div class="disclaimer">
        © 2024 ShiftMaster | Neoficiální nástroj. Logo ŠKODA je majetkem ŠKODA AUTO a.s.
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import { 
    getFirestore, 
    collection, 
    addDoc, 
    query,       // TATO FUNKCE TI CHYBĚLA
    orderBy, 
    onSnapshot, 
    getDocs, 
    where,       // TATO TAKÉ
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
    measurementId: "G-1HF3R93092"
};

// 2. INICIALIZACE - Teď už getAuth() bude fungovat
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app); 

const chatBox = document.getElementById("chatBox");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

let currentUserNickname = "Host";
let allNicknames = {}; 

async function loadNicknames() {
    try {
        const snap = await getDocs(collection(db, "employees"));
        allNicknames = {};
        
        snap.forEach(doc => {
            const d = doc.data();
            // 1. OPRAVA EMAILU: Odstraníme uvozovky a mezery, které tam máš v DB
            if (d.email) {
                const cleanEmail = d.email.replace(/"/g, '').trim().toLowerCase();
                
                // 2. OPRAVA POLE: Podle fotky máš v DB pole 'name', ne 'fName'
                // Použijeme 'name' (Péca) nebo 'surname' (Lukáš Pecka)
                allNicknames[cleanEmail] = d.name || d.surname || cleanEmail;
                
                console.log(`Spárováno: ${cleanEmail} => ${allNicknames[cleanEmail]}`);
            }
        });
    } catch (err) {
        console.error("Chyba:", err);
    }
}

onAuthStateChanged(auth, async (user) => {
    if (user) {
        await loadNicknames();
        const userEmail = user.email.toLowerCase().trim();
        // Zkusíme najít přezdívku v naší mapě
        currentUserNickname = allNicknames[userEmail] || user.email.split('@')[0];
        console.log("Tvoje finální přezdívka:", currentUserNickname);
        startChatListener();
    } else {
        window.location.href = "index.html"; 
    }
});

function startChatListener() {
    const qChat = query(collection(db, "chat"), orderBy("createdAt", "asc"));
    onSnapshot(qChat, (snapshot) => {
        chatBox.innerHTML = "";
        snapshot.forEach((docSnap) => {
   const m = docSnap.data();
if (!m.text) return;

// 1. Očištění emailu odesílatele (z databáze zprávy)
const senderEmailKey = m.senderEmail ? m.senderEmail.toLowerCase().trim().replace(/"/g, '') : "";

// 2. Jméno z mapy (pokud není, použijeme email nebo "Host")
const displayName = allNicknames[senderEmailKey] || m.sender || "Host";

// 3. SPRÁVNÉ POROVNÁNÍ PRO STRANU (isMe)
// Musíme se ujistit, že auth.currentUser existuje
const myEmail = auth.currentUser ? auth.currentUser.email.toLowerCase().trim() : "";
const isMe = senderEmailKey === myEmail;

// 4. Formát času
const time = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "...";

// 5. Vykreslení do HTML
chatBox.innerHTML += `
    <div class="msg ${isMe ? 'me' : ''}">
        <span class="msg-sender">${displayName}</span>
        <div class="msg-text">${m.text}</div>
        <span class="msg-time">${time}</span>
    </div>
`;
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !auth.currentUser) return;

    await addDoc(collection(db, "chat"), {
        text: text,
        sender: currentUserNickname,
        senderEmail: auth.currentUser.email,
        createdAt: serverTimestamp() 
    });
    msgInput.value = "";
}

sendBtn.onclick = sendMessage;
msgInput.onkeypress = (e) => { if (e.key === "Enter") sendMessage(); };
</script>

</body>
</html>
