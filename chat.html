<html lang="cs">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    @import url('https://fonts.googleapis.com');

    * {
        box-sizing: border-box;
        max-width: 100%;
        font-family: 'Inter', sans-serif !important;
        -webkit-tap-highlight-color: transparent !important;
    }

    html, body { width: 100%; margin: 0; padding: 0; overflow-x: hidden; }

    body {
        min-height: 100vh;
        background-color: #020617 !important;
        background: radial-gradient(circle at 50% 25%, #064e3b 0%, #020617 85%) !important;
        background-attachment: fixed !important;
    }

    .background-logo {
        position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
        z-index: -1; text-align: center; pointer-events: none;
    }

    .background-logo img {
        width: 650px !important; max-width: 90vw !important;
        mix-blend-mode: screen; filter: grayscale(100%) brightness(1.1) contrast(1.1) !important;
        opacity: 0.4 !important;
        mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
        -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
    }

    .topbar {
        width: 100% !important; height: 60px; display: flex !important;
        align-items: center !important; justify-content: space-between !important;
        padding: 0 20px !important; background: transparent !important;
        position: sticky; top: 0; z-index: 1000; color: white !important;
    }

    .topTitle { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
    .menuBtn { padding: 8px 16px; border-radius: 12px; background: rgba(51, 65, 85, 0.8); color: white; font-weight: 800; cursor: pointer; border: none; }
    
    #chatBox { padding: 15px 15px 160px 15px; height: calc(100vh - 180px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

    /* STYL ZPRÁV */
    .msg { 
        padding: 10px 14px !important; border-radius: 18px !important; max-width: 90%; 
        background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.08) !important; 
        align-self: flex-start; display: flex; flex-direction: column; gap: 4px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 8px;
    }

    .msg.me { 
        align-self: flex-end; background: rgba(34, 197, 94, 0.1) !important; 
        border-color: rgba(34, 197, 94, 0.2) !important; 
    }
    .approved-bg { 
        background: rgba(34, 197, 94, 0.15) !important; 
        border: 1.5px solid rgba(34, 197, 94, 0.5) !important; 
        box-shadow: 0 0 15px rgba(34, 197, 94, 0.1);
    }
    .rejected-bg { 
        background: rgba(239, 68, 68, 0.15) !important; /* Jemné červené pozadí */
        border: 1.5px solid rgba(239, 68, 68, 0.5) !important; 
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
    }

    .msg-sender { font-size: 13px !important; font-weight: 800 !important; color: #38bdf8 !important; letter-spacing: 0.2px; }
    .msg-body { display: flex; align-items: center; gap: 10px; color: white; }
    .msg-text { font-size: 14px !important; line-height: 1.4; font-weight: 500; color: white !important; }
    .msg-time { font-size: 9px; opacity: 0.3; text-align: right; color: white; }

    /* FORMULÁŘE */
    .change-form-container { 
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); 
        border-radius: 20px; padding: 15px; margin-bottom: 10px; display: none; 
    }

    .change-form-container select, .change-form-container input { 
        background: rgba(0,0,0,0.4) !important; border: 1px solid rgba(255,255,255,0.2) !important; 
        color: white !important; padding: 10px !important; border-radius: 10px !important; 
        font-size: 14px !important; font-weight: 600 !important; outline: none; 
    }

    .change-form-container select option { background: #020617 !important; color: white !important; }
    .send-change-btn { background: #22c55e; color: white; font-weight: 800; padding: 12px; border-radius: 12px; width: 100%; margin-top: 10px; font-size: 14px; cursor: pointer; }

    /* OPRAVA MOBILU: Popisky u času a data */
    input[type="time"]::before { content: "Čas: "; color: rgba(255, 255, 255, 0.4); margin-right: 5px; font-weight: 400; font-size: 12px; }
    input[type="date"]::before { content: "Datum: "; color: rgba(255, 255, 255, 0.4); margin-right: 5px; font-weight: 400; font-size: 12px; }
    input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }

    #topicInfoPanel { padding: 20px 25px !important; margin-top: 10px !important; background: transparent !important; backdrop-filter: none !important; border: none !important; box-shadow: none !important; }
    #topicInfoDesc { font-size: 16px !important; line-height: 1.5 !important; color: #ffffff !important; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); max-width: 800px; }
    #topicInfoDesc strong { color: #22c55e !important; font-weight: 800; }

    .chat-input-container { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 550px; z-index: 1001; }
    .chat-input-wrapper { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 35px; padding: 6px 6px 6px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    #msgInput { flex: 1; background: transparent; border: none; color: white; outline: none; }

    .disclaimer { position: fixed !important; bottom: 15px; left: 0; width: 100%; text-align: center; font-size: 9px; color: rgba(255, 255, 255, 0.3); pointer-events: none; }
    #chatInterface, #backBtn { display: none; }
    .msg-approved {
    border-left: 4px solid #22c55e !important;
    background: rgba(34, 197, 94, 0.1) !important;
}
.msg-rejected {
    border-left: 4px solid #ef4444 !important;
    background: rgba(239, 68, 68, 0.1) !important;
    opacity: 0.8;
}
@keyframes pulse-wait {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
}
.wait-dot {
    width: 8px;
    height: 8px;
    background-color: #f1c40f; /* Žlutá barva čekání */
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    animation: pulse-wait 2s infinite;
}
 .projects-grid { 
        display: grid; grid-template-columns: repeat(3, 1fr); 
        gap: 10px; margin-bottom: 25px; 
    }
    .project-box { 
        background: rgba(255, 255, 255, 0.05); padding: 10px; 
        border-radius: 12px; border-bottom: 2px solid #22c55e; 
    }
    .project-box label { 
        display: block; font-size: 10px; color: #22c55e; 
        font-weight: 800; margin-bottom: 4px; text-transform: uppercase;
    }
    .project-box input { 
        background: transparent; border: none; color: white; 
        width: 100%; font-size: 14px; outline: none; font-weight: 600;
    }

    .sqs-table-wrapper { overflow-x: auto; margin-top: 15px; }
    .sqs-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
    .sqs-table th { 
        padding: 10px; text-align: left; font-size: 11px; 
        opacity: 0.4; text-transform: uppercase; color: white; 
    }
    .sqs-table td { padding: 14px 10px; font-size: 14px; color: white; }
    .sqs-row { border-radius: 12px; transition: 0.3s; }
    
    .sqs-select { 
        background: #0f172a; color: white; border: 1px solid rgba(255,255,255,0.2); 
        border-radius: 8px; padding: 5px; font-size: 12px; cursor: pointer;
    }

    .sqs-form-panel { 
        background: rgba(255, 255, 255, 0.03); padding: 15px; 
        border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); 
        margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr 2fr auto; gap: 10px; 
    }
    .sqs-input { 
        background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); 
        color: white; padding: 10px; border-radius: 10px; outline: none;
    }
    .sqs-add-btn { 
        background: #ffb100; color: #000; border: none; 
        padding: 10px 20px; border-radius: 12px; font-weight: 900; cursor: pointer;
    }
</style>
</head>

window.toggleParagrafOptions = () => {
    const type = document.getElementById("absType").value;
    document.getElementById("absReason").style.display = (type === "Paragraf") ? "block" : "none";
};

// --- LOGIKA TÉMAT A PŘEPÍNÁNÍ ---
window.selectTopic = (id, name) => {
    currentTopicId = id;
    document.getElementById("topicSelection").style.display = 'none';
    document.getElementById("chatInterface").style.display = 'block';
    document.getElementById("backBtn").style.display = 'inline-block';
    document.getElementById("headerIcon").innerHTML = topicData[id].icon;
    document.getElementById("headerLabel").innerText = name;
    document.getElementById("topicInfoDesc").innerHTML = topicData[id].desc;
    document.getElementById("absenceForm").style.display = (id === 'absence') ? 'block' : 'none';
    const pokecInput = document.querySelector(".chat-input-container");
    if (pokecInput) pokecInput.style.display = (id === 'pokec') ? 'block' : 'none';
    startChatListener(id);
};

window.showTopics = () => {
    if (chatUnsubscribe) chatUnsubscribe();
    document.getElementById("topicSelection").style.display = 'grid';

function getCurrentShiftInfo() {
    const today = new Date();
    const hours = today.getHours();
    
    // Identické nastavení jako v Schedule
    const anchorDate = new Date(2026, 2, 2); // Pondělí 2.3.2026
    
    const getShiftType = (d) => {
        const msDiff = d.getTime() - anchorDate.getTime();
        const daysDiff = Math.floor(msDiff / (1000 * 60 * 60 * 24));
        const weeksDiff = Math.floor(daysDiff / 7);
        
        // V Schedule máš: ["noc", "odpo", "ranni"]
        const shiftValues = ["Noční", "Odpolední", "Ranní"];
        let index = weeksDiff % 3; 
        if (index < 0) index += 3;
        return shiftValues[index];
    };

    let dDate = new Date(today);
    const tomorrow = new Date(today); 
    tomorrow.setDate(today.getDate() + 1);

    // Překlápěcí logika z tvého Schedule
    // Pokud je zítra noční a je po 12:00, nebo je po 22:00 obecně
    if (getShiftType(tomorrow) === "Noční" && hours >= 12) {
        dDate = tomorrow;
    } else if (hours >= 22) {
        dDate = tomorrow;
    }

    // Formátování data pro Firebase (YYYY-MM-DD)
    const dStr = new Date(dDate.getTime() - dDate.getTimezoneOffset() * 60000)
                 .toISOString().split('T')[0];

    return { 
        date: dStr, 
        shift: getShiftType(dDate) 
    };
}

async function loadNicknames() {
    const snap = await getDocs(collection(db, "employees"));
    const wSelect = document.getElementById("workerSelect"); 
    const aSelect = document.getElementById("absWorkerSelect");
    
    // Získáme email aktuálně přihlášeného uživatele
    const currentUserEmail = auth.currentUser?.email?.toLowerCase();
    let myName = "";

    snap.forEach(docSnap => {
        const d = docSnap.data(); 
        const jmeno = d.fName || d.name || "Host";
        const email = d.email?.replace(/["']/g, '').trim().toLowerCase();
        
        if (email) {
            allNicknames[email] = jmeno;
            userRoles[email] = d.role || "user"; 
            
            // Pokud se email v DB shoduje s přihlášeným uživatelem, uložíme si jeho jméno
            if (email === currentUserEmail) {
                myName = jmeno;
            }
        }
    });

    // Funkce pro naplnění selectu
    const fillSelect = (selectElement) => {
        if (!selectElement) return;
        
        // Pokud jsme našli jméno uživatele, nabídneme mu jen jeho volbu
        if (myName) {
            selectElement.innerHTML = `<option value="${myName}">${myName}</option>`;
        } else {
            // Pokud uživatel v DB není (např. admin bez karty), necháme mu výběr nebo prázdno
            selectElement.innerHTML = '<option value="">-- Jméno nenalezeno --</option>';
        }
    };

    fillSelect(wSelect);
    fillSelect(aSelect);

    // Zbytek tvého kódu pro nastavení datumu
    const today = new Date();
    const offset = today.getTimezoneOffset() * 60000;
    const localISO = (new Date(today - offset)).toISOString().slice(0, 10);
    if (document.getElementById("changeDate")) document.getElementById("changeDate").value = localISO;
    if (document.getElementById("absDateFrom")) document.getElementById("absDateFrom").value = localISO;
    if (document.getElementById("absDateTo")) document.getElementById("absDateTo").value = localISO;
}

const showBtnFeedback = (btnId, text, iconType = 'success') => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const originalContent = btn.innerHTML;
    const originalBg = btn.style.background;
    const icons = {
        success: `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="3" fill="none" style="margin-right:8px;"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
        error: `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="3" fill="none" style="margin-right:8px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
    };
    btn.innerHTML = `<div style="display:flex; align-items:center; justify-content:center;">${icons[iconType]} ${text}</div>`;
    btn.style.background = (iconType === 'error') ? "#b91c1c" : "#15803d"; 
    btn.disabled = true;
    setTimeout(() => { btn.innerHTML = originalContent; btn.style.background = originalBg; btn.disabled = false; }, 1500);
};
window.handleSwapAction = async (msgId, isAccepted) => {
    const msgRef = doc(db, "chat", msgId);
    const msgSnap = await getDoc(msgRef);
    const m = msgSnap.data();

    if (!isAccepted) {
        await updateDoc(msgRef, { status: "rejected" });
        if (window.showToast) showToast("Výměna byla zamítnuta", "error");
        return;
    }

    try {
        const d = m.swapDetails;
        const shiftId = `${d.date}_${d.shift}`;
        const shiftRef = doc(db, "shifts", shiftId);
        const shiftSnap = await getDoc(shiftRef);

        if (!shiftSnap.exists()) {
            if (window.showToast) showToast("Směna již neexistuje", "error");
            return;
        }

        let shiftData = shiftSnap.data();
        let isNested = (shiftData.phases && shiftData.phases[d.phase]);
        let source = isNested ? shiftData.phases[d.phase] : shiftData;

        const getCleanID = (val) => {
            if (!val) return "PRÁZDNO";
            const id = (typeof val === 'string') ? val : (val.m || val.id || "");
            return id.toString().toLowerCase().trim();
        };

        const realA = getCleanID(source[d.fromPos]); 
        const realB = getCleanID(source[d.toPos]);   
        const reqA = d.fromId.toString().toLowerCase().trim(); 
        const reqB = d.toId.toString().toLowerCase().trim();   

        // --- 1. ÚPRAVA: MODERNÍ TEXT POJISTKY ---
       if (realA !== reqA || realB !== reqB) {
    if (window.showToast) showToast("Výměna již není možná (změna v rozpisu)", "error");
    
    await updateDoc(msgRef, { 
        status: "rejected", 
        // Přidáme příznak (system_error), aby to vykreslování poznalo
        text: m.text + " (system_error)" 
    });
    return;
}

        // --- PROHOZENÍ ---
         const d1 = source[d.fromPos]; // Data pozice 1 (např. VYP1-L)
        const d2 = source[d.toPos];   // Data pozice 2 (např. VYP2-L)

        // Extrahujeme hlavní pracovníky (m)
        const m1 = (typeof d1 === 'string') ? d1 : (d1.m || d1.id);
        const m2 = (typeof d2 === 'string') ? d2 : (d2.m || d2.id);

        // Extrahujeme učně (t), pokud na dané pozici jsou
        const t1 = (typeof d1 === 'object') ? d1.t : null;
        const t2 = (typeof d2 === 'object') ? d2.t : null;

        // VYTVOŘÍME NOVÁ DATA: Prohodíme jen 'm', ale 't' vrátíme tam, kde byl
        source[d.fromPos] = t1 ? { m: m2, t: t1 } : m2;
        source[d.toPos] = t2 ? { m: m1, t: t2 } : m1;

        if (isNested) {
            await updateDoc(shiftRef, { phases: shiftData.phases });
        } else {
            let updateObj = {};
            updateObj[d.fromPos] = source[d.fromPos];
            updateObj[d.toPos] = source[d.toPos];
            await updateDoc(shiftRef, updateObj);
        }

        // --- 2. ÚPRAVA: ČISTÉ POTVRZENÍ (Už jen status, žádný text do DB) ---
        await updateDoc(msgRef, { status: "approved" });
        if (window.showToast) showToast("Rozpis byl úspěšně aktualizován", "success");

    } catch (err) {
        console.error("Chyba systému:", err);
        if (window.showToast) showToast("Chyba při zápisu!", "error");
    }
};

window.deleteMsg = async function(msgId) {
    // 1. Najdeme prvek, na který uživatel klikl (křížek)
    // Použijeme event.currentTarget, abychom měli jistotu, že máme ten správný prvek se stylem
    const btn = event.currentTarget;

    if (!btn) {
        console.error("Chyba: Prvek pro smazání nenalezen.");
        return;
    }

    // 2. PRVNÍ KLIK: Vizuální varování (Decentní červená a scale)
    if (!btn.dataset.confirm) {
        btn.dataset.confirm = "true";
        btn.style.transition = "0.3s";
        btn.style.transform = "scale(1.4)";
        btn.style.opacity = "1";
        btn.style.color = "#ef4444"; // Jasně červená
        
        // Pokud do 3 vteřin neklikneš znovu, vrátíme to zpět
        setTimeout(() => { 
            if (btn && btn.dataset.confirm) {
                delete btn.dataset.confirm; 
                btn.style.transform = "scale(1)"; 
                btn.style.opacity = "0.4";
                btn.style.color = ""; // Vrátí barvu z CSS
            }
        }, 3000);
        return;
    }

    // 3. DRUHÝ KLIK: Samotné smazání z Firebase
    try {
        await deleteDoc(doc(db, "chat", msgId));
        console.log("Smazáno z DB:", msgId);
        
        // Odstraníme řádek z tabulky hned, aby to bylo bleskové
        const row = document.getElementById(`msg-${msgId}`);
        if (row) row.style.display = "none";

    } catch (err) {
        console.error("Chyba při mazání:", err);
        btn.innerText = "!"; // Signalizace chyby
    }
};

        if(typeEl) typeEl.value = ""; 
        vinikEl.value = "";
        document.querySelectorAll('.side-btn').forEach(sBtn => sBtn.classList.remove('active'));
        
        console.log("Uloženo pod ID:", customId);
    } catch (err) {
        console.error("Chyba zápisu:", err);
    }
};
window.confirmFix = function(id, btn) {
    const step = btn.getAttribute('data-step');

    if (step === "1") {
        // 1. KROK: Tlačítko se změní na oranžové "OPRAVENO"
        btn.innerText = "OPRAVENO";
        btn.style.background = "#f59e0b"; // Oranžová (Amber)
        btn.style.width = "70px"; // Trochu přidáme na šířce pro delší slovo
        btn.style.fontSize = "6px"; // Mírně zmenšíme písmo, aby se to tam vešlo
        btn.setAttribute('data-step', "2");

        // RESET: Pokud do 3 sekund neklikne podruhé, skočí zpět na NOK
        setTimeout(() => {
            if (btn && btn.getAttribute('data-step') === "2") {
                btn.innerText = "NOK";
                btn.style.background = "#ef4444";
                btn.style.width = "60px";
                btn.style.fontSize = "9px";
                btn.setAttribute('data-step', "1");
            }
        }, 3000);

    } else {
        // 2. KROK: Finální potvrzení a zápis razítka do Firebase
        btn.style.opacity = "0.5";
        window.fixSqs(id);
    }
};
</script>
