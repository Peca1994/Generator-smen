<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Týmová komunikace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    @import url('https://fonts.googleapis.com');

    * {
        box-sizing: border-box;
        max-width: 100%;
        font-family: 'Inter', sans-serif !important;
        -webkit-tap-highlight-color: transparent !important;
    }

    html, body { width: 100%; margin: 0; padding: 0; overflow-x: hidden; }

    body {
        min-height: 100vh;
        background-color: #020617 !important;
        background: radial-gradient(circle at 50% 25%, #064e3b 0%, #020617 85%) !important;
        background-attachment: fixed !important;
    }

    .background-logo {
        position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
        z-index: -1; text-align: center; pointer-events: none;
    }

    .background-logo img {
        width: 650px !important; max-width: 90vw !important;
        mix-blend-mode: screen; filter: grayscale(100%) brightness(1.1) contrast(1.1) !important;
        opacity: 0.4 !important;
        mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
        -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
    }

    .topbar {
        width: 100% !important; height: 60px; display: flex !important;
        align-items: center !important; justify-content: space-between !important;
        padding: 0 20px !important; background: transparent !important;
        position: sticky; top: 0; z-index: 1000; color: white !important;
    }

    .topTitle { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
    .menuBtn { padding: 8px 16px; border-radius: 12px; background: rgba(51, 65, 85, 0.8); color: white; font-weight: 800; cursor: pointer; border: none; }
    
    #chatBox { padding: 15px 15px 160px 15px; height: calc(100vh - 180px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

    /* STYL ZPRÁV */
    .msg { 
        padding: 10px 14px !important; border-radius: 18px !important; max-width: 90%; 
        background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.08) !important; 
        align-self: flex-start; display: flex; flex-direction: column; gap: 4px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 8px;
    }

    .msg.me { 
        align-self: flex-end; background: rgba(34, 197, 94, 0.1) !important; 
        border-color: rgba(34, 197, 94, 0.2) !important; 
    }
    .approved-bg { 
        background: rgba(34, 197, 94, 0.15) !important; 
        border: 1.5px solid rgba(34, 197, 94, 0.5) !important; 
        box-shadow: 0 0 15px rgba(34, 197, 94, 0.1);
    }
    .rejected-bg { 
        background: rgba(239, 68, 68, 0.15) !important; /* Jemné červené pozadí */
        border: 1.5px solid rgba(239, 68, 68, 0.5) !important; 
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
    }

    .msg-sender { font-size: 13px !important; font-weight: 800 !important; color: #38bdf8 !important; letter-spacing: 0.2px; }
    .msg-body { display: flex; align-items: center; gap: 10px; color: white; }
    .msg-text { font-size: 14px !important; line-height: 1.4; font-weight: 500; color: white !important; }
    .msg-time { font-size: 9px; opacity: 0.3; text-align: right; color: white; }

    /* FORMULÁŘE */
    .change-form-container { 
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); 
        border-radius: 20px; padding: 15px; margin-bottom: 10px; display: none; 
    }

    .change-form-container select, .change-form-container input { 
        background: rgba(0,0,0,0.4) !important; border: 1px solid rgba(255,255,255,0.2) !important; 
        color: white !important; padding: 10px !important; border-radius: 10px !important; 
        font-size: 14px !important; font-weight: 600 !important; outline: none; 
    }

    .change-form-container select option { background: #020617 !important; color: white !important; }
    .send-change-btn { background: #22c55e; color: white; font-weight: 800; padding: 12px; border-radius: 12px; width: 100%; margin-top: 10px; font-size: 14px; cursor: pointer; }

    /* OPRAVA MOBILU: Popisky u času a data */
    input[type="time"]::before { content: "Čas: "; color: rgba(255, 255, 255, 0.4); margin-right: 5px; font-weight: 400; font-size: 12px; }
    input[type="date"]::before { content: "Datum: "; color: rgba(255, 255, 255, 0.4); margin-right: 5px; font-weight: 400; font-size: 12px; }
    input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }

    #topicInfoPanel { padding: 20px 25px !important; margin-top: 10px !important; background: transparent !important; backdrop-filter: none !important; border: none !important; box-shadow: none !important; }
    #topicInfoDesc { font-size: 16px !important; line-height: 1.5 !important; color: #ffffff !important; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); max-width: 800px; }
    #topicInfoDesc strong { color: #22c55e !important; font-weight: 800; }

    .chat-input-container { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 550px; z-index: 1001; }
    .chat-input-wrapper { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 35px; padding: 6px 6px 6px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    #msgInput { flex: 1; background: transparent; border: none; color: white; outline: none; }

    .disclaimer { position: fixed !important; bottom: 15px; left: 0; width: 100%; text-align: center; font-size: 9px; color: rgba(255, 255, 255, 0.3); pointer-events: none; }
    #chatInterface, #backBtn { display: none; }
    .msg-approved {
    border-left: 4px solid #22c55e !important;
    background: rgba(34, 197, 94, 0.1) !important;
}
.msg-rejected {
    border-left: 4px solid #ef4444 !important;
    background: rgba(239, 68, 68, 0.1) !important;
    opacity: 0.8;
}
@keyframes pulse-wait {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
}
.wait-dot {
    width: 8px;
    height: 8px;
    background-color: #f1c40f; /* Žlutá barva čekání */
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    animation: pulse-wait 2s infinite;
}
</style>
</head>
<body>

<div class="background-logo" style="position: fixed; top: 10%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: -1; width: 100%; opacity: 0.2;">
    <!-- Nápis ŠKODA (vycentrovaný a viditelný) -->
    <img src="pozadi.jpg" alt="SKODA" style="width: 250px; height: auto; filter: brightness(0) invert(1);">
    
    <!-- Silueta auta (přisátá těsně pod nápis) -->
    <img src="auto.png" alt="Silueta" style="width: 450px; height: auto; filter: brightness(0) invert(1); margin-top: -30px;">

<div class="topbar" id="chatTopbar" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 25px; background: rgba(0,0,0,0.1);">
    <div class="topTitle" style="display: flex; align-items: center; gap: 14px;">
        
        <!-- Tlačítko zpět -->
        <button id="backBtn" onclick="showTopics()" style="background: none; border: none; padding: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; border-radius: 50%;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

        <!-- IKONA: Modrý gradient přesně podle Týmového portálu v indexu -->

            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); 
            border-radius: 12px; 
            padding: 10px; 
            display: flex;

            justify-content: center;

                <path d="m14 14 5.6-5.6a1 1 0 0 1 1.4 0l1.4 1.4a1 1 0 0 1 0 1.4L17 17"></path>
                <path d="m11 11-2-2a1 1 0 0 0-1.4 0l-1.4 1.4a1 1 0 0 0 0 1.4l2 2"></path>
                <path d="m13 13 2 2a1 1 0 0 1 0 1.4l-1.4 1.4a1 1 0 0 1-1.4 0l-2-2"></path>
            </svg>
        </div>

        <!-- NÁZEV: Moderní Škoda ZELENÝ gradient (bílá -> zelená) -->
        <span id="headerLabel" style="
            font-size: 24px; 
            font-weight: 900; 
            letter-spacing: -0.5px;

    <button class="menuBtn" onclick="location.href='index.html'" style="padding: 8px 20px; border-radius: 10px; cursor: pointer;">Menu</button>
</div>

<div id="topicSelection" class="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6 pt-10 text-white">
    <!-- Karta 1: Změny -->
    <div onclick="window.selectTopic('zmeny', 'Změny v rozpisu')" class="group cursor-pointer relative overflow-hidden rounded-[2.5rem] py-4 px-6 bg-blue-500/20 hover:bg-blue-500/30 border border-blue-400/30 active:scale-95 transition-all">
        <div class="mb-2 inline-flex p-3 bg-blue-400/20 rounded-xl text-blue-200">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><polyline points="21 3 21 8 16 8"></polyline></svg>
        </div>
        <h3 class="text-lg font-bold text-blue-100 mb-1">Změny v rozpisu</h3>

    <!-- Karta 2: Absence -->
    <div onclick="window.selectTopic('absence', 'Žádosti o volno')" class="group cursor-pointer relative overflow-hidden rounded-[2.5rem] py-4 px-6 bg-orange-500/20 hover:bg-orange-500/30 border border-orange-400/30 active:scale-95 transition-all">
        <div class="mb-2 inline-flex p-3 bg-orange-400/20 rounded-xl text-orange-200">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>

        <p class="text-orange-100/60 text-[10px]">Dovolené a paragrafy.</p>
    </div>

    <!-- Karta 3: Pokec -->
    <div onclick="window.selectTopic('pokec', 'Společný prostor')" class="group cursor-pointer relative overflow-hidden rounded-[2.5rem] py-4 px-6 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/30 active:scale-95 transition-all">
        <div class="mb-2 inline-flex p-3 bg-emerald-400/20 rounded-xl text-emerald-200">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <h3 class="text-lg font-bold text-emerald-100 mb-1">Společný prostor</h3>
        <p class="text-emerald-100/60 text-[10px]">Volná diskuse.</p>
    </div>
</div>

<div id="chatInterface">
    <div id="topicInfoPanel"><p id="topicInfoDesc">Popis...</p></div>


    <!-- FORMULÁŘ ABSENCE -->
    <div id="absenceForm" class="change-form-container mx-4 mt-4">
        <div class="grid grid-cols-2 gap-2">
            <select id="absWorkerSelect" class="col-span-2 w-full"><option value="">-- Vyber jméno --</option></select>
            <select id="absType" onchange="window.toggleParagrafOptions()">
                <option value="Dovolená">Dovolená</option>
                <option value="Paragraf">Paragraf</option>
            </select>
            <select id="absReason" style="display: none;">
                <option value="Návštěva lékaře">Návštěva lékaře</option>
                <option value="Doprovod k lékaři">Doprovod k lékaři</option>
                <option value="Darování krve">Darování krve</option>
                <option value="Narození dítěte">Narození dítěte</option>
                <option value="Svatba">Svatba</option>
                <option value="Úmrtí v rodině">Úmrtí v rodině</option>
                <option value="Stěhování">Stěhování</option>
            </select>
            <input type="date" id="absDateFrom"> <input type="date" id="absDateTo">
        </div>
        <button id="submitAbsenceBtn" class="send-change-btn" style="background: #f59e0b !important;">Odeslat žádost</button>
    </div>

    <div id="chatBox"></div>

    <div class="chat-input-container">
        <div class="chat-input-wrapper">
            <input type="text" id="msgInput" placeholder="Napiš vzkaz...">
            <button id="sendBtn" class="bg-[#22c55e] text-white w-11 h-11 rounded-full flex items-center justify-center">
                <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" /></svg>
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import { 
    getFirestore, collection, getDocs, getDoc, addDoc, deleteDoc, updateDoc, 
    doc, query, where, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    const firebaseConfig = {
        apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
        authDomain: "generator-smen-9fba1.firebaseapp.com",
        projectId: "generator-smen-9fba1",
        storageBucket: "generator-smen-9fba1.firebasestorage.app",
        messagingSenderId: "541779211883",
        appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
    };

    const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app); 

// --- KONSTANTY A PROMĚNNÉ ---
const POSITIONS = ["DP-L", "DP-P", "ZRC-L", "ZRC-P", "T-L", "T-P", "AGR-LP", "AGR-PP", "AGR-PZ", "AGR-LZ", "MOT-L", "MOT-P", "LEP-LP", "LEP-PP", "LEP-Z", "REPRO-L", "REPRO-P", "VYP1-L", "VYP1-P", "VYP2-L", "VYP2-P", "PR-L", "PR-P", "ZAM-L", "ZAM-P", "VET", "VET2", "VET3", "INST", "INST2", "INST3"];

let allNicknames = {}; 
let userRoles = {}; 
let currentTopicId = null; 
let chatUnsubscribe = null;

const topicData = {
    'zmeny': { 
        desc: `Zde se zobrazují <strong>žádosti o prohození pozic</strong>. Na žádost může reagovat pouze adresát. 
               <br><span style="font-size: 11px; opacity: 0.7; display: block; margin-top: 8px; font-weight: 400; line-height: 1.4;">
               Pro odeslání žádosti si otevři Rozpis směn, klikni na svoje jméno a vyber si, s kým se chceš vyměnit.
               </span>`, 
        icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><polyline points="21 3 21 8 16 8"></polyline></svg>' 
    },
    'absence': { desc: "Zde podávejte <strong>oficiální žádosti</strong> o dovolenou nebo paragraf.", icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="3"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>' },
    'pokec': { desc: "Volná diskuse mimo pracovní témata. Prosíme o dodržování <strong>zásad slušného chování</strong>.", icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="3"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>' }
};

// --- INICIALIZACE FORMULÁŘŮ ---
const pFrom = document.getElementById("posFrom"); 
const pTo = document.getElementById("posTo");
if (pFrom && pTo) {
    POSITIONS.forEach(p => { 
        pFrom.innerHTML += `<option value="${p}">${p}</option>`; 
        pTo.innerHTML += `<option value="${p}">${p}</option>`; 
    });
}

window.toggleParagrafOptions = () => {
    const type = document.getElementById("absType").value;
    document.getElementById("absReason").style.display = (type === "Paragraf") ? "block" : "none";
};

// --- LOGIKA TÉMAT A PŘEPÍNÁNÍ ---
window.selectTopic = (id, name) => {
    currentTopicId = id;
    document.getElementById("topicSelection").style.display = 'none';
    document.getElementById("chatInterface").style.display = 'block';
    document.getElementById("backBtn").style.display = 'inline-block';
    document.getElementById("headerIcon").innerHTML = topicData[id].icon;
    document.getElementById("headerLabel").innerText = name;
    document.getElementById("topicInfoDesc").innerHTML = topicData[id].desc;
    document.getElementById("absenceForm").style.display = (id === 'absence') ? 'block' : 'none';
    const pokecInput = document.querySelector(".chat-input-container");
    if (pokecInput) pokecInput.style.display = (id === 'pokec') ? 'block' : 'none';
    startChatListener(id);
};

window.showTopics = () => {
    if (chatUnsubscribe) chatUnsubscribe();
    document.getElementById("topicSelection").style.display = 'grid';
    document.getElementById("chatInterface").style.display = 'none';
    document.getElementById("backBtn").style.display = 'none';
    document.getElementById("headerIcon").innerHTML = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14 5.6 8.4a1 1 0 0 0-1.4 0l-1.4 1.4a1 1 0 0 0 0 1.4l5.6 5.6"></path><path d="m14 14 5.6-5.6a1 1 0 0 1 1.4 0l1.4 1.4a1 1 0 0 1 0 1.4L17 17"></path><path d="m11 11-2-2a1 1 0 0 0-1.4 0l-1.4 1.4a1 1 0 0 0 0 1.4l2 2"></path><path d="m13 13 2 2a1 1 0 0 1 0 1.4l-1.4 1.4a1 1 0 0 1-1.4 0l-2-2"></path></svg>`;
    document.getElementById("headerLabel").innerText = 'Týmový portál';
};

// --- DATA PRACOVNÍKŮ ---
async function loadNicknames() {
    const snap = await getDocs(collection(db, "employees"));
    const wSelect = document.getElementById("workerSelect"); 
    const aSelect = document.getElementById("absWorkerSelect");
    
    // Získáme email aktuálně přihlášeného uživatele
    const currentUserEmail = auth.currentUser?.email?.toLowerCase();
    let myName = "";

    snap.forEach(docSnap => {
        const d = docSnap.data(); 
        const jmeno = d.fName || d.name || "Host";
        const email = d.email?.replace(/["']/g, '').trim().toLowerCase();
        
        if (email) {
            allNicknames[email] = jmeno;
            userRoles[email] = d.role || "user"; 
            
            // Pokud se email v DB shoduje s přihlášeným uživatelem, uložíme si jeho jméno
            if (email === currentUserEmail) {
                myName = jmeno;
            }
        }
    });

    // Funkce pro naplnění selectu
    const fillSelect = (selectElement) => {
        if (!selectElement) return;
        
        // Pokud jsme našli jméno uživatele, nabídneme mu jen jeho volbu
        if (myName) {
            selectElement.innerHTML = `<option value="${myName}">${myName}</option>`;
        } else {
            // Pokud uživatel v DB není (např. admin bez karty), necháme mu výběr nebo prázdno
            selectElement.innerHTML = '<option value="">-- Jméno nenalezeno --</option>';
        }
    };

    fillSelect(wSelect);
    fillSelect(aSelect);

    // Zbytek tvého kódu pro nastavení datumu
    const today = new Date();
    const offset = today.getTimezoneOffset() * 60000;
    const localISO = (new Date(today - offset)).toISOString().slice(0, 10);
    if (document.getElementById("changeDate")) document.getElementById("changeDate").value = localISO;
    if (document.getElementById("absDateFrom")) document.getElementById("absDateFrom").value = localISO;
    if (document.getElementById("absDateTo")) document.getElementById("absDateTo").value = localISO;
}


onAuthStateChanged(auth, async (u) => { 
    if (u) await loadNicknames(); 
    else window.location.href = "index.html"; 
});

// --- HLAVNÍ POSLUCHAČ ZPRÁV ---
function startChatListener(topicId) {
    const q = query(collection(db, "chat"), where("topic", "==", topicId), orderBy("createdAt", "asc"));
    
    // Definice časů pro jednotlivé směny
    const shiftTimes = {
        "ranni": ["06:00-08:00", "08:05-10:15", "10:45-12:00", "12:05-14:00"],
        "odpo": ["14:00-16:00", "16:05-18:15", "18:45-20:00", "20:05-22:00"],
        "noc": ["22:00-00:00", "00:05-02:15", "02:45-04:00", "04:05-06:00"]
    };

    chatUnsubscribe = onSnapshot(q, (snapshot) => {
        let html = "";
        const currentUserEmail = auth.currentUser?.email?.toLowerCase().trim();
        const isAdmin = userRoles[currentUserEmail] === "admin";

        snapshot.forEach((docSnap) => {
            const m = docSnap.data();
            const msgId = docSnap.id;
            const isMe = m.senderEmail === currentUserEmail;
            const isTarget = m.targetEmail === currentUserEmail;
            
            const senderNick = allNicknames[m.senderEmail] || "Někdo";
            const targetNick = allNicknames[m.targetEmail] || "Někdo";
            const time = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "...";

            const posStyle = `style="font-size: 14px; color: #2ecc71; font-weight: 900;"`;

            // --- 1. BARVA KARTY ---
            let cardClass = "";
            if (m.status === "approved") cardClass = "approved-bg";
            else if (m.status === "rejected") cardClass = "rejected-bg";
            else if (isMe) cardClass = "me";

            // --- 2. ČASOVÉ INFO ŽÁDOSTI ---
            let infoTime = "";
if (m.isSwapRequest && m.swapDetails) {
    const d = m.swapDetails;
    // Formát data: 22. 3.
    const czechDate = new Date(d.date).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric' });
    const shiftLabel = d.shift === "ranni" ? "Ranní" : d.shift === "odpo" ? "Odpo" : "Noční";
    const exactTime = shiftTimes[d.shift] ? shiftTimes[d.shift][d.phase] : `${d.phase + 1}. část`;
    
    // Moderní vyznění: Tučný text, žádné ikony, výrazná barva
    infoTime = `
        <div style="font-size: 12px; color: #fff; margin-bottom: 10px; letter-spacing: 0.5px;">
            <b style="color: #2ecc71; text-transform: uppercase; font-weight: 900; font-size: 11px;">Změna:</b> 
            <span style="font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; margin-left: 5px;">
                ${czechDate} | ${shiftLabel} (${exactTime})
            </span>
        </div>`;
}

            // --- 3. DYNAMICKÝ TEXT ŽÁDOSTI ---
            let messageText = m.text; 
if (m.isSwapRequest) {
    const posStyle = `style="font-size: 14px; color: #2ecc71; font-weight: 900;"`;
    const details = m.swapDetails;

    if (isMe) {
        // TVOJE ŽÁDOST (Vpravo)
        messageText = `${infoTime} Tvoje žádost o prohození:<br>
                       <b>${senderNick}</b> (<span ${posStyle}>${details.fromPos}</span>) ➔ <span ${posStyle}>${details.toPos}</span><br>
                       <b>${targetNick}</b> (<span ${posStyle}>${details.toPos}</span>) ➔ <span ${posStyle}>${details.fromPos}</span>`;
    } else if (isTarget) {
        // CIZÍ ŽÁDOST (Vlevo) - Teď uvidíš přesně kdo a kam!
        messageText = `${infoTime} <b style="font-size: 16px;">${senderNick}</b> tě žádá o výměnu:<br>
                       <b>${senderNick}</b> (<span ${posStyle}>${details.fromPos}</span>) ➔ <span ${posStyle}>${details.toPos}</span><br>
                       <b>TY</b> (<span ${posStyle}>${details.toPos}</span>) ➔ <span ${posStyle}>${details.fromPos}</span>`;
    } else {
        // PRO OSTATNÍ (Admin atd.)
        messageText = `${infoTime} Výměna pozic:<br>
                       <b>${senderNick}</b> (<span ${posStyle}>${details.fromPos}</span>) ➔ <b>${targetNick}</b> (<span ${posStyle}>${details.toPos}</span>)<br>
                       <b>${targetNick}</b> (<span ${posStyle}>${details.toPos}</span>) ➔ <b>${senderNick}</b> (<span ${posStyle}>${details.fromPos}</span>)`;
    }
}

            // --- 4. STAVOVÉ TEXTY ---
            let statusInfo = "";
            if (m.status === "approved") {
                statusInfo = `<div style="color:#2ecc71; font-size:12px; margin-top:10px; font-weight:700;">✓ Potvrzeno a změněno v rozpisu</div>`;
            } else if (m.status === "rejected") {
                const isSystemError = m.text.includes("(system_error)");
                const statusText = isSystemError ? "Výměna nemohla být provedena kvůli změnám v rozpisu" : "Výměna byla zamítnuta";
                statusInfo = `<div style="color:#ef4444; font-size:12px; margin-top:10px; font-weight:700;">✕ ${statusText}</div>`;
            }

            const displayMessageText = messageText.replace("(system_error)", "");

            // --- 5. ADMIN KŘÍŽEK ---
            const deleteBtn = isAdmin ? `
                <button onclick="window.deleteMsg('${msgId}')" title="Smazat" style="position:absolute; top:10px; right:10px; background:rgba(255,255,255,0.1); border:none; color:#f87171; opacity:0.6; cursor:pointer; font-size:18px; transition:0.3s; z-index:10; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;">✕</button>
            ` : '';

            // --- 6. TLAČÍTKA AKCÍ ---
            let swapButtons = "";
            if (m.isSwapRequest && m.status === "pending") {
                if (isTarget) {
                    swapButtons = `
                        <div style="display:flex; gap:10px; margin-top:15px;">
                            <button onclick="window.handleSwapAction('${msgId}', true)" style="flex:1; background:#22c55e; color:white; border:none; padding:12px; border-radius:14px; font-weight:900; cursor:pointer; font-size:14px; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);">Přijmout</button>
                            <button onclick="window.handleSwapAction('${msgId}', false)" style="flex:1; background:rgba(239, 68, 68, 0.15); color:#ef4444; border:1px solid rgba(239, 68, 68, 0.3); padding:12px; border-radius:14px; font-weight:800; cursor:pointer; font-size:14px;">Odmítnout</button>
                        </div>`;
                } else if (isMe) {
                    swapButtons = `
                        <div style="display:flex; align-items:center; margin-top:12px; color:#f1c40f; font-size:12px; font-weight:600; letter-spacing:0.3px;">
                            <span class="wait-dot"></span>Čeká se na vyjádření...
                        </div>`;
                }
            }

            html += `
            <div class="msg ${cardClass}" id="msg-${msgId}" style="border-radius:22px; padding:18px; margin-bottom:15px; border: 1px solid rgba(255,255,255,0.08); background: rgba(15, 23, 42, 0.6); position: relative;">
                ${deleteBtn}
                <div style="line-height:1.6; color:#fff; font-size:14px; padding-right: 25px;">
                    ${displayMessageText}
                </div>
                ${statusInfo}
                ${swapButtons}
                <div style="text-align:right; font-size:10px; opacity:0.2; margin-top:10px;">${time}</div>
            </div>`;
        });
        document.getElementById("chatBox").innerHTML = html;
        document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight;
    });
}

// --- FUNKCE PRO ZPĚTNOU VAZBU TLAČÍTEK ---
const showBtnFeedback = (btnId, text, iconType = 'success') => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const originalContent = btn.innerHTML;
    const originalBg = btn.style.background;
    const icons = {
        success: `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="3" fill="none" style="margin-right:8px;"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
        error: `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="3" fill="none" style="margin-right:8px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
    };
    btn.innerHTML = `<div style="display:flex; align-items:center; justify-content:center;">${icons[iconType]} ${text}</div>`;
    btn.style.background = (iconType === 'error') ? "#b91c1c" : "#15803d"; 
    btn.disabled = true;
    setTimeout(() => { btn.innerHTML = originalContent; btn.style.background = originalBg; btn.disabled = false; }, 1500);
};
window.handleSwapAction = async (msgId, isAccepted) => {
    const msgRef = doc(db, "chat", msgId);
    const msgSnap = await getDoc(msgRef);
    const m = msgSnap.data();

    if (!isAccepted) {
        await updateDoc(msgRef, { status: "rejected" });
        if (window.showToast) showToast("Výměna byla zamítnuta", "error");
        return;
    }

    try {
        const d = m.swapDetails;
        const shiftId = `${d.date}_${d.shift}`;
        const shiftRef = doc(db, "shifts", shiftId);
        const shiftSnap = await getDoc(shiftRef);

        if (!shiftSnap.exists()) {
            if (window.showToast) showToast("Směna již neexistuje", "error");
            return;
        }

        let shiftData = shiftSnap.data();
        let isNested = (shiftData.phases && shiftData.phases[d.phase]);
        let source = isNested ? shiftData.phases[d.phase] : shiftData;

        const getCleanID = (val) => {
            if (!val) return "PRÁZDNO";
            const id = (typeof val === 'string') ? val : (val.m || val.id || "");
            return id.toString().toLowerCase().trim();
        };

        const realA = getCleanID(source[d.fromPos]); 
        const realB = getCleanID(source[d.toPos]);   
        const reqA = d.fromId.toString().toLowerCase().trim(); 
        const reqB = d.toId.toString().toLowerCase().trim();   

        // --- 1. ÚPRAVA: MODERNÍ TEXT POJISTKY ---
       if (realA !== reqA || realB !== reqB) {
    if (window.showToast) showToast("Výměna již není možná (změna v rozpisu)", "error");
    
    await updateDoc(msgRef, { 
        status: "rejected", 
        // Přidáme příznak (system_error), aby to vykreslování poznalo
        text: m.text + " (system_error)" 
    });
    return;
}

        // --- PROHOZENÍ ---
         const d1 = source[d.fromPos]; // Data pozice 1 (např. VYP1-L)
        const d2 = source[d.toPos];   // Data pozice 2 (např. VYP2-L)

        // Extrahujeme hlavní pracovníky (m)
        const m1 = (typeof d1 === 'string') ? d1 : (d1.m || d1.id);
        const m2 = (typeof d2 === 'string') ? d2 : (d2.m || d2.id);

        // Extrahujeme učně (t), pokud na dané pozici jsou
        const t1 = (typeof d1 === 'object') ? d1.t : null;
        const t2 = (typeof d2 === 'object') ? d2.t : null;

        // VYTVOŘÍME NOVÁ DATA: Prohodíme jen 'm', ale 't' vrátíme tam, kde byl
        source[d.fromPos] = t1 ? { m: m2, t: t1 } : m2;
        source[d.toPos] = t2 ? { m: m1, t: t2 } : m1;

        if (isNested) {
            await updateDoc(shiftRef, { phases: shiftData.phases });
        } else {
            let updateObj = {};
            updateObj[d.fromPos] = source[d.fromPos];
            updateObj[d.toPos] = source[d.toPos];
            await updateDoc(shiftRef, updateObj);
        }

        // --- 2. ÚPRAVA: ČISTÉ POTVRZENÍ (Už jen status, žádný text do DB) ---
        await updateDoc(msgRef, { status: "approved" });
        if (window.showToast) showToast("Rozpis byl úspěšně aktualizován", "success");

    } catch (err) {
        console.error("Chyba systému:", err);
        if (window.showToast) showToast("Chyba při zápisu!", "error");
    }
};

document.getElementById("submitAbsenceBtn").onclick = async () => {
    const w = document.getElementById("absWorkerSelect").value; 
    const type = document.getElementById("absType").value;
    const reason = (type === "Paragraf") ? ` (${document.getElementById("absReason").value})` : "";
    const from = document.getElementById("absDateFrom").value, to = document.getElementById("absDateTo").value;
    if(!w || !from || !to) return showBtnFeedback("submitAbsenceBtn", "Vyplňte vše!", "error");
    const dF = new Date(from).toLocaleDateString('cs-CZ'), dT = new Date(to).toLocaleDateString('cs-CZ');
    const range = (from === to) ? dF : `${dF} – ${dT}`;
    await addDoc(collection(db, "chat"), { text: `<strong>${w}:</strong> ${type}${reason} | ${range}`, senderEmail: auth.currentUser.email, topic: "absence", createdAt: serverTimestamp(), status: "pending" });
    showBtnFeedback("submitAbsenceBtn", "Žádost poslána");
};

const handleSend = async () => {
    const input = document.getElementById("msgInput"); const text = input.value.trim();
    if (!text || !currentTopicId) return;
    await addDoc(collection(db, "chat"), { text, senderEmail: auth.currentUser.email, topic: currentTopicId, createdAt: serverTimestamp() });
    input.value = "";
};

document.getElementById("sendBtn").onclick = handleSend;
document.getElementById("msgInput").onkeypress = (e) => { if (e.key === "Enter") handleSend(); };

// --- LOGIKA SCHVALOVÁNÍ A MAZÁNÍ (EXPORT DO WINDOW) ---
window.approveMsg = async (msgId) => {
    const el = document.querySelector(`#msg-${msgId} [onclick*="approveMsg"]`);
    if (!el.dataset.confirm) {
        el.dataset.confirm = "true"; el.style.transform = "scale(1.5)";
        setTimeout(() => { delete el.dataset.confirm; el.style.transform = "scale(1)"; }, 3000);
        return;
    }
    try { await updateDoc(doc(db, "chat", msgId), { status: "approved" }); } catch (err) { console.error(err); }
};

window.rejectMsg = async (msgId) => {
    const el = document.querySelector(`#msg-${msgId} [onclick*="rejectMsg"]`);
    if (!el.dataset.confirm) {
        el.dataset.confirm = "true"; el.style.transform = "scale(1.5)";
        setTimeout(() => { delete el.dataset.confirm; el.style.transform = "scale(1)"; }, 3000);
        return;
    }
    try { await updateDoc(doc(db, "chat", msgId), { status: "rejected" }); } catch (err) { console.error(err); }
};

window.deleteMsg = async (msgId) => {
    const el = document.querySelector(`#msg-${msgId} [onclick*="deleteMsg"]`);
    
    if (!el.dataset.confirm) {
        // PRVNÍ KLIK: Tlačítko se zvýrazní a zvětší
        el.dataset.confirm = "true";
        el.style.transform = "scale(1.2)";
        el.style.opacity = "1";
        el.style.background = "rgba(239, 68, 68, 0.2)"; // Červený nádech podkladu
        el.style.color = "#ff4d4d"; // Jasnější červená
        
        setTimeout(() => { 
            if (el && el.dataset.confirm) {
                delete el.dataset.confirm; 
                el.style.transform = "scale(1)"; 
                el.style.opacity = "0.6"; 
                el.style.background = "rgba(255,255,255,0.1)";
                el.style.color = "#f87171";
            }
        }, 3000);
        return;
    }

    // DRUHÝ KLIK: Smazání
    try {
        await deleteDoc(doc(db, "chat", msgId));
        if (window.showToast) showToast("Zpráva byla smazána", "success");
    } catch (err) {
        if (window.showToast) showToast("Chyba při mazání", "error");
    }
};
</script>
