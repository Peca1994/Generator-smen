<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Týmový Chat</title>

<style>
/* 1. GLOBÁLNÍ OPRAVA */
* { box-sizing: border-box; }
html, body {
    width: 100%; margin: 0; padding: 0; overflow-x: hidden;
    background: radial-gradient(circle at center, #062111 0%, #000000 100%) !important;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: white; min-height: 100vh;
}

/* Zapuštěné logo na pozadí */
.background-logo {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    z-index: -1; pointer-events: none; opacity: 0.12;
}
.background-logo img { width: 400px; max-width: 80vw; filter: brightness(0.6) sepia(1) hue-rotate(85deg) saturate(2.5); }

/* 2. TOPBAR */
.topbar {
    width: 100%; height: 60px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 20px;
    position: sticky; top: 0; z-index: 1000;
    background: rgba(0,0,0,0.3); backdrop-filter: blur(5px);
}
.topTitle { font-size: 20px; font-weight: 800; }
.menuBtn { padding: 8px 15px; border-radius: 10px; border: none; background: #334155; color: white; cursor: pointer; font-weight: bold; }

/* 3. CHAT BOX - OPRAVA ROZLOŽENÍ */
#chatBox {
    width: 100%; max-width: 600px; margin: 0 auto;
    height: calc(100vh - 180px);
    overflow-y: auto; display: flex; flex-direction: column;
    gap: 8px; padding: 15px 15px 120px 15px;
}

/* Bubliny - sjednocení a zmenšení výšky */
.msg {
    padding: 6px 12px !important; border-radius: 15px;
    max-width: 80%; width: fit-content;
    background: rgba(255, 255, 255, 0.1);
    align-self: flex-start; position: relative;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.msg.me {
    align-self: flex-end; /* Tvoje zprávy vpravo */
    background: rgba(34, 197, 94, 0.2);
    border: 1px solid rgba(34, 197, 94, 0.3);
}

.msg-sender { font-size: 10px; font-weight: 800; color: #38bdf8; margin-bottom: 2px; }
.msg-text { font-size: 14px; line-height: 1.3; }
.msg-time { font-size: 9px; opacity: 0.5; text-align: right; margin-top: 3px; display: block; }

/* 4. PSACÍ LIŠTA - OPRAVA ŠIPKY */
.chat-input-container {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%); width: 90%; max-width: 500px;
}

.chat-input-wrapper {
    background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 30px; padding: 5px 5px 5px 20px;
    display: flex; align-items: center; gap: 10px;
}

#msgInput {
    flex: 1; background: transparent; border: none;
    color: white; font-size: 15px; outline: none;
}

#sendBtn {
    background: #22c55e; color: white; border: none;
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; flex-shrink: 0;
}

#sendBtn svg { margin-left: 3px; width: 22px; height: 22px; }

.disclaimer { font-size: 9px; color: rgba(255,255,255,0.2); text-align: center; margin-top: 10px; }
</style>
</head>

<body>
<div class="background-logo">
    <img src="pozadi.jpg" alt="Logo">
</div>
<div class="topbar">
    <span class="topTitle"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg> Týmový Chat</span>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<!-- 2. SEM VLOŽ TENTO BLOK (Uprostřed mezi lištami) -->
<div id="chatBox">
    <!-- Sem skript automaticky vloží zprávy -->
</div>

<!-- 3. Tady už máš (nebo vlož) spodní část s textem -->

<div class="chat-input-container">
    <!-- 1. Psací lišta -->
    <div class="chat-input-wrapper">
        <input type="text" id="msgInput" placeholder="Napiš vzkaz...">
        <button id="sendBtn">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" /></svg>
        </button>
    </div>

    <!-- 2. Text o právech (teď bude až pod lištou) -->
    <div class="disclaimer">
        © 2024 ShiftMaster | Neoficiální nástroj. Logo ŠKODA je majetkem ŠKODA AUTO a.s.
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import { 
    getFirestore, 
    collection, 
    addDoc, 
    query,       // TATO FUNKCE TI CHYBĚLA
    orderBy, 
    onSnapshot, 
    getDocs, 
    where,       // TATO TAKÉ
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
    measurementId: "G-1HF3R93092"
};

// 2. INICIALIZACE - Teď už getAuth() bude fungovat
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app); 

const chatBox = document.getElementById("chatBox");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

let currentUserNickname = "Host";
let allNicknames = {}; 

async function loadNicknames() {
    try {
        const snap = await getDocs(collection(db, "employees"));
        allNicknames = {};
        
        snap.forEach(doc => {
            const d = doc.data();
            // 1. OPRAVA EMAILU: Odstraníme uvozovky a mezery, které tam máš v DB
            if (d.email) {
                const cleanEmail = d.email.replace(/"/g, '').trim().toLowerCase();
                
                // 2. OPRAVA POLE: Podle fotky máš v DB pole 'name', ne 'fName'
                // Použijeme 'name' (Péca) nebo 'surname' (Lukáš Pecka)
                allNicknames[cleanEmail] = d.name || d.surname || cleanEmail;
                
                console.log(`Spárováno: ${cleanEmail} => ${allNicknames[cleanEmail]}`);
            }
        });
    } catch (err) {
        console.error("Chyba:", err);
    }
}

onAuthStateChanged(auth, async (user) => {
    if (user) {
        await loadNicknames();
        const userEmail = user.email.toLowerCase().trim();
        // Zkusíme najít přezdívku v naší mapě
        currentUserNickname = allNicknames[userEmail] || user.email.split('@')[0];
        console.log("Tvoje finální přezdívka:", currentUserNickname);
        startChatListener();
    } else {
        window.location.href = "index.html"; 
    }
});

function startChatListener() {
    const qChat = query(collection(db, "chat"), orderBy("createdAt", "asc"));
    onSnapshot(qChat, (snapshot) => {
        chatBox.innerHTML = "";
        snapshot.forEach((docSnap) => {
   const m = docSnap.data();
if (!m.text) return;

// 1. Očištění emailu odesílatele (z databáze zprávy)
const senderEmailKey = m.senderEmail ? m.senderEmail.toLowerCase().trim().replace(/"/g, '') : "";

// 2. Jméno z mapy (pokud není, použijeme email nebo "Host")
const displayName = allNicknames[senderEmailKey] || m.sender || "Host";

// 3. SPRÁVNÉ POROVNÁNÍ PRO STRANU (isMe)
// Musíme se ujistit, že auth.currentUser existuje
const myEmail = auth.currentUser ? auth.currentUser.email.toLowerCase().trim() : "";
const isMe = senderEmailKey === myEmail;

// 4. Formát času
const time = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "...";

// 5. Vykreslení do HTML
chatBox.innerHTML += `
    <div class="msg ${isMe ? 'me' : ''}">
        <span class="msg-sender">${displayName}</span>
        <div class="msg-text">${m.text}</div>
        <span class="msg-time">${time}</span>
    </div>
`;
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !auth.currentUser) return;

    await addDoc(collection(db, "chat"), {
        text: text,
        sender: currentUserNickname,
        senderEmail: auth.currentUser.email,
        createdAt: serverTimestamp() 
    });
    msgInput.value = "";
}

sendBtn.onclick = sendMessage;
msgInput.onkeypress = (e) => { if (e.key === "Enter") sendMessage(); };
</script>

</body>
</html>
