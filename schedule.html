<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Směnový graf | ShiftMaster</title>

<style>
        /* 1. GLOBÁLNÍ OPRAVA (Vložte hned sem) */
        * {
            box-sizing: border-box;
            max-width: 100%;
        }

        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
/* 1. GLOBÁLNÍ DESIGN S LOGEM ŠKODA */
body {
    /* Identické tmavě zelené pozadí */
    background: radial-gradient(circle at center, #062111 0%, #000000 100%) !important;
    margin: 0;
    padding: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: white;
    min-height: 100vh;
}

/* Zapuštěné logo ŠKODA na pozadí */
.background-logo {
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
    text-align: center;
    pointer-events: none;
}

.background-logo img {
    width: 650px !important;
    max-width: 90vw !important;
    opacity: 0.12 !important;
    filter: brightness(0.6) sepia(1) hue-rotate(85deg) saturate(2.5) blur(1px) !important;
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
}

.background-logo h1 {
    font-size: 16vw !important;
    margin-top: -30px !important;
    letter-spacing: 25px !important;
    color: #1a3a2a !important;
    opacity: 0.5 !important;
    font-weight: 900;
    text-transform: uppercase;
}

/* 2. TOPBAR */

.menuBtn { 
    padding: 8px 14px; 
    border-radius: 10px; 
    border: none; 
    font-weight: 800; 
    background: rgba(51, 65, 85, 0.8); 
    color: white; 
    cursor: pointer; 
}

/* 3. KONTEJNER A SKLENĚNÉ KARTY */
.container { max-width: 450px; margin: 20px auto; padding: 15px; }

.card, .search-box, .schedule-container {
    background: rgba(255, 255, 255, 0.05) !important; /* Velmi jemné prosvítání */
    border: none !important; /* Smaže to tvrdé ohraničení */
    box-shadow: none !important; /* Smaže rušivé stíny */
    backdrop-filter: none !important; /* Ostré pozadí bez rozmazání */
    padding: 30px 20px !important;
    border-radius: 25px !important;
}

/* 4. FORMULÁŘE A ČITELNOST */
input, select {
    width: 100% !important;
    max-width: 300px !important; /* Nastav si šířku, která ti vyhovuje */
    background: rgba(255, 255, 255, 0.08) !important;
    border: none !important;
    border-bottom: 2px solid rgba(255, 255, 255, 0.2) !important; /* Decentní spodní linka */
    border-radius: 12px !important;
    padding: 12px 15px !important;
    color: white !important;
    font-size: 16px !important;
    text-align: center !important;
    outline: none !important;
    margin: 0 auto 20px auto !important; /* Vycentrování a mezera pod polem */
    display: block !important;
    transition: all 0.3s ease;
}

/* Efekt při kliknutí / psaní */
input:focus, select:focus {
    background: rgba(255, 255, 255, 0.12) !important;
    border-bottom: 2px solid #00ff88 !important; /* Škodovácká zelená při aktivaci */
}

/* Úprava barvy nápisů (Datum, Směna, Vyhledat jméno) */
label, .input-label {
    color: #38bdf8 !important; /* Světle modrá jako jména v chatu */
    font-size: 11px !important;
    font-weight: 800 !important;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px !important;
    display: block;
}

/* 5. TABULKA */
.table-wrapper { overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
th { color: #22c55e; font-weight: 900; background: rgba(0,0,0,0.2); }
/* Základní vzhled prvního sloupce */
.posCol { text-align: left; font-weight: 900; }

/* Barva pro AKTIVNÍ pozici (zelená) */
.active-pos { color: #22c55e !important; text-shadow: 0 0 5px rgba(34, 197, 94, 0.4); }

/* Barva pro NEAKTIVNÍ pozici (červená) */
.inactive-pos { color: #ef4444 !important; opacity: 0.7; }

/* Barva pro ČASY v záhlaví (např. zlatá/žlutá pro lepší kontrast) */
th { color: #facc15 !important; font-weight: 900; background: rgba(0,0,0,0.2); }
.highlight { color: #22c55e !important; font-weight: 900; background: rgba(34, 197, 94, 0.1); }
.empty { opacity: .3; }
.topbar {
    width: 100% !important;
    height: 60px;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 0 20px !important;
    box-sizing: border-box !important;
    background: transparent !important;
    border: none !important;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.topTitle {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif !important;
    font-size: 22px !important;
    font-weight: 800 !important;
    color: #ffffff !important;
    letter-spacing: -0.5px !important;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    padding-left: 10px;
}
/* ÚPRAVY PRO MOBILNÍ TELEFONY */
@media screen and (max-width: 500px) {
    /* 1. Využijeme celou šířku displeje a zmenšíme vnější okraje */
    .container { 
        max-width: 100% !important; 
        padding: 5px !important; 
        margin: 0 auto !important; 
    }
    
    .card { 
        padding: 10px !important; 
        border-radius: 12px !important; 
    }

    /* 2. Zmenšíme písmo v tabulce, aby se tam vešlo víc textu */
    table { 
        font-size: 11px !important; 
    }

    th, td { 
        padding: 6px 2px !important; /* Minimum místa kolem textu */
        word-break: break-word; /* Dlouhá jména se zalomí, pokud bude potřeba */
    }

    /* 3. Sloupec s pozicí (např. AGR-LP) uděláme co nejužší */
    .posCol { 
        min-width: 50px !important; 
        font-size: 10px !important;
        padding-left: 5px !important;
    }

    /* 4. Skryjeme nepotřebné mezery, aby tabulka nebyla "nafouklá" */
    .empty { 
        font-size: 10px; 
        opacity: 0.2; 
    }
}
.disclaimer {
    position: relative; /* Změna z fixed na relative, aby netvořil prázdné místo pod sebou */
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.3); /* Decentní šedá */
    text-align: left; /* Zarovnání doleva */
    font-family: sans-serif;
    line-height: 1.3;
    width: 100%;
    box-sizing: border-box;
}
@media (max-width: 480px) {
    .disclaimer {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
        width: 90%;
        max-width: none;
    }
}
/* 3. OPRAVA HLÁŠKY "Nenalezeno" / "Chyba" */
#statusMsg, .no-data-msg, .error-message {
    background: rgba(255, 255, 255, 0.05) !important; /* Velmi jemné sklo */
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 15px !important;
    color: #ffb100 !important; /* Tvá nová žlutá/jantarová barva pro upozornění */
    padding: 20px !important;
    margin-top: 20px !important;
    text-align: center !important;
    font-weight: 600 !important;
    font-size: 14px !important;
    backdrop-filter: none !important; /* Ostré pozadí */
}
.card, .container, .main-box, .schedule-card {
    background: transparent !important; /* Karta bude neviditelná, zůstane jen obsah */
    border: none !important;           /* Smaže čáru ohraničení */
    border-width: 0 !important;        /* Pojistka pro starší prohlížeče */
    outline: none !important;          /* Smaže případný obrys */
    box-shadow: none !important;       /* Smaže ten tmavý stín kolem dokola */
    backdrop-filter: none !important;  /* Zruší rozmazání loga */
    margin-top: 10px !important;
}
#statusMsg, .no-data-msg, .error-message, [id^="status"] {
    background: rgba(255, 255, 255, 0.05) !important; /* Jemné skleněné prosvětlení */
    border: none !important; /* Smaže ohraničení hlášky */
    border-radius: 15px !important;
    color: #ffb100 !important; /* Tvá nová žlutá/jantarová barva pro upozornění */
    padding: 20px !important;
    margin-top: 30px !important; /* Větší mezera od vyhledávání */
    text-align: center !important;
    font-weight: 600 !important;
    font-size: 15px !important;
    backdrop-filter: none !important; /* Ostré pozadí pod textem */
    width: 100% !important;
    max-width: 400px !important;
    margin-left: auto !important;
    margin-right: auto !important;
}
select {
    -webkit-appearance: none !important;
    -moz-appearance: none !important;
    appearance: none !important;
}

/* Odstranění ikonky kalendáře u DATUMU (pro Chrome/Safari) */
input[type="date"]::-webkit-calendar-picker-indicator {
    display: none !important;
    -webkit-appearance: none !important;
}

/* Odstranění šipek u čísel (pokud bys je někde měl) */
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
label, .input-label, .form-label {
    width: 100% !important;
    display: block !important;
    text-align: center !important; /* Vycentruje nápisy přesně nad kolonky */
    color: #38bdf8 !important; /* Světle modrá barva z tvého Chatu */
    font-size: 11px !important;
    font-weight: 800 !important;
    letter-spacing: 1.5px !important;
    text-transform: uppercase !important;
    margin-bottom: 8px !important;
    margin-top: 15px !important;
    opacity: 0.8;
    font-family: 'Inter', sans-serif !important;
}
/* Kontejner pro celou tabulku */
table {
    width: 100% !important;
    border-collapse: separate !important;
    border-spacing: 0 8px !important; /* Mezery mezi řádky pro moderní vzhled */
    background: transparent !important;
    margin-top: 20px;
}

/* 2. STYL PRO HLAVIČKU (Časy 6:00, 8:00...) */
thead th {
    color: #f59e0b !important; /* Oranžová barva z tvého screenu */
    font-weight: 900;
    text-transform: uppercase;
    font-size: 14px;
    padding: 15px 5px !important;
    text-align: center;
}

/* 3. STYL PRO ŘÁDKY (Pozice a Jména) */
tbody tr {
    background: rgba(30, 41, 59, 0.5) !important; /* Tmavé "skleněné" pozadí */
    backdrop-filter: blur(10px);
    transition: all 0.2s ease;
}

/* Zaoblení rohů pro každý řádek */
tbody tr td:first-child { border-radius: 12px 0 0 12px !important; }
tbody tr td:last-child { border-radius: 0 12px 12px 0 !important; }

/* Efekt při najetí na řádek */
tbody tr:hover {
    background: rgba(255, 255, 255, 0.1) !important;
    transform: scale(1.01); /* Jemné zvětšení */
}

/* 4. LEVÝ SLOUPEC (Pozice jako OP-L, DF-P...) */
tbody td:first-child {
    color: #22c55e !important; /* Zelená barva z tvého screenu */
    font-weight: 800;
    font-size: 13px;
    padding-left: 15px !important;
    border-left: 2px solid #22c55e !important; /* Zelený proužek na začátku */
}

/* 5. BUŇKY SE JMÉNY ZAMĚSTNANCŮ */
tbody td {
    color: white !important;
    padding: 12px 5px !important;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    border: none !important; /* Odstraní ty staré mřížky */
}
</style>
</head>

<body>
<div class="background-logo">
    <img src="pozadi.jpg" alt="Logo">
</div>
<div class="topbar">
    <span class="topTitle"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> Směnový Graf</span>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>
<div class="container">
    <div class="card">
        <label>DATUM</label>
        <input type="date" id="date">

        <label>SMĚNA</label>
        <select id="shift">
            <option value="ranni">Ranní</option>
            <option value="odpo">Odpolední</option>
            <option value="noc">Noční</option>
        </select>

        <label>VYHLEDAT JMÉNO</label>
        <input id="nameFilter" placeholder="např. Jan">
    </div>

    <div class="card" id="shiftInfoBox" style="display:none">
      <h3 style="color:#22c55e; margin:0 0 10px 0;">ℹ️ Info o směně</h3>
      <div id="infoDetails"></div>
    </div>

    <div class="card">
        <div class="table-wrapper">
            <table id="grid"></table>
        </div>
    </div>
    <div class="disclaimer">
        © 2024 ShiftMaster | Neoficiální nástroj. Logo ŠKODA je majetkem ŠKODA AUTO a.s.
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, getDoc }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// Tvůj konfigurák ze screenshotu
const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
    measurementId: "G-1HF3R93092"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const dateEl = document.getElementById("date");
const shiftEl = document.getElementById("shift");
const nameFilterEl = document.getElementById("nameFilter");
const gridEl = document.getElementById("grid");

// NASTAVENÍ DATA PRO KALENDÁŘ (Dnešek v ISO formátu)
const today = new Date();
const offset = today.getTimezoneOffset() * 60000;
const localDate = new Date(today.getTime() - offset).toISOString().split('T')[0];
dateEl.value = localDate;

const POSITIONS = ["DP-L","DP-P","ZRC-L","ZRC-P","T-L","T-P","AGR-LP","AGR-PP","AGR-PZ","AGR-LZ","MOT-L","MOT-P","LEP-LP","LEP-PP","LEP-Z","REPRO-L","REPRO-P","VYP1-L","VYP1-P","VYP2-L","VYP2-P","PR-L","PR-P","ZAM-L","ZAM-P","VET","VET2","INST","INST2","JINE","JINE2"];

let workerMap = {}; 
let phasesData = [];

// Načtení jmen (logika z employees.html)
async function loadWorkers(){
    try {
        const snap = await getDocs(collection(db, "employees"));
        workerMap = {};
        snap.forEach(d => {
            const e = d.data();
            workerMap[d.id] = (e.fName || e.name || "") + " " + (e.lName || "");
        });
    } catch (e) { console.error("Chyba loadWorkers:", e); }
}

// Načtení konkrétní směny podle DATA a TYPU
async function loadShift(){
    if(!dateEl.value) return;
    const id = `${dateEl.value}_${shiftEl.value}`;
    console.log("Hledám ID dokumentu:", id);

    try {
        const snap = await getDoc(doc(db, "shifts", id));
        if(!snap.exists()){
            gridEl.innerHTML = `<tr><td colspan="5" style="padding:20px; opacity:0.5;">Rozpis pro ${dateEl.value} nenalezen.</td></tr>`;
            phasesData = [];
            return;
        }
        phasesData = snap.data().phases || [];
        render();
    } catch (e) { 
        console.error("Chyba Firebase:", e);
        gridEl.innerHTML = "<tr><td>Chyba spojení s databází.</td></tr>";
    }
}

function render(){
    const filter = nameFilterEl.value.toLowerCase().trim();
    const s = shiftEl.value;
    
    // TADY JSOU TVOJE PŘESNÉ ČASY
    const labels = (s === "ranni") 
        ? ["06:00-08:00", "08:05-10:15", "10:45-12:00", "12:05-14:00"] 
        : (s === "odpo") 
        ? ["14:00-16:00", "16:05-18:15", "18:45-20:00", "20:05-22:00"] 
        : ["22:00-00:00", "00:05-02:15", "02:45-04:00", "04:05-06:00"];
    
    let html = "<thead><tr><th>Pozice</th>" + labels.map(l => `<th>${l}</th>`).join('') + "</tr></thead><tbody>";

    POSITIONS.forEach(pos => {
        let rowNames = [];
        for(let i=0; i<4; i++) {
            const wid = phasesData[i] ? phasesData[i][pos] : null;
            rowNames.push(wid ? (workerMap[wid] || "???" ) : "");
        }

        const isOccupied = rowNames.some(n => n !== "");
        const statusClass = isOccupied ? "active-pos" : "inactive-pos";

        if(filter && !rowNames.some(n => n.toLowerCase().includes(filter))) return;
        
        html += `<tr><td class="posCol ${statusClass}">${pos}</td>`;
        rowNames.forEach(n => {
            if(!n) html += `<td class="empty">—</td>`;
            else if(filter && n.toLowerCase().includes(filter)) html += `<td class="highlight">${n}</td>`;
            else html += `<td>${n}</td>`;
        });
        html += "</tr>";
    });
    gridEl.innerHTML = html + "</tbody>";
}

// POSLUCHAČE - REAKCE KALENDÁŘE NA ZMĚNU
dateEl.addEventListener("change", loadShift);
shiftEl.addEventListener("change", loadShift);
nameFilterEl.addEventListener("input", render);

// SPUŠTĚNÍ PŘI NAČTENÍ
(async () => {
    await loadWorkers();
    await loadShift();
})();
</script>
</body>
</html>
