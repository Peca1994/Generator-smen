<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// Tvůj konfigurák ze screenshotu
const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
    measurementId: "G-1HF3R93092"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const dateEl = document.getElementById("date");
const shiftEl = document.getElementById("shift");
const nameFilterEl = document.getElementById("nameFilter");
const gridEl = document.getElementById("grid");
function getContinuousShift() {
    // 1. NASTAVENÍ: Vyber si pondělí, kdy jsi měl naposledy RANNÍ (např. 5. ledna 2026)
    const anchorDate = new Date(2026, 0, 5); // Rok, Měsíc (0=leden), Den
    const today = new Date();

    // 2. Výpočet rozdílu v milisekundách a přepočet na celé týdny
    const msDiff = today.getTime() - anchorDate.getTime();
    const weeksDiff = Math.floor(msDiff / (1000 * 60 * 60 * 24 * 7));

    // 3. Pořadí směn v tvém cyklu (uprav si podle reality)
    // Pokud se střídáte: Ranní -> Odpolední -> Noční
    const shiftCycle = ["Ranní", "Odpolední", "Noční"];

    // 4. Výpočet indexu (zbytek po dělení 3)
    // Používáme modulo, které ošetří i záporná čísla (kdyby někdo koukal do historie)
    let shiftIndex = weeksDiff % 3;
    if (shiftIndex < 0) shiftIndex += 3;

    return shiftCycle[shiftIndex];
}

// Funkce pro automatické vepsání do stránky
function updateCurrentShift() {
    const shiftName = getContinuousShift();
    const displayEl = document.getElementById("currentShiftInfo");
    
    if (displayEl) {
        displayEl.innerHTML = `Tento týden probíhá: <strong style="color:#22c55e;">${shiftName}</strong>`;
    }
}

// Spustit po načtení stránky
document.addEventListener("DOMContentLoaded", updateCurrentShift);
// NASTAVENÍ DATA PRO KALENDÁŘ (Dnešek v ISO formátu)
const today = new Date();
const offset = today.getTimezoneOffset() * 60000;
const localDate = new Date(today.getTime() - offset).toISOString().split('T')[0];
dateEl.value = localDate;

const POSITIONS = [
    "DP-L", "DP-P", 
    "ZRC-L", "ZRC-P", 
    "T-L", "T-P", 
    "AGR-LP", "AGR-PP", "AGR-PZ", "AGR-LZ", 
    "MOT-L", "MOT-P", 
    "LEP-LP", "LEP-PP", "LEP-Z", 
    "REPRO-L", "REPRO-P", 
    "VYP1-L", "VYP1-P", 
    "VYP2-L", "VYP2-P", 
    "PR-L", "PR-P", 
    "ZAM-L", "ZAM-P", 
    "VET", "VET2", "VET3",    // Seřazeno: VET3 je za VET2
    "INST", "INST2", "INST3"  // Seřazeno: INST3 je za INST2
];

let workerMap = {}; 
let phasesData = [];

// Načtení jmen (logika z employees.html)
async function loadWorkers(){
    try {
        const snap = await getDocs(collection(db, "employees"));
        workerMap = {};
        snap.forEach(d => {
            const e = d.data();
            workerMap[d.id] = (e.fName || e.name || "") + " " + (e.lName || "");
        });
    } catch (e) { console.error("Chyba loadWorkers:", e); }
}
function nastavitDnesekASmenu() {
    const ted = new Date();
    
    // NASTAVENÍ DATA (dnešek)
    const offset = ted.getTimezoneOffset() * 60000;
    const localISO = (new Date(ted - offset)).toISOString().slice(0, 10);
    const dateEl = document.getElementById("dateSelect"); // Zkontroluj si id v HTML
    if (dateEl) dateEl.value = localISO;

    // NASTAVENÍ SMĚNY (automatické střídání)
    const msVTydnu = 604800000; 
    const tydnyOdEpocha = Math.floor((ted.getTime() + 345600000) / msVTydnu);
    const cyklus = tydnyOdEpocha % 3;

    let nazevSmeny = "";
    // Uprav hodnoty ("Ranní" atd.) přesně podle toho, jak je máš v <option> u tvého selectu!
    if (cyklus === 0) nazevSmeny = "Ranní";
    else if (cyklus === 1) nazevSmeny = "Noční"; 
    else nazevSmeny = "Odpolední";

    const shiftEl = document.getElementById("shiftSelect"); // Zkontroluj si id v HTML
    if (shiftEl) {
        shiftEl.value = nazevSmeny;
    }
}

// 2. SPUŠTĚNÍ PŘI NAČTENÍ (Důležité pořadí!)
async function init() {
    nastavitDnesekASmenu(); // Nejdřív nastavíme políčka
    await loadShift();      // Pak teprve loadShift() načte data z DB podle těch políček
}

// Zavolej init() místo samotného loadShift() na konci skriptu
init();
// Načtení konkrétní směny podle DATA a TYPU
async function loadShift(){
    if(!dateEl.value) return;
    const id = `${dateEl.value}_${shiftEl.value}`;
    console.log("Hledám ID dokumentu:", id);

    try {
        const snap = await getDoc(doc(db, "shifts", id));
        if(!snap.exists()){
            gridEl.innerHTML = `<tr><td colspan="5" style="padding:20px; opacity:0.5;">Rozpis pro ${dateEl.value} nenalezen.</td></tr>`;
            phasesData = [];
            return;
        }
        phasesData = snap.data().phases || [];
        render();
    } catch (e) { 
        console.error("Chyba Firebase:", e);
        gridEl.innerHTML = "<tr><td>Chyba spojení s databází.</td></tr>";
    }
}

function render(){
    const filter = nameFilterEl.value.toLowerCase().trim();
    const s = shiftEl.value;
    
    const labels = (s === "ranni") 
        ? ["06:00-08:00", "08:05-10:15", "10:45-12:00", "12:05-14:00"] 
        : (s === "odpo") 
        ? ["14:00-16:00", "16:05-18:15", "18:45-20:00", "20:05-22:00"] 
        : ["22:00-00:00", "00:05-02:15", "02:45-04:00", "04:05-06:00"];
    
    let html = "<thead><tr><th style='color: rgba(255,255,255,0.4); font-size: 11px;'>POZICE</th>" + labels.map(l => `<th style='color: rgba(255,255,255,0.4); font-size: 11px;'>${l}</th>`).join('') + "</tr></thead><tbody>";

    POSITIONS.forEach(pos => {
        let rowNames = [];
        for(let i=0; i<4; i++) {
            const wid = phasesData[i] ? phasesData[i][pos] : null;
            rowNames.push(wid ? (workerMap[wid] || "???" ) : "");
        }

        // 1. FILTR: Pokud hledáme a v řádku jméno není, celý řádek skryjeme
        if(filter && !rowNames.some(n => n.toLowerCase().includes(filter))) return;

        const isOccupied = rowNames.some(n => n !== "");
        const color = isOccupied ? "#2ecc71" : "rgba(255,255,255,0.15)";
        const borderColor = isOccupied ? "rgba(46, 204, 113, 0.3)" : "rgba(255,255,255,0.05)";

        html += `<tr>
            <td class="posCol" style="color: ${color} !important; border: 1px solid ${borderColor} !important; font-weight: 900; background: rgba(0,0,0,0.2); padding-left: 20px; border-radius: 10px; margin: 4px 0; font-size: 13px; letter-spacing: 1px;">
                ${pos}
            </td>`;

        rowNames.forEach(n => {
            if(!n) {
                html += `<td style="color: rgba(255,255,255,0.05); text-align: center;">—</td>`;
            } else {
                // 2. ZVÝRAZNĚNÍ: Pokud se jméno shoduje s hledáním, vnutí se mu zelená barva
                const isMatch = filter !== "" && n.toLowerCase().includes(filter);
                
                // Pokud hledáme, a jméno SOUHLASÍ -> ZELENÁ. Pokud hledáme a jméno NESOUHLASÍ -> ŠEDÁ. Pokud nehledáme -> BÍLÁ.
                let currentNameColor = "white";
                if (filter !== "") {
                    currentNameColor = isMatch ? "#2ecc71" : "rgba(255,255,255,0.15)";
                }

                html += `<td style="color: ${currentNameColor} !important; font-weight: 900; text-align: center; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.03); transition: 0.2s;">${n}</td>`;
            }
        });
        html += "</tr>";
    });
    gridEl.innerHTML = html + "</tbody>";
}

// 3. AKTIVACE: Tohle zajistí, že se barva změní hned, jak dopíšeš písmeno
nameFilterEl.oninput = () => render();

// POSLUCHAČE - REAKCE KALENDÁŘE NA ZMĚNU
dateEl.addEventListener("change", loadShift);
shiftEl.addEventListener("change", loadShift);
nameFilterEl.addEventListener("input", render);

// SPUŠTĚNÍ PŘI NAČTENÍ
(async () => {
    await loadWorkers();
    await loadShift();
})();
(function() {
    function setShiftAutomatically() {
        // Nastavíme anchor na pondělí 2. 3. 2026
        const anchorDate = new Date(2026, 2, 2); 
        const today = new Date();
        
        // Rozdíl týdnů
        const msDiff = today.getTime() - anchorDate.getTime();
        const weeksDiff = Math.floor(msDiff / (1000 * 60 * 60 * 24 * 7));

        // POŘADÍ SMĚN: 
        // Index 0 (tento týden) = noc
        // Index 1 (příští týden) = odpo
        // Index 2 (další týden) = ranni
        const shiftValues = ["noc", "odpo", "ranni"];
        
        let index = weeksDiff % 3;
        if (index < 0) index += 3;

        const shiftSelect = document.getElementById("shift");
        const dateInput = document.getElementById("date");

        // 1. Nastavíme dnešní datum
        if (dateInput) {
            dateInput.valueAsDate = today;
        }

        // 2. Nastavíme směnu
        if (shiftSelect) {
            shiftSelect.value = shiftValues[index];
            // Vyvoláme změnu, aby se tabulka překreslila
            shiftSelect.dispatchEvent(new Event('change'));
            
            // Pokud máš v kódu funkci na update tabulky, zavoláme ji (zkusíme nejčastější názvy)
            if (typeof updateTable === "function") updateTable();
            if (typeof filterData === "function") filterData();
        }
    }

    // Spustíme to hned a pro jistotu i po úplném načtení okna
    if (document.readyState === "complete") {
        setShiftAutomatically();
    } else {
        window.addEventListener('load', setShiftAutomatically);
    }
})();
</script>
