<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Směnový graf</title>

<style>

body {
    margin: 0;
    padding: 0;
    /* Tyto 3 řádky smaž nebo nahraď tímto: */
    display: block; 
    min-height: 100vh;
    color: white;
    font-family: sans-serif;
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg');
    background-size: contain !important;
    background-position: center 10% !important;
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
    background-color: #030712 !important;
}

.topbar{
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#020617;
  border-bottom:1px solid #1f2937;
}

.topTitle{
  font-weight:800;
  font-size:18px;
}

.menuBtn{
  padding:8px 14px;
  border-radius:10px;
  border:none;
  font-weight:800;
  background:#334155;
  color:white;
  cursor:pointer;
}

.menuBtn:hover{
  filter:brightness(1.15);
}

.menuBtn:active{
  transform:scale(.96);
}


.container{
  padding:16px;
  max-width:1000px;
  margin:auto;
}

.card{
  background:#111827;
  padding:16px;
  border-radius:14px;
  margin-bottom:14px;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:6px;
}

/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #1f2937;
  text-align:center;
}

th{
  background:#020617;
}

.posCol{
  text-align:left;
  font-weight:800;
  background:#020617;
}

.highlight{
  background:#064e3b;
  font-weight:900;
}

.empty{
  opacity:.4;
}

.infoRow{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  margin:6px 0;
}
body {
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg') !important;
    background-size: cover !important;
    background-position: center !important;
    background-attachment: fixed !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    min-height: 100vh !important;
}

.card, [class*="card"] {
    background: rgba(17, 24, 39, 0.5) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    box-shadow: none !important;
}

/* Vypne stín a ohraničení u vnitřních bloků */
.card .card, #menuCard, .menu {
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
}

.roleTag { color: #22c55e !important; font-weight: bold !important; }
body {
    display: block !important; 
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg') !important;
    background-size: cover !important;
    background-position: center !important;
    background-attachment: fixed !important;
}

/* 2. Zajištění, aby hlavní obsah byl uprostřed, ale menu nahoře */
.container, main, .app {
    margin: 20px auto !important;
    max-width: 420px;
}

/* 3. Průhlednost karet (aby bylo vidět logo Škoda) */
.card, [class*="card"] {
    background: rgba(17, 24, 39, 0.5) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
}
body {
    /* Fixní pozice zajistí, že se logo nehýbe při scrollování */
    background-attachment: fixed !important;
    
    /* Center zajistí vycentrování loga Škoda na střed */
    background-position: center center !important;
    
    /* Cover roztáhne logo tak, aby vyplnilo celý displej mobilu */
    background-size: cover !important;
    
    background-repeat: no-repeat !important;
    
    /* Zajištění, aby podklad pod logem byl tmavý */
    background-color: #030712 !important;
}

/* Oprava pro iOS Safari (iPhony), které mají s background-attachment: fixed občas problém */
@supports (-webkit-touch-callout: none) {
    body {
        background-attachment: scroll !important;
    }
}
body {
    /* 'contain' zajistí, že logo uvidíš vždy celé, nic se neořízne */
    background-size: contain !important;
    
    /* Posune logo do horní části (cca 10 % odshora), aby nebylo schované pod kartou */
    background-position: center 10% !important;
    
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
    background-color: #030712 !important; /* Tmavé pozadí vyplní zbytek displeje */
}

/* Speciální úprava pro mobily na výšku */
@media (max-width: 480px) {
    body {
        /* Na mobilu logo trochu zvětšíme, ale pořád se nesmí oříznout */
        background-size: 90% auto !important; 
        background-position: center 5% !important;
    }
}
table, thead, tbody, tr, th, td, ul, li, section, main {
    background: transparent !important;
    background-color: transparent !important;
    border-color: rgba(255, 255, 255, 0.1) !important; /* Jemné linky místo tlustých čar */
    box-shadow: none !important;
}

/* Pokud jsou v tabulkách bílé nebo šedé pruhy (zebra), vypneme je */
tr:nth-child(even), tr:nth-child(odd) {
    background: transparent !important;
}

/* Text v tabulkách musí zůstat čitelný */
td, th {
    color: white !important;
    padding: 10px 5px !important;
}
.card div, .card section, fieldset, .container > div {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

/* 2. ZPRŮHLEDNĚNÍ HORNÍ LIŠTY (TOPBAR) */
.topbar, header {
    background: rgba(0, 0, 0, 0.4) !important; /* Poloprůhledná černá */
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
}

/* 3. ÚPRAVA INPUTŮ (DATUM A SMĚNA) - Aby nebyly tak zářivě bílé */
input, select, textarea {
    background: rgba(255, 255, 255, 0.9) !important;
    border-radius: 8px !important;
    border: 1px solid #ccc !important;
    color: black !important; /* Text uvnitř musí být černý */
}

/* 4. ODSTRANĚNÍ DUPLICITNÍCH RÁMEČKŮ */
.card {
    margin-top: 20px !important;
}
/* --- FINÁLNÍ ČISTÝ VZHLED S OSTRÝM LOGEM --- */

/* 1. SMAZÁNÍ VŠECH OHRANIČENÍ (Včetně hlavního boxu) */
.container, .app, main, .card, body {
    border: none !important;           /* Smaže hlavní ohraničení celku */
    box-shadow: none !important;        /* Smaže případné stíny kolem celku */
    backdrop-filter: none !important;   /* Vypne rozmazání loga */
    -webkit-backdrop-filter: none !important;
}

/* 2. TOTÁLNÍ ZPRŮHLEDNĚNÍ POZADÍ CELKU */
/* Pokud chceš, aby pozadí boxu úplně zmizelo, změň 0.3 na 0 */
.container, .app, main {
    background: rgba(0, 0, 0, 0.3) !important; /* Velmi jemný tmavý závoj, aby byl text vidět */
    border-radius: 0 !important;
    padding: 20px !important;
    margin: 20px auto !important;
    max-width: 420px !important;
}

/* 3. VYČIŠTĚNÍ VNITŘNÍCH PRVKŮ (Modré pruhy, šedé linky) */
.container *, fieldset, section, details, summary, .btn-info, .card-header {
    border: none !important;
    background: transparent !important;
    box-shadow: none !important;
    outline: none !important;
}

/* 4. ČITELNOST TEXTU (Musí mít stín, když zmizí ohraničení) */
label, p, span, summary, h1, h2, h3, .btn-info {
    color: white !important;
    font-weight: 900 !important;
    text-shadow: 2px 2px 4px rgba(0,0,0,1) !important;
}

/* 5. TLAČÍTKA A POLÍČKA (Zůstanou vidět) */
input, select {
    background: white !important;
    color: black !important;
    border-radius: 10px !important;
}

.btn-warning, .btn-primary, .btn-success, #saveBtn {
    background-color: initial !important; 
    border-radius: 12px !important;
    padding: 12px !important;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="topTitle">📊 Směnový graf</div>
  <button class="menuBtn" onclick="location.href='index.html'">
    Menu
  </button>
</div>

<div class="container">

<div class="card">

<label>Datum</label>
<input type="date" id="date">

<label>Směna</label>
<select id="shift">
<option value="ranni">Ranní</option>
<option value="odpo">Odpolední</option>
<option value="noc">Noční</option>
</select>

<label>Filtrovat jméno</label>
<input id="nameFilter" placeholder="např. Pepa">

</div>

<div class="card" id="shiftInfoBox" style="display:none">
  <h3>ℹ️ Informace o směně</h3>
  <div id="infoSK"></div>
  <div id="infoFA"></div>
  <div id="infoZA"></div>
</div>

<div class="card">
<table id="grid"></table>
</div>


</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* FIREBASE */

const app = initializeApp({
apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
  measurementId: "G-1HF3R93D92"
});

const db = getFirestore(app);

/* DOM */

const dateEl = document.getElementById("date");
const shiftEl = document.getElementById("shift");
const nameFilterEl = document.getElementById("nameFilter");
const gridEl = document.getElementById("grid");

const shiftInfoBox = document.getElementById("shiftInfoBox");
const infoSK = document.getElementById("infoSK");
const infoFA = document.getElementById("infoFA");
const infoZA = document.getElementById("infoZA");


dateEl.value = new Date().toISOString().slice(0,10);

/* POZICE */

const POSITIONS = [
"DP-L","DP-P","ZRC-L","ZRC-P","T-L","T-P",
"AGR-LP","AGR-PP","AGR-PZ","AGR-LZ",
"MOT-L","MOT-P","LEP-LP","LEP-PP","LEP-Z",
"REPRO-L","REPRO-P","VYP1-L","VYP1-P",
"VYP2-L","VYP2-P","PR-L","PR-P","ZAM-L","ZAM-P","VET","VET2","INST",
"INST2","JINE","JINE2",
];

let workerMap = {}; // id -> name
let phasesData = [];

/* LOAD WORKERS MAP */

async function loadWorkers(){

 const snap = await getDocs(collection(db,"employees"));
 workerMap = {};

 snap.forEach(d=>{
  const e=d.data();
  workerMap[d.id] = e.name;
 });
}

/* TIME LABELS */

function phaseLabels(){
 const s=shiftEl.value;
 if(s==="ranni") return ["6:00-8:00","8:00-10:15","10:45-12:00","12:00-14:00"];
 if(s==="odpo") return ["14:00-16:00","16:00-18:15","18:45-20:00","20:00-22:00"];
 return ["22:00-00:00","00:00-02:15","02:45-04:00","04:00-06:00"];
}

/* LOAD SHIFT */

async function loadShift(){

 const id = dateEl.value + "_" + shiftEl.value;

 const snap = await getDoc(doc(db,"shifts",id));

 if(!snap.exists()){
   gridEl.innerHTML = "<tr><td>Směna nenalezena</td></tr>";
   return;
 }

 const data = snap.data();

phasesData = data.phases;

// 🔷 info o směně pro usera
renderShiftInfo(data.info);

render();

}

/* RENDER */

function render(){

 const filter = nameFilterEl.value.toLowerCase().trim();
 const labels = phaseLabels();

 let html = "<tr><th>Pozice</th>";
 labels.forEach(l=> html+=`<th>${l}</th>`);
 html+="</tr>";

 POSITIONS.forEach(pos=>{

   const names = phasesData.map(ph=>{
     const wid = ph[pos];
     return wid ? workerMap[wid] || "?" : "";
   });

   // filtr — zobraz jen když tam ten člověk někde je
   if(filter){
     if(!names.some(n=>n.toLowerCase().includes(filter))){
       return;
     }
   }

   html += `<tr><td class="posCol">${pos}</td>`;

   names.forEach(n=>{
     if(!n){
       html+=`<td class="empty">—</td>`;
     }else if(filter && n.toLowerCase().includes(filter)){
       html+=`<td class="highlight">${n}</td>`;
     }else{
       html+=`<td>${n}</td>`;
     }
   });

   html+="</tr>";

 });

 gridEl.innerHTML = html;
}

function renderShiftInfo(info){

 if(!info){
   shiftInfoBox.style.display = "none";
   return;
 }

 shiftInfoBox.style.display = "block";

 infoSK.innerHTML =
   `<div class="infoRow">Scala/Kamiq<span>${info.sk?.start||""} → ${info.sk?.end||""}</span></div>`;

 infoFA.innerHTML =
   `<div class="infoRow">Fabie<span>${info.fa?.start||""} → ${info.fa?.end||""}</span></div>`;

 infoZA.innerHTML =
   `<div class="infoRow">Zásobník<span>${info.za?.start||""} → ${info.za?.end||""}</span></div>`;
}

/* EVENTS */

dateEl.onchange = loadShift;
shiftEl.onchange = loadShift;
nameFilterEl.oninput = render;

/* INIT */

await loadWorkers();
await loadShift();

</script>

</body>
</html>
