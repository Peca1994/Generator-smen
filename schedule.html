<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Směnový graf | ShiftMaster</title>

<style>
/* 1. GLOBÁLNÍ DESIGN S LOGEM ŠKODA */
body {
    /* Identické tmavě zelené pozadí */
    background: radial-gradient(circle at center, #062111 0%, #000000 100%) !important;
    margin: 0;
    padding: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: white;
    min-height: 100vh;
}

/* Zapuštěné logo ŠKODA na pozadí */
.background-logo {
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
    text-align: center;
    pointer-events: none;
}

.background-logo img {
    width: 650px !important;
    max-width: 90vw !important;
    opacity: 0.12 !important;
    filter: brightness(0.6) sepia(1) hue-rotate(85deg) saturate(2.5) blur(1px) !important;
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
}

.background-logo h1 {
    font-size: 16vw !important;
    margin-top: -30px !important;
    letter-spacing: 25px !important;
    color: #1a3a2a !important;
    opacity: 0.5 !important;
    font-weight: 900;
    text-transform: uppercase;
}

/* 2. TOPBAR */

.menuBtn { 
    padding: 8px 14px; 
    border-radius: 10px; 
    border: none; 
    font-weight: 800; 
    background: rgba(51, 65, 85, 0.8); 
    color: white; 
    cursor: pointer; 
}

/* 3. KONTEJNER A SKLENĚNÉ KARTY */
.container { max-width: 450px; margin: 20px auto; padding: 15px; }

.card {
    background: rgba(17, 24, 39, 0.6) !important;
    backdrop-filter: blur(8px) !important;
    -webkit-backdrop-filter: blur(8px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 20px; padding: 20px; margin-bottom: 15px;
}

/* 4. FORMULÁŘE A ČITELNOST */
label { font-weight: 800; font-size: 13px; opacity: 0.8; letter-spacing: 1px; display: block; margin-top: 10px; text-shadow: 1px 1px 3px black; }
input, select {
    width: 100% !important; padding: 14px; border-radius: 12px; border: none;
    margin-top: 6px; background: white !important; color: black !important;
    font-weight: 700; box-sizing: border-box; font-size: 16px;
}

/* 5. TABULKA */
.table-wrapper { overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
th { color: #22c55e; font-weight: 900; background: rgba(0,0,0,0.2); }
.posCol { text-align: left; font-weight: 900; color: #38bdf8; }
.highlight { color: #22c55e !important; font-weight: 900; background: rgba(34, 197, 94, 0.1); }
.empty { opacity: .3; }
.topbar {
    width: 100% !important;
    height: 60px;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 0 20px !important;
    box-sizing: border-box !important;
    background: transparent !important;
    border: none !important;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.topTitle {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif !important;
    font-size: 22px !important;
    font-weight: 800 !important;
    color: #ffffff !important;
    letter-spacing: -0.5px !important;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    padding-left: 10px;
}


</style>
</head>

<body>
<div class="background-logo">
    <img src="pozadi.jpg" alt="Logo">
</div>
<div class="topbar">
    <span class="topTitle">📊 Směnový Graf</span>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>
<div class="container">
    <div class="card">
        <label>DATUM</label>
        <input type="date" id="date">

        <label>SMĚNA</label>
        <select id="shift">
            <option value="ranni">Ranní</option>
            <option value="odpo">Odpolední</option>
            <option value="noc">Noční</option>
        </select>

        <label>VYHLEDAT JMÉNO</label>
        <input id="nameFilter" placeholder="např. Pepa">
    </div>

    <div class="card" id="shiftInfoBox" style="display:none">
      <h3 style="color:#22c55e; margin:0 0 10px 0;">ℹ️ Info o směně</h3>
      <div id="infoDetails"></div>
    </div>

    <div class="card">
        <div class="table-wrapper">
            <table id="grid"></table>
        </div>
    </div>
</div>

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
    measurementId: "G-1HF3R93D92"
  };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const dateEl = document.getElementById("date");
const shiftEl = document.getElementById("shift");
const nameFilterEl = document.getElementById("nameFilter");
const gridEl = document.getElementById("grid");

// NASTAVENÍ DATA - Dnešek ve formátu RRRR-MM-DD
const today = new Date();
const offset = today.getTimezoneOffset() * 60000;
const localDate = new Date(today.getTime() - offset).toISOString().split('T')[0];
dateEl.value = localDate;

const POSITIONS = ["DP-L","DP-P","ZRC-L","ZRC-P","T-L","T-P","AGR-LP","AGR-PP","AGR-PZ","AGR-LZ","MOT-L","MOT-P","LEP-LP","LEP-PP","LEP-Z","REPRO-L","REPRO-P","VYP1-L","VYP1-P","VYP2-L","VYP2-P","PR-L","PR-P","ZAM-L","ZAM-P","VET","VET2","INST","INST2","JINE","JINE2"];

let workerMap = {}; 
let phasesData = [];

// Načtení jmen (logika jako v employees.html)
async function loadWorkers(){
    try {
        const snap = await getDocs(collection(db, "employees"));
        workerMap = {};
        snap.forEach(d => {
            const e = d.data();
            workerMap[d.id] = (e.fName || e.name || "") + " " + (e.lName || "");
        });
    } catch (e) { console.error("Chyba loadWorkers:", e); }
}

// Načtení konkrétní směny
async function loadShift(){
    if(!dateEl.value) return;
    const id = `${dateEl.value}_${shiftEl.value}`;
    console.log("Hledám ID dokumentu:", id);

    try {
        const snap = await getDoc(doc(db, "shifts", id));
        if(!snap.exists()){
            gridEl.innerHTML = `<tr><td colspan="5" style="padding:20px; opacity:0.5;">Rozpis pro ${dateEl.value} nenalezen.</td></tr>`;
            phasesData = [];
            return;
        }
        phasesData = snap.data().phases || [];
        render();
    } catch (e) { 
        console.error("Chyba Firebase:", e);
        gridEl.innerHTML = "<tr><td>Chyba spojení s databází.</td></tr>";
    }
}

function render(){
    const filter = nameFilterEl.value.toLowerCase().trim();
    const s = shiftEl.value;
    const labels = (s === "ranni") ? ["6:00","8:00","10:45","12:00"] : (s === "odpo") ? ["14:00","16:00","18:45","20:00"] : ["22:00","00:00","02:45","04:00"];
    
    let html = "<thead><tr><th>Pozice</th>" + labels.map(l => `<th>${l}</th>`).join('') + "</tr></thead><tbody>";
    POSITIONS.forEach(pos => {
        let rowNames = [];
        for(let i=0; i<4; i++) {
            const wid = phasesData[i] ? phasesData[i][pos] : null;
            rowNames.push(wid ? workerMap[wid] || "???" : "");
        }
        if(filter && !rowNames.some(n => n.toLowerCase().includes(filter))) return;
        
        html += `<tr><td class="posCol">${pos}</td>` + rowNames.map(n => n ? `<td>${n}</td>` : `<td class="empty">—</td>`).join('') + "</tr>";
    });
    gridEl.innerHTML = html + "</tbody>";
}

// POSLUCHAČE - REAKCE KALENDÁŘE NA ZMĚNU
dateEl.addEventListener("change", loadShift);
shiftEl.addEventListener("change", loadShift);
nameFilterEl.addEventListener("input", render);

(async () => {
    await loadWorkers();
    await loadShift();
})();
</script>
</body>
</html>
