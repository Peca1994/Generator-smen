import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import { getFirestore, collection, getDocs, doc, getDoc, addDoc, serverTimestamp, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
    measurementId: "G-1HF3R93092"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const dateEl = document.getElementById("date");
const shiftEl = document.getElementById("shift");
const nameFilterEl = document.getElementById("nameFilter");
const gridEl = document.getElementById("grid");

let workerMap = {}; 
let allWorkersData = {}; 
let phasesData = [];
let currentUserEmp = null;

const POSITIONS = ["DP-L", "DP-P", "ZRC-L", "ZRC-P", "T-L", "T-P", "AGR-LP", "AGR-PP", "AGR-PZ", "AGR-LZ", "MOT-L", "MOT-P", "LEP-LP", "LEP-PP", "LEP-Z", "REPRO-L", "REPRO-P", "VYP1-L", "VYP1-P", "VYP2-L", "VYP2-P", "PR-L", "PR-P", "ZAM-L", "ZAM-P", "VET", "VET2", "VET3", "INST", "INST2", "INST3"];

// 1. START A IDENTIFIKACE
onAuthStateChanged(auth, async (user) => {
    if (user) {
        const q = query(collection(db, "employees"), where("email", "==", user.email.toLowerCase().trim()));
        const snap = await getDocs(q);
        if (!snap.empty) {
            currentUserEmp = { id: snap.docs[0].id, ...snap.docs[0].data() };
        }
        await loadWorkers();
        setShiftAutomatically(); 
    } else {
        window.location.href = "index.html";
    }
});

// 2. NAČÍTÁNÍ PRACOVNÍKŮ (OPRAVENO NA PŘEZDÍVKY)
async function loadWorkers() {
    try {
        const snap = await getDocs(collection(db, "employees"));
        workerMap = {}; allWorkersData = {};
        snap.forEach(d => {
            const e = d.data();
            // POUŽIJEME JEN PŘEZDÍVKU (fName)
            workerMap[d.id] = e.fName || e.name || "Bez jména";
            allWorkersData[d.id] = { id: d.id, ...e };
        });
    } catch (e) { console.error("Chyba loadWorkers:", e); }
}

// 3. NAČÍTÁNÍ SMĚNY (OPRAVENÝ INFO BOX DLE PDF)
async function loadShift() {
    if (!dateEl.value) return;

    // --- 1. OPRAVA ID: Sjednocení na ranni, odpo, nocni ---
    let dbS = shiftEl.value.toLowerCase();
    if (dbS.includes('ranní')) dbS = 'ranni';
    else if (dbS.includes('odpo')) dbS = 'odpo';
    else if (dbS.includes('noční')) dbS = 'nocni';

    const id = `${dateEl.value}_${dbS}`; // Teď už hledá ve správném _odpo atd.
    
    try {
        const snap = await getDoc(doc(db, "shifts", id));
        const box = document.getElementById('shiftInfoBox');
        const details = document.getElementById('infoDetails');

        if (!snap.exists()) {
            gridEl.innerHTML = "<tr><td colspan='5' style='text-align:center; padding:20px; opacity:0.5;'>Rozpis nenalezen.</td></tr>";
            if (box) box.style.display = 'none';
            return;
        }

        const data = snap.data();
        
        if (details && box) {
            box.style.display = 'block';
            
            const createSection = (label, start, end, isLast = false) => `
                <div style="flex: 1; text-align: center; ${isLast ? '' : 'border-right: 1px solid rgba(34, 197, 94, 0.3);'} padding: 0 4px;">
                    <div style="font-size: 0.58rem; color: #22c55e; font-weight: 800; text-transform: uppercase; margin-bottom: 8px;">${label}</div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <div>
                            <span style="display: block; font-size: 0.45rem; color: #999;">ZAČÁTEK</span>
                            <span style="font-size: 1rem; color: #fff; font-weight: 700;">${start || '--'}</span>
                        </div>
                        <div>
                            <span style="display: block; font-size: 0.45rem; color: #999;">KONEC</span>
                            <span style="font-size: 1rem; color: #2ecc71; font-weight: 700;">${end || '--'}</span>
                        </div>
                    </div>
                </div>`;

            // --- 2. OPRAVA CESTY: Čteme z objektu info.fa atd. ---
            details.innerHTML = `
                ${createSection('Fabia', data.info?.fa?.start, data.info?.fa?.end)}
                ${createSection('Scala/Kamiq', data.info?.sk?.start, data.info?.sk?.end)}
                ${createSection('Zásobník', data.info?.za?.start, data.info?.za?.end, true)}
            `;
        }

        phasesData = data.phases || [];
        render();
    } catch (e) { console.error("Chyba loadShift:", e); }
}

// 4. RENDER (TVŮJ VIZUÁL + KLIKÁNÍ)
function render() {
    const filter = nameFilterEl.value.toLowerCase().trim();
    const s = shiftEl.value;
    const labels = (s === "ranni") ? ["06:00-08:00", "08:05-10:15", "10:45-12:00", "12:05-14:00"] : (s === "odpo") ? ["14:00-16:00", "16:05-18:15", "18:45-20:00", "20:05-22:00"] : ["22:00-00:00", "00:05-02:15", "02:45-04:00", "04:05-06:00"];
    const MERGED_GROUPS = { "VYP1-L": { others: ["VYP2-L"], label: "VÝPLNĚ L" }, "VYP1-P": { others: ["VYP2-P"], label: "VÝPLNĚ P" }, "VET": { others: ["VET2", "VET3"], label: "VĚTRAČKY" }, "INST": { others: ["INST2", "INST3"], label: "INSTALACE" } };
    const skipped = new Set();
    
    let html = "<thead><tr><th style='color:rgba(255,255,255,0.4); font-size:9px;'>Pozice</th>" + labels.map(l => `<th style='color:rgba(255,255,255,0.4); font-size:9px;'>${l}</th>`).join('') + "</tr></thead><tbody>";

    POSITIONS.forEach(pos => {
        if (skipped.has(pos)) return;
        const group = MERGED_GROUPS[pos];
        const subPos = group ? [pos, ...group.others] : [pos];
        if (group) group.others.forEach(p => skipped.add(p));

        let rowData = []; let match = false;
        for (let i = 0; i < 4; i++) {
            let pD = [];
            subPos.forEach(sp => {
                const e = phasesData[i] ? phasesData[i][sp] : null;
                let mId = typeof e === 'string' ? e : e?.m, tId = e?.t;
                const mN = workerMap[mId] || "", tN = workerMap[tId] || "";
                if (filter && (mN.toLowerCase().includes(filter) || tN.toLowerCase().includes(filter))) match = true;
                pD.push({ mN, tN, mId, tId, sp });
            });
            rowData.push(pD);
        }
        if (filter && !match) return;

        // 1. KONTROLA PRÁZDNOSTI: Projdeme všechny 4 fáze tohoto řádku
        let totalWorkersInRow = 0;
        for (let i = 0; i < 4; i++) {
            rowData[i].forEach(c => {
                if (c.mN && c.mN !== "—") totalWorkersInRow++;
                if (c.tN) totalWorkersInRow++;
            });
        }

        // 2. NASTAVENÍ BAREV (Změnil jsem je na výraznější, aby to bylo vidět)
        // Pokud nikdo není v řádku, pozadí bude skoro průhledné a barva textu šedá
        const isRowEmpty = totalWorkersInRow === 0;
        const rowBg = isRowEmpty ? "rgba(0,0,0,0.3) !important" : "rgba(46,204,113,0.05) !important";
        const labelColor = isRowEmpty ? "#555 !important" : "#2ecc71 !important";
        const rowOpacity = isRowEmpty ? "0.4" : "1";

        // 3. Vykreslení řádku
        html += `<tr style="background:${rowBg}; border-bottom:1px solid rgba(255,255,255,0.05); opacity:${rowOpacity}; transition: all 0.3s;">
            <td style="width:55px; text-align:center; font-weight:900; color:${labelColor}; font-size:8px; text-transform:uppercase;">${group ? group.label : pos}</td>`;

        for (let i = 0; i < 4; i++) {
            html += `<td style="padding:0;">`;
            rowData[i].forEach(c => {
                const isMe = c.mId === currentUserEmp?.id;
                const filterValue = filter.toLowerCase();

                // Pokud je řádek prázdný, barva pomlčky (contentColor) bude hodně ztlumená
                const contentColor = isRowEmpty ? "rgba(255,255,255,0.05)" : "#ffffff";
                
                const isMatchedM = filterValue !== "" && c.mN.toLowerCase().includes(filterValue);
                const colorM = isMatchedM ? "#00ff88" : contentColor;

                const isMatchedT = filterValue !== "" && (c.tN || "").toLowerCase().includes(filterValue);
                const colorT = isMatchedT ? "#00ff88" : (isRowEmpty ? "rgba(59,130,246,0.1)" : "#3b82f6");

                const meAttributes = isMe 
                    ? `onclick="window.openSwapPicker(${i},'${c.sp}')" style="cursor:pointer; font-weight:800; font-size:10px; line-height:1; color:${colorM};"` 
                    : `style="font-weight:800; font-size:10px; line-height:1; color:${colorM};"`;
                
                html += `<div style="height:24px; display:flex; flex-direction:column; justify-content:center;">
                    <div ${meAttributes}>
                        ${c.mN || "—"}
                    </div>
                    ${c.tN ? `<div style="color:${colorT}; font-weight:700; font-size:7px; margin-top:1px;">+ ${c.tN}</div>` : ''}
                </div>`;
            });
            html += `</td>`;
        }
        html += "</tr>";
    });
    gridEl.innerHTML = html + "</tbody>";
}
// 5. AUTOMATIKA DATA A SMĚNY (OPRAVENO DLE PDF)
function setShiftAutomatically() {
    const today = new Date();
    const hours = today.getHours();
    const anchorDate = new Date(2026, 2, 2); 
    const getShift = (d) => {
        const msDiff = d.getTime() - anchorDate.getTime();
        const weeksDiff = Math.floor(msDiff / (1000 * 60 * 60 * 24 * 7));
        const shiftValues = ["noc", "odpo", "ranni"];
        let index = weeksDiff % 3; if (index < 0) index += 3;
        return shiftValues[index];
    };
    let dDate = new Date(today);
    const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
    if (getShift(tomorrow) === "noc" && hours >= 12) dDate = tomorrow;
    else if (hours >= 24) dDate = tomorrow;
    
    dateEl.value = (new Date(dDate - dDate.getTimezoneOffset() * 60000)).toISOString().slice(0, 10);
    shiftEl.value = getShift(dDate);
    loadShift();
}

// 6. LOGIKA VÝMĚNY (MODAL)
window.openSwapPicker = (idx, myP) => {
    const list = document.getElementById("swapList");
    list.innerHTML = "";
    let found = 0;

    Object.entries(phasesData[idx]).forEach(([pos, w]) => {
        if (pos === myP) return;
        const id = typeof w === 'string' ? w : w.m;
        const k = allWorkersData[id];

        if (k?.email?.includes("@") && k.skills?.[myP] === 2) {
            found++;
            const b = document.createElement("button");
            b.className = "swap-btn";
            b.style.transition = "all 0.3s ease"; // Plynulá změna barev
            
            const originalHTML = `Vyměnit s: <b>${k.fName || k.name}</b> (${pos})`;
            b.innerHTML = originalHTML;

            b.onclick = () => {
                if (!b.dataset.confirming) {
                    // 1. KLIKNUTÍ: Moderní potvrzovací stav
                    b.dataset.confirming = "true";
                    b.innerHTML = `ODESLAT ŽÁDOST ➔`;
                    b.style.background = "#22c55e"; // Sytě zelená
                    b.style.color = "#fff";
                    b.style.letterSpacing = "1px";
                    b.style.fontWeight = "900";
                    b.style.boxShadow = "0 0 15px rgba(34, 197, 94, 0.4)";

                    // Reset po 3 vteřinách
                    setTimeout(() => {
                        if (b.dataset.confirming === "true") {
                            delete b.dataset.confirming;
                            b.innerHTML = originalHTML;
                            b.style.background = "";
                            b.style.color = "";
                            b.style.letterSpacing = "";
                            b.style.boxShadow = "";
                        }
                    }, 3000);
                } else {
    // 2. KLIKNUTÍ: Samotné odeslání - přidáme 'b' na konec
    sendSwapRequest(idx, myP, pos, k, b); 
}
            };
            list.appendChild(b);
        }
    });

    if (!found) alert("Nikdo vhodný k výměně nenalezen.");
    else document.getElementById("swapModal").style.display = "flex";
};

async function sendSwapRequest(idx, myP, toP, k, btn) {
    try {
        btn.innerHTML = `ODESÍLÁM...`;
        btn.disabled = true;

        // Vytvoříme přehledný text výměny
        // currentUserEmp.name (ty) a k.fName/k.name (on)
        const myName = currentUserEmp.name || "Já";
        const targetName = k.fName || k.name || "Kolega";

        await addDoc(collection(db, "chat"), {
            // TADY JE TA ZMĚNA: Text bude obsahovat oba směry
            text: `VÝMĚNA POZIC:\n${myName}: ${myP} ➔ ${toP}\n${targetName}: ${toP} ➔ ${myP}`,
            
            senderEmail: auth.currentUser.email,
            topic: "zmeny",
            createdAt: serverTimestamp(),
            isSwapRequest: true,
            status: "pending",
            targetEmail: k.email.toLowerCase().trim(),
            swapDetails: { 
                phase: idx, 
                date: dateEl.value, 
                shift: shiftEl.value, 
                fromId: currentUserEmp.id, 
                fromPos: myP, 
                toId: k.id, 
                toPos: toP 
            }
        });

        btn.innerHTML = `ODESLÁNO ✓`;
        btn.style.background = "#22c55e";
        
        // Po vteřině a půl okno samo zmizí
        setTimeout(() => {
            document.getElementById("swapModal").style.display = "none";
        }, 1500);

    } catch (e) {
        console.error(e);
        btn.innerHTML = `CHYBA PŘI ODESLÁNÍ`;
        btn.style.background = "#ef4444";
        btn.disabled = false;
    }
}

dateEl.onchange = loadShift;
shiftEl.onchange = loadShift;
nameFilterEl.oninput = render;
</script>
