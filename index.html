<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  onSnapshot,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
  measurementId: "G-1HF3R93D92"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loadingCard = document.getElementById("loading"); // Přidal jsem 'Card'
const emailEl = document.getElementById("email");
const passEl = document.getElementById("pass");
const authCard = document.getElementById("authCard");
const menuCard = document.getElementById("menuCard");
const roleLabel = document.getElementById("roleLabel");
const myNoteCard = document.getElementById("myNoteCard");
const myNoteText = document.getElementById("myNoteText");
const broadcastCard = document.getElementById("broadcastCard");
const broadcastTextEl = document.getElementById("broadcastText");

let mode = "login";

window.setMode = (m)=>{
  mode = m;
  tabLogin.classList.toggle("activeTab", m==="login");
  tabReg.classList.toggle("activeTab", m==="register");
  mainBtn.innerText = m==="login" ? "Přihlásit" : "Registrovat";
};

window.submitAuth = async ()=>{

  try{

    if(mode==="login"){
      await signInWithEmailAndPassword(auth,emailEl.value,passEl.value);
    }else{
      const cred = await createUserWithEmailAndPassword(auth,emailEl.value,passEl.value);
      await setDoc(doc(db,"users",cred.user.uid),{role:"user"});
      alert("Registrace proběhla");
      setMode("login");
    }

  }catch(e){

    if(
      e.code==="auth/user-not-found" ||
      e.code==="auth/wrong-password" ||
      e.code==="auth/invalid-credential"
    ){
      alert("Neplatné přihlášení — účet neexistuje nebo špatné heslo.");
    }
    else if(e.code==="auth/email-already-in-use"){
      alert("Tento email už je registrovaný.");
    }
    else if(e.code==="auth/weak-password"){
      alert("Heslo musí mít aspoň 6 znaků.");
    }
    else{
      alert("Registrace OK");
    }
  }
};

window.logout = ()=> signOut(auth);
window.go = (p)=> location.href=p;

onAuthStateChanged(auth, async (user) => {
  const loadingCard = document.getElementById("loading");
  const authCard = document.getElementById("authCard");
  const menuCard = document.getElementById("menuCard");
  const myNoteCard = document.getElementById("myNoteCard");
  const btnDovednosti = document.getElementById("btnDovednosti");
  const btnEmployees = document.getElementById("btnEmployees");
  const btnGenerator = document.getElementById("btnGenerator");
  
  // Element hromadné zprávy
  const broadcastText = document.getElementById("broadcastText");

  if (user) {
    if (loadingCard) loadingCard.style.setProperty("display", "none", "important");
    if (authCard) authCard.style.setProperty("display", "none", "important");

    if (menuCard) {
      menuCard.style.setProperty("display", "block", "important");
      menuCard.classList.remove("hidden");
    }
    
    if (btnDovednosti) {
      btnDovednosti.style.setProperty("display", "flex", "important");
      btnDovednosti.classList.remove("hidden");
    }

  try {
      // 1. Vyhledání v kolekci 'employees' podle pole 'email'
      const userEmail = user.email.toLowerCase().trim();
      const q = query(collection(db, "employees"), where("email", "==", userEmail));
      const querySnapshot = await getDocs(q);
      
      let role = "user"; // Výchozí role, pokud se nic nenajde

      // 2. Kontrola, zda jsme našli aspoň jednoho zaměstnance s tímto emailem
      if (!querySnapshot.empty) {
        // Musíme vzít první dokument z výsledků (index [0])
        const userData = querySnapshot.docs[0].data();
        role = userData.role || "user";
      }

      const isAdmin = role === "admin";
      console.log("Ověřeno v employees:", userEmail, "Role:", role);

      // --- ZBYTEK LOGIKY NASTAVENÍ UI ---
      document.querySelectorAll(".adminOnly").forEach(b => {
        b.style.setProperty("display", isAdmin ? "block" : "none", "important");
      });

      if (btnEmployees) btnEmployees.style.setProperty("display", isAdmin ? "flex" : "none", "important");
      if (btnGenerator) btnGenerator.style.setProperty("display", isAdmin ? "flex" : "none", "important");

      if (broadcastText) {
        if (isAdmin) {
          broadcastText.style.cursor = "pointer";
          broadcastText.classList.add("hover:opacity-70");
          broadcastText.onclick = () => window.openBroadcastEditor(); 
        } else {
          broadcastText.style.cursor = "default";
          broadcastText.classList.remove("hover:opacity-70");
          broadcastText.onclick = null;
        }
      }

    } catch (e) {
      console.error("Chyba při vyhledávání role v employees:", e);
    }

  } else {
    // Logika pro odhlášeného uživatele (zůstává stejná)
    if (menuCard) menuCard.style.setProperty("display", "none", "important");
    if (authCard) {
      authCard.style.setProperty("display", "block", "important");
      authCard.classList.remove("hidden");
    }
  }
});

onSnapshot(doc(db, "settings", "announcement"), (snapshot) => {
    const box = document.getElementById("broadcastText");
    if (snapshot.exists() && box) {
        box.innerText = snapshot.data().text || "";
    }
});

// --- 2. FUNKCE PRO EDITOR (Přístupné pro HTML tlačítka) ---
window.openBroadcastEditor = function() {
    const modal = document.getElementById('broadcastModal');
    const input = document.getElementById('newBroadcastInput');
    const currentText = document.getElementById('broadcastText');
    if (modal && input && currentText) {
        modal.style.display = 'flex'; // Zobrazíme okno
        input.value = currentText.innerText;
    }
};

window.closeBroadcast = function() {
    const modal = document.getElementById('broadcastModal');
    if (modal) modal.style.display = 'none';
};

window.saveBroadcast = async function() {
    const input = document.getElementById('newBroadcastInput');
    if (!input) return;
    try {
        const { updateDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js")
        await updateDoc(doc(db, "settings", "announcement"), {
            text: input.value,
            updatedAt: new Date()
        });
        window.closeBroadcast();
    } catch (error) {
        alert("Chyba při ukládání do Firebase!");
    }
};
</script>

<!-- 3. EDITAČNÍ OKNO (Tohle ti tam chybělo - vlož před </body>) -->
<div id="broadcastModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #334155;">
        <h3 style="color: white; margin-bottom: 15px; text-align: center; font-weight: bold;">Upravit hromadnou zprávu</h3>
        <textarea id="newBroadcastInput" style="width: 100%; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 12px; padding: 12px; height: 120px; margin-bottom: 15px; outline: none;"></textarea>
        <div style="display: flex; gap: 10px;">
            <button onclick="window.closeBroadcast()" style="flex: 1; padding: 12px; background: #334155; color: white; border-radius: 12px; cursor: pointer; border: none;">Zrušit</button>
            <button onclick="window.saveBroadcast()" style="flex: 1; padding: 12px; background: #059669; color: white; border-radius: 12px; font-weight: bold; cursor: pointer; border: none;">Publikovat</button>
        </div>
    </div>
</div>
