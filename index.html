<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PecaShifter</title>

<style>

body {
    margin: 0;
    padding: 0;
    min-height: 100vh; /* Zajistí výšku přes celý displej */
    display: flex;
    flex-direction: column;
    color: white;
    font-family: sans-serif;
    /* Oprava pozadí: */
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('pozadi.jpg') !important;
    background-size: cover !important; /* Důležité: roztáhne obrázek, aby vyplnil vše */
    background-position: center center !important;
    background-attachment: fixed !important;
    background-color: #030712 !important;
}

.app div:not(.card) {
    background: transparent !important;
    background-color: transparent !important;
    box-shadow: none !important;
    border: none !important;
}

.logo{
  font-size:34px;
  font-weight:900;
  text-align:center;
}

.sub{
  text-align:center;
  opacity:.7;
  margin-bottom:20px;
}

.card {
    background: rgba(17, 24, 39, 0.4) !important; /* Hodně průhledná */
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
}


#loading{
  text-align:center;
  opacity:.8;
}

/* switch */

.switch{
  display:flex;
  background:#1f2937;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:14px;
}

.switch button{
  flex:1;
  padding:12px;
  border:none;
  font-weight:800;
  background:#374151;
  color:white;
  transition:.15s;
}

.switch button:hover{ background:#4b5563; }

.activeTab{
  background:#22c55e !important;
  color:black !important;
}

.switch button:active{
  transform:scale(.96);
}

/* inputs */

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
  font-size:16px;
}

/* main button */

.mainBtn{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:none;
  font-size:16px;
  font-weight:900;
  background:#3b82f6;
  color:white;
  transition:.15s;
}

.mainBtn:hover{ background:#2563eb; }
.mainBtn:active{
  transform:scale(.97);
  filter:brightness(.85);
}

/* menu buttons */

.menu button {
    width: 100%;
    padding: 18px !important; /* Větší klikací plocha */
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    margin-top: 12px;
    font-weight: 800;
    font-size: 16px !important; /* Oprava miniaturního textu */
    color: white !important;
    transition: .15s;
    backdrop-filter: blur(5px);
}

.btnEmployees { background: rgba(124, 58, 237, 0.6) !important; } /* Fialová */
.btnGenerator { background: rgba(245, 158, 11, 0.6) !important; }  /* Oranžová */
.btnSchedule  { background: rgba(22, 163, 74, 0.6) !important; }   /* Zelená */
.btnCalendar  { background: rgba(220, 38, 38, 0.6) !important; }   /* Červená */
.btnStats     { background: rgba(6, 182, 212, 0.6) !important; }   /* Tyrkysová */
.logout       { background: rgba(55, 65, 81, 0.6) !important; }    /* Šedá */

.menu button:hover{ filter:brightness(1.1); }
.menu button:active{
  transform:scale(.97);
  filter:brightness(.85);
}

.hidden{ display:none; }

.roleTag, .sub, .logo {
    background: transparent !important;
    position: relative;
    z-index: 2; /* Aby text nezanikl pod filtrem */
}
 main, section, article, .app div:not(.card) {
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
  }
  div {
    background-color: transparent !important;
}

/* A tímto nastavíme průhlednost přímo kartě */
.card {
    background: rgba(17, 24, 39, 0.4) !important; 
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
}
.card .card, .card div, .card section {
    box-shadow: none !important;
    border: none !important;
    background: transparent !important;
    background-color: transparent !important;
}

/* Pokud je to ohraničení způsobeno třídou .menu, vypneme ho i tam */
.menu {
    border: none !important;
    box-shadow: none !important;
    background: transparent !important;
}
hr, .divider, .separator {
    display: none !important;
}

/* 2. Vypne horní a dolní ohraničení u všech prvků v kartě */
.card *, .menu, .roleTag {
    border-top: none !important;
    border-bottom: none !important;
    border-left: none !important;
    border-right: none !important;
    outline: none !important;
    box-shadow: none !important;
}

/* 3. Pokud je to ohraničení stín (shadow), tento ho vymaže */
[class*="card"] {
    box-shadow: none !important;
}
#menuCard {
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border: none !important;
    box-shadow: none !important;
}

/* 2. Pokud chceš, aby celá ta velká plocha byla průhlednější, upravíme hlavní kartu */
.card {
    background: rgba(17, 24, 39, 0.4) !important; /* Číslo 0.4 znamená 40% průhlednost */
    backdrop-filter: blur(8px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
}

/* 3. Odstranění té čáry nad nápisem Role */
.roleTag {
    border-top: none !important;
    margin-top: 10px !important;
    padding-top: 0 !important;
}
.header-container {
    padding-top: 60px; /* Vytvoří místo shora */
    padding-bottom: 20px;
    text-align: center;
}

.logo {
    display: block !important;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    font-size: 52px !important;
    font-weight: 300 !important;
    letter-spacing: -1.5px;
    margin: 40px 0 20px 0 !important;
    
    /* Moderní barevný přechod s nádechem do zelena */
    background: linear-gradient(120deg, #ffffff 30%, #4ade80 70%, #ffffff 90%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    
    /* Jemná záře kolem nápisu */
    filter: drop-shadow(0 0 15px rgba(74, 222, 128, 0.2));
}

.logo b {
    font-weight: 800 !important;
    /* Část "Master" bude mít sytější zelený odlesk */
    background: linear-gradient(to bottom, #ffffff 40%, #22c55e 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Styl pro zprávu - aby neodsunula tlačítka moc nízko */
.message-box {
    margin: 20px auto !important;
    max-width: 400px;
    padding: 18px 25px !important;
    border-radius: 20px !important;
    background: rgba(15, 23, 42, 0.6) !important; /* Tmavší, "skleněný" efekt */
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-left: 4px solid #3b82f6 !important; /* Modrý akcent na straně */
    
    /* VYLEPŠENÍ PÍSMA */
    color: #f1f5f9 !important;
    font-family: 'Segoe UI', Roboto, sans-serif !important;
    font-size: 16px !important;
    font-weight: 400 !important; /* Lehčí písmo působí luxusněji */
    line-height: 1.6 !important; /* Větší mezery mezi řádky pro čitelnost */
    text-align: left !important; /* Zarovnání doleva vypadá u zpráv lépe */
    text-transform: none !important; /* ZRUŠÍ VELKÁ PÍSMENA */
    letter-spacing: 0.2px;
}

/* Zobrazí se pouze, pokud v ní něco je */
.message-box:not(:empty) {
    display: block !important;
}

/* Pokud zpráva obsahuje text, zobrazíme ji */
.message-box:not(:empty) {
    display: block;
}
/* --- MODERNIZACE TLAČÍTEK V MENU --- */
.card {
    border-radius: 20px !important;
    padding: 18px !important;
    margin-bottom: 12px !important;
    font-weight: 800 !important;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3) !important;
    cursor: pointer;
}

.card:hover {
    transform: translateY(-2px); /* Jemné nadzvednutí při najetí myší */
    box-shadow: 0 6px 20px rgba(0,0,0,0.4) !important;
}

/* Konkrétní syté barvy pro sekce */
.bg-purple  { background: #7e22ce !important; } /* Zaměstnanci */
.bg-orange  { background: #ea580c !important; } /* Generátor */
.bg-green   { background: #16a34a !important; } /* Směnový graf */
.bg-slate   { background: #475569 !important; } /* Kalendář (místo červené) */
.bg-cyan    { background: #0891b2 !important; } /* Statistiky */
.bg-logout  { background: rgba(255,255,255,0.1) !important; color: #f1f5f9; }
</style>
</head>

<body>

<div class="app">

<div class="header-container">
    <h1 class="logo">Shift<b>Master</b></h1>
</div>

<div id="loading" class="card">
  Ověřuji přihlášení…
</div>

<!-- AUTH -->
<div id="authCard" class="card hidden">

 <div class="switch">
    <button id="tabLogin" class="activeTab" onclick="setMode('login')">Přihlášení</button>
    <button id="tabReg" onclick="setMode('register')">Registrace</button>
  </div>

  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Heslo">

  <button class="mainBtn" id="mainBtn" onclick="submitAuth()">
    Přihlásit
  </button>

</div>

<!-- MENU -->
<div id="menuCard" class="card hidden">
<div class="roleTag" id="roleLabel"></div>
 <div id="broadcastText" class="message-box"></div>

<!-- MOJE POZNÁMKA -->
<div id="myNoteCard" class="card hidden" style="margin-bottom:14px;">
  <div style="font-weight:800;margin-bottom:6px;">
    📝 Soukromá zpráva
  </div>
  <div id="myNoteText" style="opacity:.9; line-height:1.4;"></div>
</div>

  <div class="menu">

    <button class="btnEmployees adminOnly bg-purple" onclick="go('employees.html')">
      👥 Karty zaměstnance
    </button>

    <button class="btnGenerator adminOnly bg-orange" onclick="go('generator.html')">
      ⚙️ Generátor
    </button>

    <button class="btnSchedule bg-green" onclick="go('schedule.html')">
      📊 Směnový graf
    </button>

    <button class="btnCalendar bg-slate" onclick="go('date.html')">
      📅 Kalendář
    </button>

    <button class="btnStats bg-cyan" onclick="go('stats.html')">
      📈 Statistiky
    </button>

    <button class="logout bg-logout" onclick="logout()">
      Odhlásit
    </button>

  </div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
  measurementId: "G-1HF3R93D92"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loading = document.getElementById("loading");
const emailEl = document.getElementById("email");
const passEl = document.getElementById("pass");
const authCard = document.getElementById("authCard");
const menuCard = document.getElementById("menuCard");
const roleLabel = document.getElementById("roleLabel");
const myNoteCard = document.getElementById("myNoteCard");
const myNoteText = document.getElementById("myNoteText");
const broadcastCard = document.getElementById("broadcastCard");
const broadcastTextEl = document.getElementById("broadcastText");

let mode = "login";

window.setMode = (m)=>{
  mode = m;
  tabLogin.classList.toggle("activeTab", m==="login");
  tabReg.classList.toggle("activeTab", m==="register");
  mainBtn.innerText = m==="login" ? "Přihlásit" : "Registrovat";
};

window.submitAuth = async ()=>{

  try{

    if(mode==="login"){
      await signInWithEmailAndPassword(auth,emailEl.value,passEl.value);
    }else{
      const cred = await createUserWithEmailAndPassword(auth,emailEl.value,passEl.value);
      await setDoc(doc(db,"users",cred.user.uid),{role:"user"});
      alert("Registrace proběhla");
      setMode("login");
    }

  }catch(e){

    if(
      e.code==="auth/user-not-found" ||
      e.code==="auth/wrong-password" ||
      e.code==="auth/invalid-credential"
    ){
      alert("Neplatné přihlášení — účet neexistuje nebo špatné heslo.");
    }
    else if(e.code==="auth/email-already-in-use"){
      alert("Tento email už je registrovaný.");
    }
    else if(e.code==="auth/weak-password"){
      alert("Heslo musí mít aspoň 6 znaků.");
    }
    else{
      alert("Registrace OK");
    }
  }
};

window.logout = ()=> signOut(auth);
window.go = (p)=> location.href=p;

onAuthStateChanged(auth, async user => {
  
  // SEM vložíš ten nový kód (místo původních řádků 444-465):
  if (user) {
     const loadingCard = document.getElementById("loading");
    const menuCard = document.getElementById("menuCard");

    if (loadingCard) {
        loadingCard.style.setProperty("display", "none", "important");
    }

    if (menuCard) {
        menuCard.style.setProperty("display", "block", "important");
        menuCard.classList.remove("hidden");
    }

    if (menuCard) {
        menuCard.style.setProperty("display", "block", "important");
        menuCard.classList.remove("hidden");
    }

    const snap = await getDoc(doc(db, "users", user.uid));
    const role = snap.data()?.role || "user";

    if (role !== "admin") {
      document.querySelectorAll(".adminOnly").forEach(b => {
        b.style.display = "none";
      });
    }

    loadMyNote(user);
    loadBroadcast();
  } else {
    // Pokud není uživatel přihlášen, pošli ho na login nebo schovej menu
    location.href = "index.html"; // nebo tvoje přihlašovací stránka
  }
});
async function loadMyNote(user){

  const q = query(
    collection(db,"employees"),
    where("email","==", user.email)
  );

  const snap = await getDocs(q);

  if(snap.empty){
    myNoteCard.classList.add("hidden");
    return;
  }

  const emp = snap.docs[0].data();

  if(emp.info && emp.info.trim() !== ""){
    myNoteText.innerText = emp.info;
    myNoteCard.classList.remove("hidden");
  }else{
    myNoteCard.classList.add("hidden");
  }
}

async function loadBroadcast() {
  const snap = await getDoc(doc(db, "config", "global"));
  const msg = snap.data()?.broadcastMessage || "";
  const box = document.getElementById("broadcastText");

  if (box) {
    if (msg.trim() !== "") {
      box.innerText = msg;
      box.style.display = "block";
    } else {
      box.style.display = "none";
    }
  }
}

</script>

</body>
</html>
