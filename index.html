const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loading = document.getElementById("loading");

const passEl = document.getElementById("pass");
const authCard = document.getElementById("authCard");
const menuCard = document.getElementById("menuCard");
const roleLabel = document.getElementById("roleLabel");
const myNoteCard = document.getElementById("myNoteCard");
const myNoteText = document.getElementById("myNoteText");
const broadcastCard = document.getElementById("broadcastCard");
const broadcastTextEl = document.getElementById("broadcastText");

let mode = "login";

window.setMode = (m)=>{
  mode = m;
  tabLogin.classList.toggle("activeTab", m==="login");
  tabReg.classList.toggle("activeTab", m==="register");
  mainBtn.innerText = m==="login" ? "Přihlásit" : "Registrovat";
};

window.submitAuth = async ()=>{

  try{

    if(mode==="login"){
      await signInWithEmailAndPassword(auth,emailEl.value,passEl.value);
    }else{
      const cred = await createUserWithEmailAndPassword(auth,emailEl.value,passEl.value);
      await setDoc(doc(db,"users",cred.user.uid),{role:"user"});
      alert("Registrace proběhla");
      setMode("login");
    }

  }catch(e){

    if(
      e.code==="auth/user-not-found" ||
      e.code==="auth/wrong-password" ||
      e.code==="auth/invalid-credential"
    ){
      alert("Neplatné přihlášení — účet neexistuje nebo špatné heslo.");
    }
    else if(e.code==="auth/email-already-in-use"){
      alert("Tento email už je registrovaný.");
    }
    else if(e.code==="auth/weak-password"){
      alert("Heslo musí mít aspoň 6 znaků.");
    }
    else{
      alert("Registrace OK");
    }
  }
};

window.logout = ()=> signOut(auth);
window.go = (p)=> location.href=p;

onAuthStateChanged(auth, async user => {
  
  // SEM vložíš ten nový kód (místo původních řádků 444-465):
  if (user) {
     const loadingCard = document.getElementById("loading");
    const menuCard = document.getElementById("menuCard");

    if (loadingCard) {
        loadingCard.style.setProperty("display", "none", "important");
    }

    if (menuCard) {
        menuCard.style.setProperty("display", "block", "important");
        menuCard.classList.remove("hidden");
    }

    if (menuCard) {
        menuCard.style.setProperty("display", "block", "important");
        menuCard.classList.remove("hidden");
    }

    const snap = await getDoc(doc(db, "users", user.uid));
    const role = snap.data()?.role || "user";

    if (role !== "admin") {
      document.querySelectorAll(".adminOnly").forEach(b => {
        b.style.display = "none";
      });
    }

    loadMyNote(user);
    loadBroadcast();
  } else {
    // Pokud není uživatel přihlášen, pošli ho na login nebo schovej menu
    location.href = "index.html"; // nebo tvoje přihlašovací stránka
  }
});
async function loadMyNote(user){

  const q = query(
    collection(db,"employees"),
    where("email","==", user.email)
  );

  const snap = await getDocs(q);

  if(snap.empty){
    myNoteCard.classList.add("hidden");
    return;
  }

  const emp = snap.docs[0].data();

  if(emp.info && emp.info.trim() !== ""){
    myNoteText.innerText = emp.info;
    myNoteCard.classList.remove("hidden");
  }else{
    myNoteCard.classList.add("hidden");
  }
}

async function loadBroadcast() {
  const snap = await getDoc(doc(db, "config", "global"));
  const msg = snap.data()?.broadcastMessage || "";
  const box = document.getElementById("broadcastText");

  if (box) {
    if (msg.trim() !== "") {
      box.innerText = msg;
      box.style.display = "block";
    } else {
      box.style.display = "none";
    }
  }
}
