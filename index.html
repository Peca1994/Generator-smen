<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShiftMaster | Menu</title>
<style>
/* --- GLOBÁLNÍ DESIGN --- */
body {
    background: radial-gradient(circle at 50% 25%, #064e3b 0%, #020617 85%) !important;
    background-color: #020617 !important;
    margin: 0; padding: 0; min-height: 100vh;
    font-family: sans-serif; color: white; overflow-x: hidden;
}

/* HERO SEKCE S LOGEM */
.hero-container { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: -10px; }
.logo { font-size: 42px; font-weight: 300; margin: 20px 0 0 0; letter-spacing: -1px; text-align: center; }
.logo b { font-weight: 800; color: #22c55e; }

.stack-box {
    position: relative; width: 320px; height: 120px;
    display: flex; justify-content: center; align-items: center; margin-top: -10px;
}

.skoda-blend-layer {
    width: 100%; height: auto; mix-blend-mode: lighten; 
    filter: contrast(1.2) brightness(0.7) grayscale(1); opacity: 0.4;
    position: absolute; z-index: 1;
}

.message-overlay {
    position: relative; z-index: 10; text-align: center; padding: 0 20px;
    font-size: 16px; font-weight: 600; text-shadow: 2px 2px 8px rgba(0,0,0,1);
    line-height: 1.4;
}

/* KARTY */
.card {
    max-width: 400px; margin: 10px auto; background: rgba(17, 24, 39, 0.5);
    backdrop-filter: blur(12px); border-radius: 20px; padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1); box-sizing: border-box;
}

.hidden { display: none !important; }

/* TLAČÍTKA MENU */
.menu button {
    width: 100%; padding: 18px; border-radius: 16px; border: none;
    margin-top: 12px; font-weight: 800; color: white; cursor: pointer;
    transition: transform 0.2s, filter 0.2s; text-transform: uppercase;
}
.menu button:active { transform: scale(0.97); filter: brightness(0.8); }

.bg-purple { background: #7e22ce; }
.bg-orange { background: #ea580c; }
.bg-green  { background: #16a34a; }
.bg-slate  { background: #475569; }
.bg-cyan   { background: #0891b2; }
.bg-logout { background: rgba(255,255,255,0.1); margin-top: 25px !important; }

/* AUTH FORMULÁŘ */
.switch { display: flex; gap: 5px; margin-bottom: 15px; }
.switch button { flex: 1; padding: 10px; border-radius: 10px; border: none; background: #374151; color: white; cursor: pointer; }
.activeTab { background: #22c55e !important; color: black !important; }
input { width: 100%; padding: 14px; border-radius: 12px; border: none; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; }
.mainBtn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #3b82f6; color: white; font-weight: 900; cursor: pointer; }

.roleTag { text-align: center; opacity: 0.6; font-size: 12px; margin-bottom: 15px; font-weight: 800; }
.disclaimer { padding: 20px; font-size: 10px; color: rgba(255,255,255,0.3); text-align: center; line-height: 1.4; }
</style>
</head>
<body>

<div class="hero-container">
    <h1 class="logo">Shift<b>Master</b></h1>
    <div class="stack-box">
        <!-- Logo Škoda jako podklad (soubor pozadi.jpg musí být ve stejné složce) -->
        <img src="pozadi.jpg" class="skoda-blend-layer" alt="Škoda">
        <!-- Text zprávy vznášející se nad logem -->
        <div id="broadcastText" class="message-overlay"></div>
    </div>
</div>

<div id="loading" class="card" style="text-align:center;">🔍 Ověřuji přihlášení…</div>

<!-- AUTH KARTA (PŘIHLÁŠENÍ / REGISTRACE) -->
<div id="authCard" class="card hidden">
    <div class="switch">
        <button id="tabLogin" class="activeTab" onclick="setMode('login')">Přihlášení</button>
        <button id="tabReg" onclick="setMode('register')">Registrace</button>
    </div>
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Heslo">
    <button class="mainBtn" id="mainBtn" onclick="submitAuth()">VSTOUPIT</button>
</div>

<!-- MENU KARTA (PO PŘIHLÁŠENÍ) -->
<div id="menuCard" class="card hidden">
    <div id="roleLabel" class="roleTag"></div>
    
    <!-- MOJE POZNÁMKA (ZOBRAZÍ SE JEN POKUD MÁM NĚCO V KARTĚ ZAMĚSTNANCE) -->
    <div id="myNoteCard" class="hidden" style="background:rgba(34,197,94,0.1); padding:15px; border-radius:15px; margin-bottom:15px; border:1px solid rgba(34,197,94,0.3);">
        <div style="font-weight:800; color:#22c55e; font-size:12px; margin-bottom:5px;">📝 SOUKROMÁ POZNÁMKA</div>
        <div id="myNoteText" style="font-size:14px; line-height:1.4; opacity:0.9;"></div>
    </div>

    <div class="menu">
        <button class="adminOnly bg-purple hidden" onclick="location.href='zamestnanci.html'">👥 Karty zaměstnance</button>
        <button class="adminOnly bg-orange hidden" onclick="location.href='generator.html'">⚙️ Generátor</button>
        <button class="bg-green" onclick="location.href='graf.html'">📊 Směnový graf</button>
        <button class="bg-slate" onclick="location.href='kalendar.html'">📅 Kalendář</button>
        <button class="bg-cyan" onclick="location.href='statistiky.html'">📈 Statistiky</button>
        <button class="bg-logout" onclick="handleLogout()">Odhlásit</button>
    </div>
</div>

<div class="disclaimer">
    © 2024 ShiftMaster | Neoficiální nástroj.<br>Logo ŠKODA je majetkem ŠKODA AUTO a.s.
</div>

<script type="module">
// 1. OPRAVENÉ IMPORTY PRO GITHUB PAGES
import { initializeApp } from "https://www.gstatic.com";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com";
import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com";
// 2. KONFIGURACE (Generator-Smen-9fba1)
const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Globální ovládání režimu (Login/Reg)
window.authMode = 'login';
window.setMode = (m) => {
    window.authMode = m;
    document.getElementById("tabLogin").classList.toggle("activeTab", m === 'login');
    document.getElementById("tabReg").classList.toggle("activeTab", m === 'register');
    document.getElementById("mainBtn").innerText = m === 'login' ? "PŘIHLÁSIT" : "REGISTROVAT";
};

// Funkce pro odeslání přihlášení
window.submitAuth = async () => {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("pass").value;
    try {
        if (window.authMode === 'login') {
            await signInWithEmailAndPassword(auth, email, pass);
        } else {
            const res = await createUserWithEmailAndPassword(auth, email, pass);
            await setDoc(doc(db, "users", res.user.uid), { role: "user", email: email });
            alert("Registrace úspěšná, nyní se můžete přihlásit.");
            setMode('login');
        }
    } catch (e) {
        alert("Chyba: " + e.message);
    }
};

window.handleLogout = () => signOut(auth);

// 3. SLEDOVÁNÍ STAVU PŘIHLÁŠENÍ (Sjednocená logika bez zacyklení)
onAuthStateChanged(auth, async (user) => {
    const loading = document.getElementById("loading");
    const authCard = document.getElementById("authCard");
    const menuCard = document.getElementById("menuCard");

    loading.classList.add("hidden");

    if (user) {
        // PŘIHLÁŠEN
        authCard.classList.add("hidden");
        menuCard.classList.remove("hidden");
        
        // Načtení role z databáze
        try {
            const userSnap = await getDoc(doc(db, "users", user.uid));
            const role = userSnap.exists() ? userSnap.data().role : "user";
            document.getElementById("roleLabel").innerText = "ROLE: " + role.toUpperCase();

            // Skrytí/Zobrazení admin tlačítek
            document.querySelectorAll(".adminOnly").forEach(el => {
                el.classList.toggle("hidden", role !== "admin");
            });
        } catch (e) { console.error("Chyba role:", e); }

        loadMyNote(user.email);
        loadBroadcast();
    } else {
        // ODHLÁŠEN
        menuCard.classList.add("hidden");
        authCard.classList.remove("hidden");
        document.getElementById("broadcastText").innerText = ""; // Vyčistit zprávu
    }
});

// Funkce pro načtení osobní poznámky
async function loadMyNote(email) {
    const myNoteCard = document.getElementById("myNoteCard");
    const myNoteText = document.getElementById("myNoteText");
    try {
        const q = query(collection(db, "employees"), where("email", "==", email));
        const snap = await getDocs(q);
        if (!snap.empty) {
            const empData = snap.docs[0].data();
            if (empData.info && empData.info.trim() !== "") {
                myNoteText.innerText = empData.info;
                myNoteCard.classList.remove("hidden");
                return;
            }
        }
        myNoteCard.classList.add("hidden");
    } catch (e) { console.error("Chyba poznámky:", e); }
}

// Funkce pro načtení globální zprávy (vznášející se nad logem)
async function loadBroadcast() {
    const broadcastTextEl = document.getElementById("broadcastText");
    try {
        const snap = await getDoc(doc(db, "config", "global"));
        if (snap.exists()) {
            broadcastTextEl.innerText = snap.data().broadcastMessage || "";
        }
    } catch (e) { console.error("Chyba zprávy:", e); }
}
</script>
</body>
</html>
