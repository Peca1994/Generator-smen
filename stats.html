<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistiky</title>

<style>
/* 1. GLOBÁLNÍ NASTAVENÍ A POZADÍ */
body {
    margin: 0;
    padding: 0;
    display: flex; /* Vrátí vycentrování celé karty */
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: white;
    font-family: sans-serif;
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg');
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
    background-color: #030712 !important;
}

/* 2. KONTEJNER A KARTA */
.app {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    box-sizing: border-box;
}

.card {
    background: rgba(17, 24, 39, 0.6) !important; /* Průhledná karta */
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border-radius: 20px !important;
    padding: 25px;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important; /* Jemný stín pro hloubku */
}

/* Úklid vnořených prvků, aby nevrstvily šedou barvu */
.card .card, #menuCard, .menu, main, section {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0;
}

/* 3. TEXTY */
.logo { font-size: 34px; font-weight: 900; text-align: center; margin-bottom: 5px; }
.sub { text-align: center; opacity: .7; margin-bottom: 20px; }
.roleTag { 
    text-align: center; 
    margin: 15px 0 !important; 
    color: #22c55e !important; /* Škoda zelená */
    font-weight: bold;
}

/* 4. TLAČÍTKA - VRÁCENÍ BAREV A VELIKOSTI */
.menu button, .mainBtn, .switch button {
    width: 100%;
    padding: 16px !important;
    border-radius: 12px;
    margin-top: 12px;
    font-weight: 800;
    font-size: 16px !important;
    color: white !important;
    border: none !important;
    cursor: pointer;
    transition: 0.2s;
}

/* Konkrétní barvy pro tlačítka (neprůhlednější, aby byla vidět) */
.btnEmployees { background: #7c3aed !important; opacity: 0.8; }
.btnGenerator { background: #f59e0b !important; opacity: 0.8; }
.btnSchedule  { background: #16a34a !important; opacity: 0.8; }
.btnCalendar  { background: #dc2626 !important; opacity: 0.8; }
.btnStats     { background: #06b6d4 !important; opacity: 0.8; }
.logout       { background: #374151 !important; opacity: 0.8; }

.menu button:hover { opacity: 1; transform: scale(1.02); filter: brightness(1.1); }

/* Vstupy (Inputy) - aby byly vidět */
input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    margin-bottom: 10px;
    box-sizing: border-box;
}

.hidden { display: none; }
</style>
</head>

<body>

<div class="topbar">
 <div><b>📊 Statistiky</b></div>
 <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">

<input id="filter" placeholder="🔎 Filtr podle jména…">

<div class="card"><h3>🚨 Největší absence</h3><div id="rankAbs"></div></div>



<div id="cards"><div class="loading">Počítám data…</div></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
  measurementId: "G-1HF3R93D92"
});

const db = getFirestore(app);

const cardsEl = document.getElementById("cards");
const filterEl = document.getElementById("filter");
const rankAbsEl = document.getElementById("rankAbs");


/* =======================
   LOAD
======================= */

const empSnap = await getDocs(collection(db,"employees"));
const shiftSnap = await getDocs(collection(db,"shifts"));

const empCurrentStatus = {};
const empNames = {};
const stats = {};
const posCount = {};

empSnap.forEach(d=>{
 const e=d.data();

 empCurrentStatus[d.id] = e.statusToday || "work";
 empNames[d.id] = e.name+" "+e.surname;

 stats[d.id] = {
  active:0,
  reserve:0,
  absence:0,
  pos:{}
 };
});

/* =======================
   HLAVNÍ VÝPOČET
======================= */

shiftSnap.forEach(docSnap=>{

 const shift = docSnap.data();
 const phases = shift.phases || [];
 const snapStatus = shift.statusSnapshot || {}; // ✅ snapshot dne

 // 🔷 LOANED = celá směna = všechny fáze
 Object.entries(snapStatus).forEach(([id,st])=>{
   if(st === "loaned" && stats[id]){
     stats[id].active += phases.length || 4;
   }
 });

 phases.forEach(phase=>{

   const used = new Set(Object.values(phase));

   /* ===== AKTIVNÍ ===== */

   Object.entries(phase).forEach(([pos,id])=>{

     if(!stats[id]) return;

     const st = snapStatus[id] || empCurrentStatus[id] || "work";

     if(st === "loaned") return; // už započteno za směnu

     // borrowed se počítá jen když JE na pozici → a to právě je
     stats[id].active++;

     stats[id].pos[pos] = (stats[id].pos[pos]||0)+1;
     posCount[pos] = (posCount[pos]||0)+1;
   });

   /* ===== MIMO POZICE ===== */

   Object.keys(stats).forEach(id=>{

     if(used.has(id)) return;

     const st = snapStatus[id] || empCurrentStatus[id] || "work";

     if(st === "loaned") return;
     if(st === "borrowed") return;

     // ❌ nemoc + paragraf = absence
if(st==="sick" || st==="paragraf"){
  stats[id].absence++;
}

// 🟡 dovolená = nepočítat vůbec nic
else if(st==="vacation"){
  // nic
}

// ✅ normální pracovní stavy = náhradník
else if(st==="work" || st==="shitmaking"){
  stats[id].reserve++;
}


   });

 });

});

/* =======================
   RANKINGS
======================= */

function top3(arr){
 return arr.sort((a,b)=>b.val-a.val).slice(0,3);
}

rankAbsEl.innerHTML="";


/* ABSENCE */

top3(
 Object.entries(stats)
  .filter(([id,s])=>s.absence>0)
  .map(([id,s])=>({
    name:empNames[id],
    val:s.absence
  }))
).forEach(x=>{
 rankAbsEl.innerHTML +=
   `<div class="rankRow">${x.name}<span>${x.val}</span></div>`;
});



/* =======================
   KARTY
======================= */

function render(){

 const f = filterEl.value.toLowerCase();
 cardsEl.innerHTML="";

 Object.entries(stats).forEach(([id,s])=>{

  const name = empNames[id];
  if(!name.toLowerCase().includes(f)) return;

  const total = s.active+s.reserve+s.absence;
  if(!total) return;

  const pct = Math.round((s.active/total)*100);

  const div=document.createElement("div");
  div.className="card";

  div.innerHTML=`
   <div class="worker">${name}</div>

   <div class="row">Aktivní<span class="badge active">${s.active}</span></div>
   <div class="row">Náhradník<span class="badge reserve">${s.reserve}</span></div>
   <div class="row">Absence<span class="badge absence">${s.absence}</span></div>

   <div class="barWrap">
     <div class="bar" style="width:${pct}%"></div>
   </div>

   <div style="margin-top:10px;font-weight:800;">
     Pozice — součet:
   </div>

   ${
     Object.entries(s.pos)
       .sort((a,b)=>b[1]-a[1])
       .map(([p,c])=>`<div class="posItem">${p} — ${c}×</div>`)
       .join("")
   }
  `;

  cardsEl.appendChild(div);

 });

}

filterEl.oninput = render;
render();

</script>
</body>
</html>
