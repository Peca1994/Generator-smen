<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistiky</title>

<style>
    /* IMPORT MODERNÍHO PÍSMA */
    @import url('https://fonts.googleapis.com');

    * {
        box-sizing: border-box;
        max-width: 100%;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
    
    }

    html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #020617 !important;
    background: radial-gradient(circle at 50% 25%, #064e3b 0%, #020617 85%) !important;
    background-attachment: fixed !important;
}

    .background-logo {
        position: fixed;
        top: 25%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: -1;
        text-align: center;
        pointer-events: none;
    }

    .background-logo img {
    /* Šířka a pozice */
    width: 650px !important; /* Velikost odpovídající hlavní stránce */
    max-width: 90vw !important;
    
    /* KLÍČOVÉ ŘÁDKY PRO STŘÍBRNÝ EFEKT */
    mix-blend-mode: screen; /* Odstraní černé pozadí */
    filter: grayscale(100%) brightness(1.1) contrast(1.1) !important; /* Udělá logo stříbrné */
    opacity: 0.4 !important; /* Jemná viditelnost jako u indexu */
    
    /* Vymazání okrajů do ztracena (necháváme tvoji masku) */
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
}
.background-logo h1 {
    font-size: 16vw !important;
    margin-top: -30px !important;
    letter-spacing: 25px !important;
    /* Nápis taky necháme ostrý bez blur */
    filter: none !important;
    color: #1a3a2a !important;
    opacity: 0.5 !important;
    text-shadow: 0 0 15px rgba(0,0,0,0.8) !important;
}

    .topbar {
        width: 100% !important;
        height: 60px;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        padding: 0 20px !important;
        background: transparent !important;
        position: sticky;
        top: 0;
        z-index: 1000;
        color: white !important; /* TOTO PŘIDEJ PRO BÍLÝ TEXT */
    }

.menuBtn { 
    padding: 8px 14px; 
    border-radius: 10px; 
    border: none; 
    font-weight: 800; 
    background: rgba(51, 65, 85, 0.8); 
    color: white; 
    cursor: pointer; 
}

/* 3. HLAVNÍ KONTEJNER - BEZ OHRANIČENÍ A ROZMAZÁNÍ */
.container, .app, main {
    max-width: 420px;
    margin: 20px auto !important;
    padding: 16px;
    background: rgba(0, 0, 0, 0.3) !important; /* Jemný závoj přes logo */
    border: none !important;      /* SMAZÁNÍ HLAVNÍHO OHRANIČENÍ */
    box-shadow: none !important;
    backdrop-filter: none !important; /* LOGO BUDE OSTRÉ */
    -webkit-backdrop-filter: none !important;
}

/* 4. ÚPLNÉ ZPRŮHLEDNĚNÍ VNITŘNÍCH PRVKŮ (Krabice v krabici) */
.card, .card-header, .btn-info, fieldset, section, details, summary, .container > div {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 10px 0 !important;
}

/* 5. ČITELNOST TEXTU (BÍLÝ SE STÍNEM) */
label, p, span, summary, .worker, .row, h1, h2, h3, .btn-info {
    color: white !important;
    font-weight: 900 !important;
    text-shadow: 2px 2px 4px rgba(0,0,0,1) !important; /* Černý obrys písma */
}

/* 6. FORMULÁŘE A TLAČÍTKA */
input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none !important;
    margin-bottom: 14px;
    background: white !important;
    color: black !important;
    font-weight: 700;
}

.btn-warning, .btn-primary, .btn-success, #saveBtn, .mainBtn {
    width: 100%;
    padding: 14px !important;
    border-radius: 12px !important;
    border: none !important;
    font-weight: 800;
    cursor: pointer;
    margin-top: 10px;
}

/* 7. POMOCNÉ PRVKY (Badge a Bary) */
.badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 900; }
.active { background: #16a34a !important; }
.reserve { background: #2563eb !important; }
.absence { background: #dc2626 !important; }
.barWrap { background: #020617; border-radius: 10px; height: 14px; margin-top: 6px; overflow: hidden; }
.bar { height: 100%; background: linear-gradient(90deg,#22c55e,#4ade80); }
.topTitle {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif !important;
    font-size: 22px !important;
    font-weight: 800 !important;
    color: #ffffff !important;
    letter-spacing: -0.5px !important;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    padding-left: 10px;
}
.disclaimer {
    position: relative; /* Změna z fixed na relative, aby netvořil prázdné místo pod sebou */
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.3); /* Decentní šedá */
    text-align: left; /* Zarovnání doleva */
    font-family: sans-serif;
    line-height: 1.3;
    width: 100%;
    box-sizing: border-box;
}
@media (max-width: 480px) {
    .disclaimer {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
        width: 90%;
        max-width: none;
    }
}
.stats-card, .container, .employee-stats-box { 
    background: rgba(0, 0, 0, 0.2) !important; /* Pouze 20% černá, zbytek je průhledný */
    backdrop-filter: none !important; /* Odstraní rozmazání, aby bylo pozadí ostré */
    border: none !important; /* Odstraní tvrdé okraje */
    box-shadow: none !important; /* Odstraní stíny, které dělají kartu "těžkou" */
}

/* Pokud tam máš bílé vyhledávání, uděláme ho taky skleněné */
#statsSearch {
    background: rgba(255, 255, 255, 0.05) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: white !important;
    border-radius: 25px;
    padding: 12px;
}
</style>
</head>

<body>

<div class="background-logo" style="position: fixed; top: 10%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: -1; width: 100%; opacity: 0.2;">
    <!-- Nápis ŠKODA (vycentrovaný a viditelný) -->
    <img src="pozadi.jpg" alt="SKODA" style="width: 250px; height: auto; filter: brightness(0) invert(1);">
    
    <!-- Silueta auta (přisátá těsně pod nápis) -->
    <img src="auto.png" alt="Silueta" style="width: 450px; height: auto; filter: brightness(0) invert(1); margin-top: -30px;">
</div>

<div class="topbar">
  <span class="topTitle" style="display: flex; align-items: center; gap: 10px; color: #ffb100;">
    <!-- ZMĚNA: stroke jsme změnili na #ffb100 (žlutá), aby ikona ladila s textem -->
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffb100" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"></line>
      <line x1="12" y1="20" x2="12" y2="4"></line>
      <line x1="6" y1="20" x2="6" y2="14"></line>
    </svg> 
    Statistiky
  </span>
  <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">

<input id="filter" placeholder="🔎 Filtr podle jména…">

<div class="card"><h3>🚨 Největší absence</h3><div id="rankAbs"></div></div>



<div id="cards"><div class="loading">Počítám data…</div></div>
<div class="disclaimer">
        © 2026 ShiftMaster | Neoficiální nástroj. Logo ŠKODA je majetkem ŠKODA AUTO a.s.
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
  measurementId: "G-1HF3R93D92"
});

const db = getFirestore(app);

const cardsEl = document.getElementById("cards");
const filterEl = document.getElementById("filter");
const rankAbsEl = document.getElementById("rankAbs");


/* =======================
   LOAD
======================= */

const empSnap = await getDocs(collection(db,"employees"));
const shiftSnap = await getDocs(collection(db,"shifts"));

const empCurrentStatus = {};
const empNames = {};
const stats = {};
const posCount = {};

empSnap.forEach(d=>{
 const e=d.data();

 empCurrentStatus[d.id] = e.statusToday || "work";
 empNames[d.id] = e.name+" "+e.surname;

 stats[d.id] = {
  active:0,
  reserve:0,
  absence:0,
  pos:{}
 };
});

/* =======================
   HLAVNÍ VÝPOČET
======================= */

shiftSnap.forEach(docSnap=>{

 const shift = docSnap.data();
 const phases = shift.phases || [];
 const snapStatus = shift.statusSnapshot || {}; // ✅ snapshot dne

 // 🔷 LOANED = celá směna = všechny fáze
 Object.entries(snapStatus).forEach(([id,st])=>{
   if(st === "loaned" && stats[id]){
     stats[id].active += phases.length || 4;
   }
 });

 phases.forEach(phase=>{

   const used = new Set(Object.values(phase));

   /* ===== AKTIVNÍ ===== */

   Object.entries(phase).forEach(([pos,id])=>{

     if(!stats[id]) return;

     const st = snapStatus[id] || empCurrentStatus[id] || "work";

     if(st === "loaned") return; // už započteno za směnu

     // borrowed se počítá jen když JE na pozici → a to právě je
     stats[id].active++;

     stats[id].pos[pos] = (stats[id].pos[pos]||0)+1;
     posCount[pos] = (posCount[pos]||0)+1;
   });

   /* ===== MIMO POZICE ===== */

   Object.keys(stats).forEach(id=>{

     if(used.has(id)) return;

     const st = snapStatus[id] || empCurrentStatus[id] || "work";

     if(st === "loaned") return;
     if(st === "borrowed") return;

     // ❌ nemoc + paragraf = absence
if(st==="sick" || st==="paragraf"){
  stats[id].absence++;
}

// 🟡 dovolená = nepočítat vůbec nic
else if(st==="vacation"){
  // nic
}

// ✅ normální pracovní stavy = náhradník
else if(st==="work" || st==="shitmaking"){
  stats[id].reserve++;
}


   });

 });

});

/* =======================
   RANKINGS
======================= */

function top3(arr){
 return arr.sort((a,b)=>b.val-a.val).slice(0,3);
}

rankAbsEl.innerHTML="";


/* ABSENCE */

top3(
 Object.entries(stats)
  .filter(([id,s])=>s.absence>0)
  .map(([id,s])=>({
    name:empNames[id],
    val:s.absence
  }))
).forEach(x=>{
 rankAbsEl.innerHTML +=
   `<div class="rankRow">${x.name}<span>${x.val}</span></div>`;
});



/* =======================
   KARTY
======================= */

function render(){

 const f = filterEl.value.toLowerCase();
 cardsEl.innerHTML="";

 Object.entries(stats).forEach(([id,s])=>{

  const name = empNames[id];
  if(!name.toLowerCase().includes(f)) return;

  const total = s.active+s.reserve+s.absence;
  if(!total) return;

  const pct = Math.round((s.active/total)*100);

  const div=document.createElement("div");
  div.className="card";

  div.innerHTML=`
   <div class="worker">${name}</div>

   <div class="row">Aktivní<span class="badge active">${s.active}</span></div>
   <div class="row">Náhradník<span class="badge reserve">${s.reserve}</span></div>
   <div class="row">Absence<span class="badge absence">${s.absence}</span></div>

   <div class="barWrap">
     <div class="bar" style="width:${pct}%"></div>
   </div>

   <div style="margin-top:10px;font-weight:800;">
     Pozice — součet:
   </div>

   ${
     Object.entries(s.pos)
       .sort((a,b)=>b[1]-a[1])
       .map(([p,c])=>`<div class="posItem">${p} — ${c}×</div>`)
       .join("")
   }
  `;

  cardsEl.appendChild(div);

 });

}

filterEl.oninput = render;
render();

</script>
</body>
</html>
