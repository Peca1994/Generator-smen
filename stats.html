<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "://firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
    measurementId: "G-H9HJHBDD9Q"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

    let statsData = []; 
let currentPeriod = 'all'; 
let availableYears = new Set();

// Funkce pro přepínání období (volá se z dropdown menu)
window.setPeriod = (period) => {
    currentPeriod = period;
    loadAndCalculateStats(); 
};

async function loadAndCalculateStats() {
    const listEl = document.getElementById("employeeStatsList");

    try {
        const empsSnap = await getDocs(collection(db, "employees"));
        const shiftsSnap = await getDocs(collection(db, "shifts"));

        let myEmps = {};
        availableYears.clear();

        // 1. Příprava zaměstnanců
        empsSnap.forEach(d => {
            const data = d.data();
            if (data.type !== "pujceny") {
                
                // --- FILTR NEŽÁDOUCÍCH POZIC ---
                const allSkills = data.skills || [];
                const validSkills = allSkills.filter(skill => {
                    const s = skill.toUpperCase(); // Pro jistotu, aby to bralo i malá písmena
                    
                    // Definice zákazů:
                    const isVetraky = s.startsWith("VET");
                    const isInstalace = s.startsWith("INST");
                    const isZamky = (s === "ZAM-L" || s === "ZAM-P");

                    // Pokud je to něco z toho, vrátíme FALSE (vyřadit)
                    return !(isVetraky || isInstalace || isZamky);
                });

                myEmps[d.id] = {
                    name: `${data.name} ${data.surname || ""}`,
                    totalHours: 0,
                    positions: {},
                    skillsCount: validSkills.length // Počítáme jen ty naše pozice
                };
            }
        });

        // 2. Výpočet s dynamickým filtrem
       shiftsSnap.forEach(doc => {
            const shift = doc.data();
            if (!shift.date) return;

            const year = shift.date.split('-')[0];
            availableYears.add(year);

            if (currentPeriod !== 'all' && year !== currentPeriod) return;

            const statusMap = shift.statusSnapshot || {};
            const phases = shift.phases || [];

            Object.entries(statusMap).forEach(([empId, status]) => {
                if (myEmps[empId]) {
                    // 1. POČÍTÁME PRÁCI
                    const workStatuses = ["work", "shitmaking", "loaned", "borrowed"];
                    if (workStatuses.includes(status)) {
                        myEmps[empId].totalHours += 7.5;
                    }

                    // 2. POČÍTÁME ABSENCI (Chybějící hodiny)
                    // Přidej si sem statusy, které chceš sledovat jako absenci
                    const absentStatuses = ["nemoc", "dovolena", "paragraf", "absence"];
                    if (absentStatuses.includes(status)) {
                        // Pokud v objektu ještě absentHours nemáme, vytvoříme je
                        myEmps[empId].absentHours = (myEmps[empId].absentHours || 0) + 7.5;
                    }
                }
            });

            phases.forEach(phase => {
                Object.entries(phase).forEach(([pos, empId]) => {
                    if (myEmps[empId]) {
                        myEmps[empId].positions[pos] = (myEmps[empId].positions[pos] || 0) + 1;
                    }
                });
            });
        });

        // Aktualizace výběrového menu podle nalezených roků
        updateYearSelect();

        statsData = Object.values(myEmps);
        renderAll();

    } catch (err) {
        console.error(err);
        listEl.innerHTML = `<div style="color:red">Chyba: ${err.message}</div>`;
    }
}

function updateYearSelect() {
    const select = document.getElementById("periodSelect");
    if (!select) return;

    const active = currentPeriod;
    
    // Smazali jsme emoji - o ikonu se stará to žluté SVG vlevo v políčku
    let html = `<option value="all" ${active === 'all' ? 'selected' : ''}>Celá historie</option>`;
    
    [...availableYears].sort().reverse().forEach(y => {
        // Tady taky pryč s ikonou, aby text seděl k té žluté ikoně vlevo
        html += `<option value="${y}" ${active === y ? 'selected' : ''}>Rok ${y}</option>`;
    });
    
    select.innerHTML = html;
}

function renderAll() {
    const query = document.getElementById("filter").value.toLowerCase();

    // 1. SEŘAZENÍ CELÉHO SEZNAMU PODLE PŘÍJMENÍ (Před vykreslením)
    statsData.sort((a, b) => {
        // Získáme příjmení (předpokládáme, že je v závorce nebo jako druhá část jména)
        // Pokud máš jméno a příjmení v DB odděleně, je to ještě snazší.
        // Tady to beru podle tvého formátu: "Jméno (Příjmení)"
        const nameA = a.name.toLowerCase();
        const nameB = b.name.toLowerCase();
        
        // Pokud máš příjmení v závorce, seřadíme to podle textu v ní:
        const surnameA = nameA.includes('(') ? nameA.split('(')[1] : nameA;
        const surnameB = nameB.includes('(') ? nameB.split('(')[1] : nameB;
        
        return surnameA.localeCompare(surnameB);
    });

    // 2. ŽEBŘÍČKY (HORNÍ KARTY) - Ty zůstávají seřazené podle výkonu
    const top5 = [...statsData].sort((a, b) => b.totalHours - a.totalHours).slice(0, 5);
    renderRank("topAttendance", top5, "h", "#2ecc71", "totalHours");

    const absenceList = [...statsData]
        .filter(e => (e.absentHours || 0) > 0)
        .sort((a, b) => (b.absentHours || 0) - (a.absentHours || 0))
        .slice(0, 5);
    renderRank("bottomAttendance", absenceList, "h", "#e74c3c", "absentHours");

    const masters = [...statsData].sort((a, b) => b.skillsCount - a.skillsCount).slice(0, 5);
    renderRank("masterOfSkills", masters, "", "#9b59b6", "skillsCount");

    // 3. PODROBNÝ SEZNAM (Teď už poletí abecedně podle příjmení)
    const listEl = document.getElementById("employeeStatsList");
    listEl.innerHTML = "";
    
    statsData.filter(e => e.name.toLowerCase().includes(query)).forEach(e => {
        const posHtml = Object.entries(e.positions)
            .sort((a,b) => b[1] - a[1])
            .map(([p, count]) => `<span style="font-size:11px; background:rgba(255,255,255,0.08); padding:3px 8px; border-radius:6px; border:1px solid rgba(255,255,255,0.1)">${p}: <b>${count}x</b></span>`)
            .join("");

        listEl.innerHTML += `
    <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:15px; padding:18px;">
        <div style="color:#ffb100; font-weight:800; font-size:16px; margin-bottom:4px;">${e.name}</div>
        
        <div style="font-size:12px; color:rgba(255,255,255,0.5); margin-bottom:12px; display:flex; flex-direction:column; gap:4px;">
            <!-- ODPRACOVÁNO -->
            <div style="display:flex; justify-content:space-between;">
                <span>Odpracováno:</span>
                <span style="color:white; font-weight:700;">${e.totalHours} h</span>
            </div>
            
            <!-- ABSENCE -->
            ${(e.absentHours || 0) > 0 ? `
            <div style="display:flex; justify-content:space-between; color:#e74c3c;">
                <span>Absence:</span>
                <span style="font-weight:700;">${e.absentHours} h</span>
            </div>` : ''}

           <!-- 3. Dovednosti (Skills) - Smazáno slovo "operací" -->
<div style="display:flex; justify-content:space-between; color:#9b59b6;">
    <span>Dovednosti:</span>
    <span style="font-weight:700;">${e.skillsCount}</span>
</div>
        </div>

        <!-- HISTORIE POZIC -->
        <div style="display:flex; flex-wrap:wrap; gap:6px;">${posHtml || '<i style="opacity:0.2; font-size:11px;">Žádná historie</i>'}</div>
    </div>`;
    });
}

function renderRank(id, data, unit, color, key) {
    document.getElementById(id).innerHTML = data.map((e, i) => `
        <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:14px;">
            <span style="opacity:0.8;">${i+1}. ${e.name}</span>
            <b style="color:${color}">${e[key] || 0}${unit}</b>
        </div>`).join("");
}

window.filterStats = () => renderAll();
loadAndCalculateStats();
</script>
</body>
