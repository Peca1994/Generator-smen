<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Směnový graf | ShiftMaster</title>

<style>
/* 1. GLOBÁLNÍ DESIGN */
body {
    margin: 0; padding: 0; min-height: 100vh;
    color: white; font-family: sans-serif;
    background-image: radial-gradient(circle at 50% 25%, #064e3b 0%, #020617 85%);
    background-color: #020617; background-attachment: fixed;
}

/* 2. TOPBAR */
.topbar {
    height: 60px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.menuBtn {
    padding: 8px 16px; border-radius: 10px; border: none; font-weight: 800;
    background: #334155; color: white; cursor: pointer;
}

/* 3. KONTEJNER */
.container { max-width: 600px; margin: 15px auto; padding: 10px; }
.card { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }

/* 4. FORMULÁŘE */
input, select {
    width: 100%; padding: 12px; border-radius: 12px; border: none;
    margin: 8px 0; background: white; color: black; font-weight: 700; box-sizing: border-box;
}

/* 5. TABULKA GRAFU */
.table-wrapper { overflow-x: auto; margin-top: 10px; border-radius: 15px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
th { background: rgba(255,255,255,0.1); font-weight: 800; color: #22c55e; }
.posCol { text-align: left; font-weight: 900; color: #38bdf8; background: rgba(0,0,0,0.2); }

.highlight { color: #22c55e !important; font-weight: 900; background: rgba(34, 197, 94, 0.1); }
.empty { opacity: .3; }
.infoRow { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; border-bottom: 1px dotted rgba(255,255,255,0.2); padding-bottom: 4px; }
</style>
</head>

<body>

<div class="topbar">
  <div style="font-weight: 900;">📊 SMĚNOVÝ GRAF</div>
  <button class="menuBtn" onclick="window.location.href='index.html'">Menu</button>
</div>

<div class="container">
    <div class="card">
        <label style="font-weight: 800; font-size: 12px; opacity: 0.7;">VÝBĚR SMĚNY</label>
        <input type="date" id="date">
        <select id="shift">
            <option value="ranni">Ranní (6:00 - 14:00)</option>
            <option value="odpo">Odpolední (14:00 - 22:00)</option>
            <option value="noc">Noční (22:00 - 6:00)</option>
        </select>
        <input id="nameFilter" placeholder="🔍 Hledat jméno (např. Pepa)">
    </div>

    <!-- INFO BOX -->
    <div class="card" id="shiftInfoBox" style="display:none">
      <h3 style="margin-top:0; color:#22c55e;">ℹ️ Detaily výroby</h3>
      <div id="infoSK"></div>
      <div id="infoFA"></div>
      <div id="infoZA"></div>
    </div>

    <!-- TABULKA S GRAFEM -->
    <div class="card">
        <div class="table-wrapper">
            <table id="grid"></table>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const dateEl = document.getElementById("date");
const shiftEl = document.getElementById("shift");
const nameFilterEl = document.getElementById("nameFilter");
const gridEl = document.getElementById("grid");
const shiftInfoBox = document.getElementById("shiftInfoBox");

dateEl.value = new Date().toISOString().slice(0,10);

const POSITIONS = ["DP-L","DP-P","ZRC-L","ZRC-P","T-L","T-P","AGR-LP","AGR-PP","AGR-PZ","AGR-LZ","MOT-L","MOT-P","LEP-LP","LEP-PP","LEP-Z","REPRO-L","REPRO-P","VYP1-L","VYP1-P","VYP2-L","VYP2-P","PR-L","PR-P","ZAM-L","ZAM-P","VET","VET2","INST","INST2","JINE","JINE2"];

let workerMap = {}; 
let phasesData = [];

async function loadWorkers(){
    const snap = await getDocs(collection(db, "employees"));
    workerMap = {};
    snap.forEach(d => {
        const e = d.data();
        // Spojíme jméno a příjmení, pokud existují samostatně
        workerMap[d.id] = (e.fName || e.name || "") + " " + (e.lName || "");
    });
}

function phaseLabels(){
    const s = shiftEl.value;
    if(s === "ranni") return ["6:00","8:00","10:45","12:00"];
    if(s === "odpo") return ["14:00","16:00","18:45","20:00"];
    return ["22:00","00:00","02:45","04:00"];
}

async function loadShift(){
    const id = dateEl.value + "_" + shiftEl.value;
    const snap = await getDoc(doc(db, "shifts", id));

    if(!snap.exists()){
        gridEl.innerHTML = "<tr><td style='padding:20px; opacity:0.5;'>Rozpis pro tento den nebyl nalezen.</td></tr>";
        shiftInfoBox.style.display = "none";
        return;
    }

    const data = snap.data();
    phasesData = data.phases || [];
    renderShiftInfo(data.info);
    render();
}

function render(){
    const filter = nameFilterEl.value.toLowerCase().trim();
    const labels = phaseLabels();
    let html = "<tr><th>Pozice</th>";
    labels.forEach(l => html += `<th>${l}</th>`);
    html += "</tr>";

    POSITIONS.forEach(pos => {
        let rowNames = [];
        for(let i=0; i<4; i++) {
            const wid = phasesData[i] ? phasesData[i][pos] : null;
            rowNames.push(wid ? workerMap[wid] || "???" : "");
        }

        if(filter && !rowNames.some(n => n.toLowerCase().includes(filter))) return;

        html += `<tr><td class="posCol">${pos}</td>`;
        rowNames.forEach(n => {
            if(!n) html += `<td class="empty">—</td>`;
            else if(filter && n.toLowerCase().includes(filter)) html += `<td class="highlight">${n}</td>`;
            else html += `<td>${n}</td>`;
        });
        html += "</tr>";
    });
    gridEl.innerHTML = html;
}

function renderShiftInfo(info){
    if(!info) { shiftInfoBox.style.display = "none"; return; }
    shiftInfoBox.style.display = "block";
    document.getElementById("infoSK").innerHTML = `<div class="infoRow">Scala/Kamiq <span>${info.sk?.start || "?"} → ${info.sk?.end || "?"}</span></div>`;
    document.getElementById("infoFA").innerHTML = `<div class="infoRow">Fabia <span>${info.fa?.start || "?"} → ${info.fa?.end || "?"}</span></div>`;
    document.getElementById("infoZA").innerHTML = `<div class="infoRow">Zásobník <span>${info.za?.start || "?"} → ${info.za?.end || "?"}</span></div>`;
}

dateEl.onchange = loadShift;
shiftEl.onchange = loadShift;
nameFilterEl.oninput = render;

// START
(async () => {
    await loadWorkers();
    await loadShift();
})();
</script>
</body>
</html>
