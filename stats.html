<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistiky</title>

<style>
body {
    margin: 0;
    padding: 0;
    /* Tyto 3 řádky smaž nebo nahraď tímto: */
    display: block; 
    min-height: 100vh;
    color: white;
    font-family: sans-serif;
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg');
    background-size: contain !important;
    background-position: center 10% !important;
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
    background-color: #030712 !important;
}

.topbar{
 height:56px;display:flex;align-items:center;justify-content:space-between;
 padding:0 16px;background:#020617;border-bottom:1px solid #1f2937;
}

.menuBtn{
 padding:8px 14px;border-radius:10px;border:none;font-weight:800;
 background:#334155;color:white;cursor:pointer;
}

.container{max-width:1000px;margin:auto;padding:16px;}
.card{background:#111827;border-radius:16px;padding:16px;margin-bottom:14px;}

input{
 width:100%;padding:12px;border-radius:10px;border:none;
 margin-bottom:14px;font-weight:700;
}

.worker{font-weight:900;font-size:18px;margin-bottom:10px;}

.row{display:flex;justify-content:space-between;margin:6px 0;font-weight:700;}

.badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:900;}
.active{background:#16a34a;}
.reserve{background:#2563eb;}
.absence{background:#dc2626;}

.barWrap{background:#020617;border-radius:10px;overflow:hidden;height:14px;margin-top:6px;}
.bar{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);}

.rankRow{
 display:flex;justify-content:space-between;padding:6px 0;
 font-weight:800;border-bottom:1px solid #1f2937;font-size:14px;
}

.posItem{font-size:13px;opacity:.9;}
.loading{text-align:center;opacity:.7;font-weight:900;}
body {
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg') !important;
    background-size: cover !important;
    background-position: center !important;
    background-attachment: fixed !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    min-height: 100vh !important;
}

.card, [class*="card"] {
    background: rgba(17, 24, 39, 0.5) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    box-shadow: none !important;
}

/* Vypne stín a ohraničení u vnitřních bloků */
.card .card, #menuCard, .menu {
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
}

.roleTag { color: #22c55e !important; font-weight: bold !important; }
body {
    display: block !important; 
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg') !important;
    background-size: cover !important;
    background-position: center !important;
    background-attachment: fixed !important;
}

/* 2. Zajištění, aby hlavní obsah byl uprostřed, ale menu nahoře */
.container, main, .app {
    margin: 20px auto !important;
    max-width: 420px;
}

/* 3. Průhlednost karet (aby bylo vidět logo Škoda) */
.card, [class*="card"] {
    background: rgba(17, 24, 39, 0.5) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
}
body {
    /* Fixní pozice zajistí, že se logo nehýbe při scrollování */
    background-attachment: fixed !important;
    
    /* Center zajistí vycentrování loga Škoda na střed */
    background-position: center center !important;
    
    /* Cover roztáhne logo tak, aby vyplnilo celý displej mobilu */
    background-size: cover !important;
    
    background-repeat: no-repeat !important;
    
    /* Zajištění, aby podklad pod logem byl tmavý */
    background-color: #030712 !important;
}

/* Oprava pro iOS Safari (iPhony), které mají s background-attachment: fixed občas problém */
@supports (-webkit-touch-callout: none) {
    body {
        background-attachment: scroll !important;
    }
}
body {
    /* 'contain' zajistí, že logo uvidíš vždy celé, nic se neořízne */
    background-size: contain !important;
    
    /* Posune logo do horní části (cca 10 % odshora), aby nebylo schované pod kartou */
    background-position: center 10% !important;
    
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
    background-color: #030712 !important; /* Tmavé pozadí vyplní zbytek displeje */
}

/* Speciální úprava pro mobily na výšku */
@media (max-width: 480px) {
    body {
        /* Na mobilu logo trochu zvětšíme, ale pořád se nesmí oříznout */
        background-size: 90% auto !important; 
        background-position: center 5% !important;
    }
}
table, thead, tbody, tr, th, td, ul, li, section, main {
    background: transparent !important;
    background-color: transparent !important;
    border-color: rgba(255, 255, 255, 0.1) !important; /* Jemné linky místo tlustých čar */
    box-shadow: none !important;
}

/* Pokud jsou v tabulkách bílé nebo šedé pruhy (zebra), vypneme je */
tr:nth-child(even), tr:nth-child(odd) {
    background: transparent !important;
}

/* Text v tabulkách musí zůstat čitelný */
td, th {
    color: white !important;
    padding: 10px 5px !important;
}
.card div, .card section, fieldset, .container > div {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

/* 2. ZPRŮHLEDNĚNÍ HORNÍ LIŠTY (TOPBAR) */
.topbar, header {
    background: rgba(0, 0, 0, 0.4) !important; /* Poloprůhledná černá */
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
}

/* 3. ÚPRAVA INPUTŮ (DATUM A SMĚNA) - Aby nebyly tak zářivě bílé */
input, select, textarea {
    background: rgba(255, 255, 255, 0.9) !important;
    border-radius: 8px !important;
    border: 1px solid #ccc !important;
    color: black !important; /* Text uvnitř musí být černý */
}

/* 4. ODSTRANĚNÍ DUPLICITNÍCH RÁMEČKŮ */
.card {
    margin-top: 20px !important;
}
/* --- FINÁLNÍ ČISTÝ VZHLED S OSTRÝM LOGEM --- */

/* 1. VYPNUTÍ ROZMAZÁNÍ A OSTRÉ POZADÍ */
.container, .card, main, .app, body {
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    box-shadow: none !important;
}

/* 2. ZPRŮHLEDNĚNÍ VŠECH VNITŘNÍCH BLOKŮ (Modré pruhy, šedé karty) */
/* Tohle vymaže pozadí u nadpisů a vnořených sekcí ze screenshotu */
.btn-info, 
.card-header, 
.card, 
fieldset, 
section, 
details, 
summary,
[style*="background-color"] {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

/* 3. JEDNA JEMNÁ VRSTVA PŘES LOGO (Pro čitelnost) */
.container, .app {
    background: rgba(0, 0, 0, 0.4) !important; /* Logo bude krásně vidět, ale text půjde přečíst */
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 20px;
    padding: 20px !important;
}

/* 4. ČITELNOST TEXTU (Bílý s výrazným stínem) */
label, p, span, summary, .btn-info, h1, h2, h3, .card-header {
    color: white !important;
    font-weight: 900 !important;
    text-shadow: 2px 2px 4px rgba(0,0,0,1) !important; /* Černý obrys kolem písma */
}

/* 5. INPUTY (Bílá políčka pro psaní) */
input, select {
    background: white !important;
    color: black !important;
    border-radius: 8px !important;
    border: none !important;
    padding: 10px !important;
}
</style>
</head>

<body>

<div class="topbar">
 <div><b>📊 Statistiky</b></div>
 <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">

<input id="filter" placeholder="🔎 Filtr podle jména…">

<div class="card"><h3>🚨 Největší absence</h3><div id="rankAbs"></div></div>



<div id="cards"><div class="loading">Počítám data…</div></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
  measurementId: "G-1HF3R93D92"
});

const db = getFirestore(app);

const cardsEl = document.getElementById("cards");
const filterEl = document.getElementById("filter");
const rankAbsEl = document.getElementById("rankAbs");


/* =======================
   LOAD
======================= */

const empSnap = await getDocs(collection(db,"employees"));
const shiftSnap = await getDocs(collection(db,"shifts"));

const empCurrentStatus = {};
const empNames = {};
const stats = {};
const posCount = {};

empSnap.forEach(d=>{
 const e=d.data();

 empCurrentStatus[d.id] = e.statusToday || "work";
 empNames[d.id] = e.name+" "+e.surname;

 stats[d.id] = {
  active:0,
  reserve:0,
  absence:0,
  pos:{}
 };
});

/* =======================
   HLAVNÍ VÝPOČET
======================= */

shiftSnap.forEach(docSnap=>{

 const shift = docSnap.data();
 const phases = shift.phases || [];
 const snapStatus = shift.statusSnapshot || {}; // ✅ snapshot dne

 // 🔷 LOANED = celá směna = všechny fáze
 Object.entries(snapStatus).forEach(([id,st])=>{
   if(st === "loaned" && stats[id]){
     stats[id].active += phases.length || 4;
   }
 });

 phases.forEach(phase=>{

   const used = new Set(Object.values(phase));

   /* ===== AKTIVNÍ ===== */

   Object.entries(phase).forEach(([pos,id])=>{

     if(!stats[id]) return;

     const st = snapStatus[id] || empCurrentStatus[id] || "work";

     if(st === "loaned") return; // už započteno za směnu

     // borrowed se počítá jen když JE na pozici → a to právě je
     stats[id].active++;

     stats[id].pos[pos] = (stats[id].pos[pos]||0)+1;
     posCount[pos] = (posCount[pos]||0)+1;
   });

   /* ===== MIMO POZICE ===== */

   Object.keys(stats).forEach(id=>{

     if(used.has(id)) return;

     const st = snapStatus[id] || empCurrentStatus[id] || "work";

     if(st === "loaned") return;
     if(st === "borrowed") return;

     // ❌ nemoc + paragraf = absence
if(st==="sick" || st==="paragraf"){
  stats[id].absence++;
}

// 🟡 dovolená = nepočítat vůbec nic
else if(st==="vacation"){
  // nic
}

// ✅ normální pracovní stavy = náhradník
else if(st==="work" || st==="shitmaking"){
  stats[id].reserve++;
}


   });

 });

});

/* =======================
   RANKINGS
======================= */

function top3(arr){
 return arr.sort((a,b)=>b.val-a.val).slice(0,3);
}

rankAbsEl.innerHTML="";


/* ABSENCE */

top3(
 Object.entries(stats)
  .filter(([id,s])=>s.absence>0)
  .map(([id,s])=>({
    name:empNames[id],
    val:s.absence
  }))
).forEach(x=>{
 rankAbsEl.innerHTML +=
   `<div class="rankRow">${x.name}<span>${x.val}</span></div>`;
});



/* =======================
   KARTY
======================= */

function render(){

 const f = filterEl.value.toLowerCase();
 cardsEl.innerHTML="";

 Object.entries(stats).forEach(([id,s])=>{

  const name = empNames[id];
  if(!name.toLowerCase().includes(f)) return;

  const total = s.active+s.reserve+s.absence;
  if(!total) return;

  const pct = Math.round((s.active/total)*100);

  const div=document.createElement("div");
  div.className="card";

  div.innerHTML=`
   <div class="worker">${name}</div>

   <div class="row">Aktivní<span class="badge active">${s.active}</span></div>
   <div class="row">Náhradník<span class="badge reserve">${s.reserve}</span></div>
   <div class="row">Absence<span class="badge absence">${s.absence}</span></div>

   <div class="barWrap">
     <div class="bar" style="width:${pct}%"></div>
   </div>

   <div style="margin-top:10px;font-weight:800;">
     Pozice — součet:
   </div>

   ${
     Object.entries(s.pos)
       .sort((a,b)=>b[1]-a[1])
       .map(([p,c])=>`<div class="posItem">${p} — ${c}×</div>`)
       .join("")
   }
  `;

  cardsEl.appendChild(div);

 });

}

filterEl.oninput = render;
render();

</script>
</body>
</html>
