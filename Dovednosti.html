<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dovednosti týmu</title>
    <!-- Použijeme tvůj styl pro písmo a základní prvky -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Vynucení tvého tmavého vzhledu */
        body {
            background-color: #000 !important;
            margin: 0;
            padding: 0;
            color: white;
        }

        /* Horní lišta přesně podle tvého index.html */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Hlavní karta - musí být široká jako tvůj Směnový graf */
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .skills-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            width: 95%;
            max-width: 800px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        /* Hledání */
        #skillSearch {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
        }

        /* Tabulka s daty */
        .skills-table {
            width: 100%;
            border-collapse: collapse;
        }

        .skills-table tr {
            border-bottom: 1px solid #222;
        }

        .skills-table td {
            padding: 15px 10px;
            vertical-align: middle;
        }

        .emp-name {
            font-weight: bold;
            color: #00ff88; /* Světle zelená pro jména */
            width: 35%;
        }

        /* Ty bubliny u operací */
        .badge {
            display: inline-block;
            background: #00c0a8; /* Tyrkysová */
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 3px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-back {
            background: #333;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <span style="font-size: 1.4rem;">🎓</span> Dovednosti týmu
        </div>
        <a href="index.html" class="btn-back">⬅ Zpět</a>
    </div>

    <div class="container">
        <div class="skills-card">
            <input type="text" id="skillSearch" placeholder="Hledat jméno nebo operaci..." onkeyup="filterSkills()">
            
            <div id="loading" style="text-align: center; color: #888; padding: 40px;">
                ⌛ Načítám data z databáze...
            </div>

            <table class="skills-table" id="skillsTable" style="display: none;">
                <tbody id="skillsTableBody">
                    <!-- Tady se objeví zaměstnanci -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com";

        // Tvoje Firebase konfigurace
        const firebaseConfig = {
            apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
            authDomain: "generator-smen-9fba1.firebaseapp.com",
            projectId: "generator-smen-9fba1",
            storageBucket: "generator-smen-9fba1.firebasestorage.app",
            messagingSenderId: "541779211883",
            appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Kontrola přihlášení
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                startLoading();
            }
        });

        function startLoading() {
            const tableBody = document.getElementById("skillsTableBody");
            const loading = document.getElementById("loading");
            const table = document.getElementById("skillsTable");

            // Napojení na Firebase kolekci 'employees'
            onSnapshot(collection(db, "employees"), (snapshot) => {
                let html = "";
                
                // Seřazení podle příjmení (s ochranou proti undefined)
                const sortedDocs = [...snapshot.docs].sort((a, b) => {
                    const sA = (a.data().surname || "").toLowerCase();
                    const sB = (b.data().surname || "").toLowerCase();
                    return sA.localeCompare(sB);
                });

                sortedDocs.forEach(docSnap => {
                    const emp = docSnap.data();
                    const skills = emp.skills || [];
                    const fullName = `${emp.name || ""} ${emp.surname || ""}`.trim();
                    
                    // Pokud má zaměstnanec jméno, vykresli ho
                    if (fullName) {
                        const skillsHtml = skills.map(s => `<span class="badge">${s}</span>`).join("");
                        html += `
                            <tr class="skill-row">
                                <td class="emp-name">${fullName}</td>
                                <td>${skillsHtml || '<i style="color:#444; font-size:0.8rem;">Nemá přiřazené operace</i>'}</td>
                            </tr>
                        `;
                    }
                });

                tableBody.innerHTML = html;
                loading.style.display = "none";
                table.style.display = "table";
            });
        }

        // Vyhledávání v tabulce
        window.filterSkills = () => {
            const filter = document.getElementById("skillSearch").value.toLowerCase();
            document.querySelectorAll(".skill-row").forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? "" : "none";
            });
        };
    </script>
</body>
</html>
