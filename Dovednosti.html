<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dovednosti týmu</title>

<style>
    /* IMPORT MODERNÍHO PÍSMA */
    @import url('https://fonts.googleapis.com');

    * {
        box-sizing: border-box;
        max-width: 100%;
    }

    html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #020617 !important;
    background: radial-gradient(circle at 50% 25%, #064e3b 0%, #020617 85%) !important;
    background-attachment: fixed !important;
}

    .background-logo {
        position: fixed;
        top: 25%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: -1;
        text-align: center;
        pointer-events: none;
    }

    .background-logo img {
    /* Šířka a pozice */
    width: 650px !important; /* Velikost odpovídající hlavní stránce */
    max-width: 90vw !important;
    
    /* KLÍČOVÉ ŘÁDKY PRO STŘÍBRNÝ EFEKT */
    mix-blend-mode: screen; /* Odstraní černé pozadí */
    filter: grayscale(100%) brightness(1.1) contrast(1.1) !important; /* Udělá logo stříbrné */
    opacity: 0.4 !important; /* Jemná viditelnost jako u indexu */
    
    /* Vymazání okrajů do ztracena (necháváme tvoji masku) */
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
}
.background-logo h1 {
    font-size: 16vw !important;
    margin-top: -30px !important;
    letter-spacing: 25px !important;
    /* Nápis taky necháme ostrý bez blur */
    filter: none !important;
    color: #1a3a2a !important;
    opacity: 0.5 !important;
    text-shadow: 0 0 15px rgba(0,0,0,0.8) !important;
}

    .topbar {
        width: 100% !important;
        height: 60px;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        padding: 0 20px !important;
        background: transparent !important;
        position: sticky;
        top: 0;
        z-index: 1000;
        color: white !important; /* TOTO PŘIDEJ PRO BÍLÝ TEXT */
    }

    .menuBtn { 
        padding: 8px 14px; 
        border-radius: 10px; 
        border: none; 
        font-weight: 800; 
        background: rgba(51, 65, 85, 0.8); 
        color: white; 
        cursor: pointer; 
    }

    .container {
        padding: 15px; 
        display: flex; 
        flex-direction: column; 
        align-items: center;
    }

    .skills-card {
        width: 100% !important;
        max-width: 600px !important;
        background: transparent !important;
        border: none !important;
        padding: 20px 10px !important;
        margin: 10px auto !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
    }

    /* ZMĚNA: Moderní vyhledávání na střed a šířku */
    #skillSearch {
        width: 95% !important; /* Šířka na mobilu */
        max-width: 450px !important; /* Šířka na PC */
        display: block !important;
        margin: 0 auto 20px auto !important; /* Zarovnání na střed */
        background: rgba(255, 255, 255, 0.08) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        padding: 14px 20px !important;
        border-radius: 30px !important; /* Kulatý moderní tvar */
        text-align: center;
        color: white !important;
        font-size: 16px !important;
        font-family: 'Inter', sans-serif !important;
        outline: none !important;
        transition: all 0.3s ease;
    }

    #skillSearch:focus {
        background: rgba(255, 255, 255, 0.12) !important;
        border: 1px solid #00ff88 !important; /* Zelený svit při psaní */
        box-shadow: 0 0 15px rgba(0, 255, 136, 0.2) !important;
    }

    #skillSearch::placeholder {
        color: rgba(255, 255, 255, 0.5) !important;
    }

    #loading {
        margin-top: 20px !important;
        font-size: 14px !important;
        opacity: 0.6 !important;
        text-align: center;
    }

    .skills-table { width: 100%; border-collapse: collapse; }
    .skill-row { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .skill-row td { padding: 15px 5px; vertical-align: middle; }
    
    .emp-name { 
        color: #38bdf8; 
        font-weight: 800; 
        font-size: 14px; 
        font-family: 'Inter', sans-serif !important;
    }
    
    .badge {
        display: inline-block;
        background: rgba(34, 197, 94, 0.25);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: #afffcf;
        padding: 4px 12px; 
        border-radius: 12px; 
        font-size: 11px; 
        margin: 2px;
        font-weight: 600;
        font-family: 'Inter', sans-serif !important;
    }

    .disclaimer {
        margin-top: 30px; 
        padding: 10px; 
        font-size: 9px;
        color: rgba(255, 255, 255, 0.3); 
        text-align: center;
    }
</style>
</head>
<body>

<div class="background-logo">
    <img src="pozadi.jpg" alt="Logo">
</div>

<div class="topbar">
    <span style="font-size: 22px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5);"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg> Dovednosti</span>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">
    <div class="skills-card">
       <input type="text" id="skillSearch" placeholder="Hledat jméno nebo operaci" oninput="searchSkills()">
        
        <div id="loading">⌛ Načítám tým...</div>

        <table class="skills-table" id="skillsTable" style="display: none;">
            <tbody id="skillsTableBody"></tbody>
        </table>
    </div>

    <div class="disclaimer">
        © 2024 ShiftMaster | Neoficiální nástroj. Logo ŠKODA je majetkem ŠKODA AUTO a.s.
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

   const firebaseConfig = {
        apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
        authDomain: "generator-smen-9fba1.firebaseapp.com",
        projectId: "generator-smen-9fba1",
        storageBucket: "generator-smen-9fba1.firebasestorage.app",
        messagingSenderId: "541779211883",
        appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let allEmployees = []; // Cache pro bleskové vyhledávání v paměti mobilu

    onAuthStateChanged(auth, async (user) => {
        const loading = document.getElementById("loading");
        if (!user) {
            window.location.href = "index.html";
        } else {
            try {
                // Stažení dat proběhne jen JEDNOU při startu
                const snap = await getDocs(collection(db, "employees"));
                allEmployees = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // OKAMŽITÉ ZOBRAZENÍ: Vykreslíme všechny hned po stažení
                renderSkills(""); 
                loading.style.display = "none";
            } catch (e) {
                console.error(e);
                loading.innerText = "Chyba při načítání dat. Zkuste to znovu.";
            }
        }
    });

    // Univerzální vykreslovací a filtrovací funkce
    function renderSkills(queryText) {
        const tableBody = document.getElementById("skillsTableBody");
        const table = document.getElementById("skillsTable");
        const loading = document.getElementById("loading");

        // Filtrujeme cache v paměti
        const filtered = allEmployees.filter(emp => {
            if (!queryText) return true; // Pokud nic nepíšeme, projdou všichni
            const name = `${emp.name || ""} ${emp.surname || ""}`.toLowerCase();
            const skills = (emp.skills || []).join(" ").toLowerCase();
            return name.includes(queryText) || skills.includes(queryText);
        });

        if (filtered.length > 0) {
            // Seřazení výsledků podle příjmení (A-Z)
            filtered.sort((a, b) => (a.surname || "").localeCompare(b.surname || ""));
            
            let html = "";
            filtered.forEach(emp => {
                const fullName = `${emp.name || ""} ${emp.surname || ""}`.trim();
                const skillsHtml = (emp.skills || []).map(s => `<span class="badge">${s}</span>`).join("");
                html += `
                    <tr class="skill-row">
                        <td class="emp-name">${fullName}</td>
                        <td>${skillsHtml || '<i style="color:rgba(255,255,255,0.2);font-size:10px;">Bez operací</i>'}</td>
                    </tr>`;
            });
            
            tableBody.innerHTML = html;
            table.style.display = "table";
            loading.style.display = "none";
        } else {
            table.style.display = "none";
            loading.style.display = "block";
            loading.innerText = "Žádná shoda nenalezena.";
        }
    }

    // Vyhledávací funkce napojená na vstupní pole
    window.searchSkills = () => {
        const queryText = document.getElementById("skillSearch").value.toLowerCase().trim();
        renderSkills(queryText);
    };
</script>

</body>
</html>
