<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dovednosti týmu</title>

<style>
      * {
            box-sizing: border-box;
            max-width: 100%;
        }

        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
        width: 100%; margin: 0; padding: 0; overflow-x: hidden;
        background: radial-gradient(circle at center, #062111 0%, #000000 100%) !important;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        color: white; min-height: 100vh;
    }

    /* Zapuštěné logo na pozadí */
    .background-logo {
        position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
        z-index: -1; text-align: center; pointer-events: none;
    }
    .background-logo img {
        width: 650px !important; max-width: 90vw !important;
        opacity: 0.12 !important;
        filter: brightness(0.6) sepia(1) hue-rotate(85deg) saturate(2.5) blur(1px) !important;
    }

    /* 2. TOPBAR */
    .topbar {
        width: 100%; height: 60px; display: flex; align-items: center;
        justify-content: space-between; padding: 0 20px;
        position: sticky; top: 0; z-index: 1000;
        background: transparent;
    }
    .topTitle {
        font-size: 22px; font-weight: 800;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .menuBtn { 
        padding: 8px 14px; border-radius: 10px; border: none; 
        font-weight: 800; background: rgba(51, 65, 85, 0.8); 
        color: white; cursor: pointer; 
    }

    /* 3. OBSAH - SKLENĚNÁ KARTA */
    .container {
        padding: 15px; display: flex; flex-direction: column; align-items: center;
    }
   .skills-card {
    width: 90% !important;
    max-width: 500px !important; /* Užší karta vypadá víc jako tvůj vzor */
    background: rgba(255, 255, 255, 0.05) !important; /* Velmi jemné prosvítání */
    border-radius: 25px !important;
    padding: 30px 20px !important; /* Více místa nahoře a dole */
    margin: 20px auto !important;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4) !important;
    backdrop-filter: none !important; /* Ostré pozadí podle tvého přání */
}

/* 2. TEXTY - posuneme je dál od vyhledávání */
#loading {
    margin-top: 25px !important;
    font-size: 14px !important;
    opacity: 0.6 !important;
    letter-spacing: 0.5px !important;
}

/* 3. VYHLEDÁVÁNÍ - víc "skleněný" vzhled */
#skillSearch {
    background: rgba(0, 0, 0, 0.2) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    padding: 15px 20px !important;
    border-radius: 30px !important;
    text-align: center; /* Text uprostřed jako na tvém vzoru */
}

    .skills-table { width: 100%; border-collapse: collapse; }
    .skill-row { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .skill-row td { padding: 12px 5px; vertical-align: middle; }
    
    /* Jména světle modrá jako v Chatu */
    .emp-name { color: #38bdf8; font-weight: 800; font-size: 14px; }
    
    /* Bubliny operací - zelené sklo */
    .badge {
        display: inline-block;
        background: rgba(34, 197, 94, 0.25);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: #afffcf;
        padding: 3px 10px; border-radius: 12px; font-size: 11px; margin: 2px;
        font-weight: 600;
    }

    .disclaimer {
        margin-top: 30px; padding: 10px; font-size: 9px;
        color: rgba(255, 255, 255, 0.3); text-align: center;
    }
</style>
</head>
<body>

<div class="background-logo">
    <img src="pozadi.jpg" alt="Logo">
</div>

<div class="topbar">
    <span class="topTitle">🎓 Dovednosti</span>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">
    <div class="skills-card">
       <input type="text" id="skillSearch" placeholder="Hledat jméno nebo operaci (min. 2 znaky)..." oninput="searchSkills()">
        
        <div id="loading" style="text-align: center; opacity: 0.5; padding: 20px;">⌛ Načítám tým...</div>

        <table class="skills-table" id="skillsTable" style="display: none;">
            <tbody id="skillsTableBody"></tbody>
        </table>
    </div>

    <div class="disclaimer">
        © 2024 ShiftMaster | Neoficiální nástroj. Logo ŠKODA je majetkem ŠKODA AUTO a.s.
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
        authDomain: "generator-smen-9fba1.firebaseapp.com",
        projectId: "generator-smen-9fba1",
        storageBucket: "generator-smen-9fba1.firebasestorage.app",
        messagingSenderId: "541779211883",
        appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let allEmployees = []; // Cache pro bleskové vyhledávání v paměti mobilu

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "index.html";
        } else {
            const loading = document.getElementById("loading");
            try {
                // Stažení dat proběhne jen JEDNOU při startu
                const snap = await getDocs(collection(db, "employees"));
                allEmployees = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Po stažení dat změníme nápis pro uživatele
                loading.innerText = "Zadejte jméno nebo operaci (min. 2 znaky)...";
            } catch (e) {
                console.error(e);
                loading.innerText = "Chyba při načítání dat. Zkuste to znovu.";
            }
        }
    });

    // Nová blesková vyhledávací funkce
    window.searchSkills = () => {
        const queryText = document.getElementById("skillSearch").value.toLowerCase().trim();
        const tableBody = document.getElementById("skillsTableBody");
        const loading = document.getElementById("loading");
        const table = document.getElementById("skillsTable");

        // Pokud uživatel nic nepíše (nebo jen 1 písmeno), tabulku schováme a mobil si oddechne
        if (queryText.length < 2) {
            table.style.display = "none";
            loading.style.display = "block";
            loading.innerText = "Zadejte alespoň 2 znaky...";
            return;
        }

        // Filtrujeme už stažená data v paměti (to je i na mobilu bleskové)
        const filtered = allEmployees.filter(emp => {
            const name = `${emp.name || ""} ${emp.surname || ""}`.toLowerCase();
            const skills = (emp.skills || []).join(" ").toLowerCase();
            return name.includes(queryText) || skills.includes(queryText);
        });

        if (filtered.length > 0) {
            let html = "";
            // Seřazení výsledků podle příjmení
            filtered.sort((a, b) => (a.surname || "").localeCompare(b.surname || ""));
            
            filtered.forEach(emp => {
                const fullName = `${emp.name || ""} ${emp.surname || ""}`.trim();
                const skillsHtml = (emp.skills || []).map(s => `<span class="badge">${s}</span>`).join("");
                html += `
                    <tr class="skill-row">
                        <td class="emp-name">${fullName}</td>
                        <td>${skillsHtml || '<i style="color:rgba(255,255,255,0.2);font-size:10px;">Bez operací</i>'}</td>
                    </tr>`;
            });
            
            tableBody.innerHTML = html;
            loading.style.display = "none";
            table.style.display = "table";
        } else {
            table.style.display = "none";
            loading.style.display = "block";
            loading.innerText = "Žádná shoda nenalezena.";
        }
    };
</script>

</body>
</html>
