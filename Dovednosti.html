<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dovednosti týmu</title>
    <!-- Použijeme tvůj hlavní styl, aby to vypadalo stejně -->
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* Oprava pozadí a rozvržení přímo pro tento soubor */
        body {
            background-color: #000 !important;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-bar {
            width: 100%;
            background: #111;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            box-sizing: border-box;
        }

        .logo-area {
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Styl karty, aby vypadala jako ty ostatní */
        .content-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #skillSearch {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .skills-table {
            width: 100%;
            border-collapse: collapse;
        }

        .skills-table td {
            padding: 12px 5px;
            border-bottom: 1px solid #222;
            color: #eee;
        }

        .skill-badge {
            display: inline-block;
            background: #00c0a8; /* Ta tyrkysová barva, co jsme vybrali */
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            margin: 2px;
        }

        .btn-back {
            background: #333;
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <!-- Horní lišta -->
    <div class="header-bar">
        <div class="logo-area">
            <span style="font-size: 1.5em;">🍏</span> Dovednosti týmu
        </div>
        <a href="index.html" class="btn-back">⬅ Zpět</a>
    </div>

    <!-- Hlavní karta -->
    <div class="content-card">
        <input type="text" id="skillSearch" placeholder="Hledat jméno nebo operaci..." onkeyup="filterSkills()">
        
        <div id="loading" style="text-align: center; color: #666; padding: 20px;">
            Načítám data z databáze...
        </div>

        <table class="skills-table" id="skillsTable" style="display: none;">
            <tbody id="skillsTableBody">
                <!-- Data doplní JS -->
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
            authDomain: "generator-smen-9fba1.firebaseapp.com",
            projectId: "generator-smen-9fba1",
            storageBucket: "generator-smen-9fba1.firebasestorage.app",
            messagingSenderId: "541779211883",
            appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "index.html";
            else loadData();
        });

        function loadData() {
            const tableBody = document.getElementById("skillsTableBody");
            const loading = document.getElementById("loading");
            const table = document.getElementById("skillsTable");

            onSnapshot(collection(db, "employees"), (snapshot) => {
                let html = "";
                
                // Seřazení podle příjmení (s ochranou proti undefined)
                const sortedDocs = [...snapshot.docs].sort((a, b) => {
                    const sA = (a.data().surname || "").toLowerCase();
                    const sB = (b.data().surname || "").toLowerCase();
                    return sA.localeCompare(sB);
                });

                sortedDocs.forEach(docSnap => {
                    const emp = docSnap.data();
                    const skills = emp.skills || [];
                    const fullName = `${emp.name || ""} ${emp.surname || ""}`.trim() || "Neznámý";
                    const skillsHtml = skills.map(s => `<span class="skill-badge">${s}</span>`).join("");

                    html += `
                        <tr class="skill-row">
                            <td style="width: 40%;"><b>${fullName}</b></td>
                            <td>${skillsHtml || '<i style="color:#444;">Žádné operace</i>'}</td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = html;
                loading.style.display = "none";
                table.style.display = "table";
            });
        }

        window.filterSkills = () => {
            const filter = document.getElementById("skillSearch").value.toLowerCase();
            document.querySelectorAll(".skill-row").forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(filter) ? "" : "none";
            });
        };
    </script>
</body>
</html>
