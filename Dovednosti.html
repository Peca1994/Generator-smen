<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dovednosti týmu</title>

<style>
    /* 1. GLOBÁLNÍ STYL (Identický s Chatem) */
    * { box-sizing: border-box; max-width: 100%; }
    html, body {
        width: 100%; margin: 0; padding: 0; overflow-x: hidden;
        background: radial-gradient(circle at center, #062111 0%, #000000 100%) !important;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        color: white; min-height: 100vh;
    }

    /* Zapuštěné logo na pozadí */
    .background-logo {
        position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
        z-index: -1; text-align: center; pointer-events: none;
    }
    .background-logo img {
        width: 650px !important; max-width: 90vw !important;
        opacity: 0.12 !important;
        filter: brightness(0.6) sepia(1) hue-rotate(85deg) saturate(2.5) blur(1px) !important;
    }

    /* 2. TOPBAR */
    .topbar {
        width: 100%; height: 60px; display: flex; align-items: center;
        justify-content: space-between; padding: 0 20px;
        position: sticky; top: 0; z-index: 1000;
        background: transparent;
    }
    .topTitle {
        font-size: 22px; font-weight: 800;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .menuBtn { 
        padding: 8px 14px; border-radius: 10px; border: none; 
        font-weight: 800; background: rgba(51, 65, 85, 0.8); 
        color: white; cursor: pointer; 
    }

    /* 3. OBSAH - SKLENĚNÁ KARTA */
    .container {
        padding: 15px; display: flex; flex-direction: column; align-items: center;
    }
    .skills-card {
        width: 100%; max-width: 600px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        margin-top: 10px;
    }

    #skillSearch {
        width: 100%; padding: 12px 15px;
        background: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        color: white !important;
        border-radius: 25px; font-size: 16px; margin-bottom: 20px; outline: none;
    }

    .skills-table { width: 100%; border-collapse: collapse; }
    .skill-row { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .skill-row td { padding: 12px 5px; vertical-align: middle; }
    
    /* Jména světle modrá jako v Chatu */
    .emp-name { color: #38bdf8; font-weight: 800; font-size: 14px; }
    
    /* Bubliny operací - zelené sklo */
    .badge {
        display: inline-block;
        background: rgba(34, 197, 94, 0.25);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: #afffcf;
        padding: 3px 10px; border-radius: 12px; font-size: 11px; margin: 2px;
        font-weight: 600;
    }

    .disclaimer {
        margin-top: 30px; padding: 10px; font-size: 9px;
        color: rgba(255, 255, 255, 0.3); text-align: center;
    }
</style>
</head>
<body>

<div class="background-logo">
    <img src="pozadi.jpg" alt="Logo">
</div>

<div class="topbar">
    <span class="topTitle">🎓 Dovednosti</span>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">
    <div class="skills-card">
        <input type="text" id="skillSearch" placeholder="Hledat jméno nebo operaci..." onkeyup="filterSkills()">
        
        <div id="loading" style="text-align: center; opacity: 0.5; padding: 20px;">⌛ Načítám tým...</div>

        <table class="skills-table" id="skillsTable" style="display: none;">
            <tbody id="skillsTableBody"></tbody>
        </table>
    </div>

    <div class="disclaimer">
        © 2024 ShiftMaster | Neoficiální nástroj. Logo ŠKODA je majetkem ŠKODA AUTO a.s.
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import { 
    getFirestore, 
    collection, 
    addDoc, 
    query,       // TATO FUNKCE TI CHYBĚLA
    orderBy, 
    onSnapshot, 
    getDocs, 
    where,       // TATO TAKÉ
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
        authDomain: "generator-smen-9fba1.firebaseapp.com",
        projectId: "generator-smen-9fba1",
        storageBucket: "generator-smen-9fba1.firebasestorage.app",
        messagingSenderId: "541779211883",
        appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "index.html";
        else startLoading();
    });

    function startLoading() {
        const tableBody = document.getElementById("skillsTableBody");
        const loading = document.getElementById("loading");
        const table = document.getElementById("skillsTable");

        onSnapshot(collection(db, "employees"), (snapshot) => {
            let html = "";
            const sortedDocs = [...snapshot.docs].sort((a, b) => {
                const sA = (a.data().surname || "").toLowerCase();
                const sB = (b.data().surname || "").toLowerCase();
                return sA.localeCompare(sB);
            });

            sortedDocs.forEach(docSnap => {
                const emp = docSnap.data();
                const fullName = `${emp.name || ""} ${emp.surname || ""}`.trim();
                if (fullName) {
                    const skillsHtml = (emp.skills || []).map(s => `<span class="badge">${s}</span>`).join("");
                    html += `
                        <tr class="skill-row">
                            <td class="emp-name">${fullName}</td>
                            <td>${skillsHtml || '<i style="color:rgba(255,255,255,0.2);font-size:10px;">Bez operací</i>'}</td>
                        </tr>`;
                }
            });

            tableBody.innerHTML = html;
            loading.style.display = "none";
            table.style.display = "table";
        });
    }

    window.filterSkills = () => {
        const filter = document.getElementById("skillSearch").value.toLowerCase();
        document.querySelectorAll(".skill-row").forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(filter) ? "" : "none";
        });
    };
</script>

</body>
</html>
