<style>
#grid td:first-child, .posCol {
    width: 140px !important;       
    text-align: left !important;
    padding-left: 10px !important;
    font-size: 11px !important;
    font-weight: 900 !important;
    white-space: nowrap !important;
    color: #4CAF50 !important; /* Výchozí zelená pro text */
}

/* 2. LOGIKA PRO ZAMČENÉ ŘÁDKY (ČERVENÁ) */
/* Pokud SVG ikona zámku obsahuje žlutou barvu (#f1c40f), přebarvíme celý text v buňce na červenou */
#grid td:first-child:has(svg[stroke="#f1c40f"]),
#grid td:first-child:has(svg[stroke="#f1c40f"]) span {
    color: #ff4d4d !important;
}

/* 3. OSTATNÍ SLOUPCE (JMÉNA) */
#grid td:not(:first-child) {
    width: auto !important;
    text-align: center !important;
    font-size: 10px !important;
    color: white !important;
    text-transform: lowercase !important;
}

#grid td:not(:first-child)::first-letter {
    text-transform: uppercase !important;
}

/* 4. VÝŠKA ŘÁDKŮ A ČISTOTA */
#grid tr, #grid td {
    height: 18px !important;        
    line-height: 18px !important;
    padding: 0 !important;
    border-bottom: 1px solid rgba(255,255,255,0.05) !important;
}

/* Zajištění, aby span uvnitř buňky poslechl barvu, kterou mu nastavíme výše */
#grid td span {
    display: inline !important;
    font-size: 10px !important;
    color: inherit !important; /* Přebírá barvu od rodičovské buňky */
}

/* 5. FIX PRO VNITŘNÍ PRVKY */
#grid td button, #grid td span {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    font-size: inherit !important;
    text-transform: inherit !important;
}

/* Skrytí tlačítek, pokud nejsou určena pro jména */
#grid button:not([class*="name"]) {
    display: none !important; 
}
    /* IMPORT MODERNÍHO PÍSMA */
    @import url('https://fonts.googleapis.com');

    * {
        box-sizing: border-box;
        max-width: 100%;
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
    
    }

    html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    body {
    margin: 0;
    padding: 0;

    background: radial-gradient(circle at 50% 25%, #064e3b 0%, #020617 85%) !important;
    background-attachment: fixed !important;
}

    .background-logo {
        position: fixed;
        top: 25%;
        left: 50%;
        transform: translate(-50%, -50%);

    }

    .background-logo img {
    /* Šířka a pozice */
    width: 650px !important; /* Velikost odpovídající hlavní stránce */
    max-width: 90vw !important;
    
    /* KLÍČOVÉ ŘÁDKY PRO STŘÍBRNÝ EFEKT */

    filter: grayscale(100%) brightness(1.1) contrast(1.1) !important; /* Udělá logo stříbrné */
    opacity: 0.4 !important; /* Jemná viditelnost jako u indexu */
    
    /* Vymazání okrajů do ztracena (necháváme tvoji masku) */
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);

}
.background-logo h1 {
    font-size: 16vw !important;
    margin-top: -30px !important;

    text-shadow: 0 0 15px rgba(0,0,0,0.8) !important;
}

    .topbar {

        height: 60px;

        align-items: center !important;

        padding: 0 20px !important;

        top: 0;
        z-index: 1000;
        color: white !important; /* TOTO PŘIDEJ PRO BÍLÝ TEXT */
    }

.topTitle {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif !important;
    font-size: 24px !important;
    font-weight: 900 !important;

    padding-left: 10px;
    display: flex !important;
    align-items: center !important;
    gap: 14px !important;

}

.menuBtn {

    border-radius: 10px; 
    border: none;

/* 3. HLAVNÍ KONTEJNER (BEZ OHRANIČENÍ A BLURU) */
.container, .app, .main {

}

/* 4. PRŮHLEDNOST VŠECH VNITŘNÍCH BOXŮ (Karty, Tabulky, Detaily) */
.card, fieldset, section, details, summary, table, tr, td, th, .modalBox, .resBox {

    border: none !important; box-shadow: none !important; color: white !important;
}

/* 5. ČITELNOST TEXTU (STÍN PRO OSTRÉ LOGO) */
label, p, span, summary, .worker, .row, h1, h2, h3, th, td, .lockCode, .lockName {

}

/* 6. FORMULÁŘE A TLAČÍTKA */
input, select {

    padding: 14px !important;

}

/* Aby texty "Datum" a "Směna" (labely) byly tučné */
label {

    font-size: 14px;

    margin-bottom: 8px;

}
button {

    border: none !important; font-weight: 800; cursor: pointer; margin-top: 10px;

.topbar button {

}
.genBtn, .btn-warning { background: #f59e0b !important; }
.saveBtn, .btn-success { background: #22c55e !important; }
.loadBtn, .pickBtn, .btn-primary { background: #2563eb !important; color: white !important; }

.lockList {

    gap: 10px;

}

.lockRow {

    align-items: center;

    text-transform: uppercase;

    font-size: 11px !important;

}

/* VZHLED PŘI VYŘAZENÍ (Červená jako alarm v docházce) */
.lockRow:has(input:checked) {
    background: rgba(239, 68, 68, 0.08) !important;
    border: 1px solid rgba(239, 68, 68, 0.6) !important;
    color: #ef4444 !important; /* Neonově červená */
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.15);
}

/* Efekt při najetí myší */
.lockRow:hover {
    transform: translateY(-1px);
    background: rgba(255, 255, 255, 0.1) !important;
}


.modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modalBox { border: 1px solid rgba(255,255,255,0.2) !important; background: #020617 !important; padding: 20px; border-radius: 20px; }

/* PosCol a Table Borders */
th, td { border-bottom: 1px solid rgba(255,255,255,0.1) !important; padding: 8px; }
.posCol { text-align: left; font-weight: 800; }
.disclaimer {
    position: relative; /* Změna z fixed na relative, aby netvořil prázdné místo pod sebou */
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.3); /* Decentní šedá */

    font-family: sans-serif;
    line-height: 1.3;
    width: 100%;
    box-sizing: border-box;
}
@media (max-width: 480px) {
    .disclaimer {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
        width: 90%;
        max-width: none;
    }
}
@media screen and (max-width: 480px) {
    /* 1. Kontejner - beze změny */
    .container, .app, .main {
        width: 100% !important;
        max-width: 100% !important;
        padding: 2px !important;
        margin: 5px 0 !important;
        overflow-x: hidden !important;
    }

    /* 2. Tabulka - přidáme reset pro kolize */
    #grid, table {
        width: 100% !important;
        min-width: 100% !important;
        table-layout: fixed !important;
        border-spacing: 2px !important; /* Přidána malá mezera mezi buňkami */
        border-collapse: separate !important; /* Důležité pro mezery */
    }

    /* 3. První sloupec (Pozice) - OPRAVA VÝŠKY A POZADÍ */
    tbody td:first-child, thead th:first-child {
        width: 45px !important; /* Trochu užší, ať zbyde místo na jména */
        padding: 0 !important; /* Vymažeme padding td */
        font-size: 9px !important;
        background: transparent !important;
        vertical-align: middle !important;
    }

    /* Vnitřní div/span v prvním sloupci - musí vypadat jako ostatní */
    tbody td:first-child div, 
    tbody td:first-child span,
    .posCol {
        display: flex !important;
        align-items: center;
        justify-content: center;
        height: 100% !important;
        min-height: 28px !important; /* Sjednocení minimální výšky */
        background: rgba(255, 255, 255, 0.05) !important; /* Jemné pozadí, aby nebylo průhledné */
        border-radius: 6px !important;
        margin: 2px 0 !important;
    }

    /* 4. Ostatní buňky - sjednocení */
    tbody td, thead th {
        padding: 0 !important; /* Reset paddingu buňky */
        font-size: 8px !important;
        vertical-align: middle !important;
    }

    /* 5. Bubliny se jmény - OPRAVA PŘETÉKÁNÍ */
    tbody td span {
        display: flex !important; /* Flex pro lepší centrování textu */
        align-items: center;
        justify-content: center;
        width: calc(100% - 4px) !important; /* Malá rezerva, aby se nedotýkaly */
        margin: 2px auto !important;
        min-height: 28px !important; /* Stejná výška jako u prvního sloupce */
        padding: 2px !important;
        font-size: 9px !important;
        border-radius: 6px !important;
        box-sizing: border-box !important; /* Klíčové pro šířku */
    }

    /* Ikona zámku */
    .posCol div {
        width: 18px !important;
        height: 18px !important;
        margin-right: 2px !important;
    }
    .posCol svg { width: 14px; height: 14px; }

    /* 4. Sloupce s časy a jmény - Extrémní zmenšení */
    tbody td, thead th {
        padding: 5px 1px !important;
        font-size: 8px !important; /* Opravdu malé písmo */
    }

    /* 5. Bubliny se jmény - Musí být úzké a nízké */
    tbody td span {
        min-width: 100% !important; /* Roztáhne se na šířku sloupce */
        padding: 4px 2px !important;
        font-size: 9px !important; /* Písmo jmen */
        border-radius: 6px !important; /* Menší zaoblení */
        letter-spacing: -0.2px; /* Sražené písmo */
        display: block !important;
    }

    /* Časy v hlavičce (06:00-08:00) */
    thead th {
        font-size: 8px !important;
        line-height: 1;
    }
}

async function loadWorkers() {
  const container = document.getElementById("attendanceList");
  if (!container) return;

  return new Promise((resolve) => {
    let firstLoad = true;

    onSnapshot(collection(db, "employees"), (snap) => {
      // --- OPRAVA 1: Přísnější kontrola historie ---
      // Pokud existuje snapshot, ale chceme pracovat s aktuálními daty, musíme ho umět ignorovat
      const isViewingHistory = typeof currentShiftSnapshot !== 'undefined' && 
                               currentShiftSnapshot && 
                               Object.keys(currentShiftSnapshot).length > 0;

      let moje = [];
      let pujcene = [];
      let temporaryWorkers = [];
      
      allWorkersMap = {}; 

      snap.forEach(d => {
        const e = d.data();
        // Sjednocení statusu (bereme 'work' i 'v práci')
        let st = (e.statusToday || e.status || "v práci").toString().toLowerCase().trim();
        
        const workerObj = { 
          id: d.id.trim(), 
          name: e.name, 
          surname: e.surname || "", 
          type: e.type || "kmenovy",
          skills: e.skills || {}, 
          status: st 
        };

        allWorkersMap[d.id.trim()] = workerObj; 
        temporaryWorkers.push(workerObj);

        if (e.type === "pujceny") {
          pujcene.push(workerObj);
        } else {
          moje.push(workerObj);
        }
      });

      // --- OPRAVA 2: Vždy aktualizujeme workers, pokud zrovna nekoukáme na STAROU uloženou směnu ---
      workers = temporaryWorkers; 

      const sortFn = (a, b) => (a.surname || "").localeCompare(b.surname || "", 'cs');
      moje.sort(sortFn); 
      pujcene.sort(sortFn);
      
      let html = "";
      html += `<div style="color:#22c55e; font-size:10px; font-weight:900; margin:15px 0 8px 5px; text-transform:uppercase;">Moji Zaměstnanci (${moje.length})</div>`;
      moje.forEach(w => { 
          if (typeof renderAttendanceRow === 'function') html += renderAttendanceRow(w, "#22c55e"); 
      });
      
      if (pujcene.length > 0) {
        html += `<div style="color:#3b82f6; font-size:10px; font-weight:900; margin:25px 0 8px 5px; text-transform:uppercase;">Půjčení / Výpomoc (${pujcene.length})</div>`;
        pujcene.forEach(w => { 
            if (typeof renderAttendanceRow === 'function') html += renderAttendanceRow(w, "#3b82f6"); 
        });
      }
      container.innerHTML = html;

      // --- LOGIKA PRO AKTUALIZACI TABULKY ---
      if (!firstLoad) {
    if (typeof phases !== 'undefined' && phases.length > 0 && typeof phaseReserves !== 'undefined') {
        // Musíme vypočítat náhradníky pro každou fázi (F1-F4) ZVLÁŠŤ
        for (let i = 0; i < 4; i++) {
            const workingInThisPhase = new Set();
            const p = phases[i];
            
            // 1. Zjistíme, kdo pracuje v TÉTO konkrétní fázi
            if (p) {
                Object.values(p).forEach(w => { 
                    if (w) {
                        if (w.id) workingInThisPhase.add(w.id.trim());
                        if (w.main && w.main.id) workingInThisPhase.add(w.main.id.trim());
                        if (w.trainee && w.trainee.id) workingInThisPhase.add(w.trainee.id.trim());
                    }
                });
            }

            // 2. Náhradníci jsou ti, co jsou "work" a NEJSOU v "workingInThisPhase"
            phaseReserves[i] = workers.filter(w => {
                const isFreeNow = !workingInThisPhase.has(w.id.trim());
                // OPRAVA: status bez zalomeného řádku a mezer
                const s = (w.status || 'work').toString().toLowerCase().trim();
                return isFreeNow && (s === 'work' || s === 'v práci');
            });
        }
    }

    // Renderujeme, pokud máme data
    const hasActualData = phases.some(ph => ph && Object.keys(ph).length > 0);
    if (hasActualData && typeof render === "function") { 
        render(); 
    }
}

      if (firstLoad) {
        firstLoad = false;
        resolve();
      }
    });
  });
}

/**
 * Pomocná funkce pro sjednocení rodin pozic.
 * VYP1-L i VYP2-L -> VYP
 * MOT-L i MOT-P -> MOT
 * AGR-LZ -> AGR-LZ (ponecháno dle zadání jako unikátní)
 */
const getGenericPos = (p) => {
    if (!p) return "";
    // Převedeme na velká písmena, smažeme mezery na začátku/konci a uvnitř nahradíme případné mezery pomlčkou
    let clean = p.toUpperCase().trim().replace(/\s+/g, '-');
    
    // Nejprve převedeme specifické pozice na unifikovaný název (kvůli mapování)
    if (clean.startsWith("VYP")) clean = "VYP";
    if (clean.startsWith("VET")) clean = "VET";
    if (clean.startsWith("INST")) clean = "INST";
    if (clean.startsWith("QRK")) clean = "QRK";
    
    // Odřízneme všechno za pomlčkou (strany L, P, PZ atd., např. AGR-PP -> AGR, MOT-L -> MOT)
    if (clean.includes('-')) {
        clean = clean.split('-')[0];
    }
    
    // Odstraníme případná zbylá čísla
    return clean.replace(/[0-9]/g, "").trim();
};

let fixedQRKWorkers = null;

function buildPhase(act, historicalStats) {
 // 1. FILTR: Kdo je dnes v práci
 const activeWorkers = workers.filter(w => {
   const s = (w.statusToday || w.status || 'work').toString().toLowerCase().trim();
   return s.includes('work') || s.includes('prác') || s.includes('prac');
 });
 if (!act || !activeWorkers || activeWorkers.length < act.length) return null;

 // --- SPECIÁLNÍ LOGIKA PRO QRK (FIXACE NA CELÝ DEN) ---
 const hasQRK1 = act.includes("QRK1");
 const hasQRK2 = act.includes("QRK2");
 if ((hasQRK1 || hasQRK2) && (phases.length === 0 || !fixedQRKWorkers)) {
   let qrkCandidates = activeWorkers.filter(w => w.skills && w.skills["QRK"] === 2);
   qrkCandidates.sort(() => Math.random() - 0.5);
   fixedQRKWorkers = {
     qrk1: qrkCandidates[0] || null,
     qrk2: qrkCandidates[1] || null
   };
 }

 // 2. HISTORIE: Co už se dnes reálně odpracovalo v předchozích fázích
 const dailyHistory = {}; 
 phases.forEach(p => {
   Object.entries(p).forEach(([pos, worker]) => {
     const wId = worker?.id || worker?.main?.id;
     if (wId) {
       const gen = getGenericPos(pos);
       dailyHistory[`${wId}_${gen}`] = (dailyHistory[`${wId}_${gen}`] || 0) + 1;
     }
   });
 });

 // 3. MAPA SKILLŮ: Kdo co může dělat
 const skillMapping = {
   "VYP1-L": "VYP-L", "VYP2-L": "VYP-L",
   "VYP1-P": "VYP-P", "VYP2-P": "VYP-P",
   "VET": "VET", "VET2": "VET", "VET3": "VET",
   "INST": "INST", "INST2": "INST", "INST3": "INST",
   "QRK1": "QRK", "QRK2": "QRK"
 };

 const normalPositions = act.filter(p => p !== "QRK1" && p !== "QRK2");
 const map = {};
 normalPositions.forEach(pos => {
   const requiredSkill = skillMapping[pos] || pos;
   map[pos] = activeWorkers.filter(w => {
     if (!w.skills) return false;
     
     if (fixedQRKWorkers) {
       if (fixedQRKWorkers.qrk1 && w.id === fixedQRKWorkers.qrk1.id) return false;
       if (fixedQRKWorkers.qrk2 && w.id === fixedQRKWorkers.qrk2.id) return false;
     }
     if (typeof w.skills === 'object' && !Array.isArray(w.skills)) {
       return w.skills[requiredSkill] === 2;
     }
     return Array.isArray(w.skills) && w.skills.includes(requiredSkill);
   });
 });

 // 4. GENEROVÁNÍ: Sníženo na 400 pokusů + přidáno ultra rychlé předčasné ukončení
 let bestResult = null;
 let minScore = Infinity;
 
 for (let i = 0; i < 400; i++) {
   const shuffledPos = [...normalPositions].sort(() => Math.random() - 0.5);
   const attempt = runSmartAttempt(shuffledPos, map, dailyHistory);
   
   if (!attempt) continue;
   let currentScore = 0;
   
   for (const pos in attempt) {
     const wId = attempt[pos].id;
     const currentGen = getGenericPos(pos);
     const lastPos = lastPosByWorker[wId];
     const lastGen = lastPos ? getGenericPos(lastPos) : "";
     
     const totalSkills = Object.keys(attempt[pos].skills || {}).filter(k => attempt[pos].skills[k] === 2).length;

     // Pokuta za rodinu pozic hned po sobě
     if (lastPos && lastGen === currentGen) {
       if (totalSkills === 1) {
         currentScore += 0;
       } else if (totalSkills === 2) {
         currentScore += 5000000; 
       } else if (totalSkills === 3) {
         currentScore += 6000000;
       } else {
         currentScore += 8000000;
       }
     }
     
     // Celodenní opakování a poměr 3:1
     const usedToday = dailyHistory[`${wId}_${currentGen}`] || 0;
     if (usedToday > 0) {
       if (totalSkills === 2) {
         if (usedToday >= 2) {
           currentScore += 10000000;
         } else {
           currentScore += 1000;
         }
       } else if (totalSkills === 3) {
         currentScore += (usedToday * 200000);
       } else if (totalSkills >= 4) {
         currentScore += (usedToday * 500000);
       }
     }
     
     currentScore += (totalSkills * 10);
     currentScore += Math.floor(Math.random() * 5);
   }
   
   if (currentScore < minScore) {
     minScore = currentScore;
     bestResult = attempt;
   }

   // --- BLESKOVÝ STOPÉR (EARLY EXIT) ---
   // Pokud je skóre velmi nízké (např. pod 5000 bodů), znamená to, že rozpis nemá ŽÁDNÉ 
   // milionové pokuty a střídačky u nováčků sedí dokonale. Končíme, ušetříme čas i baterku mobilu!
   if (minScore < 5000) {
     break;
   }
 }

 // 5. SLOUČENÍ S QRK
 if (bestResult) {
   if (hasQRK1 && fixedQRKWorkers.qrk1) bestResult["QRK1"] = fixedQRKWorkers.qrk1;
   if (hasQRK2 && fixedQRKWorkers.qrk2) bestResult["QRK2"] = fixedQRKWorkers.qrk2;
   
   for (const p in bestResult) {
     lastPosByWorker[bestResult[p].id] = p;
   }
   
   const usedIds = new Set(Object.values(bestResult).map(w => w.id));
   return { assign: bestResult, reserves: activeWorkers.filter(w => !usedIds.has(w.id)) };
 }
 return null;
}

function runSmartAttempt(shuffledPos, map, dailyHistory) {
  let assign = {}; 
  let used = new Set(); 
  let steps = 0;
  
  function solve(index) {
    steps++; 
    if (steps > 10000) return false; 
    if (index === shuffledPos.length) return true;

    const pos = shuffledPos[index];
    const currentGen = getGenericPos(pos);
    
    // TOTÁLNÍ NÁHODA: Seznam lidí pro tuhle pozici úplně rozházíme
    let candidates = [...map[pos].filter(w => !used.has(w.id))].sort(() => Math.random() - 0.5);

    // Seřadíme je jen podle nejnutnějších pravidel
    candidates.sort((a, b) => {
      // 1. Přednost mají ti, co tam neseděli minule
      const lastA = lastPosByWorker[a.id] && getGenericPos(lastPosByWorker[a.id]) === currentGen ? 1 : 0;
      const lastB = lastPosByWorker[b.id] && getGenericPos(lastPosByWorker[b.id]) === currentGen ? 1 : 0;
      if (lastA !== lastB) return lastA - lastB;

      // 2. Přednost mají specialisté (málo skillů), aby nezacláněli univerzálům
      const sA = Object.keys(a.skills || {}).length;
      const sB = Object.keys(b.skills || {}).length;
      return sA - sB;
    });

    for (const worker of candidates) {
      assign[pos] = worker; 
      used.add(worker.id);
      if (solve(index + 1)) return true;
      used.delete(worker.id); 
      delete assign[pos];
    }
    return false;
  }
  return solve(0) ? assign : null;
}

            // --- REKONSTRUKCE TABULKY (Phases) s novými daty z DB ---
            phases = shiftData.phases.map(ph => {
                const o = {};
                Object.entries(ph).forEach(([pos, val]) => {

                        const cleanId = val.trim();
                        o[pos] = allWorkersMap[cleanId] ? { ...allWorkersMap[cleanId] } : null;

                        const mainW = val.m ? allWorkersMap[val.m.trim()] : null;

                        o[pos] = { main: mainW, trainee: traineeW };
                    } else {
                        o[pos] = null;
                    }
                });
                return o;
            });

            // Aktualizace statusů u lokálních objektů workers (historický snapshot)
            allWorkersArray.forEach(w => {
                if (currentShiftSnapshot[w.id]) {
                    const historicalStatus = currentShiftSnapshot[w.id];
                    w.statusToday = historicalStatus;
                    w.status = historicalStatus;
                } else {
                    w.statusToday = 'off'; 
                    w.status = 'off';
                }
            });

            // --- VÝPOČET NÁHRADNÍKŮ ---
            phaseReserves = phases.map((ph, phaseIdx) => {
                const usedIdsInPhase = new Set();
                Object.values(ph).forEach(w => { 
                    if (w) {
                        if (w.id) usedIdsInPhase.add(w.id.trim()); 
                        else {
                            if (w.main && w.main.id) usedIdsInPhase.add(w.main.id.trim());
                            if (w.trainee && w.trainee.id) usedIdsInPhase.add(w.trainee.id.trim());
                        }
                    }
                });

                return allWorkersArray.filter(w => {
                    const isUsed = usedIdsInPhase.has(w.id.trim());
                    const s = (w.statusToday || 'off').toString().toLowerCase().trim();
                    return !isUsed && (s === "work" || s === "v práci");
                });
            });

            console.log("Data směny byla synchronizována (možná proběhla výměna v chatu).");

            render();

        }, (error) => {
            console.error("Chyba onSnapshot:", error);
            loadingEl.style.display = "none";
        });

    } catch (err) {
        console.error("Chyba při načítání:", err);
        alert("Chyba při inicializaci směny.");
        loadingEl.style.display = "none";
    }
};

window.removeWorker = () => {
  // 1. Zjistíme, co je v téhle buňce (pickPhaseIndex a pickPosition už máme globálně)
  const cur = phases[pickPhaseIndex][pickPosition];
  console.log("Mažu pozici:", pickPosition, "Data v buňce:", cur);

  if (cur) {
    let toReturn = [];

    // ROZBALENÍ: Zjistíme, kdo tam sedí (klasický pracovník nebo učeň+hlavní)
    if (cur.id) {
        // Starý formát (jen jeden objekt pracovníka)
        toReturn.push(cur);
    } else {
        // Nový formát (balíček {main, trainee})
        if (cur.main) toReturn.push(cur.main);
        if (cur.trainee) toReturn.push(cur.trainee);
    }

    // VRÁCENÍ DO NÁHRADNÍKŮ
    toReturn.forEach(w => {
      if (!w || !w.id) return;

      // Najdeme "čerstvý" objekt se skilly v allWorkersMap nebo v hlavním poli workers
      const realWorker = (typeof allWorkersMap !== 'undefined' && allWorkersMap[w.id]) 
                         || (typeof workers !== 'undefined' ? workers.find(x => x.id === w.id) : w);
      
      // Zjistíme aktuální status (kvůli červeným polím)
      const s = (realWorker.statusToday || realWorker.status || 'work').toString().toLowerCase().trim();

      // Vracíme jen ty, co jsou reálně "v práci"
      if (s === 'work') {
        const isAlreadyInReserves = phaseReserves[pickPhaseIndex].some(x => x.id === realWorker.id);
        if (!isAlreadyInReserves) {
          phaseReserves[pickPhaseIndex].push(realWorker);
        }
      }
    });

    // Seřadíme náhradníky abecedně (A-Z)
    phaseReserves[pickPhaseIndex].sort((a, b) => (a.name || "").localeCompare(b.name || "", 'cs'));
  }

  // 2. VYMAZÁNÍ POZICE A REFRESH
  phases[pickPhaseIndex][pickPosition] = null;
  
  if (typeof closePick === "function") closePick(); 
  else if (document.getElementById('pickModal')) document.getElementById('pickModal').style.display = "none";

  if (typeof render === "function") render();
  
  console.log("Pozice vyprázdněna a náhradníci aktualizováni.");
};

 }
 // Noční směna
 return ["22:00 - 00:00", "00:05 - 02:15", "02:45 - 04:00", "04:05 - 06:00"];

function render() {
  const L = phaseLabels();
  const locked = new Set(lockedPositions());

  /* --- 1. DEFINICE SKUPIN --- */
  const MERGED_GROUPS = {
    "VYP1-L": { others: ["VYP2-L"], label: "VÝPLNĚ L" },
    "VYP1-P": { others: ["VYP2-P"], label: "VÝPLNĚ P" },
    "VET":    { others: ["VET2", "VET3"], label: "VĚTRAČKY" },
    "INST":   { others: ["INST2", "INST3"], label: "INSTALACE" },
    "QRK1": { others: ["QRK2"], label: "QRK" }
  };
  const skippedPositions = new Set();

  let html = `<thead><tr><th style="width: 55px; font-size: 9px; padding: 2px; text-align: center;">Pozice</th>`;
  L.forEach(x => html += `<th style="font-size: 8px; padding: 2px; text-align: center;">${x}</th>`);
  html += "</tr></thead><tbody>";

  POSITIONS.forEach(pos => {
    if (skippedPositions.has(pos)) return;

    const group = MERGED_GROUPS[pos];
    const subPositions = group ? [pos, ...group.others] : [pos];
    if (group) { group.others.forEach(p => skippedPositions.add(p)); }

    const isLocked = locked.has(pos);
    const labelToShow = group ? group.label : pos;
    const rowHeight = subPositions.length * 22;

    // --- LOGIKA AKTIVITY (Je v řádku aspoň jeden člověk v jakékoli fázi?) ---
    let isRowActive = false;
    subPositions.forEach(sp => {
        for (let p = 0; p < 4; p++) {
            // Kontrolujeme, zda v dané fázi a pozici někdo existuje
            if (phases[p] && phases[p][sp]) { 
                isRowActive = true; 
                break; 
            }
        }
    });

    // --- PRIORITA BAREV ---
    // Pokud je tam aspoň jeden člověk -> VŽDY ZELENÁ (#2ecc71)
    // Pokud je prázdno (ať už zamčeno nebo ne) -> ČERVENÁ (#ef4444)
    const finalColor = isRowActive ? '#2ecc71' : '#ef4444';
    const finalBg = isRowActive ? 'rgba(46, 204, 113, 0.05)' : 'rgba(239, 68, 68, 0.12)';

    html += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.08); background: ${finalBg}; transition: background 0.3s;">
      <td onclick="toggleLock('${pos}')" style="cursor: pointer; width: 55px; padding: 0; text-align: center; border-right: 1px solid rgba(255,255,255,0.05);">
          <span style="font-weight: 900; color: ${finalColor} !important; font-size: 8px; display: flex; align-items: center; justify-content: center; height: ${rowHeight}px;">
            ${labelToShow}
          </span>
      </td>`;

    for (let p = 0; p < 4; p++) {
      html += `<td style="padding: 0; width: 62px; vertical-align: middle;">`;
      
      subPositions.forEach((targetPos, idx) => {
        const w = phases[p]?.[targetPos];
        let currentStatus = 'work';
        
        if (w) {
          let workerId = w.id || (w.main ? w.main.id : null);
          if (workerId) {
            const cleanId = workerId.toString().trim();
            if (typeof currentShiftSnapshot !== 'undefined' && currentShiftSnapshot?.[cleanId]) {
              currentStatus = currentShiftSnapshot[cleanId].toString().toLowerCase().trim();
            } else if (w.statusToday) {
              currentStatus = w.statusToday.toString().toLowerCase().trim();
            }
          }
        }

        const isAlert = w && currentStatus !== 'work' && currentStatus !== 'v práci';
        let tdColor = isAlert ? "#ffffff" : (w ? "#2ecc71" : "rgba(255,255,255,0.2)");
        let tdBg = isAlert ? "#ef4444 !important" : "transparent";

        let displayName = "—";
        let traineeHTML = "";

        if (w) {
            const getActualName = (obj) => {
                if (!obj) return "—";
                const workerId = obj.id ? obj.id.trim() : null;
                const fromMap = (workerId && typeof allWorkersMap !== 'undefined') ? allWorkersMap[workerId] : null;
                if (fromMap && fromMap.name) return fromMap.name; 
                return obj.name || workerId || "—";
            };

            if (w.id) {
                displayName = getActualName(w); 
            } else if (w.main) {
                displayName = getActualName(w.main);
                if (w.trainee) {
                    let t = getActualName(w.trainee);
                    if (t !== "—") {
                        traineeHTML = `<div style="font-size: 7px; color: #3b82f6; font-weight: 700; margin-top: -1px;">+ ${t}</div>`;
                    }

  // --- NÁHRADNÍCI POD TABULKOU ---
  for (let p = 0; p < 4; p++) {

        const id = w.id ? w.id.trim() : null;
        const realW = (allWorkersMap && allWorkersMap[id]) ? allWorkersMap[id] : w;
        return realW.name || "";

    html += `
      <tr style="height: 18px; background: rgba(255,255,255,0.02) !important;">
        <td style="width: 55px; text-align: center; color: #f1c40f; font-weight: 900; font-size: 8px; border-right: 1px solid rgba(255,255,255,0.05);">
          F${p + 1}:
        </td>
        <td colspan="4" style="padding-left: 10px; color: rgba(255,255,255,0.5); font-size: 8px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: none !important;">
          ${names || "—"}
        </td>
      </tr>`;
  }

  html += "</tbody>";
  gridEl.innerHTML = html;
}

let pickPhaseIndex, pickPosition;

window.pick = (phase, pos) => {
    pickPhaseIndex = phase;
    pickPosition = pos;
    const available = phaseReserves[phase] || [];

    // MAPOVÁNÍ: Vpravo musí být zkratka z tvého nového employees.html
    const skillMapping = {
        "VET": "VET", "VET2": "VET", "VET3": "VET",
        "INST": "INST", "INST2": "INST", "INST3": "INST",
        "VYP1-L": "VYP-L", "VYP2-L": "VYP-L", // OPRAVENO: pomlčka místo mezery
        "VYP1-P": "VYP-P", "VYP2-P": "VYP-P",  // OPRAVENO: pomlčka místo mezery
        "QRK1": "QRK", "QRK2": "QRK"
    };
    const requiredSkill = skillMapping[pos] || pos;

    // 1. FILTR: KVALIFIKOVANÍ (Level 2)
    const masters = available.filter(w => {
        if (!w || !w.id) return false;
        const realWorker = (allWorkersMap && allWorkersMap[w.id.trim()]) || w;
        if (!realWorker) return false;

        const sToday = (typeof currentShiftSnapshot !== 'undefined' && currentShiftSnapshot?.[w.id.trim()]) 
            ? currentShiftSnapshot[w.id.trim()] 
            : (realWorker.statusToday || realWorker.status || 'work');
            
        if (sToday.toString().toLowerCase().trim() !== 'work') return false;

        // Kontrola skillu přes requiredSkill
        const lvl = (realWorker.skills && realWorker.skills[requiredSkill]) || 0;
        const isOld = Array.isArray(realWorker.skills) && realWorker.skills.includes(requiredSkill);
        return lvl === 2 || isOld;
    });

    // 2. FILTR: ZAUČOVÁNÍ (Level 1) - Nezapomeň opravit i tenhle filtr níže v kódu
    const trainees = available.filter(w => {
        if (!w || !w.id) return false;
        const realWorker = (allWorkersMap && allWorkersMap[w.id.trim()]) || w;
        if (!realWorker) return false;

        const sToday = (typeof currentShiftSnapshot !== 'undefined' && currentShiftSnapshot?.[w.id.trim()]) 
            ? currentShiftSnapshot[w.id.trim()] 
            : (realWorker.statusToday || realWorker.status || 'work');
            
        if (sToday.toString().toLowerCase().trim() !== 'work') return false;
        
        // OPRAVA: I tady musí být requiredSkill
        return realWorker.skills && realWorker.skills[requiredSkill] === 1;
    });

    // Zbytek vykreslování zůstává stejný
    pickTitle.innerText = "Pozice " + pos;
  
    let html = `<div style="font-size:10px; color:#2ecc71; margin-bottom:8px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;">Kvalifikovaní:</div>`;
    html += masters.map(w => {
        const name = w.name.charAt(0).toUpperCase() + w.name.slice(1);
        return `<button class="pickBtn" onclick="swapWorker('${w.id}', false)">${name}</button>`;
    }).join("");

    if (trainees.length > 0) {
        html += `<div style="font-size:10px; color:#3b82f6; margin-top:15px; margin-bottom:8px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;">Zaučování (přidat k pozici):</div>`;
        html += trainees.map(w => {
            const name = w.name.charAt(0).toUpperCase() + w.name.slice(1);
            return `<button class="pickBtn traineeBtn" style="border-color:#3b82f6; color:#3b82f6; background:rgba(59,130,246,0.1);" onclick="swapWorker('${w.id}', true)">+ ${name}</button>`;
        }).join("");
    }

    html += `<button class="pickBtn" style="background: #dc2626 !important; color: white !important; border: none !important; margin-top: 15px; font-weight: 800;" onclick="removeWorker()">Vyprázdnit pozici</button>`;
  
    pickList.innerHTML = html;
    pickModal.style.display = "flex";
};

window.swapWorker = (wid, isTrainee) => {
    const newWorker = allWorkersMap[wid] || workers.find(x => x.id === wid);
    let currentData = phases[pickPhaseIndex][pickPosition];
    
    // --- OPRAVA: VRACENÍ DO NÁHRADNÍKŮ ---
    if (currentData) {
        let toReturn = [];
        
        if (isTrainee) {
            // PŘIDÁVÁME UČNĚ:
            // Pokud už na pozici nějaký učeň byl, jen toho starého učně vrátíme zpět.
            // Učitel (Main) tam musí zůstat, toho NEVRACÍME.
            if (!currentData.id && currentData.trainee) {
                toReturn.push(currentData.trainee);
            }
        } else {
            // PŘIDÁVÁME HLAVNÍHO (Učitele):
            // Pokud tam někdo byl, vracíme ho (ať už to byl jeden člověk nebo hlavní z balíčku).
            if (currentData.id) {
                toReturn.push(currentData);
            } else if (currentData.main) {
                toReturn.push(currentData.main);
            }
        }

        // Provedeme samotné vrácení do seznamu náhradníků
        toReturn.forEach(w => {
            const realW = allWorkersMap[w.id] || w;
            const s = (realW.statusToday || 'work').toString().toLowerCase().trim();
            if (s === 'work') {
                const isAlreadyThere = phaseReserves[pickPhaseIndex].some(x => x.id === realW.id);
                if (!isAlreadyThere) phaseReserves[pickPhaseIndex].push(realW);
            }
        });
    }

    // --- ZÁPIS NOVÝCH DAT ---
    if (isTrainee) {
        if (!currentData) {
            // Pozice byla prázdná, přidáváme učně (učitel zatím není)
            phases[pickPhaseIndex][pickPosition] = { main: null, trainee: newWorker };
        } else if (currentData.id) {
            // Byl tam jeden člověk, uděláme z něj učitele a přidáme k němu nového učně
            phases[pickPhaseIndex][pickPosition] = { main: currentData, trainee: newWorker };
        } else {
            // Už tam byl balíček, jen v něm přepíšeme učně
            phases[pickPhaseIndex][pickPosition].trainee = newWorker;
        }
    } else {
        // Přidáváme hlavního pracovníka
        if (!currentData || currentData.id) {
            phases[pickPhaseIndex][pickPosition] = newWorker;
        } else {
            phases[pickPhaseIndex][pickPosition].main = newWorker;
        }
    }

    // Odstraníme nově vybraného člověka z náhradníků
    phaseReserves[pickPhaseIndex] = phaseReserves[pickPhaseIndex].filter(x => x.id !== wid);
    
    // Seřadíme, zavřeme a překreslíme
    phaseReserves[pickPhaseIndex].sort((a, b) => (a.name || "").localeCompare(b.name || "", 'cs'));
    closePick(); 
    render();
};

    const from = document.getElementById("absDateFrom").value;

    // Moderní karta pro Absenci (oranžová barva)
    const absMsg = `
        <div style="display: flex; align-items: center; gap: 10px;">

window.updateStatus = async (id, newStatus) => {
    try {
        console.log(`Měním status pro ${id} na ${newStatus} (pouze v paměti)`);
await updateDoc(doc(db, "employees", id), { statusToday: newStatus, status: newStatus });
        // 1. AKTUALIZACE SNAPSHOTU (To, co se pak ukládá do kolekce 'shifts')
        if (!window.currentShiftSnapshot) window.currentShiftSnapshot = {};
        window.currentShiftSnapshot[id] = newStatus;
        currentShiftSnapshot = window.currentShiftSnapshot;

        // 2. AKTUALIZACE PROMĚNNÉ WORKERS (Pro seznam pod tabulkou)
        if (typeof workers !== 'undefined') {
            const worker = workers.find(w => w.id === id);
            if (worker) {
                worker.statusToday = newStatus;
                worker.status = newStatus;
            }
        }

        // --- BOD 3: AKTUALIZACE MAPY (Kritické pro funkci 'pick' a skilly) ---
        // Pokud toto neuděláš, při kliknutí na políčko v tabulce se načtou stará data z mapy.
        if (typeof allWorkersMap !== 'undefined' && allWorkersMap[id]) {
            allWorkersMap[id].statusToday = newStatus;
            allWorkersMap[id].status = newStatus;
        }

        // 4. LOGIKA NÁHRADNÍKŮ (F1-F4)
        // Petr/Anamaria musí zmizet z náhradníků, pokud už nejsou "work"
        if (typeof phaseReserves !== 'undefined') {
            const targetWorker = allWorkersMap[id] || (workers ? workers.find(w => w.id === id) : null);
            
            if (targetWorker) {
                phaseReserves.forEach((reserveList, phaseIdx) => {
                    const s = newStatus.toLowerCase().trim();
                    const isWorking = (s === 'work');
                    const isAlreadyInReserves = reserveList.some(w => w.id === id);
                    
                    // Je už na nějaké pozici v této fázi?
                    const isUsedInPhase = (phases && phases[phaseIdx]) ? 
                        Object.values(phases[phaseIdx]).some(w => w && w.id === id) : false;

                    if (isWorking && !isUsedInPhase && !isAlreadyInReserves) {
                        reserveList.push(targetWorker);
                        reserveList.sort((a, b) => (a.name || "").localeCompare(b.name || "", 'cs'));
                    } 
                    else if (!isWorking && isAlreadyInReserves) {
                        phaseReserves[phaseIdx] = reserveList.filter(w => w.id !== id);
                    }
                });
            }
        }

        // 5. REFRESH UI (Bez načítání z DB!)
        // Tady pozor: Tvá funkce loadAttendance() v tvém kódu dělá getDocs(employees).
        // To je to, co ti to "rozbíjelo", protože to přepsalo paměť databází.
        // Pro refresh seznamu ji zavolej, ale ona si teď díky tvé úpravě 
        // prioritně vezme data z currentShiftSnapshot.
        
        await loadAttendance(); 

        if (typeof render === "function") {
            render(); // Jen překreslíme tabulku, nevoláme generátor (Math.random)!
        }

    } catch (err) {
        console.error("Chyba v updateStatus:", err);
    }
};
// OPRAVA loadAttendance (aby neignorovala změny v reálném čase)
async function loadAttendance() {
    const list = document.getElementById("attendanceList");
    if (!list || typeof db === 'undefined') return;

    try {
        let emps = [];

        // 1. POUŽIJEME DATA Z PAMĚTI (Pokud už jsou načtená, nelezeme do DB)
        if (window.workers && window.workers.length > 0) {
            emps = window.workers.map(w => {
                let worker = { ...w };
                // Vnutíme status ze snapshotu (to, co vidíš v tabulce)
                if (typeof currentShiftSnapshot !== 'undefined' && currentShiftSnapshot && currentShiftSnapshot[w.id]) {
                    worker.statusToday = currentShiftSnapshot[w.id];
                }
                return worker;
            });
        } 
        // 2. JEN POKUD PAMĚŤ ZEJE PRÁZDNOTOU, JEDEME DO FIREBASE
        else {
            const snap = await getDocs(collection(db, "employees"));
            snap.forEach(d => {
                const data = d.data();
                let worker = { id: d.id, ...data };
                if (typeof currentShiftSnapshot !== 'undefined' && currentShiftSnapshot && currentShiftSnapshot[d.id]) {
                    worker.statusToday = currentShiftSnapshot[d.id];
                } else {
                    worker.statusToday = data.statusToday || 'work';
                }
                emps.push(worker);
            });
            window.workers = emps; // Uložíme pro příští bleskové načtení
        }

        // 1. Definice priority statusů (pro řazení v seznamu)
        const rolePrio = { 
            'shitmaking': 1, // Parťák
            'work': 2,       // V práci
            'borrowed': 3,   // Půjčený sem
            'loaned': 4,     // Propůjčený pryč
            'vacation': 5,   // Dovolená
            'paragraf': 6,   // Paragraf
            'sick': 7        // Nemoc
        };

        // 2. SAMOTNÉ ŘAZENÍ (Moji vs Půjčení -> Status -> Jméno)
        emps.sort((a, b) => {
            const typeA = (a.type === "pujceny") ? 1 : 0;
            const typeB = (b.type === "pujceny") ? 1 : 0;
            if (typeA !== typeB) return typeA - typeB;

            const statA = a.statusToday || 'work';
            const statB = b.statusToday || 'work';
            const prioA = rolePrio[statA] || 2;
            const prioB = rolePrio[statB] || 2;
            
            if (prioA !== prioB) return prioA - prioB;

            return (a.name || "").localeCompare(b.name || "", 'cs');
        });

        // 3. ROZDĚLENÍ A VYKRESLENÍ (Moji vs Půjčení)
        const moje = emps.filter(e => e.type !== "pujceny");
        const pujcene = emps.filter(e => e.type === "pujceny");

        let html = "";
        if (moje.length > 0) {
            html += `<div style="color:#22c55e; font-size:10px; font-weight:900; margin:15px 0 8px 5px; text-transform:uppercase; border-bottom: 1px solid rgba(34, 197, 94, 0.2); padding-bottom: 3px;">Moji Zaměstnanci (${moje.length})</div>`;
            moje.forEach(e => { html += renderRowHTML(e, "#22c55e"); });
        }
        if (pujcene.length > 0) {
            html += `<div style="color:#3b82f6; font-size:10px; font-weight:900; margin:25px 0 8px 5px; text-transform:uppercase; border-bottom: 1px solid rgba(59, 130, 246, 0.2); padding-bottom: 3px;">Půjčení / Výpomoc (${pujcene.length})</div>`;
            pujcene.forEach(e => { html += renderRowHTML(e, "#3b82f6"); });
        }

        list.innerHTML = html || "<div style='color:white; padding:10px;'>Žádní zaměstnanci nenalezeni</div>";
    } catch (e) { 
        console.error("Chyba v loadAttendance:", e);
    }
}
