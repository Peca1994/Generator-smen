
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Generátor Směn</title>
    <style>
        /* Tady jsou tvé původní styly, které zachovávám */
        body { font-family: sans-serif; background: #121212; color: white; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 12px; text-align: center; }
        th { background: #252525; color: #ffa500; }
        .slot { cursor: pointer; min-width: 120px; transition: 0.2s; }
        .slot:hover { background: #333; }
        .lockedRow { background: #2a1a1a; }
        #loading { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; 
        }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { padding: 10px 20px; cursor: pointer; background: #ffa500; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #ff8c00; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; flex-direction: column; }
        .pickBtn { margin: 5px; padding: 10px; background: #444; color: white; border: 1px solid #666; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Generátor Směn</h1>

    <div class="controls">
        <input type="date" id="date">
        <select id="shift">
            <option value="ranni">Ranní</option>
            <option value="odpo">Odpolední</option>
            <option value="nocni">Noční</option>
        </select>
        <button id="genBtn">Generovat</button>
        <button id="loadBtn">Načíst uloženou</button>
        <button id="saveBtn">Uložit směnu</button>
        <button id="infoBtn">Info o směně</button>
    </div>

    <div id="loading"><h2>Generuji, počkejte...</h2></div>

    <table id="grid">
        <!-- Tabulka se vykreslí dynamicky -->
    </table>

    <div id="reservesBox" style="margin-top: 20px; display: flex; gap: 20px; flex-wrap: wrap;"></div>

    <!-- Modál pro výběr člověka -->
    <div id="pickModal" class="modal">
        <h2 id="pickTitle">Vyberte zaměstnance</h2>
        <div id="pickList"></div>
        <button onclick="window.closePick()" style="margin-top: 20px; background: #666;">Zavřít</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com";

        const firebaseConfig = {
            authDomain: "generator-smen-9fba1.firebaseapp.com",
            projectId: "generator-smen-9fba1",
            storageBucket: "generator-smen-9fba1.firebasestorage.app",
            messagingSenderId: "541779211883",
            appId: "1:541779211883:web:1d8578ec61b8f428a46328",
            measurementId: "G-1HF3R93D92"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ELEMENTY ---
        const loadingEl = document.getElementById("loading");
        const dateEl    = document.getElementById("date");
        const shiftEl   = document.getElementById("shift");
        const gridEl    = document.getElementById("grid");
        const reservesBoxEl = document.getElementById("reservesBox");
        const genBtn    = document.getElementById("genBtn");
        const pickModal = document.getElementById("pickModal");
        const pickTitle = document.getElementById("pickTitle");
        const pickList  = document.getElementById("pickList");

        // --- STAV ---
        let workers = [];
        let allWorkersMap = {};
        let phases = [];
        let phaseReserves = [];
        let POSITIONS = []; // Pozice se načtou ze skilly zaměstnanců
        let historyStats = {};

        if(dateEl) dateEl.value = new Date().toISOString().slice(0, 10);

        // --- NAČÍTÁNÍ DAT ---
        async function loadData() {
            const querySnapshot = await getDocs(collection(db, "employees"));
            workers = [];
            allWorkersMap = {};
            const foundSkills = new Set();

            querySnapshot.forEach((doc) => {
                const d = doc.data();
                if(d.status === "work") {
                    workers.push({ id: doc.id, ...d });
                    if(d.skills) d.skills.forEach(s => foundSkills.add(s));
                }
                allWorkersMap[doc.id] = { id: doc.id, ...d };
            });

            // Seřadíme pozice abecedně
            POSITIONS = Array.from(foundSkills).sort();
            render();
        }

        function phaseLabels(){
            const s = shiftEl.value;
            if(s==="ranni") return ["6:00-8:00","8:00-10:15","10:45-12:00","12:00-14:00"];
            if(s==="odpo") return ["14:00-16:00","16:00-18:15","18:45-20:00","20:00-22:00"];
            return ["22:00-00:00","00:00-02:15","02:45-04:00","04:00-06:00"];
        }

        // --- RENDER ---
        function render(){
            if(!gridEl || POSITIONS.length === 0) {
                gridEl.innerHTML = "<tr><td>Načítám pozice ze zaměstnanců...</td></tr>";
                return;
            }
            const L = phaseLabels();
            let html = "<tr><th>Pozice</th>";
            L.forEach(x => html += `<th>${x}</th>`);
            html += "</tr>";

            POSITIONS.forEach(pos => {
                html += `<tr><td class="posCol"><b>${pos}</b></td>`;
                for(let p=0; p<4; p++){
                    const w = phases[p]?.[pos];
                    html += `<td class="slot" onclick="window.pick(${p},'${pos}')">${w?w.name:"—"}</td>`;
                }
                html += "</tr>";
            });
            gridEl.innerHTML = html;

            if(reservesBoxEl && phaseReserves.length > 0) {
                reservesBoxEl.innerHTML = phaseReserves.map((arr,i)=>
                    `<div style="background:#252525; padding:10px;"><b>Fáze ${i+1} Volní:</b><br>${arr.map(w=>w.name).join(", ")|| "Nikdo"}</div>`
                ).join("");
            }
        }

        // --- ALGORITMUS ---
        function buildPhase(act) {
            const map = {};
            act.forEach(pos => { map[pos] = workers.filter(w => w.skills && w.skills.includes(pos)); });
            const orderedPos = [...act].sort((a, b) => map[a].length - map[b].length);
            
            let bestResult = null;
            let minScore = Infinity;

            for (let i = 0; i < 30; i++) {
                let assign = {}; let used = new Set();
                function solve(idx) {
                    if (idx === orderedPos.length) return true;
                    const p = orderedPos[idx];
                    let cands = map[p].filter(w => !used.has(w.id)).sort(() => Math.random() - 0.5);
                    for (const w of cands) {
                        assign[p] = w; used.add(w.id);
                        if (solve(idx + 1)) return true;
                        used.delete(w.id); delete assign[p];
                    }
                    return false;
                }
                if (solve(0)) {
                    let score = 0;
                    Object.keys(assign).forEach(p => score += (historyStats[assign[p].id + "_" + p] || 0));
                    if (score < minScore) { minScore = score; bestResult = {...assign}; }
                }
            }
            if (bestResult) {
                Object.keys(bestResult).forEach(p => historyStats[bestResult[p].id + "_" + p] = (historyStats[bestResult[p].id + "_" + p] || 0) + 1);
                const usedIds = new Set(Object.values(bestResult).map(w => w.id));
                return { assign: bestResult, reserves: workers.filter(w => !usedIds.has(w.id)) };
            }
            return null;
        }

        // --- AKCE ---
        genBtn.onclick = async () => {
            loadingEl.style.display = "flex";
            await loadData();
            phases = []; phaseReserves = []; historyStats = {};
            
            for (let i = 0; i < 4; i++) {
                const res = buildPhase(POSITIONS);
                if (!res) { 
                    alert("Chyba: Některé pozice nelze obsadit (málo lidí se skilly)."); 
                    loadingEl.style.display="none"; return; 
                }
                phases.push(res.assign); 
                phaseReserves.push(res.reserves);
            }
            render();
            loadingEl.style.display = "none";
        };

        window.pick = (phase, pos) => {
            const list = phaseReserves[phase].filter(w => w.skills.includes(pos));
            pickTitle.innerText = "Změna na pozici: " + pos;
            pickList.innerHTML = list.map(w => `<button class="pickBtn" onclick="window.swapWorker('${w.id}', ${phase}, '${pos}')">${w.name}</button>`).join("");
            pickModal.style.display = "flex";
        };

        window.swapWorker = (wid, phase, pos) => {
            const w = workers.find(x => x.id === wid);
            const current = phases[phase][pos];
            if(current) phaseReserves[phase].push(current);
            phases[phase][pos] = w;
            phaseReserves[phase] = phaseReserves[phase].filter(x => x.id !== wid);
            pickModal.style.display = "none";
            render();
        };

        window.closePick = () => pickModal.style.display = "none";

        // Načteme data hned po spuštění
        loadData();

    </script>
</body>
</html>
