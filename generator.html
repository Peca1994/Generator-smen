<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, getDoc }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
 apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
  measurementId: "G-1HF3R93D92"
});

const db = getFirestore(app);

/* DOM */

const loadingEl = document.getElementById("loading");
const dateEl = document.getElementById("date");
const shiftEl = document.getElementById("shift");
const gridEl = document.getElementById("grid");
const reservesBoxEl = document.getElementById("reservesBox");

const genBtn = document.getElementById("genBtn");
const loadBtn = document.getElementById("loadBtn");
const saveBtn = document.getElementById("saveBtn");
const lockBox = document.getElementById("lockBox");

const pickModal = document.getElementById("pickModal");
const pickTitle = document.getElementById("pickTitle");
const pickList = document.getElementById("pickList");

const infoBtn = document.getElementById("infoBtn");
const infoModal = document.getElementById("infoModal");

const skStart = document.getElementById("skStart");
const skEnd   = document.getElementById("skEnd");
const faStart = document.getElementById("faStart");
const faEnd   = document.getElementById("faEnd");
const zaStart = document.getElementById("zaStart");
const zaEnd   = document.getElementById("zaEnd");

dateEl.value = new Date().toISOString().slice(0,10);

/* POSITIONS */

const POSITIONS = [
"DP-L","DP-P","ZRC-L","ZRC-P","T-L","T-P",
"AGR-LP","AGR-PP","AGR-PZ","AGR-LZ",
"MOT-L","MOT-P","LEP-LP","LEP-PP","LEP-Z",
"REPRO-L","REPRO-P","VYP1-L","VYP1-P",
"VYP2-L","VYP2-P","PR-L","PR-P","ZAM-L","ZAM-P","VET","VET2","INST",
"INST2","JINE","JINE2",

];

/* DEFAULT ZAMČENÉ POZICE */

const DEFAULT_LOCKED = new Set([
 "ZAM-L","ZAM-P",
 "VET","VET2",
 "INST","INST2",
 "JINE","JINE2"
]);

POSITIONS.forEach(p=>{

 const checked = DEFAULT_LOCKED.has(p) ? "checked" : "";

 lockBox.innerHTML += `
 <label class="lockRow">
  <input type="checkbox" value="${p}" ${checked}>
  <span>${p}</span>
 </label>`;
});


function lockedPositions(){
 return [...lockBox.querySelectorAll("input:checked")].map(x=>x.value);
}

function activePositions(){
 const locked = lockedPositions();
 return POSITIONS.filter(p=>!locked.includes(p));
}

/* STATE */

let workers=[];
let phases=[];
let phaseReserves=[];
let allWorkersMap={};   // ← NOVÉ
let shiftInfo = {
 sk:{start:"",end:""},
 fa:{start:"",end:""},
 za:{start:"",end:""}
};



/* WORKERS */

async function loadWorkers(){
 const snap = await getDocs(collection(db,"employees"));
 workers=[];

 snap.forEach(d=>{
  const e=d.data();
  const st = e.statusToday;

  // ❌ tihle se NIKDY negenerují
  if(
    st === "sick" ||
    st === "vacation" ||
    st === "paragraf" ||
    st === "shitmaking" ||
    st === "loaned" ||
    st === "borrowed"
  ){
    return;
  }

  // ✅ jen skuteční pracovníci
  if(st === "work"){
    workers.push({
      id:d.id,
      name:e.name,
      skills:e.skills || []
    });
  }

 });
}

async function loadAllWorkers(){

 const snap = await getDocs(collection(db,"employees"));
 allWorkersMap={};

 snap.forEach(d=>{
  const e=d.data();
  allWorkersMap[d.id]={
    id:d.id,
    name:e.name,
    skills:e.skills||[],
    status:e.statusToday||"work"
  };
 });

}

/* BUILD */

if (typeof historyStats === 'undefined') { var historyStats = {}; }
if (typeof lastPosByWorker === 'undefined') { var lastPosByWorker = {}; }

function buildPhase(act) {
  if (!act || !workers || workers.length < act.length) return null;

  const map = {};
  act.forEach(pos => {
    map[pos] = workers.filter(w => w.skills && w.skills.includes(pos));
  });
  const orderedPos = [...act].sort((a, b) => map[a].length - map[b].length);

  let bestResult = null;
  let minScore = Infinity;

  for (let i = 0; i < 20; i++) {
    const attempt = runSmartAttempt(orderedPos, map);
    
    if (attempt) {
      let currentScore = 0;
      for (const pos in attempt) {
        const wId = attempt[pos].id;
        currentScore += (historyStats[wId + "_" + pos] || 0);
      }

      if (currentScore < minScore) {
        minScore = currentScore;
        bestResult = attempt;
      }
      if (minScore === 0) break;
    }
  }

  if (bestResult) {
    for (const p in bestResult) {
      const wId = bestResult[p].id;
      historyStats[wId + "_" + p] = (historyStats[wId + "_" + p] || 0) + 1;
      lastPosByWorker[wId] = p; 
    }
    const usedIds = new Set(Object.values(bestResult).map(w=>w.id));
const reserves = workers.filter(w=>!usedIds.has(w.id));

return { assign: bestResult, reserves };

  }

  return null;
}

function runSmartAttempt(orderedPos, map) {
  let assign = {};
  let used = new Set();
  let steps = 0;

  function solve(index) {
    steps++;
    if (steps > 1500) return false; 
    if (index === orderedPos.length) return true;

    const pos = orderedPos[index];
    let candidates = map[pos].filter(w => !used.has(w.id));

    candidates.sort(() => Math.random() - 0.5); 
    
    candidates.sort((a, b) => {
      if (a.skills.length !== b.skills.length) {
        if (a.skills.length === 1) return -1;
        if (b.skills.length === 1) return 1;
      }

      const aRepeats = (lastPosByWorker[a.id] === pos && a.skills.length > 1) ? 1 : 0;
      const bRepeats = (lastPosByWorker[b.id] === pos && b.skills.length > 1) ? 1 : 0;
      if (aRepeats !== bRepeats) return aRepeats - bRepeats;

      return 0;
    });

    for (const worker of candidates) {
      assign[pos] = worker;
      used.add(worker.id);
      if (solve(index + 1)) return true;
      used.delete(worker.id);
      delete assign[pos];
    }
    return false;
  }
  return solve(0) ? assign : null;
    } 


/* GENERATE */

genBtn.onclick = async ()=>{

 loadingEl.style.display="flex";

 await loadWorkers();

 const act = activePositions();   // ← TOHLE CHYBÍ

 phases = [];
 phaseReserves = [];
 lastPosByWorker = {};

 for(let i=0;i<4;i++){

   const res = buildPhase(act);

   if(!res){
     alert("❌ Nelze obsadit všechny pozice — málo lidí / skillů");
     loadingEl.style.display="none";
     return;
   }

   phases.push(res.assign);
   phaseReserves.push(res.reserves);
 }

 render();

 loadingEl.style.display="none";
};


/* LOAD */

loadBtn.onclick = async ()=>{

 loadingEl.style.display="flex";

 await loadWorkers();      // pro generátor
 await loadAllWorkers();   // pro load směny

 const id=dateEl.value+"_"+shiftEl.value;
 const snap=await getDoc(doc(db,"shifts",id));

 if(!snap.exists()){
  alert("Směna neexistuje");
  loadingEl.style.display="none";
  return;
 }

 const data=snap.data();
// ✅ načti info o směně (popup data)
shiftInfo = data.info || {
 sk:{start:"",end:""},
 fa:{start:"",end:""},
 za:{start:"",end:""}
};
 // 🔷 mapujeme z ALL workers — ne jen work
 phases = data.phases.map(ph=>{
  const o={};
  Object.entries(ph).forEach(([pos,wid])=>{
   o[pos] = allWorkersMap[wid] || {
     id:wid,
     name:"NEZNÁMÝ",
     skills:[],
     status:"missing"
   };
  });
  return o;
 });

 // reserves jen z aktuálních WORK workers
 phaseReserves = phases.map(ph=>{
  const used=new Set(Object.values(ph).filter(Boolean).map(w=>w.id));
  return workers.filter(w=>!used.has(w.id));
 });

 render();
 loadingEl.style.display="none";
};


/* RENDER */

function phaseLabels(){
 const s=shiftEl.value;
 if(s==="ranni") return ["6:00-8:00","8:00-10:15","10:45-12:00","12:00-14:00"];
 if(s==="odpo") return ["14:00-16:00","16:00-18:15","18:45-20:00","20:00-22:00"];
 return ["22:00-00:00","00:00-02:15","02:45-04:00","04:00-06:00"];
}

function render(){

 const L=phaseLabels();
 const locked = new Set(lockedPositions());

 let html="<tr><th>Pozice</th>";
 L.forEach(x=>html+=`<th>${x}</th>`);
 html+="</tr>";

 POSITIONS.forEach(pos=>{
  const isLocked = locked.has(pos);
  html+=`<tr class="${isLocked?'lockedRow':''}">
  <td class="posCol">
   ${pos} ${isLocked?'🔒':''}
   <button onclick="toggleLock('${pos}')">🔓</button>
  </td>`;

  for(let p=0;p<4;p++){
   const w=phases[p]?.[pos];
   const cls = (w && w.status && w.status!=="work") ? "outWorker" : "";
html+=`<td class="slot ${cls}" onclick="pick(${p},'${pos}')">${w?w.name:"—"}</td>`;

  }

  html+="</tr>";
 });

 gridEl.innerHTML=html;

 reservesBoxEl.innerHTML =
 phaseReserves.map((arr,i)=>
 `<div class="resBox"><b>Fáze ${i+1}</b><br>${
 arr.map(w=>w.name+" — "+w.skills.join(", ")).join("<br>")||"Nikdo"
 }</div>`).join("");
}

/* LOCK TOGGLE */

window.toggleLock=(pos)=>{
 const cb=[...lockBox.querySelectorAll("input")].find(x=>x.value===pos);
 if(cb) cb.checked=!cb.checked;
 render();
};

/* PICK */

let pickPhaseIndex,pickPosition;

window.pick=(phase,pos)=>{
 pickPhaseIndex=phase;
 pickPosition=pos;
 const list=phaseReserves[phase].filter(w=>w.skills.includes(pos));
 pickTitle.innerText="Pozice "+pos;
 pickList.innerHTML=
 list.map(w=>`<button class="pickBtn" onclick="swapWorker('${w.id}')">${w.name}</button>`).join("")
 + `<button class="pickBtn removeBtn" onclick="removeWorker()">Vyprázdnit</button>`;
 pickModal.style.display="flex";
};

window.swapWorker=(wid)=>{
 const w=workers.find(x=>x.id===wid);
 const cur=phases[pickPhaseIndex][pickPosition];
 if(cur) phaseReserves[pickPhaseIndex].push(cur);
 phases[pickPhaseIndex][pickPosition]=w;
 phaseReserves[pickPhaseIndex]=phaseReserves[pickPhaseIndex].filter(x=>x.id!==wid);
 closePick(); render();
};

window.removeWorker=()=>{
 const cur=phases[pickPhaseIndex][pickPosition];
 if(cur) phaseReserves[pickPhaseIndex].push(cur);
 phases[pickPhaseIndex][pickPosition]=null;
 closePick(); render();
};

window.closePick=()=> pickModal.style.display="none";

infoBtn.onclick = ()=>{
 skStart.value = shiftInfo.sk.start;
 skEnd.value   = shiftInfo.sk.end;
 faStart.value = shiftInfo.fa.start;
 faEnd.value   = shiftInfo.fa.end;
 zaStart.value = shiftInfo.za.start;
 zaEnd.value   = shiftInfo.za.end;

 infoModal.style.display="flex";
};

window.closeInfo = ()=>{
 infoModal.style.display="none";
};

document.getElementById("infoSave").onclick = ()=>{
 shiftInfo = {
  sk:{start:skStart.value,end:skEnd.value},
  fa:{start:faStart.value,end:faEnd.value},
  za:{start:zaStart.value,end:zaEnd.value}
 };
 infoModal.style.display="none";
};

/* SAVE */

saveBtn.onclick = async ()=>{

 if(!phases.length){
  alert("Nejdřív generuj");
  return;
 }

 // 🔷 phase data
 const out = phases.map(ph=>{
  const o={};
  Object.entries(ph).forEach(([pos,w])=>{
   if(w) o[pos]=w.id;
  });
  return o;
 });

 // 🔷 status snapshot zaměstnanců v den uložení
 const empSnap = await getDocs(collection(db,"employees"));
 const statusSnapshot = {};

 empSnap.forEach(d=>{
   statusSnapshot[d.id] = d.data().statusToday || "work";
 });

 await setDoc(doc(db,"shifts",dateEl.value+"_"+shiftEl.value),{
 date:dateEl.value,
 shift:shiftEl.value,
 phases:out,
 statusSnapshot,
 info: shiftInfo,   // ← NOVÉ
 createdAt:Date.now()
});

 alert("✅ Uloženo (včetně status snapshotu)");
};


</script>
</body>
