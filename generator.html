
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generátor směny | ShiftMaster</title>

<style>
/* 1. GLOBÁLNÍ RESET */
body {
    margin: 0; padding: 0; min-height: 100vh;
    color: white; font-family: sans-serif;
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg');
    background-size: cover; background-position: center;
    background-repeat: no-repeat; background-attachment: fixed;
    background-color: #030712;
}

/* 2. TOPBAR */
.topbar {
    height: 60px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.menuBtn {
    padding: 8px 16px; border-radius: 10px; border: none; font-weight: 800;
    background: #334155; color: white; cursor: pointer;
}

/* 3. KONTEJNER */
.container { max-width: 450px; margin: 15px auto; padding: 15px; }

/* 4. KARTY A FORMULÁŘE */
.card { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 20px; margin-bottom: 15px; }
input, select {
    width: 100%; padding: 12px; border-radius: 12px; border: none;
    margin: 8px 0; background: white; color: black; font-weight: 700; box-sizing: border-box;
}

button {
    width: 100%; padding: 15px; border-radius: 15px; border: none;
    font-weight: 800; cursor: pointer; margin-top: 10px; transition: 0.2s;
}
.genBtn { background: #f59e0b; color: black; }
.saveBtn { background: #22c55e; color: white; }
.loadBtn { background: #2563eb; color: white; }

/* 5. SPECIFICKÉ PRVKY */
.lockList { max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; }
.lockRow { display: flex; align-items: center; gap: 10px; padding: 5px; font-size: 13px; }

#loading {
    position: fixed; top: 10px; right: 10px; background: #f59e0b; color: black;
    padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 12px; z-index: 2000;
    display: none;
}

.modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
}
.modalBox { background: #0f172a; padding: 25px; border-radius: 25px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }

table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px; text-align: left; font-size: 14px; }
</style>
</head>

<body>

<div id="loading">🔍 Načítám data...</div>

<div class="topbar">
    <div><b>⚙️ GENERÁTOR</b></div>
    <button class="menuBtn" onclick="window.location.href='index.html'">Menu</button>
</div>

<div class="container">
    <button id="infoBtn" class="loadBtn" style="margin-bottom:15px;">ℹ️ Informace o směně</button>

    <div class="card">
        <label>Datum a směna</label>
        <input type="date" id="date">
        <select id="shift">
            <option value="ranni">Ranní směna</option>
            <option value="odpo">Odpolední směna</option>
            <option value="noc">Noční směna</option>
        </select>

        <details style="margin-top: 10px;">
            <summary style="cursor:pointer; font-weight: 800;">🔒 Vyřadit pozice (Nastavení)</summary>
            <div class="lockList" id="lockBox"></div>
        </details>

        <button class="genBtn" id="genBtn">⚙️ Generovat rozpis</button>
        <button class="loadBtn" id="loadBtn">📂 Načíst poslední uložený</button>
    </div>

    <div class="card">
        <table id="grid">
            <thead><tr><th>Pozice</th><th>Zaměstnanec</th></tr></thead>
            <tbody id="gridBody"></tbody>
        </table>
    </div>

    <button class="saveBtn" id="saveBtn">💾 Uložit tento rozpis</button>
</div>

<!-- MODÁLY -->
<div class="modal" id="infoModal">
    <div class="modalBox">
        <h3>ℹ️ Detaily směny</h3>
        <label>Scala / Kamiq</label>
        <input id="skStart" placeholder="Začátek">
        <input id="skEnd" placeholder="Konec">
        <button id="infoSave" class="saveBtn">Uložit info</button>
        <button onclick="document.getElementById('infoModal').style.display='none'" class="menuBtn" style="width:100%">Zavřít</button>
    </div>
</div>

<script type="module">
// OPRAVENÉ IMPORTY
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// KONSTANTY POZIC
const POSITIONS = ["DP-L","DP-P","ZRC-L","ZRC-P","T-L","T-P","AGR-LP","AGR-PP","AGR-PZ","AGR-LZ","MOT-L","MOT-P","LEP-LP","LEP-PP","LEP-Z","REPRO-L","REPRO-P","VYP1-L","VYP1-P","VYP2-L","VYP2-P","PR-L","PR-P","ZAM-L","ZAM-P","VET","VET2","INST","INST2","JINE","JINE2"];
const DEFAULT_LOCKED = ["ZAM-L","ZAM-P","VET","VET2","INST","INST2","JINE","JINE2"];

// INICIALIZACE LOCKBOXU
const lockBox = document.getElementById("lockBox");
POSITIONS.forEach(p => {
    const checked = DEFAULT_LOCKED.includes(p) ? "checked" : "";
    lockBox.innerHTML += `<label class="lockRow"><input type="checkbox" value="${p}" ${checked}> <span>${p}</span></label>`;
});

// LOGIKA NAČÍTÁNÍ
async function loadWorkers() {
    document.getElementById("loading").style.display = "block";
    try {
        const snap = await getDocs(collection(db, "employees"));
        let workers = [];
        snap.forEach(d => {
            workers.push({ id: d.id, ...d.data() });
        });
        console.log("Zaměstnanci načteni:", workers.length);
        return workers;
    } catch (e) {
        console.error("Chyba při načítání:", e);
    } finally {
        document.getElementById("loading").style.display = "none";
    }
}

// OTEVŘENÍ MODÁLU INFO
document.getElementById("infoBtn").onclick = () => {
    document.getElementById("infoModal").style.display = "flex";
};

// Nastavení dnešního data
document.getElementById("date").value = new Date().toISOString().slice(0,10);

// Zde by pokračovala tvá logika generování (shuffle atd.)
// Pro funkčnost zatím stačí toto propojení.
</script>
</body>
</html>
