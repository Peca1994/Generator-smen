const db = getFirestore(app);

/* DOM */

/* Nastavení dnešního data */

  dateEl.value = new Date().toISOString().slice(0, 10);

/* POSITIONS */

const POSITIONS = [
"DP-L","DP-P","ZRC-L","ZRC-P","T-L","T-P",
"AGR-LP","AGR-PP","AGR-PZ","AGR-LZ",
"MOT-L","MOT-P","LEP-LP","LEP-PP","LEP-Z",
"REPRO-L","REPRO-P","VYP1-L","VYP1-P",
"VYP2-L","VYP2-P","PR-L","PR-P","ZAM-L","ZAM-P","VET","VET2","INST",
"INST2","JINE","JINE2",

];

/* DEFAULT ZAMČENÉ POZICE */

const DEFAULT_LOCKED = new Set([
 "ZAM-L","ZAM-P",
 "VET","VET2",
 "INST","INST2",
 "JINE","JINE2"
]);

POSITIONS.forEach(p => {
    const checked = DEFAULT_LOCKED.has(p) ? "checked" : "";
    
    lockBox.innerHTML += `
    <label class="lockRow">
        <input type="checkbox" value="${p}" ${checked} style="display:none;">
        <span>${p}</span>
    </label>
    `;
});


function lockedPositions(){
 return [...lockBox.querySelectorAll("input:checked")].map(x=>x.value);
}

function activePositions(){
 const locked = lockedPositions();
 return POSITIONS.filter(p=>!locked.includes(p));
}

/* STATE */

let workers=[];
let phases=[];
let phaseReserves=[];
let allWorkersMap={};   // ← NOVÉ
let shiftInfo = {
 sk:{start:"",end:""},
 fa:{start:"",end:""},
 za:{start:"",end:""}
};



/* WORKERS */

async function loadWorkers(){
 const snap = await getDocs(collection(db,"employees"));
 workers=[];

 snap.forEach(d=>{
  const e=d.data();
  const st = e.statusToday;

  // ❌ tihle se NIKDY negenerují
  if(
    st === "sick" ||
    st === "vacation" ||
    st === "paragraf" ||
    st === "shitmaking" ||
    st === "loaned" ||
    st === "borrowed"
  ){
    return;
  }

  // ✅ jen skuteční pracovníci
  if(st === "work"){
    workers.push({
      id:d.id,
      name:e.name,
      skills:e.skills || []
    });
  }

 });
}

async function loadAllWorkers(){

 const snap = await getDocs(collection(db,"employees"));
 allWorkersMap={};

 snap.forEach(d=>{
  const e=d.data();
  allWorkersMap[d.id]={
    id:d.id,
    name:e.name,
    skills:e.skills||[],
    status:e.statusToday||"work"
  };
 });

}

/* BUILD */

if (typeof historyStats === 'undefined') { var historyStats = {}; }
if (typeof lastPosByWorker === 'undefined') { var lastPosByWorker = {}; }

function buildPhase(act) {
  if (!act || !workers || workers.length < act.length) return null;

  const map = {};
  act.forEach(pos => {
    map[pos] = workers.filter(w => w.skills && w.skills.includes(pos));
  });
  const orderedPos = [...act].sort((a, b) => map[a].length - map[b].length);

  let bestResult = null;
  let minScore = Infinity;

  const getBasePos = (p) => (p && p.includes('-')) ? p.split('-')[0] : (p || "");

  const currentPhaseIdx = phases.length; 

  // Zvýšeno na 1000 pokusů pro maximální šanci najít ideální rotaci
  for (let i = 0; i < 600; i++) {
    const attempt = runSmartAttempt(orderedPos, map);
    if (!attempt) continue;

    let currentScore = 0;
    for (const pos in attempt) {
      const wId = attempt[pos].id;
      const currentBase = getBasePos(pos);
      
      // 1. ZÁKAZ OPAKOVÁNÍ HNED PO SOBĚ (1-2, 2-3, 3-4)
      const lastPos = lastPosByWorker[wId];
      if (lastPos) {
        if (lastPos === pos) currentScore += 50000; // Extrémní trest
        else if (getBasePos(lastPos) === currentBase) currentScore += 20000;
      }

      // 2. ZÁKAZ SKÁKÁNÍ OB JEDNU FÁZI (1-3, 2-4)
      if (currentPhaseIdx >= 2) {
        const phaseBack2 = phases[currentPhaseIdx - 2];
        const posBack2 = Object.keys(phaseBack2).find(p => phaseBack2[p].id === wId);
        
        if (posBack2) {
           if (posBack2 === pos) {
             currentScore += 30000; // Obrovský trest za návrat na stejnou židli
           } else if (getBasePos(posBack2) === currentBase) {
             currentScore += 15000; // Velký trest za stejný typ operace
           }
        }
      }
      
      // 3. DROBNÁ PENALIZACE ZA CELÝ DEN (historie 1-4 atd.)
      currentScore += (historyStats[wId + "_" + pos] || 0) * 100;
    }

    if (currentScore < minScore) {
      minScore = currentScore;
      bestResult = attempt;
    }
    // Pokud najdeme řešení se skóre 0 (nikdo neopakuje nic), končíme hned
    if (minScore === 0) break;
  }

  if (bestResult) {
    for (const p in bestResult) {
      const wId = bestResult[p].id;
      historyStats[wId + "_" + p] = (historyStats[wId + "_" + p] || 0) + 1;
      lastPosByWorker[wId] = p;
    }
    const usedIds = new Set(Object.values(bestResult).map(w => w.id));
    return { assign: bestResult, reserves: workers.filter(w => !usedIds.has(w.id)) };
  }
  return null;
}

function runSmartAttempt(orderedPos, map) {
  let assign = {}; let used = new Set(); let steps = 0;
  function solve(index) {
    steps++; 
    if (steps > 10000) return false; 
    if (index === orderedPos.length) return true;

    const pos = orderedPos[index];
    let candidates = map[pos].filter(w => !used.has(w.id));
    candidates.sort(() => Math.random() - 0.5);

    for (const worker of candidates) {
      assign[pos] = worker; used.add(worker.id);
      if (solve(index + 1)) return true;
      used.delete(worker.id); delete assign[pos];
    }
    return false;
  }
  return solve(0) ? assign : null;
} 


/* GENERATE */

genBtn.onclick = async ()=>{

 loadingEl.style.display="flex";

 await loadWorkers();

 const act = activePositions();   // ← TOHLE CHYBÍ

 phases = [];
 phaseReserves = [];
 lastPosByWorker = {};

 for(let i=0;i<4;i++){

   const res = buildPhase(act);

   if(!res){
     alert("❌ Nelze obsadit všechny pozice — málo lidí / skillů");
     loadingEl.style.display="none";
     return;
   }

   phases.push(res.assign);
   phaseReserves.push(res.reserves);
 }

 render();

 loadingEl.style.display="none";
};


/* LOAD */

loadBtn.onclick = async ()=>{

 loadingEl.style.display="flex";

 await loadWorkers();      // pro generátor
 await loadAllWorkers();   // pro load směny

 const id=dateEl.value+"_"+shiftEl.value;
 const snap=await getDoc(doc(db,"shifts",id));

 if(!snap.exists()){
  alert("Směna neexistuje");

  return;
 }

 const data=snap.data();
// ✅ načti info o směně (popup data)
shiftInfo = data.info || {
 sk:{start:"",end:""},
 fa:{start:"",end:""},
 za:{start:"",end:""}
};
 // 🔷 mapujeme z ALL workers — ne jen work
 phases = data.phases.map(ph=>{
  const o={};
  Object.entries(ph).forEach(([pos,wid])=>{
   o[pos] = allWorkersMap[wid] || {
     id:wid,
     name:"NEZNÁMÝ",
     skills:[],
     status:"missing"
   };
  });
  return o;
 });

 // reserves jen z aktuálních WORK workers
 phaseReserves = phases.map(ph=>{
  const used=new Set(Object.values(ph).filter(Boolean).map(w=>w.id));
  return workers.filter(w=>!used.has(w.id));
 });

 render();
 loadingEl.style.display="none";
};


/* RENDER */

function phaseLabels(){
 const s = shiftEl.value;
 // Ranní směna
 if(s === "ranni") {
   return ["06:00 - 08:00", "08:05 - 10:15", "10:45 - 12:00", "12:05 - 14:00"];
 }
 // Odpolední směna
 if(s === "odpo") {
   return ["14:00 - 16:00", "16:05 - 18:15", "18:45 - 20:00", "20:05 - 22:00"];
 }
 // Noční směna
 return ["22:00 - 00:00", "00:05 - 02:15", "02:45 - 04:00", "04:05 - 06:00"];
}

function render(){

 const L=phaseLabels();
 const locked = new Set(lockedPositions());

 let html="<tr><th>Pozice</th>";
 L.forEach(x=>html+=`<th>${x}</th>`);
 html+="</tr>";

 POSITIONS.forEach(pos=>{
  const isLocked = locked.has(pos);
  html+=`<tr class="${isLocked?'lockedRow':''}">
  <td class="posCol">
   ${pos} ${isLocked?'🔒':''}
   <button onclick="toggleLock('${pos}')">🔓</button>
  </td>`;

  for(let p=0;p<4;p++){
   const w=phases[p]?.[pos];
   const cls = (w && w.status && w.status!=="work") ? "outWorker" : "";
html+=`<td class="slot ${cls}" onclick="pick(${p},'${pos}')">${w?w.name:"—"}</td>`;

  }

  html+="</tr>";
 });

 gridEl.innerHTML=html;

 reservesBoxEl.innerHTML =
 phaseReserves.map((arr,i)=>
 `<div class="resBox"><b>Fáze ${i+1}</b><br>${
 arr.map(w=>w.name+" — "+w.skills.join(", ")).join("<br>")||"Nikdo"
 }</div>`).join("");
}

/* LOCK TOGGLE */

window.toggleLock=(pos)=>{
 const cb=[...lockBox.querySelectorAll("input")].find(x=>x.value===pos);
 if(cb) cb.checked=!cb.checked;
 render();
};

/* PICK */

let pickPhaseIndex,pickPosition;

window.pick=(phase,pos)=>{
 pickPhaseIndex=phase;
 pickPosition=pos;
 const list=phaseReserves[phase].filter(w=>w.skills.includes(pos));
 pickTitle.innerText="Pozice "+pos;
 pickList.innerHTML=
 list.map(w=>`<button class="pickBtn" onclick="swapWorker('${w.id}')">${w.name}</button>`).join("")
 + `<button class="pickBtn removeBtn" onclick="removeWorker()">Vyprázdnit</button>`;
 pickModal.style.display="flex";
};

window.swapWorker=(wid)=>{
 const w=workers.find(x=>x.id===wid);
 const cur=phases[pickPhaseIndex][pickPosition];
 if(cur) phaseReserves[pickPhaseIndex].push(cur);
 phases[pickPhaseIndex][pickPosition]=w;
 phaseReserves[pickPhaseIndex]=phaseReserves[pickPhaseIndex].filter(x=>x.id!==wid);
 closePick(); render();
};

window.removeWorker=()=>{
 const cur=phases[pickPhaseIndex][pickPosition];
 if(cur) phaseReserves[pickPhaseIndex].push(cur);
 phases[pickPhaseIndex][pickPosition]=null;
 closePick(); render();
};

window.closePick=()=> pickModal.style.display="none";

async function loadAttendance() {
    const list = document.getElementById("attendanceList");
    if (!list || typeof db === 'undefined') return;

    try {
        const snap = await getDocs(collection(db, "employees"));
        list.innerHTML = "";
        let emps = [];
        snap.forEach(d => emps.push({ id: d.id, ...d.data() }));

        // Priority řazení: Parťák(1), Práce(2), Půjčení(3,4), Zbytek(5,6,7)
     const prio = { 'shitmaking': 1, 'work': 2, 'borrowed': 3, 'loaned': 4, 'vacation': 5, 'paragraf': 6, 'sick': 7 };

emps.sort((a, b) => {
    // POZOR NA VELKÁ/MALÁ PÍSMENA (statusToday vs statusToday)
    const vA = prio[a.statusToday] || 2; 
    const vB = prio[b.statusToday] || 2;
    
    if (vA !== vB) return vA - vB;
    return (a.name || "").localeCompare(b.name || "");
});
        emps.forEach(e => {
            const status = e.statusToday || 'work';
            const row = document.createElement("div");
            row.className = "att-row";
            row.innerHTML = `
    <div class="att-name">${e.name} ${e.surname || ''}</div>
    <select class="status-select ${status}" 
            onchange="this.className='status-select ' + this.value; updateStatus('${e.id}', this.value)">
        <option value="work" ${status === 'work' ? 'selected' : ''}>V práci</option>
        <option value="vacation" ${status === 'vacation' ? 'selected' : ''}>Dovolená</option>
        <option value="paragraf" ${status === 'paragraf' ? 'selected' : ''}>Paragraf</option>
        <option value="sick" ${status === 'sick' ? 'selected' : ''}>Nemoc</option>
        <option value="shitmaking" ${status === 'shitmaking' ? 'selected' : ''}>Parťák</option>
        <option value="borrowed" ${status === 'borrowed' ? 'selected' : ''}>Půjčený</option>
        <option value="loaned" ${status === 'loaned' ? 'selected' : ''}>Propůjčený</option>
    </select>`;
            list.appendChild(row);
        });
    } catch (e) { console.error(e); }
}

// Funkce pro rozbalení - OPRAVENÁ
window.toggleAttendance = (show) => {
    const modal = document.getElementById('attendanceModal');
    if (modal) {
        modal.style.display = show ? 'flex' : 'none';
        // Pokud otevíráme, rovnou načteme aktuální data
        if (show) loadAttendance();
    }
};

window.updateStatus = async (id, newStatus) => {
    try {
        // Teď už updateDoc bude fungovat!
        await updateDoc(doc(db, "employees", id), { statusToday: newStatus });
        // Po uložení okamžitě znovu načteme a seřadíme
        loadAttendance(); 
    } catch (err) {
        console.error("Chyba při ukládání role:", err);
    }
};

// Start
setTimeout(loadAttendance, 1000);
