
<!DOCTYPE html>

<style>
 #grid {
    width: 100% !important;
    table-layout: fixed !important; 
    border-collapse: separate !important;
    border-spacing: 0 8px !important;
    margin-top: 20px !important;
}

/* 1. PRVNÍ SLOUPEC (NÁZEV POZICE) */
#grid td:first-child {
    width: 150px !important;
    padding-left: 20px !important;
    font-weight: 900 !important;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 12px 0 0 12px !important;
    transition: all 0.3s ease;
}

/* 2. OSTATNÍ SLOUPCE (JMÉNA) */
#grid td:not(:first-child) {
    text-align: center !important;
    padding: 14px 5px !important;
    font-weight: 800 !important;
    color: white !important;
    background: rgba(255, 255, 255, 0.02) !important;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

#grid td:last-child {
    border-radius: 0 12px 12px 0 !important;
}

/* --- ZVÝRAZNĚNÍ AKTIVNÍHO ŘÁDKU (ZELENÁ) --- */
/* Pokud má první buňka třídu 'active-pos', celý řádek zezelená */
#grid tr:has(.active-pos) td {
    background: rgba(46, 204, 113, 0.08) !important; /* Jemné zelené svícení */
    border-color: rgba(46, 204, 113, 0.2) !important;
}

/* Barva textu pozice v aktivním řádku */
#grid td.active-pos {
    color: #2ecc71 !important; /* Škoda zelená */
    text-shadow: 0 0 12px rgba(46, 204, 113, 0.4);
}

/* --- ZVÝRAZNĚNÍ NEAKTIVNÍHO ŘÁDKU (ŠEDÁ) --- */
/* Pokud má první buňka třídu 'inactive-pos', řádek zhasne */
#grid td.inactive-pos {
    color: rgba(255, 255, 255, 0.15) !important; /* Utlumená šedá */
}

/* --- ODSTRANĚNÍ ZÁMKŮ (Už nejsou potřeba) --- */
#grid button {
    display: none !important;
}

/* Speciální úprava pro zamknutý řádek (pokud ho stále používáš v JS) */
#grid tr.lockedRow td {
    background: rgba(241, 196, 15, 0.1) !important;
    border-color: rgba(241, 196, 15, 0.3) !important;
}
#grid tr.lockedRow td:first-child {
    color: #f1c40f !important;
}
    /* IMPORT MODERNÍHO PÍSMA */
    @import url('https://fonts.googleapis.com');

    * {
        box-sizing: border-box;
        max-width: 100%;

    }

    padding: 0;

    background-attachment: fixed !important;
}

    .background-logo {
        position: fixed;
        top: 25%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: -1;
        text-align: center;

    .background-logo img {
    /* Šířka a pozice */
    width: 650px !important; /* Velikost odpovídající hlavní stránce */
    max-width: 90vw !important;
    
    /* KLÍČOVÉ ŘÁDKY PRO STŘÍBRNÝ EFEKT */
    mix-blend-mode: screen; /* Odstraní černé pozadí */
    filter: grayscale(100%) brightness(1.1) contrast(1.1) !important; /* Udělá logo stříbrné */

    /* Vymazání okrajů do ztracena (necháváme tvoji masku) */
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);

}
.background-logo h1 {
    font-size: 16vw !important;

    filter: none !important;
    color: #1a3a2a !important;
    opacity: 0.5 !important;
    text-shadow: 0 0 15px rgba(0,0,0,0.8) !important;
}

    .topbar {
        width: 100% !important;
        height: 60px;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        padding: 0 20px !important;
        background: transparent !important;
        position: sticky;
        top: 0;
        z-index: 1000;
        color: white !important; /* TOTO PŘIDEJ PRO BÍLÝ TEXT */
    }

.topTitle {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif !important;
    font-size: 22px !important;
    font-weight: 800 !important;
    color: #ffffff !important;
    letter-spacing: -0.5px !important;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    padding-left: 10px;
}

.menuBtn { 
    padding: 8px 14px; 
    border-radius: 10px; 
    border: none; 
    font-weight: 800; 
    background: rgba(51, 65, 85, 0.8); 
    color: white; 
    cursor: pointer; 
}

/* 3. HLAVNÍ KONTEJNER (BEZ OHRANIČENÍ A BLURU) */
.container, .app, .main {
    max-width: 450px !important; /* Sjednotíme maximální šířku */
    width: 95% !important;
    margin: 20px auto !important;
    padding: 10px !important;
    background: transparent !important; /* ÚPLNĚ PRŮHLEDNÉ */
    border: none !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    color: white !important;
}

/* 4. PRŮHLEDNOST VŠECH VNITŘNÍCH BOXŮ (Karty, Tabulky, Detaily) */
.card, fieldset, section, details, summary, table, tr, td, th, .modalBox, .resBox {
    background: transparent !important; background-color: transparent !important;
    border: none !important; box-shadow: none !important; color: white !important;
}

/* 5. ČITELNOST TEXTU (STÍN PRO OSTRÉ LOGO) */
label, p, span, summary, .worker, .row, h1, h2, h3, th, td, .lockCode, .lockName {
    color: white !important; font-weight: 900 !important;
    text-shadow: 2px 2px 4px rgba(0,0,0,1) !important;
}

/* 6. FORMULÁŘE A TLAČÍTKA */
input, select {
    width: 100% !important; /* Rozprostře se na celou šířku */
    box-sizing: border-box !important; /* Aby padding nerozšiřoval políčko */
    padding: 14px !important;
    border-radius: 15px !important; /* Moderní zaoblení */
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    background: rgba(255, 255, 255, 0.05) !important;
    color: white !important;
    font-weight: 700 !important;
    text-align: center;
    margin-bottom: 15px !important;
}

/* Aby texty "Datum" a "Směna" (labely) byly tučné */
label {
    display: block;
    font-weight: 800;
    font-size: 14px;
    color: #00ff88;
    margin-bottom: 8px;
    text-transform: uppercase;
}
button {
    width: 100%; padding: 14px !important; border-radius: 12px !important;
    border: none !important; font-weight: 800; cursor: pointer; margin-top: 10px;
}
.topbar button {
    width: auto !important;
    margin-top: 0 !important; /* Odstraní horní mezeru, aby bylo tlačítko uprostřed lišty */
}
.genBtn, .btn-warning { background: #f59e0b !important; }
.saveBtn, .btn-success { background: #22c55e !important; }
.loadBtn, .pickBtn, .btn-primary { background: #2563eb !important; color: white !important; }
.removeBtn { background: #ef4444 !important; }

.lockList { 
    display: flex; 
    flex-wrap: wrap; 
    gap: 10px; 
    padding: 15px 0;
    max-height: 300px;
    overflow-y: auto;
}

.lockRow {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    min-width: 95px;
    padding: 7px 12px;
    margin: 4px;
    border-radius: 20px !important; /* Oválný tvar jako v docházce */
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    font-weight: 900 !important;
    font-size: 11px !important;
    letter-spacing: 0.8px;
    
    /* MODERNI SKLENĚNÝ EFEKT - NEONOVĚ ZELENÁ */
    background: rgba(34, 197, 94, 0.05) !important; 
    border: 1px solid rgba(34, 197, 94, 0.5) !important;
    color: #22c55e !important; /* Tato barva je přesně ta zelená z tvé karty */
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.1);
}

/* VZHLED PŘI VYŘAZENÍ (Červená jako alarm v docházce) */
.lockRow:has(input:checked) {
    background: rgba(239, 68, 68, 0.08) !important;
    border: 1px solid rgba(239, 68, 68, 0.6) !important;
    color: #ef4444 !important; /* Neonově červená */
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.15);
}

/* Efekt při najetí myší */
.lockRow:hover {
    transform: translateY(-1px);
    background: rgba(255, 255, 255, 0.1) !important;
}


.modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modalBox { border: 1px solid rgba(255,255,255,0.2) !important; background: #020617 !important; padding: 20px; border-radius: 20px; }

/* PosCol a Table Borders */
th, td { border-bottom: 1px solid rgba(255,255,255,0.1) !important; padding: 8px; }
.posCol { text-align: left; font-weight: 800; }
.disclaimer {
    position: relative; /* Změna z fixed na relative, aby netvořil prázdné místo pod sebou */
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.3); /* Decentní šedá */
    text-align: left; /* Zarovnání doleva */
    font-family: sans-serif;
    line-height: 1.3;
    width: 100%;
    box-sizing: border-box;
}
@media (max-width: 480px) {
    .disclaimer {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
        width: 90%;
        max-width: none;
    }
}
@media screen and (max-width: 480px) {
    table { font-size: 11px !important; }
    tbody td {
        padding: 8px 2px !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 60px;
    }
    tbody td:first-child, thead th:first-child {
        width: 45px !important;
        padding-left: 5px !important;
        font-size: 10px !important;
    }
    table { border-spacing: 0 4px !important; }
    thead th { font-size: 10px !important; padding: 10px 2px !important; }
}

/* --- SJEDNOCENÝ DESIGN LIŠT (INFO A DOCHÁZKA) --- */
.info-section, .attendance-section {
    background: rgba(255, 255, 255, 0.08) !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    border-radius: 15px !important;
    padding: 12px 25px;
    margin: 10px auto 20px auto;
    max-width: 600px;
    width: 90%;
    transition: 0.3s;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.info-section:hover, .attendance-section:hover {
    background: rgba(255, 255, 255, 0.12) !important;
    border-color: #22c55e !important;
}

/* --- PLOVOUCÍ OKNO (MODÁL) --- */
.att-modal {
    position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
}

.att-modal-content {
    background: #0f172a !important;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 30px;
    width: 90%; max-width: 550px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
}

/* SKRYTÍ POSUVNÍKU (ROLLBARU) */
#attendanceList {
    max-height: 65vh; overflow-y: auto;
    -ms-overflow-style: none; scrollbar-width: none;
}
#attendanceList::-webkit-scrollbar { display: none; }

/* ŘÁDEK ZAMĚSTNANCE */
.att-row {
    display: flex;                /* Zapne pružné rozvržení */
    justify-content: space-between; /* Odtlačí jméno doleva a select doprava */
    align-items: center;          /* Vycentruje je výškově proti sobě */
    padding: 10px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.status-select.work { border-color: #22c55e !important; color: #22c55e !important; }

.lockRow {
    border-width: 1.5px !important; /* Trochu zvýrazníme ten hlavní vnější rámeček */

    color: #ef4444 !important;
}

async function loadWorkers() {
  const container = document.getElementById("attendanceList");
  if (!container) return;

  const snap = await getDocs(collection(db, "employees"));
  
  let moje = [];
  let pujcene = [];
  let temporaryWorkers = []; // Pomocné pole pro generátor

  snap.forEach(d => {
    const e = d.data();
    const st = e.statusToday || "work";

    const zakazane = ["sick", "vacation", "paragraf", "shitmaking", "loaned", "borrowed", "propujceny"];
    if (zakazane.includes(st)) return;

    const workerObj = { 
      id: d.id, 
      name: e.name, 
      surname: e.surname || "", 
      type: e.type || "kmenovy",
      skills: e.skills || [], // Důležité pro generování!
      status: st 
    };

    // ✅ TADY JE TA ZMĚNA: Přidáme ho do seznamu pro generátor
    temporaryWorkers.push(workerObj);

    if (e.type === "pujceny") {
      pujcene.push(workerObj);
    } else {
      moje.push(workerObj);
    }
  });

  // ✅ AKTUALIZACE GLOBÁLNÍ PROMĚNNÉ (aby generátor věděl, s kým pracovat)
  workers = temporaryWorkers; 

  const sortFn = (a, b) => a.surname.localeCompare(b.surname, 'cs');
  moje.sort(sortFn);
  pujcene.sort(sortFn);

  let html = "";
  html += `<div style="color:#22c55e; font-size:10px; font-weight:900; margin:15px 0 8px 5px; text-transform:uppercase;">Moji Zaměstnanci (${moje.length})</div>`;
  moje.forEach(w => { html += renderAttendanceRow(w, "#22c55e"); });

  if (pujcene.length > 0) {
    html += `<div style="color:#3b82f6; font-size:10px; font-weight:900; margin:25px 0 8px 5px; text-transform:uppercase;">Půjčení / Výpomoc (${pujcene.length})</div>`;
    pujcene.forEach(w => { html += renderAttendanceRow(w, "#3b82f6"); });
  }

  container.innerHTML = html;
}

async function loadAllWorkers() {
  const snap = await getDocs(collection(db, "employees"));
  allWorkersMap = {};
  let emps = [];

  snap.forEach(d => {
    const e = d.data();
    const workerData = {
      id: d.id,
      name: e.name,
      surname: e.surname || "",
      skills: e.skills || [],
      status: e.statusToday || "work",
      type: e.type || "kmenovy" // Důležité pro rozlišení
    };
    allWorkersMap[d.id] = workerData;
    emps.push(workerData);
  });

  // Seřazení podle příjmení (stejně jako v employees.html)
  emps.sort((a, b) => a.surname.localeCompare(b.surname, 'cs'));

  const pujceni = emps.filter(e => e.type === "pujceny");

  renderWorkerList(kmenovi, pujceni);
}

/* BUILD */

if (typeof historyStats === 'undefined') { var historyStats = {}; }
if (typeof lastPosByWorker === 'undefined') { var lastPosByWorker = {}; }

function buildPhase(act) {
  if (!act || !workers || workers.length < act.length) return null;

  const map = {};
  act.forEach(pos => {
    map[pos] = workers.filter(w => w.skills && w.skills.includes(pos));
  });
  const orderedPos = [...act].sort((a, b) => map[a].length - map[b].length);

  let bestResult = null;
  let minScore = Infinity;

  const getBasePos = (p) => (p && p.includes('-')) ? p.split('-')[0] : (p || "");

  const currentPhaseIdx = phases.length; 

  // Zvýšeno na 1000 pokusů pro maximální šanci najít ideální rotaci
  for (let i = 0; i < 600; i++) {
    const attempt = runSmartAttempt(orderedPos, map);
    if (!attempt) continue;

    let currentScore = 0;
    for (const pos in attempt) {
      const wId = attempt[pos].id;
      const currentBase = getBasePos(pos);
      
      // 1. ZÁKAZ OPAKOVÁNÍ HNED PO SOBĚ (1-2, 2-3, 3-4)
      const lastPos = lastPosByWorker[wId];
      if (lastPos) {
        if (lastPos === pos) currentScore += 50000; // Extrémní trest
        else if (getBasePos(lastPos) === currentBase) currentScore += 20000;
      }

      // 2. ZÁKAZ SKÁKÁNÍ OB JEDNU FÁZI (1-3, 2-4)
      if (currentPhaseIdx >= 2) {
        const phaseBack2 = phases[currentPhaseIdx - 2];
        const posBack2 = Object.keys(phaseBack2).find(p => phaseBack2[p].id === wId);
        
        if (posBack2) {
           if (posBack2 === pos) {
             currentScore += 30000; // Obrovský trest za návrat na stejnou židli
           } else if (getBasePos(posBack2) === currentBase) {
             currentScore += 15000; // Velký trest za stejný typ operace
           }
        }
      }
      
      // 3. DROBNÁ PENALIZACE ZA CELÝ DEN (historie 1-4 atd.)
      currentScore += (historyStats[wId + "_" + pos] || 0) * 100;
    }

    if (currentScore < minScore) {
      minScore = currentScore;
      bestResult = attempt;
    }
    // Pokud najdeme řešení se skóre 0 (nikdo neopakuje nic), končíme hned
    if (minScore === 0) break;
  }

  if (bestResult) {
    for (const p in bestResult) {
      const wId = bestResult[p].id;
      historyStats[wId + "_" + p] = (historyStats[wId + "_" + p] || 0) + 1;
      lastPosByWorker[wId] = p;
    }
    const usedIds = new Set(Object.values(bestResult).map(w => w.id));
    return { assign: bestResult, reserves: workers.filter(w => !usedIds.has(w.id)) };
  }
  return null;
}

function runSmartAttempt(orderedPos, map) {
  let assign = {}; let used = new Set(); let steps = 0;
  function solve(index) {
    steps++; 
    if (steps > 10000) return false; 
    if (index === orderedPos.length) return true;

    const pos = orderedPos[index];
    let candidates = map[pos].filter(w => !used.has(w.id));
    candidates.sort(() => Math.random() - 0.5);

    for (const worker of candidates) {
      assign[pos] = worker; used.add(worker.id);
      if (solve(index + 1)) return true;
      used.delete(worker.id); delete assign[pos];
    }
    return false;
  }
  return solve(0) ? assign : null;
}

window.swapWorker=(wid)=>{

 closePick(); render();

async function loadAttendance() {
    const list = document.getElementById("attendanceList");
    if (!list || typeof db === 'undefined') return;

    try {
        const snap = await getDocs(collection(db, "employees"));
        let emps = [];
        snap.forEach(d => {
            const data = d.data();
            emps.push({ id: d.id, ...data });
        });

        // 1. Definice priority rolí (nižší číslo = vyšší pozice)
        const rolePrio = { 
            'shitmaking': 1, 
            'work': 2, 
            'borrowed': 3, 
            'loaned': 4, 
            'vacation': 5, 
            'paragraf': 6, 
            'sick': 7 
        };

        // 2. HLAVNÍ ŘAZENÍ (Důkladné ošetření prázdných hodnot)
        emps.sort((a, b) => {
            // A) Typ (Moji vs Půjčení)
            const typeA = (a.type === "pujceny") ? 1 : 0;
            const typeB = (b.type === "pujceny") ? 1 : 0;
            if (typeA !== typeB) return typeA - typeB;

            // B) Role (Status)
            const statA = a.statusToday || 'work';
            const statB = b.statusToday || 'work';
            const prioA = rolePrio[statA] || 2;
            const prioB = rolePrio[statB] || 2;
            if (prioA !== prioB) return prioA - prioB;

            // C) Abeceda
            return (a.name || "").localeCompare(b.name || "", 'cs');
        });

        // 3. ROZDĚLENÍ A VYKRESLENÍ
        const moje = emps.filter(e => e.type !== "pujceny");
        const pujcene = emps.filter(e => e.type === "pujceny");

        let html = "";

        if (moje.length > 0) {
            html += `<div style="color:#22c55e; font-size:10px; font-weight:900; margin:15px 0 8px 5px; text-transform:uppercase; border-bottom: 1px solid rgba(34, 197, 94, 0.2); padding-bottom: 3px;">Moji Zaměstnanci (${moje.length})</div>`;
            moje.forEach(e => { html += renderRowHTML(e, "#22c55e"); });
        }

        if (pujcene.length > 0) {
            html += `<div style="color:#3b82f6; font-size:10px; font-weight:900; margin:25px 0 8px 5px; text-transform:uppercase; border-bottom: 1px solid rgba(59, 130, 246, 0.2); padding-bottom: 3px;">Půjčení / Výpomoc (${pujcene.length})</div>`;
            pujcene.forEach(e => { html += renderRowHTML(e, "#3b82f6"); });
        }

        list.innerHTML = html || "<div style='color:white; padding:10px;'>Žádní zaměstnanci nenalezeni</div>";
    } catch (e) { 
        console.error("Chyba v loadAttendance:", e);
        list.innerHTML = "<div style='color:red; padding:10px;'>Chyba při načítání dat</div>";
    }
}
