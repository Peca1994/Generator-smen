<script>
function updateSingleColor(el) {
    if (!el) return;
    
    // Seznam všech možných barevných tříd k odstranění
    const colors = ['bg-v-praci', 'bg-dovolena', 'bg-paragraf', 'bg-nemoc', 'bg-parfak', 'bg-pujceny', 'bg-propujceny', 'bg-volno'];
    
    // Odstraníme staré barvy
    el.classList.remove(...colors);
    
    // Vytvoříme název nové třídy (např. "V práci" -> "bg-v-praci")
    const val = el.value.toLowerCase()
        .replace(/\s+/g, '-') // mezery na pomlčky
        .normalize("NFD").replace(/[\u0300-\u036f]/g, ""); // odstraní diakritiku (á -> a)
        
    el.classList.add('bg-' + val);
}

// Tuto funkci zavolej VŽDY po vykreslení tabulky v onSnapshot
function initAllSelects() {
    document.querySelectorAll('.status-select').forEach(select => {
        updateSingleColor(select); // Obarvíme při načtení
        
        // Přidáme hlídače změny
        select.onchange = function() {
            updateSingleColor(this);
            // Zde by mělo být i tvé volání do Firebase pro uložení:
            // updateDoc(doc(db, "employees", id), { status: this.value });
        };
    });
}
</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
  measurementId: "G-1HF3R93D92"
});

const auth = getAuth(app);
const db = getFirestore(app);

const statusColors = {
    "V práci": "#ffffff",      // Bílá
    "Dovolená": "#ffc107",     // Žlutá/Oranžová
    "Paragraf": "#28a745",     // Zelená
    "Nemoc": "#dc3545",        // Červená
    "Parfák": "#6f42c1",       // Fialová
    "Půjčený": "#000000",      // Černá (tady musíme změnit i barvu písma)
    "Propůjčený": "#fd7e14",   // Oranžová
    "Volno": "#007bff"         // Modrá
};

function updateSelectStyle(selectElement) {
    const val = selectElement.value;
    const bgColor = statusColors[val] || "#ffffff";
    
    // Nastavení barvy pozadí
    selectElement.style.backgroundColor = bgColor;
    
    // Nastavení barvy písma (pro černou barvu 'Půjčený' dáme bílé písmo, jinak černé)
    if (val === "Půjčený") {
        selectElement.style.color = "white";
    } else {
        selectElement.style.color = "black";
    }

    // Odstranění "kolečka" na mobilu po výběru
    selectElement.blur(); 
}

// Funkce, kterou zavolej po vykreslení tabulky
function initStatusColors() {
    document.querySelectorAll('select').forEach(select => {
        updateSelectStyle(select);
        select.addEventListener('change', (e) => updateSelectStyle(e.target));
    });
}
/* 🔒 musí být přihlášen */

onAuthStateChanged(auth, u=>{
  if(!u){
    alert("Nejsi přihlášen");
    location.href="index.html";
  }
});

/* DOM */

const modal = document.getElementById("modal");
const skillsBox = document.getElementById("skillsBox");
const list = document.getElementById("list");

const fNameEl = document.getElementById("fName");
const lNameEl = document.getElementById("lName");
const emailEl = document.getElementById("email");
const infoEl = document.getElementById("info");
const statusEl = document.getElementById("status");
const broadcastModal = document.getElementById("broadcastModal");
const broadcastTextEl = document.getElementById("broadcastText");

/* pozice */

const POSITIONS = [
    ["DP-L","DOORPROTECTOR L"],["DP-P","DOORPROTECTOR P"],
    ["ZRC-L","ZRCÁTKA L"],["ZRC-P","ZRCÁTKA P"],
    ["T-L","TĚSNĚNÍ L"],["T-P","TĚSNĚNÍ P"],
    ["AGR-LP","AGREGÁT LP"],["AGR-PP","AGREGÁT PP"],
    ["AGR-PZ","AGREGÁT PZ"],["AGR-LZ","AGREGÁT LZ"],
    ["MOT-L","MOTORY L"],["MOT-P","MOTORY P"],
    ["LEP-LP","LEPENÍ LP"],["LEP-PP","LEPENÍ PP"],
    ["LEP-Z","LEPENÍ Z"],
    ["REPRO-L","REPRÁKY L"],["REPRO-P","REPRÁKY P"],
    ["VYP1-L","VÝPLNĚ 1 L"],["VYP1-P","VÝPLNĚ 1 P"],
    ["VYP2-L","VÝPLNĚ 2 L"],["VYP2-P","VÝPLNĚ 2 P"],
    ["PR-L","PŘITAHOVAČ L"],["PR-P","PŘITAHOVAČ P"],
    ["ZAM-L","ZÁMKY L"],["ZAM-P","ZÁMKY P"],
    ["VET","VĚTRAČKY"],["VET2","VĚTRAČKY 2"],["VET3","VĚTRAČKY 3"], // Přidané VET3
    ["INST","INSTALACE"],["INST2","INSTALACE 2"],["INST3","INSTALACE 3"] // Přidané INST3
];

POSITIONS.forEach(p => {
  const div = document.createElement("div");
  div.className = "skillItem";
  
  // p[0] je zkratka (např. VET), p[1] je název (VĚTRAČKY)
  div.innerHTML = `<input type="checkbox" value="${p[0]}">${p[1]}`;
  
  div.onclick = () => {
    const cb = div.querySelector("input");
    cb.checked = !cb.checked;
    div.classList.toggle("active", cb.checked);
  };
  
  skillsBox.appendChild(div);
});

let editId=null;

window.openNew=()=>{
  editId=null;
  fNameEl.value="";
  lNameEl.value="";
  emailEl.value="";
  infoEl.value="";
  skillsBox.querySelectorAll("input").forEach(c=>{
    c.checked=false;
    c.parentElement.classList.remove("active");
  });
  modal.style.display="block";
};

window.closeModal=()=> modal.style.display="none";

/* SAVE */

window.saveEmp = async () => {
  try {
    const fName = document.getElementById("fName").value;
    const lName = document.getElementById("lName").value;

    if (!fName || !lName) {
      alert("Vyplň jméno a příjmení");
      return;
    }

    const skills = [...document.getElementById("skillsBox").querySelectorAll("input:checked")].map(x => x.value);
    const id = editId || (fName + "_" + lName).toLowerCase().replace(/\s+/g, "_");

    // Načtení typu (Kmenový/Půjčený)
    const typeEl = document.getElementById("empType");
    const typeValue = typeEl ? typeEl.value : "kmenovy";

    const docRef = doc(db, "employees", id);

    if (editId) {
        // POKUD UPRAVUJEME (editId existuje) -> použijeme updateDoc
        // Tato funkce změní jen to, co pošleme, a roli admina v DB nechá netknutou
        await updateDoc(docRef, {
            name: fName,
            surname: lName,
            email: document.getElementById("email").value.toLowerCase().trim(),
            info: document.getElementById("info").value,
            skills: skills,
            type: typeValue
        });
    } else {
        // POKUD VYTVÁŘÍME NOVÉHO -> použijeme setDoc
        await setDoc(docRef, {
            name: fName,
            surname: lName,
            email: document.getElementById("email").value.toLowerCase().trim(),
            info: document.getElementById("info").value,
            skills: skills,
            type: typeValue,
            role: "user" // Novému člověku dáme automaticky roli user
        });
    }

    alert("Uloženo");
    modal.style.display = "none";
    load();
  } catch (e) {
    alert("CHYBA při ukládání: " + e.message);
    console.error(e);
  }
};

// 2. FUNKCE PRO MAZÁNÍ (Zůstává stejná)
window.deleteEmp = async () => {
  if (!editId) return;
  if (!confirm("Opravdu chceš smazat záznam?")) return;
  await deleteDoc(doc(db, "employees", editId));
  alert("Smazáno");
  modal.style.display = "none";
  load();
};

// 3. FUNKCE PRO NAČTENÍ SEZNAMU (ROZDĚLENÍ NA SEKCE)
async function load() {
  const listDiv = document.getElementById("list");
  if (!listDiv) return;
  listDiv.innerHTML = "<p style='color:gray; text-align:center; padding: 20px;'>Načítám data...</p>";

  const snap = await getDocs(collection(db, "employees"));
  let emps = [];
  snap.forEach(d => {
    const data = d.data();
    emps.push({ id: d.id, ...data });
  });

  // Seřazení A-Z podle příjmení
  emps.sort((a, b) => (a.surname || "").localeCompare(b.surname || ""));

  const kmenovi = emps.filter(e => e.type !== "pujceny");
  const pujceni = emps.filter(e => e.type === "pujceny");

  // Definice moderních ikon (SVG)
  const iconKmenovi = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`;
  const iconPujceni = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><path d="m7 16 3-3-3-3"></path><path d="M13 7h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-2"></path><path d="m9 11-3 3 3 3"></path><path d="M11 17H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"></path></svg>`;
  const iconChevron = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;"><polyline points="9 18 15 12 9 6"></polyline></svg>`;

  let html = "";

  // 1. SEKCE MOJI ZAMĚSTNANCI
  html += `
    <div style="display: flex; align-items: center; margin: 25px 0 12px 5px; color: #22c55e;">
      ${iconKmenovi}
      <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;">Moji Zaměstnanci (${kmenovi.length})</span>
    </div>`;

  kmenovi.forEach(e => {
    html += `
      <div class="empRow" style="border-left: 4px solid #22c55e; margin-bottom: 8px;" onclick="edit('${e.id}')">
        <div class="empName">${e.name} ${e.surname || ""}</div>
        ${iconChevron}
      </div>`;
  });

  // 2. SEKCE PŮJČENÍ / VÝPOMOC
  if (pujceni.length > 0) {
    html += `
      <div style="display: flex; align-items: center; margin: 35px 0 12px 5px; color: #3b82f6;">
        ${iconPujceni}
        <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;">Půjčení / Výpomoc (${pujceni.length})</span>
      </div>`;

    pujceni.forEach(e => {
      html += `
        <div class="empRow" style="border-left: 4px solid #3b82f6; margin-bottom: 8px; opacity: 0.85;" onclick="edit('${e.id}')">
          <div class="empName">${e.name} ${e.surname || ""}</div>
          ${iconChevron}
        </div>`;
    });
  }

  listDiv.innerHTML = html;
}

// 4. FUNKCE PRO EDITACI (OPRAVENÁ CHYBA NULL)
async function edit(id) {
  const snap = await getDoc(doc(db, "employees", id));
  const e = snap.data();
  if (!e) return;

  editId = id;
  modal.style.display = "block";

  // Přímé přiřazení do políček, aby se vyhnulo chybě undefined proměnných
  document.getElementById("fName").value = e.name || "";
  document.getElementById("lName").value = e.surname || "";
  document.getElementById("email").value = e.email || "";
  document.getElementById("info").value = e.info || "";
  
  if(document.getElementById("empType")) {
    document.getElementById("empType").value = e.type || "kmenovy";
  }

  // Skilly
  const skillsBox = document.getElementById("skillsBox");
  if (skillsBox) {
    skillsBox.querySelectorAll("input").forEach(c => {
      const hasSkill = e.skills && e.skills.includes(c.value);
      c.checked = hasSkill;
      c.parentElement.classList.toggle("active", hasSkill);
    });
  }
}
window.edit = edit;
// Ostatní funkce (Broadcast atd.)
window.openBroadcast = async () => {
  const snap = await getDoc(doc(db, "config", "global"));
  document.getElementById("broadcastText").value = snap.data()?.broadcastMessage || "";
  document.getElementById("broadcastModal").style.display = "block";
};
window.closeBroadcast = () => document.getElementById("broadcastModal").style.display = "none";
window.saveBroadcast = async () => {
  await setDoc(doc(db, "config", "global"), { broadcastMessage: document.getElementById("broadcastText").value }, { merge: true });
  alert("Uloženo");
  window.closeBroadcast();
};

// Spuštění načítání
load();

</script>
