<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaměstnanci | ShiftMaster</title>

<style>
/* 1. MODERNÍ DESIGN Z INDEXU (PŘESNÁ KOPIE) */
body {
    margin: 0; padding: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    color: white; font-family: sans-serif;
    background-color: #030712 !important;
    background-image: 
        radial-gradient(circle at 50% -20%, rgba(34, 197, 94, 0.4) 0%, rgba(3, 7, 18, 0) 60%),
        linear-gradient(to top, rgba(34, 197, 94, 0.1) 0%, rgba(3, 7, 18, 0) 40%) !important;
    background-attachment: fixed !important;
}

/* 2. TOPBAR */
.topbar {
    width: 100%; height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: rgba(2, 6, 23, 0.8); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-sizing: border-box; z-index: 100;
}
.menuBtn {
    padding: 8px 14px; border-radius: 10px; border: none; font-weight: 800;
    background: #334155; color: white; cursor: pointer;
}

/* 3. HERO SEKCE (LOGA A PROLNUTÍ) */
.hero-container {
    display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 10px;
}
.logo-main {
    font-size: 42px; font-weight: 300; margin: 0; color: white; text-align: center;
}
.logo-main b { color: #22c55e; text-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }

.stack-box {
    position: relative; width: 320px; height: 120px;
    display: flex; justify-content: center; align-items: center; margin-top: -10px;
}
.skoda-blend-layer {
    width: 100%; height: auto; mix-blend-mode: screen; 
    filter: contrast(1.2) brightness(0.8) grayscale(1); opacity: 0.4;
    position: absolute; z-index: 1;
}

/* 4. KONTEJNER A SKLENĚNÉ KARTY */
.container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }

.card {
    background: rgba(17, 24, 39, 0.4) !important;
    backdrop-filter: blur(12px) !important; -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 20px !important; padding: 20px; margin-bottom: 15px;
}

/* 5. TVÉ PŮVODNÍ STYLY PRO STATUSY A DOVEDNOSTI (ZACHOVÁNO) */
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
.skillItem {
    background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.5);
    padding: 12px 5px; border-radius: 10px; cursor: pointer; text-align: center;
    font-weight: 800; font-size: 11px; transition: all 0.2s; color: white;
}
.skillItem.active { background: rgba(34, 197, 94, 0.6); border: 1px solid #22c55e; }

input, select, textarea {
    width: 100%; padding: 12px; border-radius: 20px; border: none; 
    margin-bottom: 12px; background: white; color: black; font-weight: 700;
}

.addBtn, .save { background: #22c55e; width: 100%; padding: 16px; border-radius: 14px; border: none; color: white; font-weight: 800; cursor: pointer; }
.delete { background: #dc2626; width: 100%; padding: 16px; border-radius: 14px; border: none; color: white; margin-top: 10px; }

/* STATUSY BAREVNĚ */
.status-work { background-color: #15803d !important; color: white !important; }
.status-vacation { background-color: #eab308 !important; color: black !important; }
.status-sick { background-color: #b91c1c !important; color: white !important; }

.empRow {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(15, 23, 42, 0.7); padding: 12px 16px; margin-bottom: 8px;
    border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05);
}

/* 6. MODÁLY */
.modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 10000; overflow-y: auto; align-items: center; justify-content: center; padding: 20px;
}
.modalBox {
    background: #0f172a; padding: 25px; border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px;
}
</style>
</head>
<body>

<div class="topbar">
    <div style="font-weight: 800;">👥 Zaměstnanci</div>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="hero-container">
    <h1 class="logo-main">Shift<b>Master</b></h1>
    <div class="stack-box">
        <img src="pozadi.jpg" class="skoda-blend-layer" alt="Škoda">
    </div>
</div>

<div class="container">
    <button class="addBtn" onclick="openNew()">+ PŘIDAT ZAMĚSTNANCE</button>
    <button class="addBtn" style="background:#0ea5e9; margin-top:10px;" onclick="openBroadcast()">📢 HROMADNÁ ZPRÁVA</button>
    <div id="list" style="margin-top: 20px;"></div>
</div>

<!-- MODÁL ZAMĚSTNANEC -->
<div id="modal" class="modal">
  <div class="modalBox">
    <h3 style="text-align:center;">Karta zaměstnance</h3>
    <input id="fName" placeholder="Jméno">
    <input id="lName" placeholder="Příjmení">
    <input id="email" placeholder="Email">
    <textarea id="info" placeholder="Poznámka"></textarea>

    <h4>Pozice</h4>
    <div id="skillsBox" class="skills"></div>

    <h4 style="margin-top:15px;">Stav dnes</h4>
    <select id="status">
      <option value="work">V práci</option>
      <option value="vacation">Dovolená</option>
      <option value="sick">Nemoc</option>
      <option value="shitmaking">Parťák</option>
    </select>

    <button class="save" onclick="saveEmp()">Uložit</button>
    <button id="delBtn" class="delete" style="display:none" onclick="deleteEmp()">Smazat</button>
    <button class="save" style="background:#64748b; margin-top:10px;" onclick="closeModal()">Zavřít</button>
  </div>
</div>

<!-- MODÁL ZPRÁVA -->
<div id="broadcastModal" class="modal">
  <div class="modalBox">
    <h3>📢 Hromadná zpráva</h3>
    <textarea id="broadcastText" style="min-height:120px;" placeholder="Text pro všechny..."></textarea>
    <button class="save" onclick="saveBroadcast()">Uložit a odeslat</button>
    <button class="save" style="background:#64748b; margin-top:10px;" onclick="closeBroadcast()">Zavřít</button>
  </div>
</div>

<script type="module">
// TVŮJ KOMPLETNÍ FIREBASE KÓD (NIC NECHYBÍ)
import { initializeApp } from "https://www.gstatic.com";
import { getFirestore, collection, getDocs, doc, setDoc, getDoc, deleteDoc, updateDoc } from "https://www.gstatic.com";

const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const POSITIONS = ["DP-L","DP-P","ZRC-L","ZRC-P","T-L","T-P","AGR-LP","AGR-PP","AGR-PZ","AGR-LZ","MOT-L","MOT-P","LEP-LP","LEP-PP","LEP-Z","REPRO-L","REPRO-P","VYP1-L","VYP1-P","VYP2-L","VYP2-P","PR-L","PR-P","ZAM-L","ZAM-P","VET","VET2","INST","INST2","JINE","JINE2"];

let currentEditId = null;

// RENDER POZIC V MODÁLU
const skillsBox = document.getElementById("skillsBox");
POSITIONS.forEach(p => {
    skillsBox.innerHTML += `<div class="skillItem" data-val="${p}">${p}</div>`;
});

document.querySelectorAll(".skillItem").forEach(item => {
    item.onclick = () => item.classList.toggle("active");
});

// NAČTENÍ SEZNAMU
async function load() {
    const list = document.getElementById("list");
    try {
        const snap = await getDocs(collection(db, "employees"));
        list.innerHTML = "";
        snap.forEach(d => {
            const e = d.data();
            list.innerHTML += `
                <div class="empRow">
                    <span style="font-weight:800;">${e.fName || e.name} ${e.lName || ""}</span>
                    <button class="menuBtn" style="background:#1e293b" onclick="editEmp('${d.id}')">UPRAVIT</button>
                </div>
            `;
        });
    } catch(e) { console.error(e); }
}

window.openNew = () => {
    currentEditId = null;
    document.getElementById("modal").style.display = "flex";
    document.getElementById("delBtn").style.display = "none";
    document.querySelectorAll(".skillItem").forEach(i => i.classList.remove("active"));
};

window.closeModal = () => document.getElementById("modal").style.display = "none";

window.editEmp = async (id) => {
    currentEditId = id;
    const snap = await getDoc(doc(db, "employees", id));
    const e = snap.data();
    document.getElementById("fName").value = e.fName || e.name || "";
    document.getElementById("lName").value = e.lName || "";
    document.getElementById("email").value = e.email || "";
    document.getElementById("info").value = e.info || "";
    document.getElementById("status").value = e.statusToday || "work";
    
    document.querySelectorAll(".skillItem").forEach(i => {
        i.classList.toggle("active", e.skills && e.skills.includes(i.dataset.val));
    });
    
    document.getElementById("modal").style.display = "flex";
    document.getElementById("delBtn").style.display = "block";
};

window.saveEmp = async () => {
    const skills = [...document.querySelectorAll(".skillItem.active")].map(i => i.dataset.val);
    const data = {
        fName: document.getElementById("fName").value,
        lName: document.getElementById("lName").value,
        email: document.getElementById("email").value,
        info: document.getElementById("info").value,
        statusToday: document.getElementById("status").value,
        skills: skills
    };
    if(currentEditId) await setDoc(doc(db, "employees", currentEditId), data);
    else await setDoc(doc(collection(db, "employees")), data);
    closeModal();
    load();
};

window.deleteEmp = async () => {
    if(confirm("Smazat?")) {
        await deleteDoc(doc(db, "employees", currentEditId));
        closeModal();
        load();
    }
};

window.openBroadcast = () => document.getElementById("broadcastModal").style.display = "flex";
window.closeBroadcast = () => document.getElementById("broadcastModal").style.display = "none";
window.saveBroadcast = async () => {
    await setDoc(doc(db, "config", "global"), { broadcastMessage: document.getElementById("broadcastText").value });
    closeBroadcast();
    alert("Zpráva odeslána");
};

load();
</script>
</body>
</html>
