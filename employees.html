<script>
function updateSingleColor(el) {
    if (!el) return;
    
    // Seznam všech možných barevných tříd k odstranění
    const colors = ['bg-v-praci', 'bg-dovolena', 'bg-paragraf', 'bg-nemoc', 'bg-parfak', 'bg-pujceny', 'bg-propujceny', 'bg-volno'];
    
    // Odstraníme staré barvy
    el.classList.remove(...colors);
    
    // Vytvoříme název nové třídy (např. "V práci" -> "bg-v-praci")
    const val = el.value.toLowerCase()
        .replace(/\s+/g, '-') // mezery na pomlčky
        .normalize("NFD").replace(/[\u0300-\u036f]/g, ""); // odstraní diakritiku (á -> a)
        
    el.classList.add('bg-' + val);

const row = el.closest('.empRow'); // Najde celý řádek/kartu zaměstnance
    if (row) {
        const status = el.value;
        
        // Těchto 5 stavů způsobí, že řádek v rozpisu zčervená
        const alertStatuses = ["Nemoc", "Paragraf", "Dovolená", "Propůjčený", "Parťák"];

        if (alertStatuses.includes(status)) {
            row.style.backgroundColor = "rgba(220, 38, 38, 0.4)"; // Červené pozadí
            row.style.border = "2px solid #ef4444";             // Červený okraj
            row.classList.add('not-available-alert');           // Přidáme i třídu pro CSS
        } else {
            // Návrat do původního stavu, pokud je v práci (nebo jiný bezpečný stav)
            row.style.backgroundColor = "rgba(255, 255, 255, 0.08)";
            row.style.border = "1px solid rgba(255, 255, 255, 0.15)";
            row.classList.remove('not-available-alert');
        }
    }
}
// Tuto funkci zavolej VŽDY po vykreslení tabulky v onSnapshot
function initAllSelects() {
    document.querySelectorAll('.status-select').forEach(select => {
        updateSingleColor(select); // Obarvíme při načtení
        
        // Přidáme hlídače změny
        select.onchange = function() {
            updateSingleColor(this);
            // Zde by mělo být i tvé volání do Firebase pro uložení:
            // updateDoc(doc(db, "employees", id), { status: this.value });
        };
    });
}

}

const skillsBox = document.getElementById("skillsBox");
const list = document.getElementById("list");

const fNameEl = document.getElementById("fName");
const lNameEl = document.getElementById("lName");
const emailEl = document.getElementById("email");
const infoEl = document.getElementById("info");
const statusEl = document.getElementById("status");
const broadcastModal = document.getElementById("broadcastModal");
const broadcastTextEl = document.getElementById("broadcastText");

/* pozice */

const POSITIONS = [
    ["DP-L","DOORPROTECTOR L"], ["DP-P","DOORPROTECTOR P"],
    ["ZRC-L","ZRCÁTKA L"], ["ZRC-P","ZRCÁTKA P"],
    ["T-L","TĚSNĚNÍ L"], ["T-P","TĚSNĚNÍ P"],
    ["AGR-LP","AGREGÁT LP"], ["AGR-PP","AGREGÁT PP"],
    ["AGR-PZ","AGREGÁT PZ"], ["AGR-LZ","AGREGÁT LZ"],
    ["MOT-L","MOTORY L"], ["MOT-P","MOTORY P"],
    ["LEP-LP","LEPENÍ LP"], ["LEP-PP","LEPENÍ PP"], ["LEP-Z","LEPENÍ Z"],
    ["REPRO-L","REPRÁKY L"], ["REPRO-P","REPRÁKY P"],
    ["VYP-L","VÝPLNĚ L"], ["VYP-P","VÝPLNĚ P"], // Sloučeno VYP1 a VYP2
    ["PR-L","PŘITAHOVAČ L"], ["PR-P","PŘITAHOVAČ P"],
    ["ZAM-L","ZÁMKY L"], ["ZAM-P","ZÁMKY P"],
    ["VET","VĚTRAČKY"], // Sloučeno VET1, VET2, VET3
    ["INST","INSTALACE"] // Sloučeno INST1, INST2, INST3
];

POSITIONS.forEach(p => {
  const div = document.createElement("div");
  div.className = "skillItem";
  // Výchozí stav: 0 = neumí, 1 = zaučuje se (modrá), 2 = umí (zelená)
  div.dataset.level = "0"; 
  div.dataset.val = p[0];
  
  div.innerHTML = `<span>${p[1]}</span>`;
  
  div.onclick = () => {
    let level = parseInt(div.dataset.level);
    level = (level + 1) % 3; // Točí se to: 0 -> 1 -> 2 -> 0
    div.dataset.level = level;

    // Odstraníme staré barvy
    div.classList.remove("active", "trainee");

    if (level === 1) {
        div.classList.add("trainee"); // Přidáme modrou (vytvoříme v CSS)
    } else if (level === 2) {
        div.classList.add("active");  // Tvoje původní zelená
    }
  };
  
  skillsBox.appendChild(div);
});

let editId=null;

window.openNew=()=>{
  editId=null;
  fNameEl.value="";
  lNameEl.value="";
  emailEl.value="";
  infoEl.value="";
  
  // RESET DOVEDNOSTÍ: Projdeme všechny čtverečky v skillsBox
  skillsBox.querySelectorAll(".skillItem").forEach(div => {
    div.dataset.level = "0";             // Vrátíme level na nulu
    div.classList.remove("active");      // Smažeme zelenou (Level 2)
    div.classList.remove("trainee");     // Smažeme modrou (Level 1)
  });

  // Skryjeme tlačítko Smazat (u nového není co mazat)
  const delBtn = document.querySelector(".delete");
  if(delBtn) delBtn.style.display = "none";

  modal.style.display="block";
};

window.closeModal=()=> modal.style.display="none";
/* SAVE */

const saveEmp = async () => {
    console.log("KLIKNUTO: Spouštím ukládání...");
    try {
        // Načtení hodnot z políček
        let fname = document.getElementById("fName")?.value.trim() || "";
        let lname = document.getElementById("lName")?.value.trim() || "";
        const email = document.getElementById("email")?.value || "";
        const info = document.getElementById("info")?.value || "";
        const empType = document.getElementById("empType")?.value || "kmenovy";
        
        // Kontrola, zda jsou vyplněna základní jména
        if (!fname || !lname) {
            showBtnFeedback(".save", "Chybí jméno!", "error");
            return;
        }

        // --- OPRAVA VELKÝCH PÍSMEN (Jméno i Příjmení/Přezdívka) ---
        // První písmeno velké, zbytek malým
       fname = fname.trim().charAt(0).toUpperCase() + fname.trim().slice(1);
        lname = lname.trim().charAt(0).toUpperCase() + lname.trim().slice(1);
        // Posbírání dovedností (skills) z mřížky
        let skills = {};
        const sBox = document.getElementById("skillsBox");
        if (sBox) {
            sBox.querySelectorAll(".skillItem").forEach(div => {
                const lvl = parseInt(div.dataset.level);
                if (lvl > 0) {
                    // Uložíme jako např. "DP-L": 2
                    skills[div.dataset.val] = lvl;
                }
            });
        }

        // Generování ID (bez diakritiky, malými písmeny, s podtržítkem)
        const id = editId || (fname + "_" + lname).toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/\s/g, "");
        
        const docRef = doc(db, "employees", id);

        // Příprava dat pro Firebase
        const empData = {
            name: fname,      // Toto je ta přezdívka, co se píše do rozpisu
            surname: lname,   // Celé jméno
            email: email.toLowerCase().trim(),
            info: info,
            skills: skills,
            type: empType
        };

        // Pokud je to úplně nový člověk, nastavíme mu roli 'user'
        if (!editId) { 
            empData.role = "user"; 
        }

        // ULOŽENÍ DO DATABÁZE
        await setDoc(docRef, empData, { merge: true });
        
        // Zpětná vazba pro uživatele (zelené tlačítko)
        showBtnFeedback(".save", "Uloženo do systému");
        
        // Zavření okna a refresh seznamu
        setTimeout(() => { 
            document.getElementById("modal").style.display = "none"; 
            if (typeof load === "function") load(); 
        }, 1200);

    } catch (e) {
        console.error("Chyba Firebase:", e);
        showBtnFeedback(".save", "Chyba databáze", "error");
    }
};

// --- PROPOJENÍ S OKNEM (STAČÍ POUZE JEDNOU) ---
window.saveEmp = saveEmp;

window.deleteEmp = async () => {
    if (!editId) return;
    const delBtn = document.querySelector(".delete");

    // První fáze - Potvrzení
    if (!delBtn.dataset.confirm) {
        delBtn.dataset.confirm = "true";
        delBtn.innerHTML = `<div style="display:flex; align-items:center; justify-content:center;"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="3" fill="none" style="margin-right:8px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> Opravdu smazat?</div>`;
        delBtn.style.background = "#000";
        
        setTimeout(() => { 
            delete delBtn.dataset.confirm;
            delBtn.innerHTML = "Smazat ze systému";
            delBtn.style.background = "#dc2626";
        }, 4000);
        return;
    }

    // Druhá fáze - Smazání
    try {
        await deleteDoc(doc(db, "employees", editId));
        showBtnFeedback(".delete", "Odstraněno", "delete");
        setTimeout(() => { modal.style.display = "none"; load(); }, 1200);
    } catch (e) {
        showBtnFeedback(".delete", "Chyba!", "error");
    }
};

// 3. FUNKCE PRO NAČTENÍ SEZNAMU (ROZDĚLENÍ NA SEKCE)
async function load() {
  const listDiv = document.getElementById("list");
  if (!listDiv) return;
  listDiv.innerHTML = "<p style='color:gray; text-align:center; padding: 20px;'>Načítám data...</p>";

  const snap = await getDocs(collection(db, "employees"));
  let emps = [];
  snap.forEach(d => {
    const data = d.data();
    emps.push({ id: d.id, ...data });
  });

  // Seřazení A-Z podle příjmení
  emps.sort((a, b) => (a.surname || "").localeCompare(b.surname || ""));

  const kmenovi = emps.filter(e => e.type !== "pujceny");
  const pujceni = emps.filter(e => e.type === "pujceny");

  // Definice moderních ikon (SVG)
  const iconKmenovi = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`;
  const iconPujceni = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><path d="m7 16 3-3-3-3"></path><path d="M13 7h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-2"></path><path d="m9 11-3 3 3 3"></path><path d="M11 17H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"></path></svg>`;
  const iconChevron = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;"><polyline points="9 18 15 12 9 6"></polyline></svg>`;

  let html = "";

  // 1. SEKCE MOJI ZAMĚSTNANCI
  html += `
    <div style="display: flex; align-items: center; margin: 25px 0 12px 5px; color: #22c55e;">
      ${iconKmenovi}
      <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;">Moji Zaměstnanci (${kmenovi.length})</span>
    </div>`;

  kmenovi.forEach(e => {
    // TADY JE TA ÚPRAVA: Pokud má příjmení, dáme ho do závorky
    const displayFull = e.surname ? `${e.name} (${e.surname})` : e.name;
    
    html += `
      <div class="empRow" style="border-left: 4px solid #22c55e; margin-bottom: 8px;" onclick="edit('${e.id}')">
        <div class="empName">${displayFull}</div>
        ${iconChevron}
      </div>`;
  });

  // 2. SEKCE PŮJČENÍ / VÝPOMOC
  if (pujceni.length > 0) {
    html += `
      <div style="display: flex; align-items: center; margin: 35px 0 12px 5px; color: #3b82f6;">
        ${iconPujceni}
        <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;">Půjčení / Výpomoc (${pujceni.length})</span>
      </div>`;

    pujceni.forEach(e => {
      // TADY TAKÉ:
      const displayFull = e.surname ? `${e.name} (${e.surname})` : e.name;

      html += `
        <div class="empRow" style="border-left: 4px solid #3b82f6; margin-bottom: 8px; opacity: 0.85;" onclick="edit('${e.id}')">
          <div class="empName">${displayFull}</div>
          ${iconChevron}
        </div>`;
    });
  }

  listDiv.innerHTML = html;
}

// 4. FUNKCE PRO EDITACI (OPRAVENÁ CHYBA NULL)
async function edit(id) {
  const snap = await getDoc(doc(db, "employees", id));
  const e = snap.data();
  if (!e) return;

  editId = id;
  modal.style.display = "block";

  // --- TADY JE TA OPRAVA PRO TLAČÍTKO SMAZAT ---
  const delBtn = document.querySelector(".delete");
  if (delBtn) delBtn.style.display = "block"; 
  // --------------------------------------------

  // Přímé přiřazení do políček
  document.getElementById("fName").value = e.name || "";
  document.getElementById("lName").value = e.surname || "";
  document.getElementById("email").value = e.email || "";
  document.getElementById("info").value = e.info || "";
  
  if(document.getElementById("empType")) {
    document.getElementById("empType").value = e.type || "kmenovy";
  }

  // Skilly
  const skillsBox = document.getElementById("skillsBox");
  if (skillsBox) {
    skillsBox.querySelectorAll(".skillItem").forEach(div => {
      const val = div.dataset.val; 
      let lvl = 0;

      if (e.skills) {
        if (typeof e.skills[val] === 'number') {
          lvl = e.skills[val];
        } 
        else if (Array.isArray(e.skills) && e.skills.includes(val)) {
          lvl = 2; 
        }
      }

      div.dataset.level = lvl;
      div.classList.remove("active", "trainee");
      
      if (lvl === 1) {
        div.classList.add("trainee"); 
      } else if (lvl === 2) {
        div.classList.add("active");  
      }
    });
  }
}
window.edit = edit;
// Ostatní funkce (Broadcast atd.)
window.openBroadcast = async () => {
  const snap = await getDoc(doc(db, "config", "global"));
  document.getElementById("broadcastText").value = snap.data()?.broadcastMessage || "";
  document.getElementById("broadcastModal").style.display = "block";
};
window.closeBroadcast = () => document.getElementById("broadcastModal").style.display = "none";
window.saveBroadcast = async () => {
  await setDoc(doc(db, "config", "global"), { broadcastMessage: document.getElementById("broadcastText").value }, { merge: true });
  alert("Uloženo");
  window.closeBroadcast();
};

// Spuštění načítání
load();

</script>
