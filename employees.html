<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaměstnanci</title>

<style>
/* 1. GLOBÁLNÍ RESET A POZADÍ */
* {
    box-shadow: none !important;
    border: none !important;
    outline: none !important;
}

body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: white;
    font-family: sans-serif;
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg');
    background-size: cover !important; /* Pro mobilní telefony lepší cover */
    background-position: center !important;
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
    background-color: #030712 !important;
}

/* 2. HLAVNÍ STRUKTURA (APP A KARTY) */
.app {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    background: transparent !important;
}

.card {
    background: rgba(17, 24, 39, 0.4) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border-radius: 20px !important;
    padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
}

/* Úklid vnořených prvků a menu */
.card .card, #menuCard, .menu, .app div:not(.card), main, section {
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
    padding: 0;
}

/* 3. TEXTOVÉ PRVKY */
.logo { font-size: 34px; font-weight: 900; text-align: center; }
.sub { text-align: center; opacity: .7; margin-bottom: 20px; }
.roleTag { 
    text-align: center; 
    margin: 10px 0 !important; 
    color: #22c55e !important; /* Škoda zelená */
    font-weight: bold;
    background: transparent !important;
}

/* 4. TLAČÍTKA A INTERAKCE */
.menu button, .mainBtn {
    width: 100%;
    padding: 16px !important;
    border-radius: 12px;
    margin-top: 10px;
    font-weight: 800;
    font-size: 16px !important;
    color: white !important;
    transition: 0.15s;
    cursor: pointer;
}

/* Barevné a průhledné varianty tlačítek */
.btnEmployees { background: rgba(124, 58, 237, 0.5) !important; }
.btnGenerator { background: rgba(245, 158, 11, 0.5) !important; }
.btnSchedule  { background: rgba(22, 163, 74, 0.5) !important; }
.btnCalendar  { background: rgba(220, 38, 38, 0.5) !important; }
.btnStats     { background: rgba(6, 182, 212, 0.5) !important; }
.logout       { background: rgba(55, 65, 81, 0.5) !important; }

.menu button:hover, .mainBtn:hover { filter: brightness(1.2); transform: scale(1.01); }
.menu button:active { transform: scale(0.98); }

/* 5. POMOCNÉ TŘÍDY */
.hidden { display: none; }
hr, .divider { display: none !important; }

/* Responzivita pro malé mobily */
@media (max-width: 400px) {
    .app { padding: 10px; }
    .logo { font-size: 28px; }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="topTitle">👥 Zaměstnanci</div>
  <button class="menuBtn" onclick="location.href='index.html'">
    Menu
  </button>
</div>

<div class="container">
<button class="addBtn" onclick="openNew()">+ Přidat zaměstnance</button>
<button class="addBtn" style="background:#0ea5e9" onclick="openBroadcast()">
📢 Hromadná zpráva všem
</button>
<div id="list"></div>
</div>

<div id="modal" class="modal">
  <div class="modalBox">

    <input id="fName" placeholder="Jméno">
    <input id="lName" placeholder="Příjmení">
    <input id="email" placeholder="Email zaměstnance">
    <textarea id="info" placeholder="Poznámka"></textarea>

    <h4>Pozice</h4>
    <div id="skillsBox" class="skills"></div>

    <h4>Stav dnes</h4>
    <select id="status">
  <option value="work">V práci</option>
  <option value="vacation">Dovolená</option>
  <option value="paragraf">Paragraf</option>
  <option value="sick">Nemoc</option>
  <option value="shitmaking">Shit making</option>
  <option value="borrowed">Půjčený</option>
  <option value="loaned">Propůjčený</option>
</select>


    <button class="save" onclick="saveEmp()">Uložit</button>
    <button class="delete" onclick="deleteEmp()">Smazat</button>
    <button class="close" onclick="closeModal()">Zavřít</button>

  </div>
</div>
</div>
<div id="broadcastModal" class="modal">
  <div class="modalBox">
    <h3>📢 Hromadná zpráva</h3>
    <textarea id="broadcastText" placeholder="Text pro všechny zaměstnance"></textarea>
    <button class="save" onclick="saveBroadcast()">Uložit zprávu</button>
    <button class="close" onclick="closeBroadcast()">Zavřít</button>
  </div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  deleteDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
  measurementId: "G-1HF3R93D92"
});

const auth = getAuth(app);
const db = getFirestore(app);

/* 🔒 musí být přihlášen */

onAuthStateChanged(auth, u=>{
  if(!u){
    alert("Nejsi přihlášen");
    location.href="index.html";
  }
});

/* DOM */

const modal = document.getElementById("modal");
const skillsBox = document.getElementById("skillsBox");
const list = document.getElementById("list");

const fNameEl = document.getElementById("fName");
const lNameEl = document.getElementById("lName");
const emailEl = document.getElementById("email");
const infoEl = document.getElementById("info");
const statusEl = document.getElementById("status");
const broadcastModal = document.getElementById("broadcastModal");
const broadcastTextEl = document.getElementById("broadcastText");

/* pozice */

const POSITIONS = [
["DP-L","DOORPROTECTOR L"],["DP-P","DOORPROTECTOR P"],
["ZRC-L","ZRCÁTKA L"],["ZRC-P","ZRCÁTKA P"],
["T-L","TĚSNĚNÍ L"],["T-P","TĚSNĚNÍ P"],
["AGR-LP","AGREGÁT LP"],["AGR-PP","AGREGÁT PP"],
["AGR-PZ","AGREGÁT PZ"],["AGR-LZ","AGREGÁT LZ"],
["MOT-L","MOTORY L"],["MOT-P","MOTORY P"],
["LEP-LP","LEPENÍ LP"],["LEP-PP","LEPENÍ PP"],
["LEP-Z","LEPENÍ Z"],
["REPRO-L","REPRÁKY L"],["REPRO-P","REPRÁKY P"],
["VYP1-L","VÝPLNĚ 1 L"],["VYP1-P","VÝPLNĚ 1 P"],
["VYP2-L","VÝPLNĚ 2 L"],["VYP2-P","VÝPLNĚ 2 P"],
["PR-L","PŘITAHOVAČ L"],["PR-P","PŘITAHOVAČ P"],
["ZAM-L","ZÁMKY L"],["ZAM-P","ZÁMKY P"],
["VET","VĚTRAČKY"],["VET2","VĚTRAČKY 2"],["INST","INSTALACE"],["INST2","INSTALACE 2"],
["JINE","JINÝ ÚSEK"],["JINE2","JINÝ ÚSEK 2"],

];

POSITIONS.forEach(p=>{
  const div=document.createElement("div");
  div.className="skillItem";
  div.innerHTML=`<input type="checkbox" value="${p[0]}"> ${p[1]}`;
  div.onclick=()=>{
    const cb=div.querySelector("input");
    cb.checked=!cb.checked;
    div.classList.toggle("active",cb.checked);
  };
  skillsBox.appendChild(div);
});

let editId=null;

window.openNew=()=>{
  editId=null;
  fNameEl.value="";
  lNameEl.value="";
  emailEl.value="";
  infoEl.value="";
  statusEl.value="work";
  skillsBox.querySelectorAll("input").forEach(c=>{
    c.checked=false;
    c.parentElement.classList.remove("active");
  });
  modal.style.display="block";
};

window.closeModal=()=> modal.style.display="none";

/* SAVE */

window.saveEmp = async ()=>{

 try{

  if(!fNameEl.value || !lNameEl.value){
    alert("Vyplň jméno a příjmení");
    return;
  }

  const skills=[...skillsBox.querySelectorAll("input:checked")]
    .map(x=>x.value);

  const id = editId || (fNameEl.value+"_"+lNameEl.value)
    .toLowerCase().replace(/\s+/g,"_");

  await setDoc(doc(db,"employees",id),{
  name:fNameEl.value,
  surname:lNameEl.value,
  email:emailEl.value.toLowerCase().trim(),
  info:infoEl.value,
  skills,
  statusToday:statusEl.value
});


  alert("Uloženo");
  modal.style.display="none";
  load();

 }catch(e){
  alert("CHYBA: "+e.message);
  console.error(e);
 }

};

/* DELETE */

window.deleteEmp = async ()=>{

 if(!editId) return;

 const ok = confirm("Opravdu chceš smazat záznam zaměstnance?");

 if(!ok) return;

 await deleteDoc(doc(db,"employees",editId));

 alert("Smazáno");
 modal.style.display="none";
 load();
};

function paintStatusSelect(sel){

 sel.classList.remove(
  "status-work",
  "status-vacation",
  "status-sick",
  "status-paragraf",
  "status-shitmaking",
  "status-borrowed",
  "status-loaned"
 );


  sel.classList.add("status-" + sel.value);
}

/* LIST */

async function load(){
 list.innerHTML="";
 const snap = await getDocs(collection(db,"employees"));

 snap.forEach(d=>{
  const e=d.data();
  const row=document.createElement("div");
  row.className="empRow";
  row.innerHTML=`
   <div class="empName">${e.name} ${e.surname}</div>
   <select>
  <option value="work">Práce</option>
  <option value="vacation">Dovolená</option>
  <option value="paragraf">Paragraf</option>
  <option value="sick">Nemoc</option>
  <option value="shitmaking">Shit making</option>
  <option value="borrowed">Půjčený</option>
  <option value="loaned">Propůjčený</option>
</select>
`;

  row.querySelector(".empName").onclick=()=>edit(d.id);
  const sel=row.querySelector("select");
  sel.value=e.statusToday || "work";
  paintStatusSelect(sel);
  sel.onchange=ev=>{
  paintStatusSelect(ev.target);
  setDoc(doc(db,"employees",d.id),
    {statusToday:ev.target.value},{merge:true});
};


  list.appendChild(row);
 });
}

async function edit(id){
 const snap=await getDoc(doc(db,"employees",id));
 const e=snap.data();
 editId=id;
 modal.style.display="block";
 fNameEl.value=e.name;
 lNameEl.value=e.surname;
 emailEl.value = e.email || "";
 infoEl.value=e.info;
 statusEl.value=e.statusToday||"work";
 skillsBox.querySelectorAll("input").forEach(c=>{
   c.checked=e.skills?.includes(c.value);
   c.parentElement.classList.toggle("active",c.checked);
 });
}

load();

window.openBroadcast = async ()=>{

 const snap = await getDoc(doc(db,"config","global"));
 broadcastTextEl.value = snap.data()?.broadcastMessage || "";
 broadcastModal.style.display = "block";
};

window.closeBroadcast = ()=> broadcastModal.style.display="none";

window.saveBroadcast = async ()=>{

 await setDoc(doc(db,"config","global"),{
   broadcastMessage: broadcastTextEl.value
 },{merge:true});

 alert("Uloženo pro všechny");
 broadcastModal.style.display="none";
};

</script>
</body>
</html>
