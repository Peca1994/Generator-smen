<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaměstnanci - Generátor směn</title>
    <style>
        /* 1. GLOBÁLNÍ STYL A ZAPUŠTĚNÉ POZADÍ */
        body {
            background: radial-gradient(circle at center, #111827 0%, #000000 100%) !important;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Obří zapuštěný nápis ŠKODA na pozadí */
        body::before {
            content: "ŠKODA";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            font-size: 18vw;
            font-weight: 900;
            letter-spacing: 20px;
            color: rgba(255, 255, 255, 0.02);
            pointer-events: none;
            text-transform: uppercase;
        }

        /* 2. TOPBAR A KONTEJNERY */
        .topbar { 
            height: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 20px; 
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .topTitle { font-weight: 700; font-size: 18px; }

        .container { 
            width: 95%;
            max-width: 500px; 
            margin: 20px auto !important; 
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* 3. MODERNÍ KARTY ZAMĚSTNANCŮ */
        .empRow {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            background: rgba(30, 41, 59, 0.4) !important;
            backdrop-filter: blur(8px);
            padding: 12px 16px !important;
            margin-bottom: 10px !important;
            border-radius: 16px !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .empName {
            font-weight: 600 !important;
            font-size: 15px !important;
            color: #f1f5f9 !important;
            flex: 1 !important;
            text-align: left !important;
            cursor: pointer;
        }

        .empRow select {
            width: 130px !important;
            margin-bottom: 0 !important;
            padding: 8px !important;
            font-size: 13px !important;
            border-radius: 12px !important;
            font-weight: 900 !important;
        }

        /* 4. MODÁL A MŘÍŽKA POZIC */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85) !important; z-index: 10000; overflow-y: auto; align-items: flex-start; justify-content: center; padding: 20px 10px; }
        .modalBox { background: #0f172a !important; padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); width: 100%; max-width: 450px; margin: 40px auto !important; box-shadow: 0 20px 50px #000; }

        .skills { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 8px !important; margin-top: 15px !important; }

        .skillItem {
            background: rgba(220, 38, 38, 0.2) !important; 
            border: 1px solid rgba(220, 38, 38, 0.5) !important;
            padding: 12px 5px !important; 
            border-radius: 10px !important; 
            cursor: pointer; 
            display: flex !important;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 800; 
            font-size: 11px; 
            min-height: 50px; 
            transition: all 0.2s ease;
            color: white;
        }

        .skillItem.active { background: rgba(34, 197, 94, 0.6) !important; border: 1px solid #22c55e !important; }
        .skillItem input { display: none !important; }

        /* 5. TLAČÍTKA A POLE */
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 20px !important;
            border: none !important; margin-bottom: 12px; 
            background: white !important; color: black !important; 
            font-weight: 700; box-sizing: border-box !important;
            text-align: center;
        }

        .addBtn, .save, .delete, .close { 
            width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 800; margin-top: 10px; color: white !important; cursor: pointer;
        }
        .addBtn, .save { background: #22c55e !important; }
        .delete { background: #dc2626 !important; }
        .close { background: #64748b !important; }

        .menuBtn { padding: 8px 14px; border-radius: 10px; border: none; font-weight: 800; background: rgba(51, 65, 85, 0.8); color: white; cursor: pointer; }

        /* Barvy statusů */
        .status-work { background-color: #15803d !important; color: white !important; }
        .status-vacation { background-color: #eab308 !important; color: black !important; }
        .status-paragraf { background-color: #7e22ce !important; color: white !important; }
        .status-sick { background-color: #b91c1c !important; color: white !important; }
        .status-shitmaking { background-color: #1d4ed8 !important; color: white !important; }
        .status-borrowed { background-color: #000000 !important; color: white !important; border: 1px solid #444 !important; }
        .status-loaned { background-color: #15803d !important; color: white !important; }

        label, h1, h2, h3, h4 { color: white !important; font-weight: 900; text-shadow: 2px 2px 4px #000; text-align: center; }
    </style>
</head>
<body>

<div class="topbar">
  <div class="topTitle">👥 Zaměstnanci</div>
  <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">
    <button class="addBtn" onclick="openNew()">+ Přidat zaměstnance</button>
    <button class="addBtn" style="background:#0ea5e9 !important" onclick="openBroadcast()">📢 Hromadná zpráva všem</button>
    <div id="list"></div>
</div>

<!-- MODÁL ZAMĚSTNANCE -->
<div id="modal" class="modal">
  <div class="modalBox">
    <input id="fName" placeholder="Jméno">
    <input id="lName" placeholder="Příjmení">
    <input id="email" placeholder="Email zaměstnance">
    <textarea id="info" placeholder="Poznámka"></textarea>
    <h4>Pozice</h4>
    <div id="skillsBox" class="skills"></div>
    <h4>Stav dnes</h4>
    <select id="status">
        <option value="work">V práci</option>
        <option value="vacation">Dovolená</option>
        <option value="paragraf">Paragraf</option>
        <option value="sick">Nemoc</option>
        <option value="shitmaking">Parťák</option>
        <option value="borrowed">Půjčený</option>
        <option value="loaned">Propůjčený</option>
    </select>
    <button class="save" onclick="saveEmp()">Uložit</button>
    <button class="delete" onclick="deleteEmp()">Smazat</button>
    <button class="close" onclick="closeModal()">Zavřít</button>
  </div>
</div>

<!-- HROMADNÁ ZPRÁVA -->
<div id="broadcastModal" class="modal">
  <div class="modalBox">
    <h3>📢 Hromadná zpráva</h3>
    <textarea id="broadcastText" placeholder="Text pro všechny..."></textarea>
    <button class="save" onclick="saveBroadcast()">Uložit zprávu</button>
    <button class="close" onclick="closeBroadcast()">Zavřít</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, getDoc } from "https://www.gstatic.com";

const app = initializeApp({
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
    measurementId: "G-1HF3R93D92"
});

const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, u=>{ if(!u){ alert("Nejsi přihlášen"); location.href="index.html"; }});

const modal = document.getElementById("modal");
const skillsBox = document.getElementById("skillsBox");
const list = document.getElementById("list");
const fNameEl = document.getElementById("fName");
const lNameEl = document.getElementById("lName");
const emailEl = document.getElementById("email");
const infoEl = document.getElementById("info");
const statusEl = document.getElementById("status");
const broadcastModal = document.getElementById("broadcastModal");
const broadcastTextEl = document.getElementById("broadcastText");

const POSITIONS = [
    ["DP-L","DOORPROTECTOR L"],["DP-P","DOORPROTECTOR P"],["ZRC-L","ZRCÁTKA L"],["ZRC-P","ZRCÁTKA P"],
    ["T-L","TĚSNĚNÍ L"],["T-P","TĚSNĚNÍ P"],["AGR-LP","AGREGÁT LP"],["AGR-PP","AGREGÁT PP"],
    ["AGR-PZ","AGREGÁT PZ"],["AGR-LZ","AGREGÁT LZ"],["MOT-L","MOTORY L"],["MOT-P","MOTORY P"],
    ["LEP-LP","LEPENÍ LP"],["LEP-PP","LEPENÍ PP"],["LEP-Z","LEPENÍ Z"],["REPRO-L","REPRÁKY L"],
    ["REPRO-P","REPRÁKY P"],["VYP1-L","VÝPLNĚ 1 L"],["VYP1-P","VÝPLNĚ 1 P"],["VYP2-L","VÝPLNĚ 2 L"],
    ["VYP2-P","VÝPLNĚ 2 P"],["PR-L","PŘITAHOVAČ L"],["PR-P","PŘITAHOVAČ P"],["ZAM-L","ZÁMKY L"],
    ["ZAM-P","ZÁMKY P"],["VET","VĚTRAČKY"],["VET2","VĚTRAČKY 2"],["INST","INSTALACE"],
    ["INST2","INSTALACE 2"],["JINE","JINÝ ÚSEK"],["JINE2","JINÝ ÚSEK 2"]
];

POSITIONS.forEach(p => {
    const div = document.createElement("div");
    div.className = "skillItem";
    div.innerHTML = `<input type="checkbox" value="${p[0]}">${p[1]}`;
    div.onclick = () => {
        const cb = div.querySelector("input");
        cb.checked = !cb.checked;
        div.classList.toggle("active", cb.checked);
    };
    skillsBox.appendChild(div);
});

let editId=null;

window.openNew=()=>{
    editId=null; fNameEl.value=""; lNameEl.value=""; emailEl.value=""; infoEl.value=""; statusEl.value="work";
    skillsBox.querySelectorAll("input").forEach(c=>{ c.checked=false; c.parentElement.classList.remove("active"); });
    modal.style.display="block";
};

window.closeModal=()=> modal.style.display="none";

window.saveEmp = async ()=>{
    try{
        if(!fNameEl.value || !lNameEl.value){ alert("Vyplň jméno a příjmení"); return; }
        const skills=[...skillsBox.querySelectorAll("input:checked")].map(x=>x.value);
        const id = editId || (fNameEl.value+"_"+lNameEl.value).toLowerCase().replace(/\s+/g,"_");
        await setDoc(doc(db,"employees",id),{ name:fNameEl.value, surname:lNameEl.value, email:emailEl.value.toLowerCase().trim(), info:infoEl.value, skills, statusToday:statusEl.value });
        alert("Uloženo"); modal.style.display="none"; load();
    }catch(e){ alert("CHYBA: "+e.message); }
};

window.deleteEmp = async ()=>{
    if(!editId) return;
    if(!confirm("Opravdu chceš smazat záznam zaměstnance?")) return;
    await deleteDoc(doc(db,"employees",editId));
    alert("Smazáno"); modal.style.display="none"; load();
};

function paintStatusSelect(sel) {
    const states = ["work", "vacation", "sick", "paragraf", "shitmaking", "borrowed", "loaned"];
    states.forEach(s => sel.classList.remove("status-" + s));
    sel.classList.add("status-" + sel.value);
}

async function load() {
    list.innerHTML = "";
    const snap = await getDocs(collection(db, "employees"));
    snap.forEach(d => {
        const e = d.data();
        const row = document.createElement("div");
        row.className = "empRow";
        row.innerHTML = `
            <div class="empName">${e.name} ${e.surname}</div>
            <select>
                <option value="work">Práce</option>
                <option value="vacation">Dovolená</option>
                <option value="paragraf">Paragraf</option>
                <option value="sick">Nemoc</option>
                <option value="shitmaking">Parťák</option>
                <option value="borrowed">Půjčený</option>
                <option value="loaned">Propůjčený</option>
            </select>`;
        row.querySelector(".empName").onclick = () => edit(d.id);
        const sel = row.querySelector("select");
        sel.value = e.statusToday || "work";
        paintStatusSelect(sel);
        sel.onchange = ev => {
            paintStatusSelect(ev.target);
            setDoc(doc(db, "employees", d.id), { statusToday: ev.target.value }, { merge: true });
        };
        list.appendChild(row);
    });
}

async function edit(id){
    const snap=await getDoc(doc(db,"employees",id));
    const e=snap.data();
    editId=id; modal.style.display="block";
    fNameEl.value=e.name; lNameEl.value=e.surname; emailEl.value = e.email || ""; infoEl.value=e.info; statusEl.value=e.statusToday||"work";
    skillsBox.querySelectorAll("input").forEach(c=>{ c.checked=e.skills?.includes(c.value); c.parentElement.classList.toggle("active",c.checked); });
}

load();

window.openBroadcast = async ()=>{
    const snap = await getDoc(doc(db,"config","global"));
    broadcastTextEl.value = snap.data()?.broadcastMessage || "";
    broadcastModal.style.display = "block";
};

window.closeBroadcast = ()=> broadcastModal.style.display="none";
window.saveBroadcast = async ()=>{
    await setDoc(doc(db,"config","global"),{ broadcastMessage: broadcastTextEl.value },{merge:true});
    alert("Uloženo pro všechny"); broadcastModal.style.display="none";
};
</script>
</body>
</html>
