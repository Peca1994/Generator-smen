<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaměstnanci | ShiftMaster</title>

<style>
/* 1. PŘESNÉ POZADÍ Z INDEX.HTML */
body {
    margin: 0; padding: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    color: white; font-family: sans-serif;
    background-color: #030712 !important;
    background-image: 
        radial-gradient(circle at 50% -20%, rgba(34, 197, 94, 0.4) 0%, rgba(3, 7, 18, 0) 60%),
        linear-gradient(to top, rgba(34, 197, 94, 0.1) 0%, rgba(3, 7, 18, 0) 40%) !important;
    background-attachment: fixed !important;
}

/* LOGO ŠKODA ZAPUŠTĚNÉ V POZADÍ */
body::after {
    content: ""; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 150px; height: 150px; background-image: url('pozadi.jpg');
    background-size: contain; background-repeat: no-repeat; background-position: center;
    opacity: 0.15; filter: grayscale(100%) brightness(200%); z-index: -1; pointer-events: none;
}

/* 2. TOPBAR A HEADER */
.topbar {
    width: 100%; height: 60px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-sizing: border-box;
}

.logo-header { font-size: 24px; font-weight: 300; margin: 0; color: white; }
.logo-header b { color: #22c55e; text-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }

.menuBtn {
    padding: 8px 16px; border-radius: 12px; border: none; font-weight: 800;
    background: #334155; color: white; cursor: pointer; transition: 0.2s;
}
.menuBtn:hover { background: #475569; }

/* 3. KONTEJNER A SKLENĚNÉ KARTY */
.container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }

.card {
    background: rgba(17, 24, 39, 0.4) !important;
    backdrop-filter: blur(12px) !important; -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 20px !important; padding: 20px; margin-bottom: 15px;
}

/* 4. TLAČÍTKA A FORMULÁŘE */
input, select, textarea {
    width: 100%; padding: 14px; border-radius: 15px; border: none;
    margin-bottom: 12px; background: white; color: black; font-weight: 700;
    box-sizing: border-box; text-align: center;
}

.addBtn, .save { 
    background: #22c55e; width: 100%; padding: 16px; border-radius: 15px; 
    border: none; color: white; font-weight: 800; cursor: pointer; margin-top: 10px; 
}
.broadcastBtn { background: #0ea5e9; margin-top: 10px; }

/* SEZNAM ZAMĚSTNANCŮ */
.empRow {
    background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 15px;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
}
</style>
</head>
<body>

<div class="topbar">
    <h1 class="logo-header">Shift<b>Master</b></h1>
    <button class="menuBtn" onclick="window.location.href='index.html'">Zpět</button>
</div>

<div class="container">
    <div class="card" style="text-align: center;">
        <h2 style="margin-top: 0;">👥 Správa zaměstnanců</h2>
        <button class="addBtn" onclick="openNew()">+ Přidat zaměstnance</button>
        <button class="addBtn broadcastBtn" onclick="openBroadcast()">📢 Hromadná zpráva</button>
    </div>

    <div id="list">
        <!-- Zde se načtou zaměstnanci z Firebase -->
    </div>
</div>

<script type="module">
// 1. OPRAVENÉ IMPORTY PRO GITHUB PAGES
import { initializeApp } from "https://www.gstatic.com";
import { getFirestore, collection, getDocs, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com";

const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Načtení seznamu zaměstnanců
async function loadEmployees() {
    const listDiv = document.getElementById("list");
    try {
        const snap = await getDocs(collection(db, "employees"));
        listDiv.innerHTML = "";
        snap.forEach(d => {
            const e = d.data();
            listDiv.innerHTML += `
                <div class="empRow card">
                    <span style="font-weight: 800;">${e.fName || e.name || "Neznámý"} ${e.lName || ""}</span>
                    <button class="menuBtn" style="background:#1e293b" onclick="alert('Zde bude editace...')">Upravit</button>
                </div>
            `;
        });
    } catch (err) { console.error("Chyba při načítání:", err); }
}

window.openNew = () => alert("Zde se otevře modál pro nového zaměstnance...");
window.openBroadcast = () => alert("Zde se otevře modál pro hromadnou zprávu...");

// Spuštění po načtení
loadEmployees();
</script>

</body>
</html>
