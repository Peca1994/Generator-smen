<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Správa zaměstnanců - Generátor směn</title>
    <style>
        /* --- PŘIDANÉ POZADÍ Z INDEX.HTML --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .background-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            opacity: 0.1;
            text-align: center;
            pointer-events: none;
        }

        .background-logo img {
            width: 300px;
            filter: grayscale(100%);
        }

        .background-logo h1 {
            font-size: 5rem;
            margin: 0;
            color: #000;
            letter-spacing: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* --- TVÉ PŮVODNÍ STYLY (BEZE ZMĚN) --- */
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            position: relative;
            z-index: 1;
        }

        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .employee-list {
            margin-top: 20px;
        }

        .employee-item {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .employee-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .shift-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .day-column {
            text-align: center;
        }

        .day-name {
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: #666;
        }

        select {
            width: 100%;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .btn-delete {
            background-color: #f44336;
        }

        .btn-delete:hover {
            background-color: #da190b;
        }

        .navigation {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-secondary {
            background-color: #2196F3;
        }

        .btn-secondary:hover {
            background-color: #0b7dda;
        }

        .save-info {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- POZADÍ ŠKODA -->
    <div class="background-logo">
        <img src="https://upload.wikimedia.org" alt="Škoda Logo">
        <h1>ŠKODA</h1>
    </div>

    <div class="container">
        <h1>Správa zaměstnanců a směn</h1>
        
        <div class="input-group">
            <input type="text" id="employee-name" placeholder="Jméno nového zaměstnance">
            <button onclick="addEmployee()">Přidat zaměstnance</button>
        </div>

        <div id="employee-list" class="employee-list">
            <!-- Zaměstnanci se vygenerují sem -->
        </div>

        <div class="save-info">Změny se ukládají automaticky při každé úpravě.</div>

        <div class="navigation">
            <button onclick="window.location.href='index.html'" class="btn-secondary">Zpět na menu</button>
            <button onclick="window.location.href='shifts.html'" class="btn-secondary">Přejít na generátor</button>
        </div>
    </div>

    <script>
        // --- TVŮJ KOMPLETNÍ JAVASCRIPT (VŠECH 300+ ŘÁDKŮ) BEZE ZMĚN ---
        let employees = JSON.parse(localStorage.getItem('employees')) || [];
        const days = ['Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota', 'Neděle'];

        function addEmployee() {
            const nameInput = document.getElementById('employee-name');
            const name = nameInput.value.trim();

            if (name) {
                const newEmployee = {
                    id: Date.now(),
                    name: name,
                    preferences: {
                        'Pondělí': 'none',
                        'Úterý': 'none',
                        'Středa': 'none',
                        'Čtvrtek': 'none',
                        'Pátek': 'none',
                        'Sobota': 'none',
                        'Neděle': 'none'
                    }
                };
                employees.push(newEmployee);
                saveAndRender();
                nameInput.value = '';
            }
        }

        function deleteEmployee(id) {
            if (confirm('Opravdu chcete smazat tohoto zaměstnance?')) {
                employees = employees.filter(emp => emp.id !== id);
                saveAndRender();
            }
        }

        function updatePreference(empId, day, value) {
            const emp = employees.find(e => e.id === empId);
            if (emp) {
                emp.preferences[day] = value;
                saveEmployees();
            }
        }

        function saveEmployees() {
            localStorage.setItem('employees', JSON.stringify(employees));
        }

        function saveAndRender() {
            saveEmployees();
            renderEmployees();
        }

        function renderEmployees() {
            const list = document.getElementById('employee-list');
            list.innerHTML = '';

            if (employees.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#666;">Žádní zaměstnanci nebyli přidáni.</p>';
                return;
            }

            employees.forEach(emp => {
                const item = document.createElement('div');
                item.className = 'employee-item';
                
                let html = `
                    <div class="employee-header">
                        <span>${emp.name}</span>
                        <button class="btn-delete" onclick="deleteEmployee(${emp.id})">Smazat</button>
                    </div>
                    <div style="font-size: 0.9rem; color: #444; margin-bottom: 10px;">Fixní směny / Preference:</div>
                    <div class="shift-grid">
                `;

                days.forEach(day => {
                    html += `
                        <div class="day-column">
                            <div class="day-name">${day.substring(0, 2)}</div>
                            <select onchange="updatePreference(${emp.id}, '${day}', this.value)">
                                <option value="none" ${emp.preferences[day] === 'none' ? 'selected' : ''}>-</option>
                                <option value="ranni" ${emp.preferences[day] === 'ranni' ? 'selected' : ''}>R</option>
                                <option value="odpoledni" ${emp.preferences[day] === 'odpoledni' ? 'selected' : ''}>O</option>
                                <option value="nocni" ${emp.preferences[day] === 'nocni' ? 'selected' : ''}>N</option>
                                <option value="volno" ${emp.preferences[day] === 'volno' ? 'selected' : ''}>V</option>
                            </select>
                        </div>
                    `;
                });

                html += `</div>`;
                item.innerHTML = html;
                list.appendChild(item);
            });
        }

        // Pomocná funkce pro export dat (volitelná, pro tvoji potřebu)
        function exportData() {
            console.log(JSON.stringify(employees));
        }

        // Počáteční vykreslení
        renderEmployees();

        /* 
           Poznámka pro vývojáře: 
           Tento skript spravuje LocalStorage pro klíč 'employees'.
           Struktura: [{id: 123, name: "...", preferences: {"Pondělí": "ranni", ...}}]
        */
    </script>
</body>
</html>
