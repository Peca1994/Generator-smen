<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaměstnanci | ShiftMaster</title>

<style>
/* 1. GLOBÁLNÍ RESET */
body {
    margin: 0; padding: 0; min-height: 100vh;
    color: white; font-family: sans-serif;
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg');
    background-size: cover; background-position: center;
    background-repeat: no-repeat; background-attachment: fixed;
    background-color: #030712;
}

/* 2. TOPBAR */
.topbar { 
    height: 60px; display: flex; align-items: center; justify-content: space-between; 
    padding: 0 16px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1);
}
.menuBtn { 
    padding: 8px 16px; border-radius: 10px; border: none; font-weight: 800; 
    background: #334155; color: white; cursor: pointer; 
}

/* 3. KONTEJNERY */
.container { max-width: 480px; margin: 20px auto; padding: 15px; }

/* 4. TLAČÍTKA */
.addBtn, .save, .delete, .close { 
    width: 100%; padding: 16px; border-radius: 15px; border: none; 
    font-weight: 800; margin-top: 10px; color: white; cursor: pointer; font-size: 15px;
}
.addBtn, .save { background: #22c55e; }
.delete { background: #dc2626; }
.close { background: #64748b; }

/* 5. MODÁL */
.modal { 
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
    z-index: 1000; overflow-y: auto; padding: 20px;
}
.modalBox { 
    background: #0f172a; padding: 25px; border-radius: 25px; 
    border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px; margin: 20px auto;
}

/* 6. FORMULÁŘE */
input, select, textarea {
    width: 100%; padding: 14px; border-radius: 15px; border: none; 
    margin-bottom: 12px; background: white; color: black; font-weight: 700;
    box-sizing: border-box; text-align: center; font-size: 14px;
}
textarea { min-height: 80px; resize: none; text-align: left; }

/* 7. DOVEDNOSTI / POZICE */
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.skillItem {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    padding: 10px; border-radius: 10px; text-align: center; font-size: 12px;
    font-weight: 700; cursor: pointer; transition: 0.2s;
}
.skillItem.active { background: #22c55e; border-color: #22c55e; }

/* 8. BARVY STATUSŮ */
#status[value="work"] { background: #15803d; color: white; }
#status[value="vacation"] { background: #eab308; color: black; }
/* Dynamické barvy přes JS */
.status-work { background: #15803d !important; color: white !important; }
.status-vacation { background: #eab308 !important; color: black !important; }
.status-sick { background: #b91c1c !important; color: white !important; }

/* SEZNAM ZAMĚSTNANCŮ */
.empRow {
    background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 15px;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
}
.empName { font-weight: 800; cursor: pointer; }
</style>
</head>
<body>

<div class="topbar">
  <div style="font-weight: 900;">👥 ZAMĚSTNANCI</div>
  <button class="menuBtn" onclick="window.location.href='index.html'">Zpět</button>
</div>

<div class="container">
    <button class="addBtn" onclick="openNew()">+ Přidat zaměstnance</button>
    <button class="addBtn" style="background:#0ea5e9" onclick="openBroadcast()">📢 Hromadná zpráva</button>
    <div id="list" style="margin-top: 20px;">
        <!-- Zde se vygenerují zaměstnanci přes JS -->
    </div>
</div>

<!-- MODÁL PRO ZAMĚSTNANCE -->
<div id="modal" class="modal">
  <div class="modalBox">
    <h3 id="modalTitle" style="text-align: center;">Zaměstnanec</h3>
    <input id="fName" placeholder="Jméno">
    <input id="lName" placeholder="Příjmení">
    <input id="email" placeholder="Email (pro přihlášení)">
    <textarea id="info" placeholder="Interní poznámka..."></textarea>

    <h4 style="margin-bottom: 5px;">Pozice / Dovednosti</h4>
    <div id="skillsBox" class="skills">
        <!-- Pozice se vygenerují přes JS -->
    </div>

    <h4>Aktuální stav</h4>
    <select id="status" onchange="this.className='status-'+this.value">
      <option value="work">V práci</option>
      <option value="vacation">Dovolená</option>
      <option value="paragraf">Paragraf</option>
      <option value="sick">Nemoc</option>
      <option value="shitmaking">Parťák</option>
      <option value="borrowed">Půjčený</option>
      <option value="loaned">Propůjčený</option>
    </select>

    <button class="save" onclick="saveEmp()">Uložit změny</button>
    <button class="delete" id="delBtn" style="display:none;" onclick="deleteEmp()">Smazat zaměstnance</button>
    <button class="close" onclick="closeModal()">Zavřít</button>
  </div>
</div>

<!-- MODÁL PRO ZPRÁVU -->
<div id="broadcastModal" class="modal">
  <div class="modalBox">
    <h3 style="text-align: center;">📢 Hromadná zpráva</h3>
    <p style="font-size: 12px; opacity: 0.7; text-align: center;">Tato zpráva se zobrazí všem na hlavní ploše.</p>
    <textarea id="broadcastText" style="min-height: 120px;" placeholder="Sem napište text zprávy..."></textarea>
    <button class="save" onclick="saveBroadcast()">Uložit a odeslat</button>
    <button class="close" onclick="closeBroadcast()">Zrušit</button>
  </div>
</div>

<script>
// Pomocné funkce pro ovládání oken (logiku propojení s Firebase dodáme v hlavním souboru)
function openNew() {
    document.getElementById('modalTitle').innerText = "Nový zaměstnanec";
    document.getElementById('delBtn').style.display = "none";
    document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function openBroadcast() { document.getElementById('broadcastModal').style.display = 'block'; }
function closeBroadcast() { document.getElementById('broadcastModal').style.display = 'none'; }

function saveEmp() { alert("Zde se propojí ukládání do Firebase..."); closeModal(); }
function deleteEmp() { if(confirm("Opravdu smazat?")) { closeModal(); } }
function saveBroadcast() { alert("Zpráva uložena!"); closeBroadcast(); }
</script>

</body>
</html>
