<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Správa zaměstnanců - Generátor směn</title>
    <style>
        /* IDENTICKÉ POZADÍ JAKO V INDEX.HTML */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* LOGO A NÁPIS ŠKODA NA POZADÍ */
        .background-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            opacity: 0.1;
            text-align: center;
            pointer-events: none;
        }

        .background-logo img {
            width: 300px;
            filter: grayscale(100%);
        }

        .background-logo h1 {
            font-size: 5rem;
            margin: 0;
            color: #000;
            letter-spacing: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* PŮVODNÍ STYLY Z EMPLOYEES.HTML */
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background-color: #45a049;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            margin-top: 20px;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .employee-list {
            margin-top: 2rem;
            border-top: 2px solid #eee;
            padding-top: 1rem;
        }

        .employee-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- POZADÍ S LOGEM ŠKODA -->
    <div class="background-logo">
        <img src="https://upload.wikimedia.org" alt="Škoda Logo">
        <h1>ŠKODA</h1>
    </div>

    <div class="container">
        <h2>Správa zaměstnanců</h2>
        
        <div class="form-group">
            <label for="employeeName">Jméno zaměstnance:</label>
            <input type="text" id="employeeName" placeholder="Zadejte jméno">
        </div>
        
        <button class="btn btn-primary" onclick="addEmployee()">Přidat zaměstnance</button>

        <div class="employee-list" id="employeeList">
            <!-- Sem se budou přidávat zaměstnanci -->
        </div>

        <a href="index.html" class="btn btn-secondary">Zpět na menu</a>
    </div>

    <script>
        // PŮVODNÍ FUNKCE PRO SPRÁVU ZAMĚSTNANCŮ
        let employees = JSON.parse(localStorage.getItem('employees')) || [];

        function renderEmployees() {
            const listElement = document.getElementById('employeeList');
            listElement.innerHTML = '';
            
            employees.forEach((name, index) => {
                const item = document.createElement('div');
                item.className = 'employee-item';
                item.innerHTML = `
                    <span>${name}</span>
                    <button class="delete-btn" onclick="deleteEmployee(${index})">Smazat</button>
                `;
                listElement.appendChild(item);
            });
        }

        function addEmployee() {
            const nameInput = document.getElementById('employeeName');
            const name = nameInput.value.trim();
            
            if (name) {
                employees.push(name);
                localStorage.setItem('employees', JSON.stringify(employees));
                nameInput.value = '';
                renderEmployees();
            } else {
                alert('Prosím zadejte jméno.');
            }
        }

        function deleteEmployee(index) {
            employees.splice(index, 1);
            localStorage.setItem('employees', JSON.stringify(employees));
            renderEmployees();
        }

        // První vykreslení při načtení
        renderEmployees();
    </script>
</body>
</html>
