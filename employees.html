<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaměstnanci</title>

<style>
/* 1. GLOBÁLNÍ RESET A OSTRÉ POZADÍ */
body {
    margin: 0; padding: 0; display: block !important; min-height: 100vh;
    color: white; font-family: sans-serif;
    background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('pozadi.jpg') !important;
    background-size: contain !important; background-position: center 10% !important;
    background-repeat: no-repeat !important; background-attachment: fixed !important;
    background-color: #030712 !important;
}

/* 2. TOPBAR A HEADER */
.topbar, .header {
    height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: rgba(2, 6, 23, 0.8); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.menuBtn, .back {
    padding: 8px 14px; border-radius: 10px; border: none; font-weight: 800;
    background: #334155; color: white; cursor: pointer;
}

/* 3. HLAVNÍ KONTEJNER - BEZ RÁMEČKŮ A ROZMAZÁNÍ */
.container, .app, main {
    max-width: 420px; margin: 20px auto !important; padding: 16px;
    background: rgba(0, 0, 0, 0.3) !important; border: none !important;
    backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
}

/* 4. PRŮHLEDNOST VNITŘNÍCH PRVKŮ (Karty, Řádky zaměstnanců) */
.empRow, .card, .skillItem, .modalBox, fieldset, section {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

/* 5. ČITELNOST TEXTU (STÍN PRO OSTRÉ LOGO) */
label, p, span, .empName, .topTitle, h1, h2, h3 {
    color: white !important; font-weight: 900 !important;
    text-shadow: 2px 2px 4px rgba(0,0,0,1) !important;
}

/* 6. FORMULÁŘE A TLAČÍTKA */
input, select, textarea {
    width: 100%; padding: 12px; border-radius: 10px; border: none !important;
    margin-bottom: 10px; background: white !important; color: black !important; font-weight: 700;
}
.addBtn, .save, .modal button {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    font-weight: 800; background: #22c55e; color: white; cursor: pointer;
}
.delete { background: #ef4444 !important; }
.close { background: #334155 !important; }

/* 7. STATUSY A SKILLY */
.empRow { border-bottom: 1px solid rgba(255,255,255,0.1) !important; margin-bottom: 5px; padding: 10px 0; }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.skillItem { 
    padding: 10px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1) !important; 
    text-align: center; font-size: 13px; 
}
.skillItem.active { border-color: #22c55e !important; background: rgba(34, 197, 94, 0.2) !important; }

/* Barevné statusy */
.status-work { color: #22c55e !important; }
.status-vacation { color: #f59e0b !important; }
.status-sick, .status-paragraf { color: #ef4444 !important; }
.status-shitmaking { color: #3b82f6 !important; }

/* 8. MODAL */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; z-index: 1000; }
.modalBox { background: #020617 !important; border: 1px solid rgba(255,255,255,0.2) !important; margin: 20px; padding: 20px; border-radius: 20px; }
.container, .app, main {
    display: flex !important;
    flex-direction: column !important; /* Řadí prvky pod sebe */
    gap: 15px !important;            /* Vytvoří stejnoměrnou mezeru mezi kartami */
    align-items: center !important;
    justify-content: flex-start !important;
    padding-top: 20px !important;
}

/* Sjednocení všech karet a tlačítek, aby měly odstup */
.card, .empRow, button, .mainBtn {
    position: relative !important;   /* Zruší případné překrývání z absolutní pozice */
    margin: 0 !important;            /* Odsazení řeší "gap" výše */
    width: 100% !important;          /* Aby byly všechny stejně široké */
    max-width: 400px !important;
}

/* Pokud je logo v pozadí příliš vysoko, posuneme obsah níž */
body {
    padding-top: 60px !important; 
}
</style>
</head>

<body>

<div class="topbar">
  <div class="topTitle">👥 Zaměstnanci</div>
  <button class="menuBtn" onclick="location.href='index.html'">
    Menu
  </button>
</div>

<div class="container">
<button class="addBtn" onclick="openNew()">+ Přidat zaměstnance</button>
<button class="addBtn" style="background:#0ea5e9" onclick="openBroadcast()">
📢 Hromadná zpráva všem
</button>
<div id="list"></div>
</div>

<div id="modal" class="modal">
  <div class="modalBox">

    <input id="fName" placeholder="Jméno">
    <input id="lName" placeholder="Příjmení">
    <input id="email" placeholder="Email zaměstnance">
    <textarea id="info" placeholder="Poznámka"></textarea>

    <h4>Pozice</h4>
    <div id="skillsBox" class="skills"></div>

    <h4>Stav dnes</h4>
    <select id="status">
  <option value="work">V práci</option>
  <option value="vacation">Dovolená</option>
  <option value="paragraf">Paragraf</option>
  <option value="sick">Nemoc</option>
  <option value="shitmaking">Shit making</option>
  <option value="borrowed">Půjčený</option>
  <option value="loaned">Propůjčený</option>
</select>


    <button class="save" onclick="saveEmp()">Uložit</button>
    <button class="delete" onclick="deleteEmp()">Smazat</button>
    <button class="close" onclick="closeModal()">Zavřít</button>

  </div>
</div>
</div>
<div id="broadcastModal" class="modal">
  <div class="modalBox">
    <h3>📢 Hromadná zpráva</h3>
    <textarea id="broadcastText" placeholder="Text pro všechny zaměstnance"></textarea>
    <button class="save" onclick="saveBroadcast()">Uložit zprávu</button>
    <button class="close" onclick="closeBroadcast()">Zavřít</button>
  </div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  deleteDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
  authDomain: "generator-smen-9fba1.firebaseapp.com",
  projectId: "generator-smen-9fba1",
  storageBucket: "generator-smen-9fba1.firebasestorage.app",
  messagingSenderId: "541779211883",
  appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
  measurementId: "G-1HF3R93D92"
});

const auth = getAuth(app);
const db = getFirestore(app);

/* 🔒 musí být přihlášen */

onAuthStateChanged(auth, u=>{
  if(!u){
    alert("Nejsi přihlášen");
    location.href="index.html";
  }
});

/* DOM */

const modal = document.getElementById("modal");
const skillsBox = document.getElementById("skillsBox");
const list = document.getElementById("list");

const fNameEl = document.getElementById("fName");
const lNameEl = document.getElementById("lName");
const emailEl = document.getElementById("email");
const infoEl = document.getElementById("info");
const statusEl = document.getElementById("status");
const broadcastModal = document.getElementById("broadcastModal");
const broadcastTextEl = document.getElementById("broadcastText");

/* pozice */

const POSITIONS = [
["DP-L","DOORPROTECTOR L"],["DP-P","DOORPROTECTOR P"],
["ZRC-L","ZRCÁTKA L"],["ZRC-P","ZRCÁTKA P"],
["T-L","TĚSNĚNÍ L"],["T-P","TĚSNĚNÍ P"],
["AGR-LP","AGREGÁT LP"],["AGR-PP","AGREGÁT PP"],
["AGR-PZ","AGREGÁT PZ"],["AGR-LZ","AGREGÁT LZ"],
["MOT-L","MOTORY L"],["MOT-P","MOTORY P"],
["LEP-LP","LEPENÍ LP"],["LEP-PP","LEPENÍ PP"],
["LEP-Z","LEPENÍ Z"],
["REPRO-L","REPRÁKY L"],["REPRO-P","REPRÁKY P"],
["VYP1-L","VÝPLNĚ 1 L"],["VYP1-P","VÝPLNĚ 1 P"],
["VYP2-L","VÝPLNĚ 2 L"],["VYP2-P","VÝPLNĚ 2 P"],
["PR-L","PŘITAHOVAČ L"],["PR-P","PŘITAHOVAČ P"],
["ZAM-L","ZÁMKY L"],["ZAM-P","ZÁMKY P"],
["VET","VĚTRAČKY"],["VET2","VĚTRAČKY 2"],["INST","INSTALACE"],["INST2","INSTALACE 2"],
["JINE","JINÝ ÚSEK"],["JINE2","JINÝ ÚSEK 2"],

];

POSITIONS.forEach(p=>{
  const div=document.createElement("div");
  div.className="skillItem";
  div.innerHTML=`<input type="checkbox" value="${p[0]}"> ${p[1]}`;
  div.onclick=()=>{
    const cb=div.querySelector("input");
    cb.checked=!cb.checked;
    div.classList.toggle("active",cb.checked);
  };
  skillsBox.appendChild(div);
});

let editId=null;

window.openNew=()=>{
  editId=null;
  fNameEl.value="";
  lNameEl.value="";
  emailEl.value="";
  infoEl.value="";
  statusEl.value="work";
  skillsBox.querySelectorAll("input").forEach(c=>{
    c.checked=false;
    c.parentElement.classList.remove("active");
  });
  modal.style.display="block";
};

window.closeModal=()=> modal.style.display="none";

/* SAVE */

window.saveEmp = async ()=>{

 try{

  if(!fNameEl.value || !lNameEl.value){
    alert("Vyplň jméno a příjmení");
    return;
  }

  const skills=[...skillsBox.querySelectorAll("input:checked")]
    .map(x=>x.value);

  const id = editId || (fNameEl.value+"_"+lNameEl.value)
    .toLowerCase().replace(/\s+/g,"_");

  await setDoc(doc(db,"employees",id),{
  name:fNameEl.value,
  surname:lNameEl.value,
  email:emailEl.value.toLowerCase().trim(),
  info:infoEl.value,
  skills,
  statusToday:statusEl.value
});


  alert("Uloženo");
  modal.style.display="none";
  load();

 }catch(e){
  alert("CHYBA: "+e.message);
  console.error(e);
 }

};

/* DELETE */

window.deleteEmp = async ()=>{

 if(!editId) return;

 const ok = confirm("Opravdu chceš smazat záznam zaměstnance?");

 if(!ok) return;

 await deleteDoc(doc(db,"employees",editId));

 alert("Smazáno");
 modal.style.display="none";
 load();
};

function paintStatusSelect(sel){

 sel.classList.remove(
  "status-work",
  "status-vacation",
  "status-sick",
  "status-paragraf",
  "status-shitmaking",
  "status-borrowed",
  "status-loaned"
 );


  sel.classList.add("status-" + sel.value);
}

/* LIST */

async function load(){
 list.innerHTML="";
 const snap = await getDocs(collection(db,"employees"));

 snap.forEach(d=>{
  const e=d.data();
  const row=document.createElement("div");
  row.className="empRow";
  row.innerHTML=`
   <div class="empName">${e.name} ${e.surname}</div>
   <select>
  <option value="work">Práce</option>
  <option value="vacation">Dovolená</option>
  <option value="paragraf">Paragraf</option>
  <option value="sick">Nemoc</option>
  <option value="shitmaking">Shit making</option>
  <option value="borrowed">Půjčený</option>
  <option value="loaned">Propůjčený</option>
</select>
`;

  row.querySelector(".empName").onclick=()=>edit(d.id);
  const sel=row.querySelector("select");
  sel.value=e.statusToday || "work";
  paintStatusSelect(sel);
  sel.onchange=ev=>{
  paintStatusSelect(ev.target);
  setDoc(doc(db,"employees",d.id),
    {statusToday:ev.target.value},{merge:true});
};


  list.appendChild(row);
 });
}

async function edit(id){
 const snap=await getDoc(doc(db,"employees",id));
 const e=snap.data();
 editId=id;
 modal.style.display="block";
 fNameEl.value=e.name;
 lNameEl.value=e.surname;
 emailEl.value = e.email || "";
 infoEl.value=e.info;
 statusEl.value=e.statusToday||"work";
 skillsBox.querySelectorAll("input").forEach(c=>{
   c.checked=e.skills?.includes(c.value);
   c.parentElement.classList.toggle("active",c.checked);
 });
}

load();

window.openBroadcast = async ()=>{

 const snap = await getDoc(doc(db,"config","global"));
 broadcastTextEl.value = snap.data()?.broadcastMessage || "";
 broadcastModal.style.display = "block";
};

window.closeBroadcast = ()=> broadcastModal.style.display="none";

window.saveBroadcast = async ()=>{

 await setDoc(doc(db,"config","global"),{
   broadcastMessage: broadcastTextEl.value
 },{merge:true});

 alert("Uloženo pro všechny");
 broadcastModal.style.display="none";
};

</script>
</body>
</html>
