<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Týmový Chat</title>

<style>
/* 1. GLOBÁLNÍ RESET A OSTRÉ POZADÍ */
body {
    /* Identické tmavě zelené pozadí */
    background: radial-gradient(circle at center, #062111 0%, #000000 100%) !important;
    margin: 0;
    padding: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: white;
    min-height: 100vh;
}

/* Zapuštěné logo ŠKODA na pozadí */
.background-logo {
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
    text-align: center;
    pointer-events: none;
}

.background-logo img {
    width: 650px !important;
    max-width: 90vw !important;
    opacity: 0.12 !important;
    filter: brightness(0.6) sepia(1) hue-rotate(85deg) saturate(2.5) blur(1px) !important;
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
}

.background-logo h1 {
    font-size: 16vw !important;
    margin-top: -30px !important;
    letter-spacing: 25px !important;
    color: #1a3a2a !important;
    opacity: 0.5 !important;
    font-weight: 900;
    text-transform: uppercase;
}

/* 2. TOPBAR */
.topbar {
    width: 100% !important;
    height: 60px;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 0 20px !important;
    box-sizing: border-box !important;
    background: transparent !important;
    border: none !important;
    position: sticky;
    top: 0;
    z-index: 1000;
}
.menuBtn { 
    padding: 8px 14px; 
    border-radius: 10px; 
    border: none; 
    font-weight: 800; 
    background: rgba(51, 65, 85, 0.8); 
    color: white; 
    cursor: pointer; 
}
/* CHAT OKNO */
       #chatBox {
    height: 400px; 
    overflow-y: auto; 
    display: flex; 
    flex-direction: column; 
    gap: 12px; 
    padding: 15px;
    margin-bottom: 20px;
    background: rgba(0, 0, 0, 0.2); /* Mírné ztmavení pozadí chatu */
    border-radius: 15px;
}

/* Bublina zprávy */
.msg {
    padding: 10px 15px;
    border-radius: 18px;
    max-width: 75%;
    position: relative;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.05);
    align-self: flex-start; /* Zprávy ostatních vlevo */
    color: white;
}

/* Moje zprávy (vpravo a zelené) */
.msg.me {
    align-self: flex-end; 
    background: rgba(34, 197, 94, 0.25);
    border: 1px solid rgba(34, 197, 94, 0.5);
}

/* Jméno odesílatele */
.msg-sender {
    font-size: 11px;
    font-weight: 800;
    color: #38bdf8; /* Světle modrá pro jména */
    margin-bottom: 4px;
    display: block;
}

/* Čas zprávy */
.msg-time {
    font-size: 9px;
    opacity: 0.5;
    display: block;
    text-align: right;
    margin-top: 5px;
}
.topTitle {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif !important;
    font-size: 22px !important;
    font-weight: 800 !important;
    color: #ffffff !important;
    letter-spacing: -0.5px !important;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    padding-left: 10px;
}

.chat-input-container {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 500px;
    z-index: 1001;
}

/* Skleněný efekt lišty */
.chat-input-wrapper {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 30px;
    padding: 8px 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}

/* Samotné pole pro text */
#msgInput {
    flex: 1;
    background: transparent !important;
    border: none !important;
    color: white !important;
    font-size: 16px;
    padding: 10px 0;
    outline: none !important;
}

/* Stylové tlačítko s ikonou šipky */
#sendBtn {
    background: #22c55e;
    color: white;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
}

#sendBtn:hover {
    background: #16a34a;
    transform: scale(1.1);
}

#sendBtn svg {
    margin-left: 3px; /* Vycentrování ikonky šipky */
}
.disclaimer {
    position: relative; /* Změna z fixed na relative, aby netvořil prázdné místo pod sebou */
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.3); /* Decentní šedá */
    text-align: left; /* Zarovnání doleva */
    font-family: sans-serif;
    line-height: 1.3;
    width: 100%;
    box-sizing: border-box;
}
@media (max-width: 480px) {
    .disclaimer {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
        width: 90%;
        max-width: none;
    }
}
</style>
</head>

<body>
<div class="background-logo">
    <img src="pozadi.jpg" alt="Logo">
</div>
<div class="topbar">
    <span class="topTitle">💬 Týmový Chat</span>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<!-- 2. SEM VLOŽ TENTO BLOK (Uprostřed mezi lištami) -->
<div id="chatBox">
    <!-- Sem skript automaticky vloží zprávy -->
</div>

<!-- 3. Tady už máš (nebo vlož) spodní část s textem -->
<div class="chat-input-container">
    ... tvůj kód pro psaní zpráv ...
</div>

<div class="chat-input-container">
    <div class="chat-input-wrapper">
        <input type="text" id="msgInput" placeholder="Napiš vzkaz...">
        <button id="sendBtn">
            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" /></svg>
        </button>
    </div>
</div>
<div class="disclaimer">
        © 2024 ShiftMaster | Neoficiální nástroj. Logo ŠKODA je majetkem ŠKODA AUTO a.s.
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import { 
    getFirestore, 
    collection, 
    addDoc, 
    query,       // TATO FUNKCE TI CHYBĚLA
    orderBy, 
    onSnapshot, 
    getDocs, 
    where,       // TATO TAKÉ
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e",
    measurementId: "G-1HF3R93092"
};

// 2. INICIALIZACE - Teď už getAuth() bude fungovat
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app); 

const chatBox = document.getElementById("chatBox");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

let currentUserNickname = "Host";

// 3. ZJIŠTĚNÍ PŘEZDÍVKY PŘIHLÁŠENÉHO UŽIVATELE
onAuthStateChanged(auth, async (user) => {
    if (user) {
        try {
            // Hledáme v employees dokument, kde email odpovídá přihlášenému uživateli
            const q = query(collection(db, "employees"), where("email", "==", user.email));
            const snap = await getDocs(q);
            
            if (!snap.empty) {
                // Oprava: Získání dat z prvního nalezeného dokumentu
                const empData = snap.docs[0].data();
                currentUserNickname = empData.nickname || empData.fName || user.email.split('@')[0];
            } else {
                currentUserNickname = user.email.split('@')[0];
            }
        } catch (e) { 
            console.error("Chyba při hledání jména:", e);
            currentUserNickname = user.email.split('@')[0];
        }
    } else {
        // Pokud nikdo není přihlášen, nepustíme ho do chatu
        window.location.href = "index.html"; 
    }
});

// 4. NAČÍTÁNÍ ZPRÁV V REÁLNÉM ČASE
const qChat = query(collection(db, "chat"), orderBy("createdAt", "asc"));
onSnapshot(qChat, (snapshot) => {
    chatBox.innerHTML = "";
    snapshot.forEach((doc) => {
        const m = doc.data();
        
        // OPRAVA: Pokud je text prázdný, zprávu vůbec nevykresluj
        if (!m.text || m.text.trim() === "") return;

        const isMe = m.sender === currentUserNickname;
        const time = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";
        
        chatBox.innerHTML += `
            <div class="msg ${isMe ? 'me' : ''}">
                <span class="msg-sender">${m.sender}</span>
                <div class="msg-text">${m.text}</div>
                <span class="msg-time">${time}</span>
            </div>
        `;
    });
    chatBox.scrollTop = chatBox.scrollHeight;
});

// 5. ODESÍLÁNÍ ZPRÁVY
async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;

    try {
        await addDoc(collection(db, "chat"), {
            text: text,
            sender: currentUserNickname,
            createdAt: serverTimestamp() 
        });
        msgInput.value = "";
    } catch (e) { 
        console.error("Chyba odesílání:", e);
        alert("Chyba: " + e.message); 
    }
}

// Připojení funkcí na tlačítka (vložit za definici funkce)
sendBtn.onclick = sendMessage;
msgInput.onkeypress = (e) => { if (e.key === "Enter") sendMessage(); };
</script>

</body>
</html>
