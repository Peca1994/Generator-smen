<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalendář směn</title>

<style>
/* 1. GLOBÁLNÍ NASTAVENÍ A POZADÍ */
body {
    margin: 0;
    padding: 0;
    display: flex; /* Vrátí vycentrování celé karty */
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: white;
    font-family: sans-serif;
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg');
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
    background-color: #030712 !important;
}

/* 2. KONTEJNER A KARTA */
.app {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    box-sizing: border-box;
}

.card {
    background: rgba(17, 24, 39, 0.6) !important; /* Průhledná karta */
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border-radius: 20px !important;
    padding: 25px;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important; /* Jemný stín pro hloubku */
}

/* Úklid vnořených prvků, aby nevrstvily šedou barvu */
.card .card, #menuCard, .menu, main, section {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0;
}

/* 3. TEXTY */
.logo { font-size: 34px; font-weight: 900; text-align: center; margin-bottom: 5px; }
.sub { text-align: center; opacity: .7; margin-bottom: 20px; }
.roleTag { 
    text-align: center; 
    margin: 15px 0 !important; 
    color: #22c55e !important; /* Škoda zelená */
    font-weight: bold;
}

/* 4. TLAČÍTKA - VRÁCENÍ BAREV A VELIKOSTI */
.menu button, .mainBtn, .switch button {
    width: 100%;
    padding: 16px !important;
    border-radius: 12px;
    margin-top: 12px;
    font-weight: 800;
    font-size: 16px !important;
    color: white !important;
    border: none !important;
    cursor: pointer;
    transition: 0.2s;
}

/* Konkrétní barvy pro tlačítka (neprůhlednější, aby byla vidět) */
.btnEmployees { background: #7c3aed !important; opacity: 0.8; }
.btnGenerator { background: #f59e0b !important; opacity: 0.8; }
.btnSchedule  { background: #16a34a !important; opacity: 0.8; }
.btnCalendar  { background: #dc2626 !important; opacity: 0.8; }
.btnStats     { background: #06b6d4 !important; opacity: 0.8; }
.logout       { background: #374151 !important; opacity: 0.8; }

.menu button:hover { opacity: 1; transform: scale(1.02); filter: brightness(1.1); }

/* Vstupy (Inputy) - aby byly vidět */
input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    margin-bottom: 10px;
    box-sizing: border-box;
}

.hidden { display: none; }
</style>
</head>

<body>

<div class="topbar">
 <div><b>📅 Kalendář</b></div>
 <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">
<div class="card">

<div class="monthBar">
 <button class="monthBtn" onclick="changeMonth(-1)">◀</button>
 <div id="title"></div>
 <button class="monthBtn" onclick="changeMonth(1)">▶</button>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<script>

/* ===== názvy ===== */

const dayNames=["Po","Út","St","Čt","Pá","So","Ne"];
const monthNames=["Leden","Únor","Březen","Duben","Květen","Červen",
"Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];

/* ===== pevné svátky CZ ===== */

const fixedHolidays = [
 "01-01",
 "05-01","05-08",
 "07-05","07-06",
 "09-28",
 "10-28",
 "11-17",
 "12-24","12-25","12-26"
];

/* ===== výpočet Velikonoc ===== */

function easterSunday(year){
 const a = year % 19;
 const b = Math.floor(year/100);
 const c = year % 100;
 const d = Math.floor(b/4);
 const e = b % 4;
 const f = Math.floor((b+8)/25);
 const g = Math.floor((b-f+1)/3);
 const h = (19*a+b-d-g+15)%30;
 const i = Math.floor(c/4);
 const k = c % 4;
 const l = (32+2*e+2*i-h-k)%7;
 const m = Math.floor((a+11*h+22*l)/451);
 const month = Math.floor((h+l-7*m+114)/31);
 const day = ((h+l-7*m+114)%31)+1;
 return new Date(year, month-1, day);
}

function getEasterHolidays(year){
 const easter = easterSunday(year);

 const goodFriday = new Date(easter);
 goodFriday.setDate(easter.getDate()-2);

 const easterMonday = new Date(easter);
 easterMonday.setDate(easter.getDate()+1);

 return [goodFriday, easterMonday];
}

function isHoliday(date){

 const key =
  String(date.getMonth()+1).padStart(2,"0")+"-"+
  String(date.getDate()).padStart(2,"0");

 if(fixedHolidays.includes(key)) return true;

 const easterDays = getEasterHolidays(date.getFullYear());

 return easterDays.some(d =>
  d.getFullYear()===date.getFullYear() &&
  d.getMonth()===date.getMonth() &&
  d.getDate()===date.getDate()
 );
}

/* ===== SMĚNOVÝ CYKLUS ===== */

const cycleStartMonday = new Date(Date.UTC(2026,1,2));
const weekCycle = ["R","N","O"];

function getMondayUTC(d){
 const day=(d.getUTCDay()+6)%7;
 return new Date(Date.UTC(
  d.getUTCFullYear(),
  d.getUTCMonth(),
  d.getUTCDate()-day
 ));
}

function weekType(i){
 return weekCycle[(i%3+3)%3];
}

function getShiftForDate(date){

 const day=(date.getDay()+6)%7;
 if(day>4) return null;

 const dUTC=new Date(Date.UTC(
  date.getFullYear(),
  date.getMonth(),
  date.getDate()
 ));

 const monday=getMondayUTC(dUTC);
 const diffDays=Math.round((monday-cycleStartMonday)/86400000);
 const w=Math.floor(diffDays/7);

 return weekType(w);
}

/* ===== RENDER ===== */

let current=new Date();

function render(){
 const grid=document.getElementById("grid");
 grid.innerHTML="";

 const y=current.getFullYear();
 const m=current.getMonth();
 document.getElementById("title").innerText=monthNames[m]+" "+y;

 dayNames.forEach(n=>{
  const e=document.createElement("div");
  e.className="dayName";
  e.innerText=n;
  grid.appendChild(e);
 });

 const first=new Date(y,m,1);
 const start=(first.getDay()+6)%7;

 for(let i=0;i<start;i++){
  const e=document.createElement("div");
  e.className="day empty";
  grid.appendChild(e);
 }

 const days=new Date(y,m+1,0).getDate();
 const today=new Date();

 for(let d=1; d<=days; d++){
  const cell=document.createElement("div");
  cell.className="day";

  const dt=new Date(y,m,d);

  if(dt.toDateString()===today.toDateString())
    cell.classList.add("today");

  if(isHoliday(dt))
    cell.classList.add("holiday");

  const num=document.createElement("div");
  num.innerText=d;

  const s=getShiftForDate(dt);
  if(s){
    const b=document.createElement("div");
    b.className="shift "+s;
    b.innerText=s;
    cell.appendChild(b);
  }

  if(isHoliday(dt)){
    const h=document.createElement("div");
    h.className="hBadge";
    h.innerText="SV";
    cell.appendChild(h);
  }

  cell.appendChild(num);
  grid.appendChild(cell);
 }
}

function changeMonth(x){
 current.setMonth(current.getMonth()+x);
 render();
}

render();

</script>

</body>
</html>
