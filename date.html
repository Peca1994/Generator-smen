<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalendář směn</title>

<style>
/* 1. GLOBÁLNÍ RESET A POZADÍ */
* {
    box-shadow: none !important;
    border: none !important;
    outline: none !important;
}

body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: white;
    font-family: sans-serif;
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('pozadi.jpg');
    background-size: cover !important; /* Pro mobilní telefony lepší cover */
    background-position: center !important;
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
    background-color: #030712 !important;
}

/* 2. HLAVNÍ STRUKTURA (APP A KARTY) */
.app {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    background: transparent !important;
}

.card {
    background: rgba(17, 24, 39, 0.4) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border-radius: 20px !important;
    padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
}

/* Úklid vnořených prvků a menu */
.card .card, #menuCard, .menu, .app div:not(.card), main, section {
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
    padding: 0;
}

/* 3. TEXTOVÉ PRVKY */
.logo { font-size: 34px; font-weight: 900; text-align: center; }
.sub { text-align: center; opacity: .7; margin-bottom: 20px; }
.roleTag { 
    text-align: center; 
    margin: 10px 0 !important; 
    color: #22c55e !important; /* Škoda zelená */
    font-weight: bold;
    background: transparent !important;
}

/* 4. TLAČÍTKA A INTERAKCE */
.menu button, .mainBtn {
    width: 100%;
    padding: 16px !important;
    border-radius: 12px;
    margin-top: 10px;
    font-weight: 800;
    font-size: 16px !important;
    color: white !important;
    transition: 0.15s;
    cursor: pointer;
}

/* Barevné a průhledné varianty tlačítek */
.btnEmployees { background: rgba(124, 58, 237, 0.5) !important; }
.btnGenerator { background: rgba(245, 158, 11, 0.5) !important; }
.btnSchedule  { background: rgba(22, 163, 74, 0.5) !important; }
.btnCalendar  { background: rgba(220, 38, 38, 0.5) !important; }
.btnStats     { background: rgba(6, 182, 212, 0.5) !important; }
.logout       { background: rgba(55, 65, 81, 0.5) !important; }

.menu button:hover, .mainBtn:hover { filter: brightness(1.2); transform: scale(1.01); }
.menu button:active { transform: scale(0.98); }

/* 5. POMOCNÉ TŘÍDY */
.hidden { display: none; }
hr, .divider { display: none !important; }

/* Responzivita pro malé mobily */
@media (max-width: 400px) {
    .app { padding: 10px; }
    .logo { font-size: 28px; }
}
</style>
</head>

<body>

<div class="topbar">
 <div><b>📅 Kalendář</b></div>
 <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">
<div class="card">

<div class="monthBar">
 <button class="monthBtn" onclick="changeMonth(-1)">◀</button>
 <div id="title"></div>
 <button class="monthBtn" onclick="changeMonth(1)">▶</button>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<script>

/* ===== názvy ===== */

const dayNames=["Po","Út","St","Čt","Pá","So","Ne"];
const monthNames=["Leden","Únor","Březen","Duben","Květen","Červen",
"Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];

/* ===== pevné svátky CZ ===== */

const fixedHolidays = [
 "01-01",
 "05-01","05-08",
 "07-05","07-06",
 "09-28",
 "10-28",
 "11-17",
 "12-24","12-25","12-26"
];

/* ===== výpočet Velikonoc ===== */

function easterSunday(year){
 const a = year % 19;
 const b = Math.floor(year/100);
 const c = year % 100;
 const d = Math.floor(b/4);
 const e = b % 4;
 const f = Math.floor((b+8)/25);
 const g = Math.floor((b-f+1)/3);
 const h = (19*a+b-d-g+15)%30;
 const i = Math.floor(c/4);
 const k = c % 4;
 const l = (32+2*e+2*i-h-k)%7;
 const m = Math.floor((a+11*h+22*l)/451);
 const month = Math.floor((h+l-7*m+114)/31);
 const day = ((h+l-7*m+114)%31)+1;
 return new Date(year, month-1, day);
}

function getEasterHolidays(year){
 const easter = easterSunday(year);

 const goodFriday = new Date(easter);
 goodFriday.setDate(easter.getDate()-2);

 const easterMonday = new Date(easter);
 easterMonday.setDate(easter.getDate()+1);

 return [goodFriday, easterMonday];
}

function isHoliday(date){

 const key =
  String(date.getMonth()+1).padStart(2,"0")+"-"+
  String(date.getDate()).padStart(2,"0");

 if(fixedHolidays.includes(key)) return true;

 const easterDays = getEasterHolidays(date.getFullYear());

 return easterDays.some(d =>
  d.getFullYear()===date.getFullYear() &&
  d.getMonth()===date.getMonth() &&
  d.getDate()===date.getDate()
 );
}

/* ===== SMĚNOVÝ CYKLUS ===== */

const cycleStartMonday = new Date(Date.UTC(2026,1,2));
const weekCycle = ["R","N","O"];

function getMondayUTC(d){
 const day=(d.getUTCDay()+6)%7;
 return new Date(Date.UTC(
  d.getUTCFullYear(),
  d.getUTCMonth(),
  d.getUTCDate()-day
 ));
}

function weekType(i){
 return weekCycle[(i%3+3)%3];
}

function getShiftForDate(date){

 const day=(date.getDay()+6)%7;
 if(day>4) return null;

 const dUTC=new Date(Date.UTC(
  date.getFullYear(),
  date.getMonth(),
  date.getDate()
 ));

 const monday=getMondayUTC(dUTC);
 const diffDays=Math.round((monday-cycleStartMonday)/86400000);
 const w=Math.floor(diffDays/7);

 return weekType(w);
}

/* ===== RENDER ===== */

let current=new Date();

function render(){
 const grid=document.getElementById("grid");
 grid.innerHTML="";

 const y=current.getFullYear();
 const m=current.getMonth();
 document.getElementById("title").innerText=monthNames[m]+" "+y;

 dayNames.forEach(n=>{
  const e=document.createElement("div");
  e.className="dayName";
  e.innerText=n;
  grid.appendChild(e);
 });

 const first=new Date(y,m,1);
 const start=(first.getDay()+6)%7;

 for(let i=0;i<start;i++){
  const e=document.createElement("div");
  e.className="day empty";
  grid.appendChild(e);
 }

 const days=new Date(y,m+1,0).getDate();
 const today=new Date();

 for(let d=1; d<=days; d++){
  const cell=document.createElement("div");
  cell.className="day";

  const dt=new Date(y,m,d);

  if(dt.toDateString()===today.toDateString())
    cell.classList.add("today");

  if(isHoliday(dt))
    cell.classList.add("holiday");

  const num=document.createElement("div");
  num.innerText=d;

  const s=getShiftForDate(dt);
  if(s){
    const b=document.createElement("div");
    b.className="shift "+s;
    b.innerText=s;
    cell.appendChild(b);
  }

  if(isHoliday(dt)){
    const h=document.createElement("div");
    h.className="hBadge";
    h.innerText="SV";
    cell.appendChild(h);
  }

  cell.appendChild(num);
  grid.appendChild(cell);
 }
}

function changeMonth(x){
 current.setMonth(current.getMonth()+x);
 render();
}

render();

</script>

</body>
</html>
