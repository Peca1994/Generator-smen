<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Týmový Chat | ShiftMaster</title>
    <style>
        /* 1. GLOBÁLNÍ DESIGN (PŘESNĚ PODLE TVÉHO STYLU) */
        body {
            background: radial-gradient(circle at center, #062111 0%, #000000 100%) !important;
            margin: 0; padding: 0; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }

        /* Zapuštěné logo ŠKODA na pozadí */
        .background-logo {
            position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
            z-index: -1; text-align: center; pointer-events: none;
        }
        .background-logo img {
            width: 650px; max-width: 90vw; opacity: 0.12;
            filter: brightness(0.6) sepia(1) hue-rotate(85deg) saturate(2.5) blur(1px);
        }

        /* TOPBAR */
        .topbar {
            width: 100%; height: 60px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; position: sticky; top: 0; z-index: 1000;
        }
        .topTitle { font-size: 22px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .menuBtn { padding: 8px 14px; border-radius: 10px; border: none; font-weight: 800; background: rgba(51, 65, 85, 0.8); color: white; cursor: pointer; }

        /* KONTEJNER A CHAT KARTA */
        .container { max-width: 500px; margin: 20px auto; padding: 15px; }
        .card {
            background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px;
        }

        /* CHAT OKNO */
        #chatBox {
            height: 450px; overflow-y: auto; display: flex; flex-direction: column;
            gap: 12px; padding: 10px; margin-bottom: 15px;
            scrollbar-width: thin; scrollbar-color: #22c55e rgba(0,0,0,0);
        }
        /* Styl zprávy */
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 80%; position: relative; background: rgba(255,255,255,0.1); align-self: flex-start; }
        .msg.me { align-self: flex-end; background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; }
        .msg-sender { font-size: 11px; font-weight: 900; color: #38bdf8; margin-bottom: 4px; display: block; }
        .msg-time { font-size: 9px; opacity: 0.4; display: block; text-align: right; margin-top: 4px; }

        /* VSTUPNÍ POLE */
        .input-area { display: flex; gap: 10px; }
        input {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            background: white; color: black; font-weight: 700;
        }

        .disclaimer { text-align: center; margin-top: 30px; font-size: 10px; font-weight: 800; opacity: 0.4; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="background-logo"><img src="pozadi.jpg" alt="Logo"></div>

<div class="topbar">
    <span class="topTitle">💬 Týmový Chat</span>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">
    <div class="card">
        <div id="chatBox">
            <div style="text-align:center; opacity:0.5; font-size:12px;">Načítám zprávy...</div>
        </div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Napiš vzkaz...">
            <button class="menuBtn" id="sendBtn">Odeslat</button>
        </div>
    </div>

    <div class="disclaimer">
        © 2024 ShiftMaster | Neoficiální nástroj. Logo ŠKODA je majetkem ŠKODA AUTO a.s.
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, getDocs, where } from "https://www.gstatic.com";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com";

const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const chatBox = document.getElementById("chatBox");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

let currentUserNickname = "Host";

// 1. ZJIŠTĚNÍ PŘIHLÁŠENÉHO UŽIVATELE A JEHO PŘEZDÍVKY
onAuthStateChanged(auth, async (user) => {
    if (user) {
        // Hledáme v kolekci 'employees' dokument s jeho emailem
        try {
            const q = query(collection(db, "employees"), where("email", "==", user.email));
            const snap = await getDocs(q);
            if (!snap.empty) {
                const empData = snap.docs[0].data();
                // Tady se podíváme, jestli má přezdívku, jinak složíme jméno
                currentUserNickname = empData.nickname || empData.fName || user.email.split('@')[0];
            } else {
                currentUserNickname = user.email.split('@')[0];
            }
        } catch (e) { console.error("Chyba při hledání přezdívky:", e); }
    } else {
        // Pokud není přihlášen, pošli ho na index (nebo mu zakaž psát)
        window.location.href = "index.html";
    }
});

// 2. NAČÍTÁNÍ ZPRÁV V REÁLNÉM ČASE
const qChat = query(collection(db, "chat"), orderBy("createdAt", "asc"));
onSnapshot(qChat, (snapshot) => {
    chatBox.innerHTML = "";
    snapshot.forEach((doc) => {
        const m = doc.data();
        const isMe = m.sender === currentUserNickname;
        const time = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";
        
        chatBox.innerHTML += `
            <div class="msg ${isMe ? 'me' : ''}">
                <span class="msg-sender">${m.sender}</span>
                ${m.text}
                <span class="msg-time">${time}</span>
            </div>
        `;
    });
    chatBox.scrollTop = chatBox.scrollHeight; // Automatický scroll dolů
});

// 3. ODESÍLÁNÍ ZPRÁVY
async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;

    try {
        await addDoc(collection(db, "chat"), {
            text: text,
            sender: currentUserNickname,
            createdAt: new Date()
        });
        msgInput.value = "";
    } catch (e) { alert("Zprávu se nepodařilo odeslat."); }
}

sendBtn.onclick = sendMessage;
msgInput.onkeypress = (e) => { if (e.key === "Enter") sendMessage(); };

</script>
</body>
</html>
