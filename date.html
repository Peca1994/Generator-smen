<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Týmový Chat</title>

<style>
/* 1. GLOBÁLNÍ RESET A OSTRÉ POZADÍ */
body {
    /* Identické tmavě zelené pozadí */
    background: radial-gradient(circle at center, #062111 0%, #000000 100%) !important;
    margin: 0;
    padding: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: white;
    min-height: 100vh;
}

/* Zapuštěné logo ŠKODA na pozadí */
.background-logo {
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
    text-align: center;
    pointer-events: none;
}

.background-logo img {
    width: 650px !important;
    max-width: 90vw !important;
    opacity: 0.12 !important;
    filter: brightness(0.6) sepia(1) hue-rotate(85deg) saturate(2.5) blur(1px) !important;
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
}

.background-logo h1 {
    font-size: 16vw !important;
    margin-top: -30px !important;
    letter-spacing: 25px !important;
    color: #1a3a2a !important;
    opacity: 0.5 !important;
    font-weight: 900;
    text-transform: uppercase;
}

/* 2. TOPBAR */
.topbar {
    width: 100% !important;
    height: 60px;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 0 20px !important;
    box-sizing: border-box !important;
    background: transparent !important;
    border: none !important;
    position: sticky;
    top: 0;
    z-index: 1000;
}
.menuBtn { 
    padding: 8px 14px; 
    border-radius: 10px; 
    border: none; 
    font-weight: 800; 
    background: rgba(51, 65, 85, 0.8); 
    color: white; 
    cursor: pointer; 
}
/* CHAT OKNO */
        #chatBox {
            height: 450px; overflow-y: auto; display: flex; flex-direction: column;
            gap: 12px; padding: 10px; margin-bottom: 15px;
            scrollbar-width: thin; scrollbar-color: #22c55e rgba(0,0,0,0);
        }
        /* Styl zprávy */
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 80%; position: relative; background: rgba(255,255,255,0.1); align-self: flex-start; }
        .msg.me { align-self: flex-end; background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; }
        .msg-sender { font-size: 11px; font-weight: 900; color: #38bdf8; margin-bottom: 4px; display: block; }
        .msg-time { font-size: 9px; opacity: 0.4; display: block; text-align: right; margin-top: 4px; }

        /* VSTUPNÍ POLE */
        .input-area { display: flex; gap: 10px; }
        input {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            background: white; color: black; font-weight: 700;
        }
.topTitle {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif !important;
    font-size: 22px !important;
    font-weight: 800 !important;
    color: #ffffff !important;
    letter-spacing: -0.5px !important;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    padding-left: 10px;
}
.disclaimer {
    position: relative; /* Změna z fixed na relative, aby netvořil prázdné místo pod sebou */
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.3); /* Decentní šedá */
    text-align: left; /* Zarovnání doleva */
    font-family: sans-serif;
    line-height: 1.3;
    width: 100%;
    box-sizing: border-box;
}
@media (max-width: 480px) {
    .disclaimer {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
        width: 90%;
        max-width: none;
    }
}
</style>
</head>

<body>
<div class="background-logo">
    <img src="pozadi.jpg" alt="Logo">
</div>
<div class="topbar">
    <span class="topTitle">💬 Týmový Chat</span>
    <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">
    <div class="card">
        <div id="chatBox">
            <div style="text-align:center; opacity:0.5; font-size:12px;">Načítám zprávy...</div>
        </div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Napiš vzkaz...">
            <button class="menuBtn" id="sendBtn">Odeslat</button>
        </div>
<div class="disclaimer">
        © 2024 ShiftMaster | Neoficiální nástroj. Logo ŠKODA je majetkem ŠKODA AUTO a.s.
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, getDocs, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = {
    apiKey: "AIzaSyA2T9e79Hs9brEwffRoRpPZuVYT6p6g6uE",
    authDomain: "generator-smen-9fba1.firebaseapp.com",
    projectId: "generator-smen-9fba1",
    storageBucket: "generator-smen-9fba1.firebasestorage.app",
    messagingSenderId: "541779211883",
    appId: "1:541779211883:web:1d8578ec61b0f428a4632e"
};

// 2. INICIALIZACE (včetně getAuth)
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app); // Tato řádka ti házela chybu

const chatBox = document.getElementById("chatBox");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

let currentUserNickname = "Host";

// 3. ZJIŠTĚNÍ PŘEZDÍVKY PODLE EMAILU
onAuthStateChanged(auth, async (user) => {
    if (user) {
        try {
            // Hledáme v employees email, který se shoduje s přihlášeným uživatelem
            const q = query(collection(db, "employees"), where("email", "==", user.email));
            const snap = await getDocs(q);
            
            if (!snap.empty) {
                const empData = snap.docs[0].data();
                // Priorita: Přezdívka -> Jméno -> Email
                currentUserNickname = empData.nickname || empData.fName || user.email.split('@')[0];
            } else {
                currentUserNickname = user.email.split('@')[0];
            }
        } catch (e) { 
            console.error("Chyba při hledání uživatele:", e);
            currentUserNickname = user.email.split('@')[0];
        }
    } else {
        // Pokud není nikdo přihlášený, chat zakážeme nebo přesměrujeme
        window.location.href = "index.html"; 
    }
});

// 2. NAČÍTÁNÍ ZPRÁV V REÁLNÉM ČASE
const qChat = query(collection(db, "chat"), orderBy("createdAt", "asc"));
onSnapshot(qChat, (snapshot) => {
    chatBox.innerHTML = "";
    snapshot.forEach((doc) => {
        const m = doc.data();
        const isMe = m.sender === currentUserNickname;
        const time = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";
        
        chatBox.innerHTML += `
            <div class="msg ${isMe ? 'me' : ''}">
                <span class="msg-sender">${m.sender}</span>
                ${m.text}
                <span class="msg-time">${time}</span>
            </div>
        `;
    });
    chatBox.scrollTop = chatBox.scrollHeight; // Automatický scroll dolů
});

// 3. ODESÍLÁNÍ ZPRÁVY
async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;

    try {
        await addDoc(collection(db, "chat"), {
            text: text,
            sender: currentUserNickname,
            createdAt: new Date()
        });
        msgInput.value = "";
    } catch (e) { alert("Zprávu se nepodařilo odeslat."); }
}

sendBtn.onclick = sendMessage;
msgInput.onkeypress = (e) => { if (e.key === "Enter") sendMessage(); };

</script>

</body>
</html>
