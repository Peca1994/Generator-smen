<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalendář směn</title>

<style>
/* 1. GLOBÁLNÍ RESET A OSTRÉ POZADÍ */
body {
    /* Identické tmavě zelené pozadí */
    background: radial-gradient(circle at center, #062111 0%, #000000 100%) !important;
    margin: 0;
    padding: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: white;
    min-height: 100vh;
}

/* Zapuštěné logo ŠKODA na pozadí */
.background-logo {
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
    text-align: center;
    pointer-events: none;
}

.background-logo img {
    width: 650px !important;
    max-width: 90vw !important;
    opacity: 0.12 !important;
    filter: brightness(0.6) sepia(1) hue-rotate(85deg) saturate(2.5) blur(1px) !important;
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
}

.background-logo h1 {
    font-size: 16vw !important;
    margin-top: -30px !important;
    letter-spacing: 25px !important;
    color: #1a3a2a !important;
    opacity: 0.5 !important;
    font-weight: 900;
    text-transform: uppercase;
}

/* 2. TOPBAR */
.topbar {
    height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: rgba(2, 6, 23, 0.8); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.menuBtn { 
    padding: 8px 14px; 
    border-radius: 10px; 
    border: none; 
    font-weight: 800; 
    background: rgba(51, 65, 85, 0.8); 
    color: white; 
    cursor: pointer; 
}

/* 3. HLAVNÍ KONTEJNER - BEZ RÁMEČKŮ A BLURU */
.container, .app, main {
    max-width: 480px; margin: 20px auto !important; padding: 16px;
    background: rgba(0, 0, 0, 0.3) !important; border: none !important;
    backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
}

/* 4. KALENDÁŘ - MŘÍŽKA A DNY (VŠE PRŮHLEDNÉ) */
.card, .grid, .day, .monthBtn, fieldset, section {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }

.day {
    height: 72px; padding: 6px; display: flex; flex-direction: column;
    justify-content: space-between; font-weight: 800;
    border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 12px;
}

/* 5. ČITELNOST TEXTU (STÍN PRO OSTRÉ LOGO) */
label, p, span, .dayName, .monthBar, h1, h2, h3, .shift {
    color: white !important; font-weight: 900 !important;
    text-shadow: 2px 2px 4px rgba(0,0,0,1) !important;
}

.dayName { text-align: center; font-size: 12px; opacity: .8; }

/* 6. SMĚNY A BADGE (BAREVNÉ BODY) */
.shift { align-self: flex-start; padding: 3px 9px; border-radius: 999px; font-size: 12px; }
.R { background: #16a34a !important; } /* Ranní */
.N { background: #7c3aed !important; } /* Noční */
.O { background: #f59e0b !important; color: black !important; } /* Odpolední */

.today { outline: 2px solid #38bdf8 !important; }
.holiday { outline: 2px solid #ef4444 !important; background: rgba(239, 68, 68, 0.1) !important; }
.hBadge { background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 999px; }

/* 7. OVLÁDÁNÍ MĚSÍCE */
.monthBar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.monthBtn { 
    background: rgba(255,255,255,0.1) !important; padding: 8px 12px; 
    border-radius: 10px; cursor: pointer; color: white !important;
}

/* 8. FORMULÁŘE (POKUD JSOU PŘÍTOMNY) */
input, select {
    background: white !important; color: black !important;
    border-radius: 10px !important; padding: 10px !important;
}
</style>
</head>

<body>
<div class="background-logo">
    <img src="pozadi.jpg" alt="Logo">
</div>
<div class="topbar">
 <div><b>📅 Kalendář</b></div>
 <button class="menuBtn" onclick="location.href='index.html'">Menu</button>
</div>

<div class="container">
<div class="card">

<div class="monthBar">
 <button class="monthBtn" onclick="changeMonth(-1)">◀</button>
 <div id="title"></div>
 <button class="monthBtn" onclick="changeMonth(1)">▶</button>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<script>

/* ===== názvy ===== */

const dayNames=["Po","Út","St","Čt","Pá","So","Ne"];
const monthNames=["Leden","Únor","Březen","Duben","Květen","Červen",
"Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];

/* ===== pevné svátky CZ ===== */

const fixedHolidays = [
 "01-01",
 "05-01","05-08",
 "07-05","07-06",
 "09-28",
 "10-28",
 "11-17",
 "12-24","12-25","12-26"
];

/* ===== výpočet Velikonoc ===== */

function easterSunday(year){
 const a = year % 19;
 const b = Math.floor(year/100);
 const c = year % 100;
 const d = Math.floor(b/4);
 const e = b % 4;
 const f = Math.floor((b+8)/25);
 const g = Math.floor((b-f+1)/3);
 const h = (19*a+b-d-g+15)%30;
 const i = Math.floor(c/4);
 const k = c % 4;
 const l = (32+2*e+2*i-h-k)%7;
 const m = Math.floor((a+11*h+22*l)/451);
 const month = Math.floor((h+l-7*m+114)/31);
 const day = ((h+l-7*m+114)%31)+1;
 return new Date(year, month-1, day);
}

function getEasterHolidays(year){
 const easter = easterSunday(year);

 const goodFriday = new Date(easter);
 goodFriday.setDate(easter.getDate()-2);

 const easterMonday = new Date(easter);
 easterMonday.setDate(easter.getDate()+1);

 return [goodFriday, easterMonday];
}

function isHoliday(date){

 const key =
  String(date.getMonth()+1).padStart(2,"0")+"-"+
  String(date.getDate()).padStart(2,"0");

 if(fixedHolidays.includes(key)) return true;

 const easterDays = getEasterHolidays(date.getFullYear());

 return easterDays.some(d =>
  d.getFullYear()===date.getFullYear() &&
  d.getMonth()===date.getMonth() &&
  d.getDate()===date.getDate()
 );
}

/* ===== SMĚNOVÝ CYKLUS ===== */

const cycleStartMonday = new Date(Date.UTC(2026,1,2));
const weekCycle = ["R","N","O"];

function getMondayUTC(d){
 const day=(d.getUTCDay()+6)%7;
 return new Date(Date.UTC(
  d.getUTCFullYear(),
  d.getUTCMonth(),
  d.getUTCDate()-day
 ));
}

function weekType(i){
 return weekCycle[(i%3+3)%3];
}

function getShiftForDate(date){

 const day=(date.getDay()+6)%7;
 if(day>4) return null;

 const dUTC=new Date(Date.UTC(
  date.getFullYear(),
  date.getMonth(),
  date.getDate()
 ));

 const monday=getMondayUTC(dUTC);
 const diffDays=Math.round((monday-cycleStartMonday)/86400000);
 const w=Math.floor(diffDays/7);

 return weekType(w);
}

/* ===== RENDER ===== */

let current=new Date();

function render(){
 const grid=document.getElementById("grid");
 grid.innerHTML="";

 const y=current.getFullYear();
 const m=current.getMonth();
 document.getElementById("title").innerText=monthNames[m]+" "+y;

 dayNames.forEach(n=>{
  const e=document.createElement("div");
  e.className="dayName";
  e.innerText=n;
  grid.appendChild(e);
 });

 const first=new Date(y,m,1);
 const start=(first.getDay()+6)%7;

 for(let i=0;i<start;i++){
  const e=document.createElement("div");
  e.className="day empty";
  grid.appendChild(e);
 }

 const days=new Date(y,m+1,0).getDate();
 const today=new Date();

 for(let d=1; d<=days; d++){
  const cell=document.createElement("div");
  cell.className="day";

  const dt=new Date(y,m,d);

  if(dt.toDateString()===today.toDateString())
    cell.classList.add("today");

  if(isHoliday(dt))
    cell.classList.add("holiday");

  const num=document.createElement("div");
  num.innerText=d;

  const s=getShiftForDate(dt);
  if(s){
    const b=document.createElement("div");
    b.className="shift "+s;
    b.innerText=s;
    cell.appendChild(b);
  }

  if(isHoliday(dt)){
    const h=document.createElement("div");
    h.className="hBadge";
    h.innerText="SV";
    cell.appendChild(h);
  }

  cell.appendChild(num);
  grid.appendChild(cell);
 }
}

function changeMonth(x){
 current.setMonth(current.getMonth()+x);
 render();
}

render();

</script>

</body>
</html>
